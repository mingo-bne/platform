    const c=this.fCfg(), br=(this.clubCfg?.age_brackets||[]).map(b=>+b.u).sort((a,b)=>a-b);
    const uFor = age => br.find(u=>age<u) || (br[br.length-1]||20);
    const now=uFor(p.age), then=uFor(Math.max(1,p.age-1));
    const steps=(now-then)/2;
    const down=Math.pow(1-c.step, c.div*steps);
    const f = steps>0 ? (c.compound ? c.growth*down : down) : c.growth;
    return +r.ppg * f;
  },
  fVal(p){ return this.fp.basis==='points' ? this.fPpg(p) : (p.rating==null?null:+p.rating); },
  fRated(){ return this.fPool().filter(p=>this.fVal(p)!=null); },
  fMissing(){ return this.fPool().filter(p=>this.fVal(p)==null); },
  fVisible(basis){
    const keep=this.fp.basis; this.fp.basis=basis;
    const n=this.fPool().filter(p=>this.fVal(p)!=null).length;
    this.fp.basis=keep; return n;
  },
  fAxis(){
    if(this.fp.basis!=='points') return {lo:1,hi:5,dp:2,unit:''};
    const v=this.fPool().map(p=>this.fPpg(p)).filter(x=>x!=null);
    return {lo:0,hi:Math.max(2,Math.ceil(Math.max(0,...v)+0.5)),dp:1,unit:' ppg'};
  },
  fPct(v){ const a=this.fAxis(); return ((v-a.lo)/(a.hi-a.lo))*100; },
  fFx(v){ const a=this.fAxis();
    return a.dp===1 ? (Math.round(v*10)/10).toFixed(1)+a.unit : (Math.round(v*100)/100).toFixed(2); },
  // org_profile.division_label is a PATTERN, not a prefix — 'Div {n}', 'Grade {n}',
  // 'A{n}' — exactly like age_group_label 'U{n}'. Substitute; only fall back to
  // appending when a club has typed a pattern with no placeholder in it.
  //  A name the club has typed wins; otherwise the pattern with {n} substituted.
  //  The RANK still orders and bands — this is only what gets printed.
  fDivLabel(d){
    if(d==null) return 'Ungraded';
    const named=(this.clubCfg?.division_names||{})[String(d)];
    if(named && String(named).trim()) return String(named).trim();
    const pat=(this.clubCfg?.division_label||'Div {n}').trim();
    return pat.includes('{n}') ? pat.replace(/\{n\}/g,d) : (pat+' '+d);
  },

  // ── what this association calls its divisions ────────────────────────────
  //  Club-wide, because a division is the association's competition and rank 3
  //  means the same thing in U12 as in U18. Edited here because here is where a
  //  club looks at the names.
  fNameOpen(){
    this.fp.names = {...(this.clubCfg?.division_names||{})};
    this.fp.pattern = this.clubCfg?.division_label || 'Div {n}';
    this.fp.namesErr=''; this.fp.naming=true;
  },
  //  Every rank this club has anywhere — the plans, the teams entered, and the
  //  chips being edited right now — so nothing in use is missing from the list.
  fNameRanks(){
    const r=new Set();
    (this.fp.plans||[]).forEach(p=>(p.teams||[]).forEach(d=>d!=null&&r.add(+d)));
    (this.teamSeasons||[]).forEach(t=>t.division_rank!=null&&r.add(+t.division_rank));
    (this.fp.teams||[]).forEach(d=>d!=null&&r.add(+d));
    return [...r].sort((a,b)=>a-b);
  },
  fNameSet(d,v){
    const n={...this.fp.names};
    if(String(v||'').trim()) n[String(d)]=String(v).trim(); else delete n[String(d)];
    this.fp.names=n;
  },
  //  What the pattern would give — shown beside an empty field so a club can see
  //  what it is overriding before it types.
  fNameFallback(d){
    const pat=(this.fp.pattern||'Div {n}').trim();
    return pat.includes('{n}') ? pat.replace(/\{n\}/g,d) : (pat+' '+d);
  },
  async fSaveNames(){
    this.fp.busy=true; this.fp.namesErr='';
    const {error} = await this.sb.from('org_profile')
      .update({division_names:this.fp.names, division_label:(this.fp.pattern||'Div {n}').trim()})
      .eq('org_id', this.org.id);
    this.fp.busy=false;
    if(error){ this.fp.namesErr=error.message; return; }
    this.clubCfg={...this.clubCfg, division_names:this.fp.names,
                  division_label:(this.fp.pattern||'Div {n}').trim()};
    this.fp.naming=false;
  },

  // ── the plan for one age group ───────────────────────────────────────────
  fPlan(g){
    return this.fp.plans.find(p=>p.age_group===g)
      || {age_group:g, basis:'rating', teams:[], cuts:[], cuts_other:[],
          squad_cap:this.fCfg().cap, min_field:8};
  },
  //  The teams the club intends to ENTER, which is the plan's own list — naming
  //  them happens afterwards (ADR-008), so this cannot be read off the named
  //  teams. Before a plan exists, the named teams are the best available guess
  //  and seed it.
  fTeamsOf(g){
    const p=this.fp.plans.find(x=>x.age_group===g);
    if(p && p.teams && p.teams.length) return p.teams.slice().sort((a,b)=>a-b);
    return this.teamSeasons.filter(ts=>ts.age_group===g)
      .map(ts=>ts.division_rank).filter(d=>d!=null).sort((a,b)=>a-b);
  },
  //  The row is narrow, so the word is said once — 'Div 1 · 3 · 4' — but only when
  //  the club's pattern actually ENDS in the number. 'A{n} Grade' cannot be
  //  collapsed that way, so every team is labelled in full instead.
  fTeamsLabel(g){
    const t=this.fTeamsOf(g);
    if(!t.length) return 'no teams entered';
    const pat=(this.clubCfg?.division_label||'Div {n}').trim();
    if(pat.endsWith('{n}'))
      return pat.replace(/\{n\}$/,'').trim()+' '+t.join(' · ');
    return t.map(d=>this.fDivLabel(d)).join(' · ');
  },
  fGroupSub(g){
    const ps=this.fPoolOf(g);
    return ps.length+' players · avg '+this.f2(this.fMean(ps.map(p=>p.rating)));
  },

  // ── bands ────────────────────────────────────────────────────────────────
  //  Consecutive teams in the SAME division share one band and are balanced
  //  against each other; different divisions are separated by a line.
  fBandsOf(divs, cuts, g){
    const out=[];
    divs.forEach(d=>{ const last=out[out.length-1];
      if(last && last.div===d) last.teams++; else out.push({div:d,teams:1}); });
    const A=this.fAxis();
    const ps=this.fPoolOf(g).filter(p=>this.fVal(p)!=null)
      .sort((a,b)=>this.fVal(b)-this.fVal(a));
    return out.map((b,i)=>{
      const inb=ps.filter(p=>{
        const v=this.fVal(p);
        let k=cuts.length; for(let j=0;j<cuts.length;j++) if(v>=cuts[j]){k=j;break}
        return k===i; });
      const vals=inb.map(p=>this.fVal(p));
      return {...b, i, n:inb.length, avg:this.fMean(vals),
        total:vals.reduce((a,x)=>a+x,0),
        from: i<cuts.length?cuts[i]:A.lo, to: i>0?cuts[i-1]:A.hi,
        per: b.teams? Math.round(inb.length/b.teams*10)/10 : 0};
    });
  },
  fBands(){ return this.fBandsOf(this.fp.teams, this.fp.cuts, this.fp.group); },
  fBandRange(b,i){
    return i===0 ? this.fFx(b.from)+' and above'
      : (i===this.fp.cuts.length ? 'under '+this.fFx(b.to)
         : this.fFx(b.from)+' – '+this.fFx(b.to));
  },
  fThin(g){
    const p=this.fPlan(g), divs=this.fTeamsOf(g);
    if(!divs.length) return 0;
    return this.fBandsOf(divs, p.cuts||[], g)
      .filter(b=>b.n && b.per < (p.min_field||8)).length;
  },
  fLocked(){
    //  already in a team FOR THIS SEASON, and still in this age group
    const ids=new Set(this.teamSeasons.filter(ts=>ts.age_group===this.fp.group).map(ts=>ts.id));
    return this.roster.filter(r=>ids.has(r.team_season_id));
  },

  fSpark(g){
    const ps=this.fPoolOf(g), plan=this.fPlan(g), cuts=plan.cuts||[];
    const keep=this.fp.basis; this.fp.basis = plan.basis||'rating';
    const A=this.fAxis(), N=24, h=new Array(N).fill(0);
    ps.forEach(p=>{ const v=this.fVal(p); if(v==null) return;
      const i=Math.min(N-1,Math.max(0,Math.floor((v-A.lo)/(A.hi-A.lo)*N))); h[i]++; });
    const mx=Math.max(1,...h);
    const out=h.map((v,i)=>{
      const r=A.lo+(i+0.5)/N*(A.hi-A.lo);
      let k=cuts.length; for(let j=0;j<cuts.length;j++) if(r>=cuts[j]){k=j;break}
      return '<i class="b'+Math.min(6,k+1)+'" style="height:'+Math.round(v/mx*100)+'%"></i>';
    }).join('');
    this.fp.basis=keep; return out;
  },
  fBarsHTML(){
    const A=this.fAxis(), N=24, h=new Array(N).fill(0);
    this.fPool().forEach(p=>{ const v=this.fVal(p); if(v==null) return;
      const i=Math.min(N-1,Math.max(0,Math.floor((v-A.lo)/(A.hi-A.lo)*N))); h[i]++; });
    const mx=Math.max(1,...h), cuts=this.fp.cuts;
    return h.map((v,i)=>{
      const r=A.lo+(i+0.5)/N*(A.hi-A.lo);
      let k=cuts.length; for(let j=0;j<cuts.length;j++) if(r>=cuts[j]){k=j;break}
      return '<i class="b'+Math.min(6,k+1)+'" style="height:'+Math.round(v/mx*100)+'%"></i>';
    }).join('');
  },
  fAxisHTML(){
    const A=this.fAxis(), out=[];
    for(let i=0;i<=8;i++){
      const v=+(A.lo+(A.hi-A.lo)*i/8).toFixed(2);
      out.push('<span style="left:'+this.fPct(v)+'%'
        +(i===0?';transform:none':'')+(i===8?';transform:translateX(-100%)':'')+'">'
        +this.fFx(v)+'</span>');
    }
    return out.join('');
  },

  // ── opening one, and the lines ───────────────────────────────────────────
  fOpen(g){
    const p=this.fPlan(g);
    this.fp.group=g; this.fp.basis=p.basis||'rating';
    this.fp.cap=p.squad_cap||this.fCfg().cap; this.fp.min=p.min_field||8;
    this.fp.lock=p.lock_placed!==false;
    this.fp.teams=this.fTeamsOf(g).slice();
    this.fp.saved=''; this.fp.err=''; this.fp.phase='setup'; this.fp.result=null;
    this.fp.frozen=null; this.fp.moves={}; this.fp.marks={}; this.fp.stars={}; this.fp.assign={};
    this.fp.cuts=(p.cuts||[]).map(Number);
    if(this.fp.cuts.length !== this.fBandsOf(this.fp.teams,[],g).length-1) this.fEvenCounts();
    this.modal='formation';
  },
  fAddTeam(d){ this.fp.teams.push(+d); this.fp.teams.sort((a,b)=>a-b); this.fEvenCounts(); },
  fDropTeam(i){ if(this.fp.teams.length<2) return;
    this.fp.teams.splice(i,1); this.fEvenCounts(); },
  fSetBasis(b){ if(this.fp.basis===b) return; this.fp.basis=b; this.fEvenCounts(); },
  fEvenCounts(){
    const g=this.fp.group, bs=this.fBandsOf(this.fp.teams,[],g);
    const ps=this.fRated().sort((a,b)=>this.fVal(b)-this.fVal(a));
    const tot=bs.reduce((a,b)=>a+b.teams,0);
    const cuts=[]; let run=0;
    for(let i=0;i<bs.length-1;i++){
      run+=bs[i].teams;
      const k=Math.round(ps.length*run/tot);
      const hi=ps[k-1]?this.fVal(ps[k-1]):this.fAxis().lo;
      const lo=ps[k]?this.fVal(ps[k]):this.fAxis().lo;
      cuts.push(+((hi+lo)/2).toFixed(2));
    }
    this.fp.cuts=cuts;
    this.fStale();
  },
  fEvenSpan(){
    const bs=this.fBandsOf(this.fp.teams,[],this.fp.group);
    const v=this.fRated().map(p=>this.fVal(p));
    if(!v.length) return;
    const hi=Math.max(...v), lo=Math.min(...v), tot=bs.reduce((a,b)=>a+b.teams,0);
    const cuts=[]; let run=0;
    for(let i=0;i<bs.length-1;i++){ run+=bs[i].teams;
      cuts.push(+(hi-(hi-lo)*run/tot).toFixed(2)); }
    this.fp.cuts=cuts;
    this.fStale();
  },
  //  Anything that changes what the engine would produce marks the teams below
  //  the graph as stale. They are NOT cleared — seeing what the last build gave
  //  while you drag the line is the whole reason they are down there.
  fStale(){ if(this.fp.result) this.fp.stale=true; },
  //  Dragging repaints the number and the bands; nothing heavier runs until the
  //  line is let go. Rebuilding the table on every pointer move destroyed the
  //  very slider under the pointer the first time this was built.
  fDragStart(ev,i){
    ev.preventDefault();
    const box=document.getElementById('flv'); if(!box) return;
    const A=this.fAxis(), st=A.dp===1?10:20, self=this;
    const move=e=>{
      const b=box.getBoundingClientRect();
      let v=A.lo+Math.max(0,Math.min(1,(e.clientX-b.left)/b.width))*(A.hi-A.lo);
      const up=i>0?self.fp.cuts[i-1]-0.05:A.hi;
      const dn=i<self.fp.cuts.length-1?self.fp.cuts[i+1]+0.05:A.lo;
      v=Math.max(dn,Math.min(up,Math.round(v*st)/st));
      self.fp.cuts[i]=+v.toFixed(2);
    };
    const up=()=>{ window.removeEventListener('pointermove',move);
                   window.removeEventListener('pointerup',up);
                   self.fStale(); };
    window.addEventListener('pointermove',move);
    window.addEventListener('pointerup',up);
  },

  async fSavePlan(){
    this.fp.busy=true; this.fp.err=''; this.fp.saved='';
    const row={ org_id:this.org.id, season_id:this.seasonId, age_group:this.fp.group,
      basis:this.fp.basis, teams:this.fp.teams, cuts:this.fp.cuts,
      squad_cap:this.fp.cap, min_field:this.fp.min, lock_placed:!!this.fp.lock,
      updated_by:this.me?.id||null };
    const {error} = await this.sb.from('formation_plan')
      .upsert(row, {onConflict:'season_id,age_group'});
    this.fp.busy=false;
    if(error){ this.fp.err=error.message; return; }
    this.fp.saved='saved';
    await this.loadFormation();
    return true;
  },

  //  THE ENGINE IS NOT IN THIS FILE. It runs as an edge function because this
  //  file is served from a public repository — see CLAUDE.md. The plan is saved
  //  first so the engine reads what is on screen rather than what was last
  //  written, and so a proposal can always be explained by a stored plan.
  async fGenerate(){
    this.fp.err=''; this.fp.result=null; this.fp.busy=true;
    const ok = await this.fSavePlan();
    if(!ok){ this.fp.busy=false; return; }
    this.fp.busy=true;
    const {data,error} = await this.sb.functions.invoke('formation',
      {body:{season_id:this.seasonId, age_group:this.fp.group}});
    this.fp.busy=false;
    if(error){
      //  The function returns its reason in the body; supabase-js only gives a
      //  status on the error, so read the body before falling back to it.
      let msg = error.message;
      try{ const b = await error.context?.json?.(); if(b?.error) msg=b.error; }catch(e){}
      this.fp.err = msg; return;
    }
    if(data?.error){ this.fp.err=data.error; return; }
    this.fp.result=data; this.fp.stale=false;
  },
  // ═══ THE PROPOSAL, AND THE BOARD ═════════════════════════════════════════
  //  Ported from prototype_formation_setup.html. Confirming FREEZES the
  //  proposal: from then on the engine does not run again and every change is
  //  the coach's, shown against the number its band set. ADR-001 made visible.

  //  The lenses belong to the SPORT (migration 018). Colour is presentation and
  //  is taken by position from one palette, so adding a sport never touches this
  //  file and no basketball position is named here.
  fLensPalette:['#3c7dc4','#1d9e75','#1F3864','#4d9ec4','#8fc7db','#7b96bd','#c9a227'],
  fLensList(){
    const used=this.clubCfg?.lenses_used||[];
    const all=(this.fp.lenses||[]).map(l=>({...l,
      slots:(l.slots||[]).map((z,i)=>({...z, c:this.fLensPalette[i%this.fLensPalette.length]}))}));
    return used.length ? all.filter(l=>used.includes(l.k)) : all;
  },
  fLens(){ const L=this.fLensList();
    return L.find(l=>l.k===(this.fp.lens||(L[0]||{}).k)) || L[0] || null; },
  fSetLens(k){ this.fp.lens=k; },
  fOther(){ return {k:'', t:'', c:'#a9a69e'}; },
  //  Where a stored value sits when seen through a given lens. Rolls UP, never
  //  down: set somebody fine and the coarse view shows the coarse slot; set them
  //  coarse and the fine view cannot invent which kind, so it says so.
  fSlotIn(lens,stored){
    if(!stored||!lens) return '';
    if(lens.slots.some(x=>x.k===stored.k)) return stored.k;
    const src=this.fLensList().find(l=>l.k===stored.lens);
    const def=src&&src.slots.find(x=>x.k===stored.k);
    if(def&&def.up&&lens.slots.some(x=>x.k===def.up)) return def.up;
    return '';
  },
  //  Keyed on (TEAM, PLAYER), never on the person — the same child can be the
  //  size in one squad and a skill player in another. `team_member.zone` does
  //  exactly this in the schema.
  fMarks(axis){ this.fp.marks=this.fp.marks||{};
    return this.fp.marks[axis]=this.fp.marks[axis]||{}; },
  fZKey(col,pid){ return col+'|'+pid; },
  fSlotOf(col,pid){ const l=this.fLens();
    return l ? this.fSlotIn(l, this.fMarks(l.axis)[this.fZKey(col,pid)]) : ''; },
  fSetZone(pid,col,k){
    const l=this.fLens(); if(!l) return;
    const m=this.fMarks(l.axis), key=this.fZKey(col,pid);
    if(k) m[key]={k:k,lens:l.k}; else delete m[key];
    this.fp.marks={...this.fp.marks};
  },
  fCoarseNote(col,pid){
    const l=this.fLens(); if(!l) return '';
    const st=this.fMarks(l.axis)[this.fZKey(col,pid)];
    if(!st||this.fSlotIn(l,st)) return '';
    const src=this.fLensList().find(x=>x.k===st.lens);
    const def=src&&src.slots.find(x=>x.k===st.k);
    return def?def.t:'';
  },
  //  What this player is on the axes NOT currently on screen — three different
  //  questions about the same child, so the answers to the other two travel
  //  with them.
  fOtherAxes(col,pid){
    const cur=(this.fLens()||{}).axis, out=[];
    this.fLensList().forEach(l=>{
      if(l.axis===cur) return;
      const st=this.fMarks(l.axis)[this.fZKey(col,pid)];
      const slot=st&&l.slots.find(x=>x.k===st.k);
      if(slot) out.push(slot.t);
    });
    return out;
  },
  fToggleStar(col,pid){ const key=this.fZKey(col,pid);
    if(this.fp.stars[key]) delete this.fp.stars[key]; else this.fp.stars[key]=true;
    this.fp.stars={...this.fp.stars}; },
  fIsStar(col,pid){ return !!this.fp.stars[this.fZKey(col,pid)]; },
  fSlotsWithOther(){ const l=this.fLens();
    return l ? l.slots.concat([{...this.fOther(), t:l.empty||'Other'}]) : []; },
  fInSlot(col,players,k){ return players.filter(p=>this.fSlotOf(col,p.person_id)===k); },

  //  THE BOARD IS DERIVED ONCE, and the markup only walks what this returns.
  //
  //  It was built the obvious way first — an x-for over the columns, and each
  //  slot's players recomputed inside it from the loop variable. On 19 Aug 2026
  //  that rendered eleven names under a header reading ten: a hand move updated
  //  the column header, which reads the loop variable directly, but not the
  //  nested lists, which re-derive from it in a child scope Alpine had already
  //  settled. Both were reading the same `col`; only one had been told it moved.
  //
  //  One derivation removes the whole class of bug: there is nothing left to go
  //  out of step with, because there is only one thing.
  fBoard(){
    const slots=this.fSlotsWithOther();
    return this.fLiveCols().map((col,ci)=>{
      const n=col.players.length||1;
      const buckets=slots.map(z=>{
        const inz=col.players.filter(p=>this.fSlotOf(ci,p.person_id)===z.k);
        return {...z, n:inz.length, w:100*inz.length/n, players:inz};
      });
      return {...col, ci, slots:buckets,
        title:buckets.map(z=>z.n+' '+z.t).join(' · '),
        moveIn:col.players.filter(p=>this.fp.moves[p.person_id]!=null).length,
        moveOut:col.ids.filter(id=>this.fp.moves[id]!=null&&this.fp.moves[id]!==ci).length};
    });
  },

  // ── naming: propose, never decide (ADR-008) ──────────────────────────────
  //  The TMS prefix rule, unchanged: B / G / U plus the number.
  fPrefix(g){
    const t=String(g||'').toUpperCase();
    const n=(t.match(/\d+/)||[''])[0];
    return (t.includes('GIRL')?'G':t.includes('BOY')?'B':'U')+n;
  },
  //  The team that ran this division last season keeps it, then the nearest
  //  division, then whatever else the club has. Never prevented, only flagged.
  fProposeAssign(){
    const g=this.fp.group, out={}, used={};
    const known=(this.teamSeasons||[]).filter(t=>t.age_group===g)
      .map(t=>({name:t.team_name, lastDiv:t.division_rank}));
    (this.fp.result?.squads||[]).forEach(sq=>{
      const key=sq.division_rank+'#'+sq.ordinal;
      if(this.fp.assign[key]){ out[key]=this.fp.assign[key]; used[out[key]]=1; return; }
      let best=null,d=1e9;
      known.forEach(t=>{ if(used[t.name])return;
        const gap=Math.abs((t.lastDiv==null?99:t.lastDiv)-(sq.division_rank==null?99:sq.division_rank));
        if(gap<d){d=gap;best=t} });
      if(best){ used[best.name]=1; out[key]=best.name; return; }
      const free=(this.teams||[]).map(t=>t.name)
        .filter(n=>!used[n] && !Object.values(out).includes(n));
      out[key]= free[0] || (this.fPrefix(g)+' Team '+(Object.keys(out).length+1));
      used[out[key]]=1;
    });
    return out;
  },
  fAssignTo(key,name){
    if(!name) delete this.fp.assign[key]; else this.fp.assign[key]=name;
    this.fp.assign={...this.fp.assign};
  },
  fTeamOptions(){
    const named=(this.teams||[]).map(t=>t.name);
    const inplay=Object.values(this.fProposeAssign()).filter(v=>!named.includes(v));
    return named.concat([...new Set(inplay)]);
  },
  fAssignedName(sq){ return this.fProposeAssign()[sq.division_rank+'#'+sq.ordinal]||''; },
  fAssignedTwice(sq){
    const n=this.fAssignedName(sq), all=Object.values(this.fProposeAssign());
    return n && all.filter(v=>v===n).length>1;
  },
  fLastDivNote(sq){
    const n=this.fAssignedName(sq);
    const t=(this.teamSeasons||[]).find(x=>x.team_name===n && x.age_group===this.fp.group);
    if(!t||t.division_rank==null) return 'new team';
    return t.division_rank===sq.division_rank ? 'same division as last season'
      : 'was '+this.fDivLabel(t.division_rank)+' last season';
  },
  fShortName(n){ return String(n||'').replace(this.fPrefix(this.fp.group)+' ',''); },

  // ── the frozen proposal, and what the coach does to it ───────────────────
  fConfirmProposal(){
    this.fp.frozen=(this.fp.result?.squads||[]).map(sq=>({
      division_rank:sq.division_rank, ordinal:sq.ordinal,
      target:sq.target, target_total:sq.target_total,
      team:this.fAssignedName(sq),
      ids:sq.players.map(p=>p.person_id) }));
    this.fp.by={}; (this.fp.result?.squads||[]).forEach(sq=>sq.players
      .forEach(p=>this.fp.by[p.person_id]=p));
    this.fp.moves={}; this.fp.phase='compare';
  },
  fBackToSetup(){ this.fp.phase='setup'; },
  fRestoreProposal(){ this.fp.moves={}; },
  fMovePlayer(pid,to){
    const home=this.fp.frozen.findIndex(s=>s.ids.includes(pid));
    if(to===home) delete this.fp.moves[pid]; else this.fp.moves[pid]=to;
    this.fp.moves={...this.fp.moves};
  },
  fMoved(pid){ return this.fp.moves[pid]!=null; },
  //  Where everybody sits right now: the frozen proposal plus the coach's moves.
  fLiveCols(){
    const cols=(this.fp.frozen||[]).map(s=>({...s, players:[]}));
    (this.fp.frozen||[]).forEach((s,i)=>s.ids.forEach(id=>{
      const to=this.fp.moves[id]!=null?this.fp.moves[id]:i;
      if(cols[to]&&this.fp.by[id]) cols[to].players.push(this.fp.by[id]);
    }));
    cols.forEach(c=>c.players.sort((a,b)=>(b.value||0)-(a.value||0)
      || a.person_id.localeCompare(b.person_id)));
    return cols;
  },
  fColNow(col){ const v=col.players.map(p=>p.value).filter(x=>x!=null);
    return this.fp.basis==='points' ? v.reduce((a,x)=>a+x,0) : this.fMean(v); },
  fColTgt(col){ return this.fp.basis==='points' ? col.target_total : col.target; },
  fColOff(col){ const d=Math.abs(this.fColNow(col)-this.fColTgt(col));
    return this.fp.basis==='points' ? d>2 : d>0.2; },
  fColVs(col){ return this.fp.basis==='points'
    ? Math.round(this.fColNow(col))+' vs '+Math.round(this.fColTgt(col))+' pts'
    : this.f2(this.fColNow(col))+' vs '+this.f2(this.fColTgt(col)); },
  fColIn(col,i){ return col.players.filter(p=>this.fp.moves[p.person_id]!=null).length; },
  fColOut(col,i){ return col.ids.filter(id=>this.fp.moves[id]!=null&&this.fp.moves[id]!==i).length; },
  fMovedCount(){ return Object.keys(this.fp.moves||{}).length; },
  //  The reference basis travels with the column, and states its own coverage.
  fColRef(col){
    if(!col.players.length) return null;
    if(this.fp.basis==='points'){
      const r=col.players.map(p=>p.rating).filter(x=>x!=null);
      return {label:'coach rating', text:this.f2(this.fMean(r)),
              note:r.length===col.players.length?'':r.length+' of '+col.players.length+' on record'};
    }
    const have=col.players.filter(p=>p.ppg!=null);
    return {label:'projects to score',
      text: have.length?Math.round(have.reduce((a,p)=>a+p.ppg,0))+' pts/game':'—',
      note: have.length===col.players.length?'':have.length+' of '+col.players.length+' on record'};
  },
  fVfx(v){ return v==null?'—':(this.fp.basis==='points'
    ? (Math.round(v*10)/10).toFixed(1) : this.f2(v)); },
  fLensNote(){ const a=(this.fLens()||{}).axis;
    return {zone:'how the squad is built', role:'what a player does',
            position:'where a player lines up'}[a] || ''; },

  // ── drag and drop, one delegated set of handlers as the TMS does it ──────
  fDragStartPlayer(ev,pid){ ev.dataTransfer.setData('text/plain',pid); },
  //  Dropping ON a zone moves the player AND sets what they are in that team;
  //  dropping on the team but not a zone is a plain move and leaves it alone.
  fDrop(ev,col,zone){
    const pid=ev.dataTransfer.getData('text/plain'); if(!pid) return;
    this.fMovePlayer(pid,col);
    if(zone!==undefined) this.fSetZone(pid,col,zone);
  },

  fRefText(s){
    const r=s.reference; if(!r) return '';
    const v = r.label==='coach rating' ? this.f2(r.value) : Math.round(r.value)+' pts/game';
    return r.label+' '+v + (r.covered===r.of ? '' : ' ('+r.covered+' of '+r.of+' on record)');
  },
  fSqDev(s){ return s.average - s.target; },
  fSqOff(s){ return this.fp.basis==='points'
    ? Math.abs(s.total-s.target_total)>2 : Math.abs(this.fSqDev(s))>0.2; },
  fSqVs(s){ return this.fp.basis==='points'
    ? Math.round(s.total)+' vs '+Math.round(s.target_total)+' pts/game'
    : this.f2(s.average)+' vs '+this.f2(s.target); },
  //  A bar left of centre is a category this team is short in. Every value is
  //  also written out — nothing here is encoded by colour alone.
  fBarStyle(dev){
    const d=Math.max(-1.5,Math.min(1.5,dev)), w=Math.abs(d)/1.5*50;
    return d>=0 ? 'left:50%;width:'+w+'%' : 'left:'+(50-w)+'%;width:'+w+'%';
  },

  ageGroupsInSeason(){
    return [...new Set(this.teamSeasons.map(ts=>ts.age_group))]
      .sort((a,b)=> (parseInt(String(a).replace(/\D/g,''))||999)
                  - (parseInt(String(b).replace(/\D/g,''))||999));
  },
  teamSeasonsIn(g){
    if(g === undefined) return [];
    return this.teamSeasons.filter(ts=>ts.age_group===g)
      .sort((a,b)=>a.team_name.localeCompare(b.team_name));
  },
  // every age group the club's own banding produces for this season's players
  allAgeGroups(){
    return [...new Set(this.pool.map(p=>p.age_group).filter(Boolean))]
      .sort((a,b)=> (parseInt(String(a).replace(/\D/g,''))||999)
                  - (parseInt(String(b).replace(/\D/g,''))||999));
  },
  poolAll(){ return this.pool.filter(p=>p.status!=='inactive'); },
  placedPeople(){ return new Set(this.roster.map(r=>r.person_id)); },
  placedCount(){ return this.roster.length; },
  placedInGroup(g){
    return new Set(this.roster
      .filter(r=>r.age_group===g).map(r=>r.person_id));
  },
  poolShown(){
    const t = this.selTeam(); const q = this.tm.q.trim().toLowerCase();
    const inGrp = t ? this.placedInGroup(t.age_group) : new Set();
    return this.poolAll().filter(p => {
      if(this.tm.scope==='grp' && t && t.age_group && p.age_group !== t.age_group) return false;
      if(this.tm.hidePlaced && inGrp.has(p.person_id)) return false;
      if(!q) return true;
      return (p.given_name+' '+p.family_name).toLowerCase().includes(q);
    }).sort((a,b)=> (b.rating||0)-(a.rating||0)
        || (a.family_name+a.given_name).localeCompare(b.family_name+b.given_name));
  },

  // Ported from the TMS `elig`: on age, plays up, plays down, or refused on
  // gender. An age gap is a judgement; a gender mismatch is a rule.
  eligible(playerGroup, gender, teamGroup){
    if(!teamGroup) return {k:'on2', s:'—'};
    if(!playerGroup) return {k:'no', s:'no age group'};
    if((teamGroup.includes('Boys')  && gender==='F') ||
       (teamGroup.includes('Girls') && gender==='M')) return {k:'no', s:'wrong group'};
    if(playerGroup === teamGroup) return {k:'on2', s:'on age'};
    const n = g => parseInt(String(g).replace(/\D/g,''),10) || 0;
    return n(teamGroup) < n(playerGroup)
      ? {k:'dn', s:'plays down'} : {k:'up', s:'plays up'};
  },
  eligOf(p){ return this.eligible(p.age_group, p.gender, this.selTeam()?.age_group); },
  eligRow(r){ return this.eligible(r.natural_group, r.gender, r.age_group); },

  async createTeam(){
    this.tm.err=''; this.tm.busy=true;
    const name = this.tm.name.trim();
    let team = this.teams.find(t => t.name.toLowerCase() === name.toLowerCase());
    if(!team){
      const {data,error} = await this.sb.from('team')
        .insert({org_id:this.org.id, name}).select().single();
      if(error){ this.tm.err=error.message; this.tm.busy=false; return; }
      team = data;
    }
    //  A division is a RANK and a printable LABEL. What is typed is what gets
    //  printed; the digits in it are what orders and bands. Without the rank this
    //  team is invisible to Formation, which reads the rank and nothing else.
    const divText = this.tm.div.trim();
    const divRank = divText ? (divText.match(/\d+/)||[null])[0] : null;
    const {error} = await this.sb.from('team_season').insert({
      org_id:this.org.id, season_id:this.seasonId, team_id:team.id,
      age_group:this.tm.grp || null, division:divText || null,
      division_label:divText || null,
      division_rank:divRank!==null ? Number(divRank) : null});
    this.tm.busy=false;
    if(error){
      this.tm.err = /team_season_season_id_team_id_key/.test(error.message)
        ? name+' is already in this season.' : error.message;
      return;
    }
    this.tm={...this.tm, adding:false, name:'', grp:'', div:''};
    await this.loadTeams();
  },
  selectTeam(id){ this.tm.selected=id; this.tm.err=''; },

  async place(personId){
    if(!this.tm.selected) { this.tm.err='Pick a team first.'; return; }
    this.tm.err='';
    const {error} = await this.sb.from('team_member').insert({
      org_id:this.org.id, team_season_id:this.tm.selected, person_id:personId});
    if(error){ this.tm.err = error.message; return; }
    await this.loadTeams();
  },
  async unplace(r){
    this.tm.err='';
    const {error} = await this.sb.from('team_member').delete().eq('id', r.id);

    this.busy=true;

  // ── forming teams ──────────────────────────────────────────────────────
  // The engine itself is NOT here. It runs as a Supabase Edge Function, because
  // this file is served from a public repository and the solver is the one
  // piece of the product worth protecting. All this does is describe the teams,
  // ask, and show what came back.
  parsePlan(text){
    // "Gold 8, Navy 8 F, U12 White 10" -> [{label,size,gender}]
    return String(text).split(',').map(x => x.trim()).filter(Boolean).map(part => {
      const m = part.match(/^(.*?)\s+(\d+)\s*([FM])?$/i);
      if(!m) return {label: part, size: 10, gender: null};
      return {label: m[1].trim(), size: Number(m[2]),
              gender: m[3] ? m[3].toUpperCase() : null};
    }).filter(t => t.label && t.size > 0);
  },

  async runFormation(s){
    this.fm.err = ''; this.fm.busy = true; this.fm.sessionId = s.id;
    const teams = this.parsePlan(this.fm.plan);
    if(!teams.length){ this.fm.busy=false; this.fm.err='Describe at least one team.'; return; }
    const dup = teams.map(t=>t.label).filter((l,i,a)=>a.indexOf(l)!==i);
    if(dup.length){ this.fm.busy=false; this.fm.err='Two teams cannot share the name "'+dup[0]+'".'; return; }
    const {data, error} = await this.sb.functions.invoke('formation', {
      body: {session_id: s.id, teams}
    });
    this.fm.busy = false;
    if(error){ this.fm.err = error.message || String(error); return; }
    if(data?.error){ this.fm.err = data.error; return; }
    this.fm.result = data;
  },

    this.fm.err = '';

        org_id: this.org.id, session_id: s.id, person_id: pl.person_id,
        team_label: label, locked_by: this.me.id
      });
      if(error){ this.fm.err = error.message; return; }
    }
    await this.runFormation(s);

  async addBlock(){

  // ── the number ─────────────────────────────────────────────────────────
  meanOf(personId){

  sessionMean(){

  // ══════════════════════ COURTSIDE ══════════════════════
  // The coach's own device. Two rules shape all of this:
  //
  //   1. A rating is SAVED THE MOMENT IT IS TAKEN, to this device. Uploading is
  //      a separate, later, retryable thing. A school hall on trial night has no
  //      usable wifi and that is precisely when this has to work.
  //   2. Nobody is pre-assigned. The squad list shows who has already been rated
  //      and by whom, and coaches pick up whoever has not been. Two coaches
  //      rating the same player is allowed by design (decision F4) — both are
  //      kept and the head coach sees the spread.
  //
  // Idempotence comes free from the schema: the client generates the assessment
  // id, and assessment_score is keyed on (assessment_id, measure_id). A retry
  // that re-posts the same rating writes nothing new.

  QKEY(){ return 'platform.queue.' + (this.userId || 'anon'); },
  loadQueue(){
    try { this.queue = JSON.parse(localStorage.getItem(this.QKEY()) || '[]'); }
    catch { this.queue = []; }
  },
  saveQueue(){ localStorage.setItem(this.QKEY(), JSON.stringify(this.queue)); },
  RKEY(){ return 'platform.rejected.' + (this.userId || 'anon'); },
  loadRejected(){
    try { this.rejected = JSON.parse(localStorage.getItem(this.RKEY()) || '[]'); }
    catch { this.rejected = []; }
  },
  saveRejected(){ localStorage.setItem(this.RKEY(), JSON.stringify(this.rejected)); },

  CKEY(id){ return 'platform.court.' + id; },
  cacheSession(bundle){
    try { localStorage.setItem(this.CKEY(bundle.session.id), JSON.stringify(bundle)); } catch {}
  },
  cachedSession(id){
    try { return JSON.parse(localStorage.getItem(this.CKEY(id)) || 'null'); } catch { return null; }
  },

  uuid(){
    if(crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = crypto.getRandomValues(new Uint8Array(1))[0] % 16;
      return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
  },

  async openCourt(){
    this.stage = 'court';
    this.court.err = ''; this.court.session = null; this.court.person = null;
    const {data, error} = await this.sb.from('session_authorisation')
      .select('session_id, rating_session!inner(id,name,status,opens_at,closes_at,rubric_id)')
      .eq('membership_id', this.me.id);
    if(error){
      // No connection: fall back to whatever this device already knows.
      this.court.sessions = this.knownSessions();
      this.court.err = this.court.sessions.length ? '' :
        'Cannot reach the database, and this device has no session saved yet.';
      return;
    }
    this.court.sessions = (data || [])
      .map(r => r.rating_session)
      .filter(s => s && s.status === 'open');
    this.court.sessions.forEach(s => {
      const b = this.cachedSession(s.id) || {};
      this.cacheSession({...b, session: s});
    });
  },
  knownSessions(){
    const out = [];
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(!k || k.indexOf('platform.court.') !== 0) continue;
      try { const b = JSON.parse(localStorage.getItem(k)); if(b?.session) out.push(b.session); }
      catch {}
    }
    return out;
  },

  async pickCourtSession(s){
    this.court.session = s; this.court.person = null;
    this.court.err = ''; this.court.msg = '';
    const cached = this.cachedSession(s.id);
    if(cached){ this.court.people = cached.people || []; this.court.measures = cached.measures || [];
                this.court.rated = cached.rated || {}; }
    const [{data:ppl, error:e1}, {data:ms, error:e2}, {data:det}] = await Promise.all([
      this.sb.from('person').select('id,given_name,family_name').order('family_name'),
      this.sb.from('rubric_measure').select('*').eq('rubric_id', s.rubric_id).order('sort_order'),
      this.sb.from('v_rating_detail').select('person_id,membership_id,rater_name')
        .eq('session_id', s.id)
    ]);
    if(e1 || e2){
      if(!cached) this.court.err =
        'Cannot reach the database, and this session is not saved on this device yet. ' +
        'Open it once while you have a connection.';
      return;
    }
    this.court.people   = ppl || [];
    this.court.measures = ms  || [];
    const rated = {};
    (det || []).forEach(d => {
      rated[d.person_id] = rated[d.person_id] || {names:new Set(), mine:false};
      rated[d.person_id].names.add(d.rater_name);
      if(d.membership_id === this.me.id) rated[d.person_id].mine = true;
    });
    // Sets do not survive JSON, so store plain arrays.
    this.court.rated = Object.fromEntries(Object.entries(rated)
      .map(([k,v]) => [k, {names:[...v.names], mine:v.mine}]));
    this.applyQueueToRated();
    this.cacheSession({session:s, people:this.court.people,
                       measures:this.court.measures, rated:this.court.rated});
  },
  // Anything still sitting in the queue counts as rated — the coach did the work,
  // it just has not left the device.
  applyQueueToRated(){
    this.queue.filter(q => q.session_id === this.court.session?.id).forEach(q => {
      const r = this.court.rated[q.person_id] || {names:[], mine:false};
      if(!r.names.includes(this.me.display_name)) r.names.push(this.me.display_name);
      r.mine = true;
      this.court.rated[q.person_id] = r;
    });
  },
  courtMeasures(){ return this.court.measures; },
  courtRated(id){ return !!this.court.rated[id]; },
  courtMine(id){ return !!this.court.rated[id]?.mine; },
  courtWho(id){
    const r = this.court.rated[id];
    if(!r) return 'not rated yet';
    return 'rated by ' + r.names.join(', ');
  },
  courtDone(){ return Object.keys(this.court.rated).length; },

  pickCourtPlayer(p){
    this.court.person = p; this.court.scores = {}; this.court.note = ''; this.court.msg = '';
  },

  // Save = write to this device. Uploading is a separate concern.
  saveCourt(){
    const q = {
      id: this.uuid(),
      org_id: this.org.id,
      session_id: this.court.session.id,
      person_id: this.court.person.id,
      membership_id: this.me.id,
      submitted_at: new Date().toISOString(),
      note: this.court.note || null,
      scores: Object.entries(this.court.scores).map(([measure_id, score]) => ({measure_id, score}))
    };
    this.queue.push(q); this.saveQueue();
    const r = this.court.rated[q.person_id] || {names:[], mine:false};
    if(!r.names.includes(this.me.display_name)) r.names.push(this.me.display_name);
    r.mine = true; this.court.rated[q.person_id] = r;
    this.cacheSession({session:this.court.session, people:this.court.people,
                       measures:this.court.measures, rated:this.court.rated});
    this.court.person = null; this.court.scores = {}; this.court.note = '';
    this.flushQueue();
  },

  async flushQueue(){
    if(this.syncing || !this.queue.length) return;
    this.syncing = true;
    const still = [];
    for(const q of this.queue){
      const r = await this.sendOne(q);
      if(r.status === 'retry')   { still.push(q); }
      if(r.status === 'refused') { this.rejected.push({...q, reason:r.reason}); }
      // 'sent' simply falls off the queue.
    }
    this.queue = still; this.saveQueue(); this.saveRejected();
    this.syncing = false;
  },
  // A refusal is the coach's to see and decide about. It is never silently
  // dropped and never retried into a loop.
  discardRejected(id){
    this.rejected = this.rejected.filter(r => r.id !== id);
    this.saveRejected();
  },
  requeueRejected(id){
    const r = this.rejected.find(x => x.id === id);
    if(!r) return;
    this.rejected = this.rejected.filter(x => x.id !== id);
    const {reason, ...clean} = r;
    this.queue.push(clean);
    this.saveRejected(); this.saveQueue();
    this.flushQueue();
  },
  nameOfPerson(id){
    const p = (this.court.people || []).find(x => x.id === id);
    return p ? p.given_name + ' ' + p.family_name : 'a player';
  },
  // Three outcomes, not two. A rating that COULD NOT BE SENT and a rating the
  // database REFUSED are different problems and must not share a code path:
  // the first is worth retrying forever, the second never will be. Treating a
  // refusal as a network failure loops it silently and reports the app offline
  // while it is sitting on wifi.
  //
  // The discriminator is whether the request reached the database at all. If it
  // did, PostgREST returns an error carrying a `code` — a SQLSTATE from one of
  // our own triggers (P0001), an RLS refusal (42501), a constraint. If it did
  // not, there is no code, only a transport message.
  async sendOne(q){
    const {error:e1} = await this.sb.from('assessment').upsert({
      id:q.id, org_id:q.org_id, session_id:q.session_id, person_id:q.person_id,
      membership_id:q.membership_id, submitted_at:q.submitted_at
    }, {onConflict:'id', ignoreDuplicates:true});
    if(e1) return this.classify(e1);
    const {error:e2} = await this.sb.from('assessment_score').upsert(
      q.scores.map(x => ({assessment_id:q.id, measure_id:x.measure_id,
                          score:x.score, note:q.note})),
      {onConflict:'assessment_id,measure_id', ignoreDuplicates:true});
    if(e2) return this.classify(e2);
    this.online = true;
    return {status:'sent'};
  },
  classify(error){
    const reachedTheDatabase = !!error?.code;
    if(!reachedTheDatabase){ this.online = false; return {status:'retry'}; }
    this.online = true;
    return {status:'refused', reason: error.message || 'The database refused this rating.'};
  },

  // ── the player modal ───────────────────────────────────────────────────
  // Summoned from Review (and later from the Players list). It carries two
  // things: what happened in THIS session, pass by pass, and the player's
  // approved record across every session that has been confirmed.
  async openPlayer(personId){
    const row = this.review.rows.find(r => r.person_id === personId) || {};
    const sc  = this.review.scores?.[personId];
    const dir = this.people.find(p => p.id === personId);
    this.pe = dir ? this.bufferFrom(dir) : this.blankPerson();
    this.modal = 'players';
    this.pm = {
      personId, mode:'session', editing:false, adding:false, returnTo:'review',
      name: [row.given_name, row.family_name].filter(Boolean).join(' '),
      sessionName: this.review.session?.name || '',
      mean: sc ? Number(sc.mean_score).toFixed(2) : '',
      coverage: row.coverage || '',
      detail: [], history: [], err: ''
    };
    this.rz = {measure_id:'',source:'',adopted:null,score:null,rationale:'',err:'',busy:false};
    const [{data:d, error:e1}, {data:h, error:e2}, {data:rs}] = await Promise.all([
      this.sb.from('v_rating_detail').select('*')
        .eq('session_id', this.review.session.id).eq('person_id', personId)
        .order('measure_sort'),
      this.sb.from('v_player_history').select('*')
        .eq('person_id', personId).order('session_date'),
      this.sb.from('v_session_resolution').select('*')
        .eq('session_id', this.review.session.id).eq('person_id', personId)
    ]);
    if(e1){ this.pm.err = e1.message; return; }
    this.pm.detail      = d  || [];
    this.pm.history     = e2 ? [] : (h || []);
    this.pm.resolutions = (rs || []).filter(r => r.is_resolved);
  },

  // ── settling a divergence ──────────────────────────────────────────────
  // Two acts, one record. ADOPTED means the head coach picked a rater and said
  // that one is right; OWN means he formed his own judgement. Neither writes an
  // assessment — a head coach's score is not a fourth rating. If it were, it
  // would join the mean and move the spread, rewriting what the coaches said.
  res(measureId){ return (this.pm.resolutions || []).find(r => r.measure_id === measureId) || null; },
  effOf(m){
    const r = this.res(m.measure_id);
    return r ? Number(r.resolved_score).toFixed(2) : (m.mean ?? '–');
  },
  canResolve(){
    return ['head_coach','club_admin'].includes(this.me?.role)
        && ['open','closed'].includes(this.review.session?.status);
  },
  rzMeasure(){
    return this.pmMeasures().find(m => m.measure_id === this.rz.measure_id)
        || {scale_min:1, scale_max:5};
  },
  toggleResolve(m){
    if(this.rz.measure_id === m.measure_id){ this.rz.measure_id=''; return; }
    const existing = this.res(m.measure_id);
    this.rz = {
      measure_id: m.measure_id,
      source: existing?.source || '',
      adopted: existing?.adopted_membership_id || null,
      score: existing ? Number(existing.resolved_score) : null,
      rationale: existing?.rationale || '',
      err:'', busy:false
    };
  },
  async saveResolution(m){
    this.rz.err=''; this.rz.busy=true;
    const row = {
      org_id: this.org.id,
      session_id: this.review.session.id,
      person_id: this.pm.personId,
      measure_id: m.measure_id,
      resolved_score: this.rz.score,
      resolving_membership_id: this.me.id,
      source: this.rz.source || 'own',
      adopted_membership_id: this.rz.source === 'adopted' ? this.rz.adopted : null,
      rationale: this.rz.rationale || null
    };
    const {error} = await this.sb.from('assessment_resolution')
      .upsert(row, {onConflict:'session_id,person_id,measure_id'});
    this.rz.busy=false;
    if(error){ this.rz.err = error.message; return; }
    this.rz.measure_id='';
    const {data:rs} = await this.sb.from('v_session_resolution').select('*')
      .eq('session_id', this.review.session.id).eq('person_id', this.pm.personId);
    this.pm.resolutions = (rs || []).filter(r => r.is_resolved);
    await this.loadSessionQueue();
  },

  // One column per rating PASS, oldest first. Two passes by the same coach stay
  // separate — seeing what was actually said is the whole point.
  pmRaters(){
    const seen = new Map();
    (this.pm.detail || []).forEach(d => {
      if(!seen.has(d.assessment_id))
        seen.set(d.assessment_id, {key:d.assessment_id, name:d.rater_name,
                                   mid:d.membership_id,
                                   at:d.recorded_at, when:this.shortWhen(d.recorded_at)});
    });
    return [...seen.values()].sort((a,b) => String(a.at).localeCompare(String(b.at)));
  },
  // Every measure in the session's rubric, whether anybody rated it or not.
  // A gap is the head coach's to close as much as a disagreement is his to
  // settle — he is the one who explains the whole record to a parent.
  pmMeasures(){
    const byMeasure = new Map();
    (this.measuresOf(this.review.session?.rubric_id) || []).forEach(m => {
      byMeasure.set(m.id, {measure_id:m.id, label:m.label, sort:m.sort_order,
                           scale_min:m.scale_min ?? 1, scale_max:m.scale_max ?? 5,
                           by:{}, vals:[]});
    });
    (this.pm.detail || []).forEach(d => {
      if(!byMeasure.has(d.measure_id))
        byMeasure.set(d.measure_id,
          {measure_id:d.measure_id, label:d.measure_label, sort:d.measure_sort,
           scale_min:1, scale_max:5, by:{}, vals:[]});
      const m = byMeasure.get(d.measure_id);
      m.by[d.assessment_id] = d.score;
      m.vals.push(Number(d.score));
    });
    return [...byMeasure.values()]
      .sort((a,b) => a.sort - b.sort)
      .map(m => ({...m,
        rated: m.vals.length > 0,
        mean:  m.vals.length ? (m.vals.reduce((a,b)=>a+b,0) / m.vals.length).toFixed(2) : null,
        spread: m.vals.length ? Math.max(...m.vals) - Math.min(...m.vals) : 0}));
  },
  pmWorst(){
    const v = this.pmMeasures().map(m => m.spread);
    return v.length ? Math.max(...v) : 0;
  },
  // The approved record, one row per confirmed session, oldest first.
  pmHistory(){
    const bySession = new Map();
    (this.pm.history || []).forEach(h => {
      if(!bySession.has(h.session_id))
        bySession.set(h.session_id, {session_id:h.session_id, session_name:h.session_name,
                                     session_date:h.session_date, vals:[], anyResolved:false});
      const x = bySession.get(h.session_id);
      x.vals.push(Number(h.score));
      if(h.source === 'resolved') x.anyResolved = true;
    });
    return [...bySession.values()]
      .sort((a,b) => String(a.session_date).localeCompare(String(b.session_date)))
      .map(x => ({...x, n:x.vals.length,
        mean:(x.vals.reduce((a,b)=>a+b,0) / x.vals.length).toFixed(2)}));
  },
  // ── the shape and the trend ────────────────────────────────────────────
  // `radarSVG` is ported from the TMS (build/src/app.js) unchanged in geometry
  // and nearly unchanged in code, so a player drawn here and a player drawn
  // there are the same picture. Rings at 1..5, the 3 ring dashed as the
  // reference line, axis names outside, long names broken over two lines.
  //
  // Accessibility: two series are told apart by dash AND colour, and the table
  // beside the chart writes out every value and every change. Nothing here is
  // encoded by colour alone.
  esc(t){ return String(t).replace(/[&<>"]/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); },

  radarSVG(labels, series, size){
    const N = labels.length; if(!N) return '';
    const padx = 58;
    const R = size/2 - 30, cx = size/2, cy = size/2 + 2;
    const ang = i => (Math.PI*2*i/N) - Math.PI/2;
    const pt  = (i,v) => [cx + Math.cos(ang(i))*R*(v/5), cy + Math.sin(ang(i))*R*(v/5)];
    const poly = v => labels.map((_,i) => pt(i,v).join(',')).join(' ');
    let h = `<svg viewBox="${-padx} 0 ${size+padx*2} ${size}" width="${size+padx*2}" `
          + `height="${size}" style="display:block" role="img" `
          + `aria-label="Rating shape across ${N} measures, scored 1 to 5">`;
    for(let r=1; r<=5; r++)
      h += `<polygon points="${poly(r)}" fill="none" `
         + `stroke="${r===3?'#b9b7ae':'#e6e4dc'}" stroke-width="${r===3?1.1:0.8}"`
         + `${r===3?' stroke-dasharray="3 2"':''}/>`;
    labels.forEach((_,i) => { const [x,y] = pt(i,5);
      h += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#e6e4dc" stroke-width="0.8"/>`; });
    series.forEach(sr => {
      const pts = labels.map((_,i) => { const v = sr.vals[i]; return pt(i, v==null?0:v).join(','); }).join(' ');
      h += `<polygon points="${pts}" fill="${sr.fill||'none'}" stroke="${sr.stroke}" `
         + `stroke-width="${sr.w||1.6}"${sr.dash?` stroke-dasharray="${sr.dash}"`:''}/>`;
      if(sr.dot) labels.forEach((_,i) => { const v = sr.vals[i]; if(v==null) return;
        const [x,y] = pt(i,v); h += `<circle cx="${x}" cy="${y}" r="2.4" fill="${sr.stroke}"/>`; });
    });
    labels.forEach((lab,i) => { const [x,y] = pt(i,5.8);
      const an = ang(i), mid = Math.abs(Math.cos(an)) < 0.25;
      const anc = mid ? 'middle' : (Math.cos(an) > 0 ? 'start' : 'end');
      const sp = String(lab).indexOf(' ');
      const two = (String(lab).length > 11 && sp > 0);
      const lines = two ? [String(lab).slice(0,sp), String(lab).slice(sp+1)] : [String(lab)];
      const y0 = y + 3 - (two ? 5 : 0);
      h += `<text x="${x}" y="${y0}" font-size="9" fill="#55554E" text-anchor="${anc}">`
         + lines.map((l,k) => `<tspan x="${x}" dy="${k?10:0}">${this.esc(l)}</tspan>`).join('')
         + '</text>';
    });
    return h + '</svg>';
  },

  // One row per measure of the LATEST confirmed session, with the change since
  // the one before it. Measures are ordered as the rubric orders them.
  pmShapeRows(){
    const hist = this.pmHistory();
    if(!hist.length) return [];
    const latest = hist[hist.length-1].session_id;
    const prev   = hist.length > 1 ? hist[hist.length-2].session_id : null;
    const byMeasure = new Map();
    (this.pm.history || []).forEach(h => {
      if(!byMeasure.has(h.measure_id))
        byMeasure.set(h.measure_id,
          {measure_id:h.measure_id, label:h.measure_label, sort:h.measure_sort,
           now:null, was:null});
      const m = byMeasure.get(h.measure_id);
      if(h.session_id === latest) m.now = Number(h.score);
      if(prev && h.session_id === prev) m.was = Number(h.score);
    });
    return [...byMeasure.values()]
      .filter(m => m.now != null)
      .sort((a,b) => a.sort - b.sort)
      .map(m => ({...m, delta: m.was == null ? null : m.now - m.was}));
  },

  playerRadar(){
    const rows = this.pmShapeRows();
    if(!rows.length) return '';
    const labels = rows.map(r => r.label);
    const series = [];
    if(rows.some(r => r.was != null))
      series.push({vals: rows.map(r => r.was), stroke:'#8b8981', dash:'4 3', w:1.3});
    series.push({vals: rows.map(r => r.now), stroke:'#1F3864',
                 fill:'rgba(31,56,100,.10)', w:1.8, dot:true});
    return this.radarSVG(labels, series, 210);
  },

  shortWhen(ts){
    if(!ts) return '';
    const d = String(ts).slice(0,10), t = String(ts).slice(11,16);
    return d + (t ? ' ' + t : '');
  },

  async confirmSession(){
    this.review.err=''; this.busy=true;
    const {error} = await this.sb.from('rating_session')
      .update({status:'confirmed', confirmed_by:this.me.id})
      .eq('id',this.review.session.id);
    this.busy=false;
    if(error){ this.review.err=error.message; return; }
    this.review.session.status='confirmed';
    await this.load();
  },

  unauthorisedMembers(){
    const has = new Set(this.auths.map(a=>a.membership_id));
    return this.members.filter(m=>!has.has(m.id));
  },

  // ── lifecycle ──────────────────────────────────────────────────────────
  // What is still stopping the open session from opening, in one phrase.
  // Returns '' when nothing is. The database enforces the same rule.
  openBlockers(){
    const missing = [];
    if(!this.blocks.length) missing.push('at least one day');
    if(!this.auths.length)  missing.push('at least one authorised rater');
    return missing.join(' and ');
  },

  // draft → open → closed → confirmed, and closed can reopen. The database
  // owns which moves exist and what opening requires; this just asks.
  async setStatus(s, next){
    this.statusErr='';
    const {error} = await this.sb.from('rating_session')
      .update({status: next}).eq('id', s.id);
    if(error){ this.statusErr = error.message; return; }
    s.status = next;
    const keep = this.sel; this.sel=null;
    await this.load();
    if(keep) await this.openSession(this.sessions.find(x=>x.id===keep.id) || keep);
  },

  // ── removal ────────────────────────────────────────────────────────────
  // The database is the authority on all three of these. Every message below
  // is either the trigger's own words or a plain reading of a Postgres code —
  // nothing here decides whether the delete is allowed.
  friendlyDeleteError(error, fallback){
    const m = error?.message || '';
    if (error?.code === '23503') return 'Something still depends on this, so it cannot be removed.';
    if (error?.code === '42501' || /row-level security/i.test(m))
      return 'You do not have permission to remove this.';
    return m || fallback;
  },

  async removeBlock(b){
    this.blockErr='';
    const {error} = await this.sb.from('session_block').delete().eq('id', b.id);
    if(error){ this.blockErr = this.friendlyDeleteError(error,'That day could not be removed.'); return; }
    const s=this.sel; this.sel=null; await this.openSession(s);
  },

  async removeAuth(a){
    this.authErr='';
    const {error} = await this.sb.from('session_authorisation').delete().eq('id', a.id);
    if(error){ this.authErr = this.friendlyDeleteError(error,'That authorisation could not be removed.'); return; }
    const s=this.sel; this.sel=null; await this.openSession(s);
  },

  async deleteSession(s){
    this.delErr='';
    const {error} = await this.sb.from('rating_session').delete().eq('id', s.id);
    if(error){
      this.delErr = this.friendlyDeleteError(error,'That session could not be deleted.');
      return;
    }
    this.delConfirm=''; this.sel=null;
    await this.load();
  },

  // ── the player record ───────────────────────────────────────────────────
  // Three doors write this same row: staff entry here, EOI and import later.
  // They differ in the TRUST attached, not in what they produce, so the shape
  // stays one shape and `source` says which door it came through.
  activePeople(){ return this.people.filter(p => p.status !== 'inactive'); },
  peopleShown(){
    const q = this.pf.q.trim().toLowerCase();
    // Opened from a review, the list is scoped to that session — Ming's old
    // complaint was scrolling up and down to get between players.
    const scope = (this.pm.returnTo==='review' && this.review?.rows?.length)
      ? new Set(this.review.rows.map(r => r.person_id)) : null;
    return this.people.filter(p => {
      if(scope) return scope.has(p.id) &&
        (!q || (p.given_name+' '+p.family_name).toLowerCase().includes(q));
      if(this.pf.show==='active'     && p.status==='inactive') return false;
      if(this.pf.show==='inactive'   && p.status!=='inactive') return false;
      if(this.pf.show==='unverified' && p.verification==='verified') return false;
      if(this.pf.gender && p.gender !== this.pf.gender) return false;
      if(this.pf.age !== null && this.ageAt(p.dob, this.pf.year) !== this.pf.age) return false;
      if(!q) return true;
      return (p.given_name+' '+p.family_name).toLowerCase().includes(q);
    });
  },
  // AGE, NOT AGE GROUP. This is arithmetic — age at 31 December of a chosen
  // year — and nothing more. "U12" / "U14" is an ASSOCIATION'S OWN banding
  // convention, it varies between them, and it is only meaningful against a
  // season year. Hard-coding a band here would invent a rule this platform has
  // no business inventing; it belongs with the season and org_profile.
  ageAt(dob, year){
    if(!dob) return null;
    return Number(year) - Number(String(dob).slice(0,4));
  },
  ageYears(){
    const y = new Date().getFullYear();
    return [y-1, y, y+1, y+2];
  },
  ageGroups(){
    const seen = {};
    this.people.forEach(p => {
      if(this.pf.show==='active'   && p.status==='inactive') return;
      if(this.pf.show==='inactive' && p.status!=='inactive') return;
      if(this.pf.gender && p.gender !== this.pf.gender) return;
      const a = this.ageAt(p.dob, this.pf.year);
      if(a === null) return;
      seen[a] = (seen[a]||0) + 1;
    });
    return Object.keys(seen).map(Number).sort((a,b)=>a-b).map(a => ({age:a, n:seen[a]}));
  },
  unverifiedCount(){ return this.people.filter(p => p.verification!=='verified').length; },
  ratedCount(id){ return this.people.find(p=>p.id===id)?.sessions_rated || 0; },
  ageOf(dob){
    if(!dob) return '';
    const d=new Date(dob+'T00:00:00Z'), n=new Date();
    let a=n.getUTCFullYear()-d.getUTCFullYear();
    const m=n.getUTCMonth()-d.getUTCMonth();
    if(m<0 || (m===0 && n.getUTCDate()<d.getUTCDate())) a--;
    return a;
  },
  vsourceLabel(s){
    return s==='association' ? 'matched to the association’s registration'
         : s==='attested'    ? 'attested by the parent at registration'
         : s==='admin'       ? 'a club admin’s own authority' : '';
  },
  vsourceShort(s){
    return s==='association' ? 'reg.' : s==='attested' ? 'parent'
         : s==='admin' ? 'admin' : 'verified';
  },

  blankPerson(){
    return {id:null,given:'',family:'',dob:'',gender:'',ref:'',status:'active',
            verification:'unverified',vsource:'',vnote:'',
            dupes:[],delConfirm:false,err:'',busy:false};
  },
  // The edit buffer is filled from the directory row, so the card can be READ
  // before anybody decides to change anything. Apple's Contacts shape: one card
  // per person, edit is a mode it enters, not a second screen.
  bufferFrom(p){
    return {id:p.id, given:p.given_name||'', family:p.family_name||'', dob:p.dob||'',
            gender:p.gender||'', ref:p.external_ref||'', status:p.status||'active',
            verification:p.verification||'unverified', vsource:p.verified_source||'',
            vnote:p.verified_note||'',
            dupes:[], delConfirm:false, err:'', busy:false};
  },
  pmRow(){ return this.people.find(p => p.id === this.pm.personId) || null; },
  canEditPlayer(){ return ['head_coach','club_admin'].includes(this.me?.role); },
  sourceLabel(s){
    return s==='eoi'    ? 'an expression of interest'
         : s==='import' ? 'an import'
         : s==='seed'   ? 'the demo seed' : 'staff entry';
  },
  cancelEdit(){
    if(!this.pm.personId){ this.pm.adding=false; return; }  // a new player, abandoned
    this.pe = this.bufferFrom(this.pmRow() || {});
    this.pm.editing = false;
  },

  // ── the player card ─────────────────────────────────────────────────────
  // One surface per player, reached from the directory OR from a review row.
  // From the directory it shows details, verification and the permanent record;
  // from a review it also shows what each rater said in that session.
  startAdd(){
    this.peopleErr='';
    this.pe = this.blankPerson();
    this.pm.adding = true;
  },
  // Selecting on the left swaps the pane on the right. No dialog per player —
  // Ming, 13 Aug 2026: scroll the list and the detail follows.
  async selectPlayer(p){
    if(!p) return;
    if(this.pm.editing) this.cancelEdit();
    if(this.pm.returnTo==='review' && this.review?.session){ await this.openPlayer(p.id); return; }
    this.peopleErr='';
    this.pe = this.bufferFrom(p);
    Object.assign(this.pm, {personId:p.id, mode:'profile', editing:false, adding:false,
      name:[p.given_name,p.family_name].filter(Boolean).join(' '),
      sessionName:'', mean:'', coverage:'',
      detail:[], history:[], resolutions:[], err:''});
    this.rz = {measure_id:'',source:'',adopted:null,score:null,rationale:'',err:'',busy:false};
    if(!this.ratedCount(p.id)) return;
    const {data:h, error} = await this.sb.from('v_player_history')
      .select('*').eq('person_id', p.id).order('session_date');
    if(error){ this.pm.err = error.message; return; }
    this.pm.history = h || [];
  },

  // ── verifying in one click ──────────────────────────────────────────────
  // Writes straight away. Verification is repeated dozens of times in a sitting
  // and must not cost an edit-change-save round trip; editing a record is the
  // rare act, not this one.
  async quickVerify(src, note){
    if(!this.pm.personId || this.pm.editing) return;
    this.qv.err=''; this.qv.busy=true;
    const {error} = await this.sb.from('person').update({
      verification:'verified', verified_source:src, verified_by:this.me?.id,
      verified_note: src==='admin' ? (note||'').trim() : null
    }).eq('id', this.pm.personId);
    this.qv.busy=false;
    if(error){ this.qv.err = error.message; return; }
    this.qv = {open:false,note:'',busy:false,err:''};
    await this.refreshCard();
  },
  async quickUnverify(){
    if(!this.pm.personId) return;
    this.qv.err=''; this.qv.busy=true;
    const {error} = await this.sb.from('person')
      .update({verification:'unverified'}).eq('id', this.pm.personId);
    this.qv.busy=false;
    if(error){ this.qv.err = error.message; return; }
    await this.refreshCard();
  },
  async refreshCard(){
    await this.load();
    const p = this.pmRow();
    if(p) this.pe = this.bufferFrom(p);
  },

  setVerification(src){
    if(!src){ this.pe.verification='unverified'; this.pe.vsource='';
              this.pe.vnote=''; return; }
    this.pe.verification='verified'; this.pe.vsource=src;
    if(src!=='admin') this.pe.vnote='';
  },

  // Verification's FIRST job is "is this person already here", not "are these
  // fields right". match_person() lives in the database precisely so staff
  // entry and, later, import can never disagree about who is a duplicate.
  async checkDupes(){
    this.pe.dupes=[];
    const g=this.pe.given.trim(), f=this.pe.family.trim();
    if(!g || !f || !this.org) return;
    const {data,error} = await this.sb.rpc('match_person',{
      p_org:this.org.id, p_given:g, p_family:f, p_dob:this.pe.dob||null});
    if(error) return;
    this.pe.dupes = (data||[]).filter(d => d.person_id !== this.pe.id);
  },

  async savePerson(){
    this.pe.err=''; this.pe.busy=true;
    const verified = this.pe.verification==='verified';
    const row = {
      given_name: this.pe.given.trim(),
      family_name: this.pe.family.trim(),
      dob: this.pe.dob || null,
      gender: this.pe.gender || null,
      external_ref: this.pe.ref.trim() || null,
      status: this.pe.status,
      verification: verified ? 'verified' : 'unverified',
      verified_source: verified ? (this.pe.vsource || null) : null,
      verified_note:   verified ? (this.pe.vnote.trim() || null) : null,
      verified_by:     verified ? this.me?.id : null
    };
    let error;
    if(this.pe.id){
      ({error} = await this.sb.from('person').update(row).eq('id', this.pe.id));
    }else{
      // HARD RULE: this version holds fabricated data only, so every record
      // created here is flagged. Do not make this conditional.
      ({error} = await this.sb.from('person')
                    .insert({...row, org_id:this.org.id, source:'staff', is_demo:true}));
    }
    this.pe.busy=false;
    if(error){ this.pe.err = error.message; return; }
    await this.load();
    // stay on the record that was just written, in read mode
    const saved = this.pe.id
      ? this.pmRow()
      : this.people.find(p => p.given_name===row.given_name
                           && p.family_name===row.family_name && p.dob===row.dob);
    if(saved){ await this.selectPlayer(saved); }
    this.pm.editing = false; this.pm.adding = false;
  },

  async deletePerson(){
    this.pe.err='';
    const {error} = await this.sb.from('person').delete().eq('id', this.pe.id);
    if(error){
      this.pe.err = this.friendlyDeleteError(error,'That player could not be deleted.');
      this.pe.delConfirm=false;
      return;
    }
    this.pm.personId=''; this.pm.editing=false;
    await this.load();
  },

  async addAuth(){
    this.authErr='';
    const {error} = await this.sb.from('session_authorisation').insert({
      org_id:this.org.id, session_id:this.sel.id,
      membership_id:this.newAuth.membership_id, authorised_by:this.me.id
    });
    if(error){
      this.authErr = error.code==='23505'
        ? 'That person is already authorised for this session.'
        : error.message;
      return;
    }
    this.newAuth.membership_id='';
    const s=this.sel; this.sel=null; await this.openSession(s);
  }
}}
</script>
</body>
</html>
