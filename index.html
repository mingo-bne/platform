    <!-- ══════════════════ PLACEMENT — where every player stands ═══════════════
         N6. `player_season` and `team_offer` have been enforced and tested since
         12 Aug and were completely invisible: accepting a formation put offers
         out and nothing could record a single answer.

         ORGANISED BY WHAT NEEDS DOING, not by team. Ming's call, 20 Aug 2026.
         A registrar on a Tuesday night is chasing forty families across thirteen
         teams — the question is never "show me B14 Gold", it is "who has not
         answered". So the index on the left is the work, and the right-hand side
         is that list with the one action it exists for.

         THE TWO STATE MACHINES STAY TWO. The club relationship (training →
         trialling → offered → confirmed) and the answer to a place in a specific
         team are different facts and are never merged into one column — see
         ADR-001. A decline sends a player back to TRAINING, not out of the club. -->
    <template x-if="stage==='placement'">
    <div class="panel">
      <div class="rhead">
        <h2>Placement</h2>
        <div class="sub">Who has been offered a place, who has answered, and who is registered.</div>
      </div>

      <!-- the same season control as every other stage where the season is the scope -->
      <div class="pbody" style="padding-bottom:0">
        <div class="cath" style="margin-top:0">Season</div>
        <div class="dsh" style="margin-bottom:8px">
          <template x-for="s in seasonTiles()" :key="s.id">
            <button class="dsc" :class="s.id===seasonId?'on':''" @click="pickSeason(s.id)">
              <b x-text="s.name"></b>
              <span class="yr">age reckoned at <span x-text="s.year"></span></span>
              <span class="mt">
                <span class="c ok" x-show="s.is_current">current</span>
                <span class="c wn" x-show="s.archived_at">archived · read-only</span>
                <span class="c" x-text="dashSeasonSub(s)"></span>
              </span>
            </button>
          </template>
          <template x-if="!seasonTiles().length">
            <div class="empty" style="flex:1">No season in play. Open <b>Season</b> and create one.</div>
          </template>
        </div>
        <div class="inline" style="margin:0 0 4px" x-show="seasonTilesOlder().length">
          <label class="fl" style="margin:0">Earlier and archived seasons</label>
          <select style="width:auto" @change="pickSeason($event.target.value)">
            <option value="">—</option>
            <template x-for="s in seasonTilesOlder()" :key="s.id">
              <option :value="s.id" x-text="seasonOptionLabel(s)+(s.archived_at?' · archived':'')"></option>
            </template>
          </select>
        </div>
      </div>

      <div class="statrow">
        <div><b x-text="plCount('offered')"></b>offers out</div>
        <div><b x-text="plCount('answered')"></b>answered</div>
        <div><b x-text="plCount('registered')"></b>registered</div>
        <div><b x-text="plCount('fees')"></b>fees outstanding</div>
      </div>
      <p x-show="pl.err" class="warnbar" style="display:flex;gap:10px;align-items:center">
        <span style="flex:1" x-text="pl.err"></span>
        <button class="lnk" style="color:var(--warn)" @click="pl.err=''">dismiss</button></p>

      <div class="pbody">
        <template x-if="!seasonId">
          <div class="empty">Choose a season — everything here is read through one.</div>
        </template>

        <template x-if="seasonId">
        <div class="tsplit">
          <!-- ── WHAT NEEDS DOING, LEFT ── every list is shown even when it is
               empty: "nobody is waiting on you" is an answer, and a list that
               disappears when it empties makes the screen change shape under
               somebody who is working down it. -->
          <div>
            <div class="cath" style="margin-top:0">What needs doing</div>
            <template x-for="b in plBuckets()" :key="b.k">
              <button class="agi" :class="pl.bucket===b.k?'on':''" @click="pl.bucket=b.k">
                <span class="an" x-text="b.label"></span>
                <span class="c" :class="b.n ? (b.tone||'') : ''" x-text="b.n"></span>
              </button>
            </template>
            <p class="note" style="margin-top:8px">A decline sends a player back to the pool, not
              out of the club — they stay available for the next thing.</p>
          </div>

          <!-- ── THAT LIST, AND THE ONE ACTION IT IS FOR, RIGHT ── -->
          <div>
            <div class="cath" style="margin-top:0" x-text="plBucket().label"></div>
            <p class="note" style="margin:0 0 8px" x-text="plBucket().rule"></p>

            <template x-if="!plRows().length">
              <div class="empty" x-text="plBucket().empty"></div>
            </template>

            <template x-if="plRows().length">
            <table class="jt plt">
              <thead><tr>
                <th>Player</th><th>Age group</th><th>Team</th>
                <th x-text="plBucket().col || 'Standing'"></th>
                <th style="width:1%"></th>
              </tr></thead>
              <tbody>
                <template x-for="r in plRows()" :key="r.person_id">
                  <tr>
                    <td class="pn">
                      <b x-text="r.name"></b>
                      <span x-text="r.sub"></span>
                    </td>
                    <td class="pg" x-text="r.age_group || '—'"></td>
                    <td class="pt">
                      <b x-text="r.team_name || r.team_label || '—'"></b>
                      <span x-show="r.division_label" x-text="r.division_label"></span>
                    </td>
                    <td class="ps">
                      <span class="c" :class="r.tone" x-text="r.standing"></span>
                      <span class="c wn" x-show="r.verification!=='verified'">unverified</span>
                      <span class="sub" x-show="r.standing2" x-text="r.standing2"></span>
                    </td>
                    <td class="plact">
                      <!-- ── the answer ────────────────────────────────────── -->
                      <!-- THE CONFIRMATION HAPPENS ON THE ROW. Ming, 20 Aug 2026:
                           "declined at the moment does nothing." It did exactly
                           what it was built to do — it opened a confirmation box
                           BELOW the table, which with sixty-four rows rendered
                           four thousand pixels under the fold. A response the
                           user cannot see is no response. The two-step guard
                           stays (a decline takes a child off a roster); it just
                           happens where the eye already is. -->
                      <template x-if="plBucket().act==='answer'">
                        <span class="inline" style="margin:0;gap:5px;flex-wrap:nowrap;justify-content:flex-end">
                          <template x-if="pl.decline!==r.person_id">
                            <span class="inline" style="margin:0;gap:5px;flex-wrap:nowrap">
                              <button class="btn sm" :disabled="pl.busy===r.person_id"
                                      @click="plAnswer(r,'accepted')">Accepted</button>
                              <button class="btn sm" :disabled="pl.busy===r.person_id"
                                      @click="pl.decline=r.person_id">Declined…</button>
                            </span>
                          </template>
                          <template x-if="pl.decline===r.person_id">
                            <span class="pldec">
                              <!-- THE TEAM IS ALREADY ON THIS ROW. Naming it again
                                   in the confirmation is what pushed the strip off
                                   the right edge of the screen. -->
                              <span class="q">Decline?</span>
                              <button class="btn sm pri" :disabled="pl.busy===r.person_id"
                                      @click="plAnswer(r,'declined')">Yes</button>
                              <button class="btn sm" @click="pl.decline=''">Cancel</button>
                            </span>
                          </template>
                        </span>
                      </template>
                      <!-- ── the registration ──────────────────────────────── -->
                      <template x-if="plBucket().act==='register'">
                        <span class="inline" style="margin:0;gap:5px;flex-wrap:nowrap">
                          <input type="text" style="width:150px" :value="pl.ref[r.person_id]||''"
                                 @input="pl.ref[r.person_id]=$event.target.value; pl.ref={...pl.ref}"
                                 placeholder="registration reference — optional">
                          <button class="btn sm pri" :disabled="pl.busy===r.person_id"
                                  @click="plRegister(r)">Registered</button>
                        </span>
                      </template>
                      <!-- ── the fees ──────────────────────────────────────── -->
                      <template x-if="plBucket().act==='fees'">
                        <span class="inline" style="margin:0;gap:4px;flex-wrap:nowrap">
                          <template x-for="f in plFeeStates" :key="f.k">
                            <button class="btn sm" :class="r.fees===f.k?'pri':''"
                                    :disabled="pl.busy===r.person_id"
                                    @click="plFees(r,f.k)" x-text="f.label"></button>
                          </template>
                        </span>
                      </template>
                      <!-- ── a place that came back ────────────────────────── -->
                      <template x-if="plBucket().act==='backfill'">
                        <button class="btn sm" @click="plToTeams(r)">Open the team →</button>
                      </template>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
            </template>

            <p class="note" x-show="plBucket().act==='backfill' && plRows().length">
              Backfilling in place — picking a replacement here and seeing what it costs the team's
              average — is not built yet. Until it is, open the team and place somebody from the
              pool; the balance table on that age group shows the cost.</p>
          </div>
        </div>
        </template>
      </div>
    </div>
    </template>

    <!-- PLAYERS IS A SECTION, NOT A DIALOG. Ming, 19 Aug 2026, put it in the
         sequence beside Rating, Teams and Formation. The directory was always a
         working surface fighting a modal container — list left, detail right, the
         list scrolling on its own. Reached from a review row it stays scoped to
         that session and `← Review` goes back to the ledger. -->
    <template x-if="stage==='players'">
      <div class="panel">
        <div>
          <div class="rhead" style="display:flex;align-items:baseline;gap:10px">
            <h2 style="margin:0">Players</h2>
            <span class="c" x-text="peopleShown().length+' of '+people.length"></span>
            <span class="c wn" x-show="unverifiedCount()"
                  x-text="unverifiedCount()+' unverified'"></span>
            <span style="margin-left:auto"></span>
            <button class="btn sm pri" @click="startAdd()"
                    x-show="!pm.editing && pm.returnTo!=='review'">Add a player</button></div>

          <div class="mbody" style="max-height:none">
            <p x-show="peopleErr" x-text="peopleErr" class="err" style="margin-top:0"></p>

            <!-- ── filters. Age is arithmetic — age at 31 December of the year you
                   pick — NOT a named band. U12 / U14 are an association's own
                   convention and belong with the season, not hard-coded here. ── -->
            <p class="note" x-show="pm.returnTo==='review'" style="margin-top:0">
              Showing the players in <b x-text="pm.sessionName"></b>. Pick any of them on the left —
              you do not have to go back to the ledger between players.</p>
            <div class="inline" style="margin-top:0" x-show="pm.returnTo!=='review'">
              <input type="search" x-model="pf.q" placeholder="Search a name"
                     style="flex:1;min-width:150px">
              <select x-model="pf.show" style="width:auto">
                <option value="active">Active</option>
                <option value="unverified">Unverified only</option>
                <option value="inactive">Inactive</option>
                <option value="all">Everyone</option>
              </select>
              <select x-model="pf.gender" style="width:auto">
                <option value="">Any gender</option>
                <option value="F">F</option><option value="M">M</option><option value="X">X</option>
              </select>
              <select x-model.number="pf.year" style="width:auto">
                <template x-for="y in ageYears()" :key="y">
                  <option :value="y" x-text="'age at 31 Dec '+y"></option>
                </template>
              </select>
            </div>
            <div class="fchips" x-show="pm.returnTo!=='review'">
              <button class="fc" :class="pf.age===null?'on':''" @click="pf.age=null">All ages</button>
              <template x-for="g in ageGroups()" :key="g.age">
                <button class="fc" :class="pf.age===g.age?'on':''" @click="pf.age=g.age">
                  <b x-text="g.age"></b><span x-text="' · '+g.n"></span></button>
              </template>
              <span class="c" x-show="!ageGroups().length">no dates of birth recorded</span>
            </div>

            <div class="psplit" style="margin-top:10px">
              <div>
                <div class="plist2">
                  <template x-for="p in peopleShown()" :key="p.id">
                    <button class="prow" :class="pm.personId===p.id?'on':''"
                            @click="selectPlayer(p)">
                      <span class="u" x-show="p.verification!=='verified'"
                            title="not verified"></span>
                      <span class="bd">
                        <span class="n2" x-text="p.given_name+' '+p.family_name"></span>
                        <span class="m2">
                          <span x-text="p.dob ? ageAt(p.dob, pf.year)+' in '+pf.year : 'no DOB'"></span>
                          <span x-show="p.gender" x-text="' · '+p.gender"></span>
                          <span x-show="p.status==='inactive'"> · inactive</span>
                          <span x-show="ratedCount(p.id)" x-text="' · '+ratedCount(p.id)+' rated'"></span>
                        </span>
                      </span>
                    </button>
                  </template>
                  <template x-if="!peopleShown().length">
                    <div class="empty" style="padding:18px 10px"
                         x-text="people.length ? 'Nobody matches that.' : 'No players yet.'"></div>
                  </template>
                </div>
                <p class="note">A dot marks a record nobody has stood behind yet. Rating never waits
                  on it; <b>an offer of a place does</b>.</p>
              </div>

              <div class="pdet" data-modal="player">
                <template x-if="!pm.personId">
                  <div class="empty">Pick a player on the left.</div>
                </template>
                <template x-if="pm.personId">
                  <div>
                    <div class="inline" style="margin:0 0 8px">
                      <b style="font-size:15px" x-text="pm.name"></b>
                      <span class="c" x-show="pe.dob" x-text="ageAt(pe.dob, pf.year)+' in '+pf.year"></span>
                      <span class="c" x-show="pe.status==='inactive'">inactive</span>
                      <span class="c" :class="pe.verification==='verified' ? 'ok':'wn'"
                            x-text="pe.verification==='verified'
                                    ? vsourceShort(pe.vsource) : 'unverified'"></span>
                      <span class="c grp" x-show="pm.sessionName" x-text="pm.sessionName"></span>
                      <span style="margin-left:auto"></span>
                      <button class="btn sm" x-show="pm.returnTo==='review' && !pm.editing"
                              @click="stage='admin'; modal='review'">&larr; Review</button>
                      <button class="btn sm" x-show="!pm.editing && canEditPlayer()"
                              @click="pm.editing=true">Edit</button>
                      <button class="btn sm pri" x-show="pm.editing" @click="savePerson()"
                              :disabled="pe.busy || !pe.given.trim() || !pe.family.trim()"
                              x-text="pe.busy ? 'Saving…' : 'Done'"></button>
                      <button class="btn sm" x-show="pm.editing" @click="cancelEdit()">Cancel</button>
                    </div>

            <p x-show="pm.err" x-text="pm.err" class="err" style="margin-top:0"></p>

            <!-- ── details ─────────────────────────────────────────────────── -->
            <div class="cath">Details</div>
            <div class="dl">
              <div class="r"><span class="k">Given name</span>
                <span class="v" x-show="!pm.editing" x-text="pe.given"></span>
                <input type="text" x-show="pm.editing" x-model="pe.given" @blur="checkDupes()"></div>
              <div class="r"><span class="k">Family name</span>
                <span class="v" x-show="!pm.editing" x-text="pe.family"></span>
                <input type="text" x-show="pm.editing" x-model="pe.family" @blur="checkDupes()"></div>
              <div class="r"><span class="k">Date of birth</span>
                <span class="v" x-show="!pm.editing" :class="pe.dob?'':'none'"
                      x-text="pe.dob ? pe.dob+'  ('+ageOf(pe.dob)+' years)' : 'not recorded'"></span>
                <input type="date" x-show="pm.editing" x-model="pe.dob" @blur="checkDupes()"></div>
              <div class="r"><span class="k">Gender</span>
                <span class="v" x-show="!pm.editing" :class="pe.gender?'':'none'"
                      x-text="pe.gender || 'not recorded'"></span>
                <select x-show="pm.editing" x-model="pe.gender">
                  <option value="">—</option><option value="F">F</option>
                  <option value="M">M</option><option value="X">X</option></select></div>
              <div class="r"><span class="k">Association ref</span>
                <span class="v" x-show="!pm.editing" :class="pe.ref?'':'none'"
                      x-text="pe.ref || 'none held'"></span>
                <input type="text" x-show="pm.editing" x-model="pe.ref"
                       placeholder="e.g. BC-2027-00412"></div>
              <div class="r" x-show="pm.editing || pe.status==='inactive'">
                <span class="k">Status</span>
                <span class="v" x-show="!pm.editing" x-text="pe.status"></span>
                <select x-show="pm.editing" x-model="pe.status">
                  <option value="active">Active</option>
                  <option value="inactive">Inactive — off the lists, ratings kept</option></select></div>
              <div class="r" x-show="!pm.editing && pm.personId"><span class="k">Came in as</span>
                <span class="v" x-text="sourceLabel(pmRow()?.source)"></span></div>
            </div>

            <!-- The duplicate check runs BEFORE a second record can exist. Same
                 rule import will use — match_person(), not a second implementation
                 that quietly disagrees with the first. -->
            <template x-if="pm.editing && pe.dupes.length">
              <div class="warnbar" style="border-radius:8px;border:1px solid var(--warnline);
                          margin:10px 0 0">
                <b x-text="pe.dupes.length===1 ? 'This player may already be here'
                                               : 'These players may already be here'"></b>
                <template x-for="d in pe.dupes" :key="d.person_id">
                  <div style="margin-top:4px">
                    <b x-text="d.given_name+' '+d.family_name"></b>
                    <span x-text="' — '+d.reason+' ('+d.confidence+')'"></span>
                    <button class="btn sm" style="margin-left:6px"
                            @click="selectPlayer(people.find(p=>p.id===d.person_id))">
                      Open that record instead</button>
                  </div>
                </template>
              </div>
            </template>

            <!-- ── verification ────────────────────────────────────────────── -->
            <div class="cath">Verification</div>
            <p class="note" style="margin:0 0 6px" x-show="!pm.editing">
              <span x-show="pe.verification==='verified'">Checked
                <b x-text="vsourceLabel(pe.vsource)"></b><span x-show="pmRow()?.verified_by_name">,
                by <b x-text="pmRow()?.verified_by_name"></b></span><span
                x-show="pmRow()?.verified_at"> on <b x-text="fmt(pmRow()?.verified_at)"></b></span>.
                <span x-show="pe.vnote"><br>Reason given: <i x-text="pe.vnote"></i></span></span>
              <span x-show="pe.verification!=='verified'">Nobody has checked this record yet, so this
                player <b>cannot be offered a place</b>. Rating is unaffected.</span>
            </p>

            <!-- ── verifying, without going into edit ──────────────────────────
                 Ming, 13 Aug 2026: "to go into edit and confirm is too much
                 burden". Verification is the act a club repeats dozens of times
                 in a sitting, so it is one click from the card. Editing a record
                 is rare; verifying one is not. The `admin` path still asks for a
                 reason, because that is the whole difference between an override
                 and a bypass — but it asks inline, not in a different mode. ── -->
            <template x-if="!pm.editing && canEditPlayer()">
              <div>
                <div class="inline" style="margin-top:0" x-show="pe.verification!=='verified'">
                  <button class="btn pri" @click="quickVerify('association')"
                          :disabled="qv.busy">Matched the registration</button>
                  <button class="btn" @click="quickVerify('attested')"
                          :disabled="qv.busy">Parent attested</button>
                  <button class="btn" @click="qv.open=!qv.open"
                          x-text="qv.open ? 'Cancel' : 'My own authority…'"></button>
                </div>

                <div class="inline" style="margin-top:0" x-show="pe.verification==='verified'">
                  <button class="btn" @click="quickUnverify()" :disabled="qv.busy">Unverify</button>
                  <span class="c" x-show="!pe.dob">no date of birth on record</span>
                </div>

                <div x-show="qv.open" style="margin-top:8px">
                  <div class="field" style="margin-bottom:6px">
                    <label class="fl">What did you check? — this goes on the record</label>
                    <input type="text" x-model="qv.note" @keydown.enter="quickVerify('admin', qv.note)"
                           placeholder="e.g. birth certificate sighted, Connect record not live yet">
                  </div>
                  <button class="btn pri" @click="quickVerify('admin', qv.note)"
                          :disabled="!qv.note.trim() || qv.busy">Verify on my authority</button>
                </div>
                <p x-show="qv.err" x-text="qv.err" class="err"></p>
                <p class="note" x-show="pe.verification!=='verified' && !qv.open" style="margin-top:6px">
                  <span x-text="unverifiedCount()"></span> still to check.
                </p>
              </div>
            </template>

            <template x-if="pm.editing">
              <div>
                <p class="note" style="margin:0 0 6px">A club is downstream of the association, whose
                  registration the parent already attested to — so match that, and only go back to a
                  family where the two disagree.</p>
                <div class="vsrc">
                  <button class="btn" :class="pe.verification==='verified' && pe.vsource==='association' ? 'pri':''"
                          @click="setVerification('association')">Matched the registration</button>
                  <button class="btn" :class="pe.verification==='verified' && pe.vsource==='attested' ? 'pri':''"
                          @click="setVerification('attested')">Parent attested</button>
                  <button class="btn" :class="pe.verification==='verified' && pe.vsource==='admin' ? 'pri':''"
                          @click="setVerification('admin')">My own authority</button>
                  <button class="btn" :class="pe.verification!=='verified' ? 'pri':''"
                          @click="setVerification('')">Not verified</button>
                </div>
                <!-- The override has to say what was actually checked. That is the
                     whole difference between an override and a bypass. -->
                <div class="field" x-show="pe.verification==='verified' && pe.vsource==='admin'"
                     style="margin-top:8px">
                  <label class="fl">What did you check? — this is the reason on the record</label>
                  <input type="text" x-model="pe.vnote"
                         placeholder="e.g. birth certificate sighted, Connect record not live yet">
                </div>
                <p class="note" x-show="pe.verification==='verified'" style="margin-top:8px">
                  Changing the date of birth un-verifies this record — the registration it was matched
                  against is keyed on that date, so somebody has to look again.</p>
                <p class="note" x-show="!pm.personId">Anything created here is flagged <b>DEMO</b>.
                  This version holds fabricated data only.</p>

                <div class="inline" style="margin-top:10px" x-show="pm.personId">
                  <button class="btn" x-show="!pe.delConfirm" @click="pe.delConfirm=true">Delete…</button>
                  <template x-if="pe.delConfirm">
                    <span class="inline" style="margin:0">
                      <span class="c wn">Delete permanently?</span>
                      <button class="btn" @click="deletePerson()">Yes, delete</button>
                      <button class="btn" @click="pe.delConfirm=false">No</button>
                    </span>
                  </template>
                </div>
                <p class="note" x-show="pe.delConfirm">A player who has been rated cannot be deleted —
                  the ratings would go with them. Mark them <b>inactive</b> instead; they leave the
                  lists and the record survives.</p>
                <p x-show="pe.err" x-text="pe.err" class="err"></p>
              </div>
            </template>

            <template x-if="!pm.editing && !pm.detail.length && !pm.err && pm.mode!=='profile'">
              <div class="empty">Nothing recorded for this player in this session yet.</div>
            </template>


            <template x-if="pm.detail.length">
              <div>
                <div class="statrow" style="border:1px solid var(--line);border-radius:8px;margin-bottom:12px">
                  <div><b x-text="pm.mean"></b>rating</div>
                  <div><b x-text="pmRaters().length"></b><span x-text="pmRaters().length===1?'pass':'passes'"></span></div>
                  <div><b x-text="pmMeasures().length"></b>measures</div>
                  <div><b x-text="pmWorst()"></b>worst spread</div>
                </div>

                <div class="cath">What each rater said
                  <b x-text="'threshold '+review.threshold"></b></div>
                <div class="inline" style="margin:0 0 6px">
                  <template x-for="w in pmRaters()" :key="w.key">
                    <span class="c grp"><span x-text="w.name"></span> ·
                      <span x-text="w.when"></span></span>
                  </template>
                </div>
                <div class="pc">
                  <template x-for="m in pmMeasures()" :key="m.measure_id">
                    <div>
                    <div class="pcr" :class="res(m.measure_id) ? 'settled'
                                          : (!m.rated ? 'gap'
                                          : (m.spread > review.threshold ? 'wide' : ''))">
                      <span class="lb" x-text="m.label"></span>
                      <span class="passes">
                        <template x-for="w in pmRaters()" :key="w.key">
                          <span class="pv" :class="m.by[w.key] == null ? 'none' : ''"
                                x-text="m.by[w.key] ?? '–'"></span>
                        </template>
                      </span>
                      <span class="meter" :title="effOf(m) + ' of 5'">
                        <i :style="'width:'+ (isNaN(effOf(m)) ? 0 : effOf(m)/5*100) +'%'"></i>
                      </span>
                      <span class="mn" x-text="effOf(m)"></span>
                      <span class="sp" x-text="res(m.measure_id)
                            ? (res(m.measure_id).source==='adopted'
                                ? 'took '+res(m.measure_id).adopted_name
                                : 'HC call')
                            : (!m.rated ? 'not rated' : (m.spread ? 'spread '+m.spread : ''))"></span>
                      <span class="act">
                        <button class="btn sm" x-show="canResolve()"
                                @click="toggleResolve(m)"
                                x-text="rz.measure_id===m.measure_id ? 'Cancel'
                                      : (res(m.measure_id) ? 'Change' : 'Override')"></button>
                      </span>
                    </div>

                    <!-- Pick one of the raters, or record your own. Both are the head
                         coach's call; only the record of WHOSE call differs. -->
                    <div class="rz" x-show="rz.measure_id===m.measure_id">
                      <div class="cath" style="margin-top:0">The head coach's call</div>
                      <p class="note" style="margin:0 0 7px">A session is usually run by the coaching
                        staff; the head coach carries the final say on every rating, and the
                        explanation with it.</p>
                      <template x-for="w in pmRaters()" :key="w.key">
                        <div class="opt" x-show="m.by[w.key] != null"
                             :class="rz.source==='adopted' && rz.adopted===w.mid ? 'on' : ''"
                             @click="rz.source='adopted'; rz.adopted=w.mid; rz.score=m.by[w.key]">
                          <span class="v" x-text="m.by[w.key]"></span>
                          <span>Take <b x-text="w.name"></b>'s rating</span>
                        </div>
                      </template>
                      <div class="opt" :class="rz.source==='own' ? 'on' : ''"
                           @click="rz.source='own'; rz.adopted=null">
                        <span class="v" x-text="rz.source==='own' && rz.score ? rz.score : '?'"></span>
                        <span>Record my own</span>
                        <span class="scale" style="margin-left:auto">
                          <template x-for="v in scaleOf(rzMeasure())" :key="v">
                            <button class="sv" :class="rz.source==='own' && rz.score===v ? 'on' : ''"
                                    @click.stop="rz.source='own'; rz.adopted=null; rz.score=v"
                                    x-text="v"></button>
                          </template>
                        </span>
                      </div>
                      <div class="field" style="margin:8px 0 0">
                        <label class="fl">Why — optional, and only for you. The head coach's
                          authority does not rest on writing it down</label>
                        <input type="text" x-model="rz.rationale"
                               placeholder="e.g. watched the second half">
                      </div>
                      <div class="inline" style="margin-top:8px">
                        <button class="btn pri" @click="saveResolution(m)"
                                :disabled="!rz.score || rz.busy">Save the call</button>
                        <button class="btn" @click="rz.measure_id=''">Cancel</button>
                      </div>
                      <p x-show="rz.err" x-text="rz.err" class="err"></p>
                    </div>
                    </div>
                  </template>
                </div>
                <p class="note" x-show="pmRaters().length>1">One box per rating pass, in the order
                  they were taken. Where the same coach rated twice the passes stay separate —
                  nothing is averaged away before you see it. The bar repeats the mean; it does not
                  add anything the number does not already say.</p>
                <p class="note" x-show="pmRaters().length===1">One pass, so there is nothing to
                  disagree with yet. Spread appears once a second coach rates this player.</p>
              </div>
            </template>

            <!-- The shape. Ported from the TMS `radarSVG` so the two systems draw a
                 player the same way. Series are distinguished by BOTH colour and
                 dash, and every value is written out beside the chart, so nothing
                 depends on telling two colours apart. -->
            <template x-if="pmHistory().length">
              <div>
                <div class="cath">The shape
                  <b x-text="pmHistory().length > 1
                       ? 'latest against the one before'
                       : 'one confirmed session so far'"></b></div>
                <div class="shape">
                  <div>
                    <div x-html="playerRadar()"></div>
                    <div class="leg">
                      <div><i :style="'border-color:var(--navy)'"></i>
                        <span x-text="pmHistory()[pmHistory().length-1]?.session_name"></span></div>
                      <div x-show="pmHistory().length > 1">
                        <i style="border-color:var(--ink3);border-top-style:dashed"></i>
                        <span x-text="pmHistory()[pmHistory().length-2]?.session_name"></span></div>
                    </div>
                  </div>
                  <table class="vtab">
                    <thead><tr>
                      <th>Measure</th>
                      <th class="r">Rating</th>
                      <th class="r" x-show="pmHistory().length>1">Change</th>
                    </tr></thead>
                    <tbody>
                      <template x-for="r in pmShapeRows()" :key="r.measure_id">
                        <tr>
                          <td x-text="r.label"></td>
                          <td class="r v" x-text="r.now.toFixed(2)"></td>
                          <td class="r d dlt" x-show="pmHistory().length>1"
                              :class="r.delta > 0 ? 'up' : (r.delta < 0 ? 'dn' : 'flat')"
                              x-text="r.delta == null ? '—'
                                    : (r.delta > 0 ? '▲ +' : (r.delta < 0 ? '▼ ' : '– '))
                                      + (r.delta === 0 ? '0.00' : r.delta.toFixed(2))"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </div>
            </template>

            <!-- The trend. One bar per confirmed session, oldest first. With a
                 single session it is a single bar and says so — better than an
                 empty frame pretending a line exists. -->
            <template x-if="pmHistory().length">
              <div>
                <div class="cath">Overall, session by session</div>
                <div class="trend">
                  <div class="tline">
                    <template x-for="h in pmHistory()" :key="h.session_id">
                      <b :style="'height:'+ Math.max(3, h.mean/5*34) +'px'"
                         :title="h.session_name + ' — ' + h.mean"></b>
                    </template>
                  </div>
                  <div class="inline" style="margin-top:5px">
                    <template x-for="h in pmHistory()" :key="h.session_id">
                      <span class="c"><span x-text="h.session_date"></span> ·
                        <b x-text="h.mean"></b></span>
                    </template>
                  </div>
                </div>
                <p class="note" x-show="pmHistory().length === 1">
                  One confirmed session. The trend fills in as more are signed off — this is the
                  first point on it.</p>
                <p class="note" x-show="pmHistory().length > 1">
                  Overall is the plain mean across every approved measure in that session, the same
                  arithmetic the rating itself uses.</p>
              </div>
            </template>

            <div class="cath">Approved record</div>
            <template x-if="!pm.history.length">
              <p class="note" style="margin-top:0">Nothing approved yet. A rating enters this player's
                permanent record when the head coach confirms the session it came from.</p>
            </template>
            <template x-if="pm.history.length">
              <div>
                <template x-for="h in pmHistory()" :key="h.session_id">
                  <div class="sess">
                    <span class="big" x-text="h.mean"></span>
                    <div class="body">
                      <div class="t" x-text="h.session_name"></div>
                      <div class="d"><span x-text="h.session_date"></span> ·
                        <span x-text="h.n"></span> measures</div>
                    </div>
                    <span class="c" :class="h.anyResolved?'acc':''"
                          x-text="h.anyResolved?'resolved':'mean'"></span>
                  </div>
                </template>
                <p class="note">One card per confirmed session, oldest first. The matrix and the
                  trend chart will read from this same record.</p>
              </div>
            </template>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </div>
      </div>
    </template>

    <template x-if="stage==='admin'">
    <div>

    <!-- no membership -->
    <template x-if="!org">
      <div class="panel">
        <div class="rhead"><h2>No organisation yet</h2>
          <div class="sub">You are signed in, but not a member of any organisation.</div></div>
        <p class="warnbar">This is the security model working. With no membership row the database
          returns nothing at all — not an error, just nothing.</p>
        <div class="pbody">
          <p class="note" style="margin-top:0">Run this in the Supabase SQL Editor to join the demo
            club. Your user id is already filled in.</p>
          <pre class="sql">insert into membership (user_id, org_id, display_name, role, seniority)
values (
  '<span x-text="userId"></span>',
  '11111111-0000-0000-0000-000000000001',
  'Your Name', 'head_coach', 10
);</pre>
          <p><button class="btn pri" @click="load()">I've done that — reload</button></p>
        </div>
      </div>
    </template>

    <!-- the working surface: rating sessions -->
    <template x-if="org">
    <div class="panel">
      <div class="rhead" style="display:flex;align-items:flex-start;gap:10px">
        <div style="flex:1">
          <h2>Rating sessions</h2>
          <div class="sub">A multi-day trial is one session. Days are added inside it.</div>
        </div>
        <!-- COURTSIDE IS A MODE OF RATING, not a section of the club. Ming,
             19 Aug 2026: it belongs under Rating. Same codebase, same tokens,
             same deploy — this switches the screen to the coach's own device,
             which saves to that device first and uploads second. -->
        <div class="inline" style="margin:0">
          <button class="btn" @click="openCourt()">Courtside</button>
        </div>
        <!-- The season is a SCOPE, not a section, so it sits on the stage rather
             than in the header beside Players and Rubrics. Everything below is
             read through it. -->
        <div class="inline" style="margin:0">
          <button class="btn" @click="newSession.open=!newSession.open"
                  :disabled="!seasons.length"
                  x-text="newSession.open?'Cancel':'New session'"></button>
        </div>
      </div>

      <!-- ── the season, on tiles ── the same control everywhere the season is
           the scope. One derivation (`seasonTiles`), one handler (`pickSeason`),
           because four copies of a dropdown drift apart. -->
      <div class="pbody" style="padding-bottom:0">
        <div class="cath" style="margin-top:0">Season</div>
        <div class="dsh" style="margin-bottom:8px">
          <template x-for="s in seasonTiles()" :key="s.id">
            <button class="dsc" :class="s.id===seasonId?'on':''" @click="pickSeason(s.id)">
              <b x-text="s.name"></b>
              <span class="yr">age reckoned at <span x-text="s.year"></span></span>
              <span class="mt">
                <span class="c ok" x-show="s.is_current">current</span>
                <span class="c wn" x-show="s.archived_at">archived · read-only</span>
                <span class="c" x-text="dashSeasonSub(s)"></span>
              </span>
            </button>
          </template>
          <template x-if="!seasonTiles().length">
            <div class="empty" style="flex:1">No season in play. Open <b>Season</b> and create one.</div>
          </template>
        </div>
        <div class="inline" style="margin:0 0 4px" x-show="seasonTilesOlder().length">
          <label class="fl" style="margin:0">Earlier and archived seasons</label>
          <select style="width:auto" @change="pickSeason($event.target.value)">
            <option value="">—</option>
            <template x-for="s in seasonTilesOlder()" :key="s.id">
              <option :value="s.id" x-text="seasonOptionLabel(s)+(s.archived_at?' · archived':'')"></option>
            </template>
          </select>
        </div>
      </div>
      <p class="warnbar" x-show="!seasons.length">There is no season yet, and a trial has to belong
        to one. Open <b>Season</b> and create the one you are running.</p>
      <div class="statrow">
        <div><b x-text="sessions.length"></b>sessions</div>
        <div><b x-text="sessions.filter(s=>s.status==='open').length"></b>open</div>
        <div><b x-text="sessions.filter(s=>s.status==='confirmed').length"></b>confirmed</div>
        <div><b x-text="waitingCount()"></b>waiting on you</div>
        <div><b x-text="toSettleCount()"></b>calls to make</div>
        <div><b x-text="people.length"></b>players</div>
      </div>
      <div class="statrow" style="padding-top:8px;padding-bottom:8px" x-show="waitingCount()">
        <div style="min-width:0;display:flex;gap:6px;align-items:center;flex-wrap:wrap">
          <button class="btn sm" :class="onlyWaiting ? 'pri' : ''"
                  @click="onlyWaiting=!onlyWaiting"
                  x-text="onlyWaiting ? 'Showing what is waiting' : 'Show only what is waiting'"></button>
          <span class="note" style="margin:0">A session appears here once anybody in it is fully
            rated, or a disagreement is waiting on your call.</span>
        </div>
      </div>
      <p x-show="err" class="warnbar" style="display:flex;gap:10px;align-items:center">
        <span style="flex:1" x-text="err"></span>
        <button class="lnk" style="color:var(--warn)" @click="err=''">dismiss</button>
      </p>

      <div class="pbody">
        <div x-show="newSession.open" class="srow" style="background:#fbfaf8">
          <div class="field"><label class="fl">Session name</label>
            <input type="text" x-model="newSession.name" placeholder="e.g. U14 Trials 2027"></div>
          <div class="row2">
            <div class="field"><label class="fl">First day</label>
              <input type="date" x-model="newSession.opens"></div>
            <div class="field"><label class="fl">Last day</label>
              <input type="date" x-model="newSession.closes" :min="newSession.opens"></div>
          </div>
          <div class="field"><label class="fl">Rubric — most clubs want Core</label>
            <select x-model="newSession.rubric_id">
              <template x-for="r in rubrics" :key="r.id">
                <option :value="r.id" x-text="r.name+' ('+measuresOf(r.id).length+' measures)'"></option>
              </template>
            </select></div>
          <p class="note" style="margin-bottom:8px">Every day you add must fall on or between
            these two dates. This trial lands in <b x-text="seasonName(seasonId)"></b>.</p>
          <button class="btn pri" @click="createSession()"
            :disabled="!newSession.name||!newSession.opens||!newSession.closes||busy">Create session</button>
          <p x-show="err" x-text="err" class="err"></p>
        </div>

        <!-- A filter that silently hides work is worse than no filter. If the
             chosen season is empty and another one is not, say so and offer the
             way there. -->
        <template x-if="!sessions.length">
          <div class="empty">
            <div x-text="'No sessions in '+seasonName(seasonId)+' yet.'"></div>
            <template x-if="elsewhereSeasons().length">
              <div style="margin-top:8px">
                <span x-text="allSessions.length + (allSessions.length===1
                      ? ' session sits in another season:' : ' sessions sit in other seasons:')"></span>
                <template x-for="s in elsewhereSeasons()" :key="s.id">
                  <button class="btn sm" style="margin-left:6px"
                          @click="seasonId=s.id; onSeasonChange()"
                          x-text="seasonOptionLabel(s)"></button>
                </template>
              </div>
            </template>
          </div>
        </template>

        <template x-for="s in visibleSessions()" :key="s.id">
          <div class="srow">
            <div class="sflex">
              <div class="body">
                <div class="nm" x-text="s.name"></div>
                <div class="meta">
                  <span x-text="s.opens_at?.slice(0,10)"></span> →
                  <span x-text="s.closes_at?.slice(0,10)"></span>
                  · <span x-text="rubricName(s.rubric_id)"></span>
                  <span class="c" :class="rubricLevel(s.rubric_id)==='core'?'grp':'acc'"
                        x-text="rubricLevel(s.rubric_id)==='core'?'5 measures':'10 measures'"></span>
                </div>
              </div>
              <span class="c" :class="{'':s.status==='draft','grp':s.status==='open',
                    'wn':s.status==='closed','ok':s.status==='confirmed'}" x-text="s.status"></span>
              <span class="c wn" x-show="q(s.id)?.outside_window"
                    title="Ratings are gated by status, never the clock — this is a reminder, not a block"
                    >outside its window</span>
              <span class="c acc" x-show="q(s.id)?.to_settle"
                    x-text="q(s.id)?.to_settle + ' to settle'"></span>
              <span class="c" x-show="q(s.id)?.complete"
                    x-text="q(s.id)?.complete + '/' + q(s.id)?.players + ' rated'"></span>
              <button class="btn sm" x-show="q(s.id)?.needs_you" @click="openReview(s)"
                      >Review…</button>
              <button class="btn sm" @click="openSession(s)"
                      x-text="sel?.id===s.id?'Close':'Open'"></button>
            </div>

            <div x-show="sel?.id===s.id" class="sdet">
              <div class="cath">Days in this session <b x-text="blocks.length"></b></div>
              <template x-if="!blocks.length">
                <div class="note" style="margin:0">No days yet.</div></template>
              <table class="jt" x-show="blocks.length">
                <thead><tr><th>Date</th><th style="width:110px">Time</th><th>Venue</th>
                  <th style="width:74px"></th></tr></thead>
                <tbody>
                  <template x-for="b in blocks" :key="b.id">
                    <tr><td x-text="b.block_date"></td>
                        <td x-text="b.starts_at?.slice(0,5)+'–'+b.ends_at?.slice(0,5)"></td>
                        <td x-text="b.venue"></td>
                        <td><button class="btn sm" @click="removeBlock(b)">Remove</button></td></tr>
                  </template>
                </tbody>
              </table>
              <p class="note">This session runs <b x-text="fmt(sel?.opens_at)"></b> to
                <b x-text="fmt(sel?.closes_at)"></b>.</p>
              <div class="inline">
                <input type="date" x-model="newBlock.date"
                       :min="sel?.opens_at?.slice(0,10)" :max="sel?.closes_at?.slice(0,10)">
                <input type="time" x-model="newBlock.start" style="width:104px">
                <input type="time" x-model="newBlock.end" style="width:104px">
                <input type="text" x-model="newBlock.venue" placeholder="venue" style="width:130px">
                <button class="btn sm" @click="addBlock()">Add day</button>
              </div>
              <p x-show="blockErr" x-text="blockErr" class="err"></p>

              <div class="cath">Authorised raters <b x-text="auths.length"></b></div>
              <p class="note" style="margin:0 0 5px">Being a coach in the club is not enough.
                Authorisation is explicit and per session.</p>
              <template x-if="!auths.length">
                <div class="note" style="margin:0">Nobody authorised yet.</div></template>
              <template x-for="a in auths" :key="a.id">
                <div class="inline" style="margin:0 0 3px;gap:8px">
                  <span style="font-size:12.5px" x-text="nameOf(a.membership_id)"></span>
                  <button class="btn sm" @click="removeAuth(a)">Remove</button>
                </div>
              </template>
              <div class="inline">
                <select x-model="newAuth.membership_id">
                  <option value="">choose a member…</option>
                  <template x-for="m in members" :key="m.id">
                    <option :value="m.id" x-text="m.display_name+' ('+m.role.replace('_',' ')+')'"></option>
                  </template>
                </select>
                <button class="btn sm" @click="addAuth()"
                        :disabled="!newAuth.membership_id">Authorise</button>
              </div>

              <div class="cath">Where this session is up to</div>
              <div class="inline" style="margin-top:0">
                <span class="c" :class="s.status==='draft'?'':'ok'">1 · draft</span>
                <span class="c" :class="['open','closed','confirmed'].includes(s.status)?'ok':''">2 · open</span>
                <span class="c" :class="['closed','confirmed'].includes(s.status)?'ok':''">3 · closed</span>
                <span class="c" :class="s.status==='confirmed'?'ok':''">4 · confirmed</span>
              </div>

              <div class="inline">
                <template x-if="s.status==='draft'">
                  <button class="btn pri" @click="setStatus(s,'open')"
                          :disabled="!blocks.length || !auths.length">Open this session</button>
                </template>
                <template x-if="s.status==='open'">
                  <button class="btn" @click="setStatus(s,'closed')">Close for now</button>
                </template>
                <template x-if="s.status==='closed'">
                  <button class="btn" @click="setStatus(s,'open')">Reopen</button>
                </template>
              </div>
              <p class="note" x-show="s.status==='draft' && openBlockers()"
                 style="margin:4px 0 0">
                Before this can open it needs <b x-text="openBlockers()"></b>.
              </p>
              <p class="note" x-show="s.status==='closed'" style="margin:4px 0 0">
                Closed stops new ratings but is not final — reopen it if a coach still has players
                to get through. Confirming is the step that cannot be undone.
              </p>
              <p x-show="statusErr" x-text="statusErr" class="err"></p>

              <div class="cath" x-show="s.status==='confirmed'">Form teams</div>
              <template x-if="s.status==='confirmed'">
                <div>
                  <p class="note" style="margin-top:0">Runs on the approved record from this
                    session. It is a constraint solver, not a guess — the same session and the same
                    plan always produce the same teams, and anything it cannot place is named.</p>
                  <div class="inline">
                    <input type="text" x-model="fm.plan" style="flex:1;min-width:200px"
                           placeholder="Gold 8, Navy 8, White 8">
                    <button class="btn pri" @click="runFormation(s)"
                            :disabled="fm.busy || !fm.plan.trim()"
                            x-text="fm.busy ? 'Working…' : 'Propose teams'"></button>
                  </div>
                  <p class="note" style="margin:4px 0 0">Name each team and how many it holds.
                    Add <b>F</b> or <b>M</b> for a single-gender team — <i>Girls 8 F, Open 10</i>.</p>
                  <p x-show="fm.err" x-text="fm.err" class="err"></p>
                </div>
              </template>

              <template x-if="fm.result && fm.sessionId===s.id">
                <div style="margin-top:10px">
                  <div class="statrow" style="border:1px solid var(--line);border-radius:8px;margin-bottom:10px">
                    <div><b x-text="fm.result.teams.length"></b>teams</div>
                    <div><b x-text="fm.result.teams.reduce((n,t)=>n+t.size,0)"></b>placed</div>
                    <div><b x-text="fm.result.unplaced.length"></b>unplaced</div>
                    <div><b x-text="fm.result.spread"></b>spread</div>
                    <div><b x-text="fm.result.swaps"></b>swaps</div>
                  </div>
                  <div class="grid3">
                    <template x-for="t in fm.result.teams" :key="t.label">
                      <div class="tcol">
                        <div class="h"><b x-text="t.label"></b>
                          <span class="c" x-text="t.size + '/' + t.planned_size"></span>
                          <span class="c grp" x-text="'avg ' + (t.average ?? '–')"></span></div>
                        <template x-for="pl in t.players" :key="pl.person_id">
                          <div class="p">
                            <span x-text="pl.name"></span>
                            <span class="c ok" x-show="pl.forced">HC</span>
                            <span class="c" x-show="pl.locked && !pl.forced">locked</span>
                            <span class="r" x-text="Number(pl.rating).toFixed(2)"></span>
                            <button class="btn sm" @click="toggleLock(s, pl, t.label)"
                                    x-text="pl.locked ? 'Unlock' : 'Lock'"></button>
                          </div>
                        </template>
                        <template x-if="!t.players.length">
                          <div class="p" style="color:var(--ink3)">nobody yet</div>
                        </template>
                      </div>
                    </template>
                  </div>

                  <template x-if="fm.result.unplaced.length">
                    <div class="warnbar" style="border-radius:8px;border:1px solid var(--warnline);margin-top:10px">
                      <b x-text="fm.result.unplaced.length + ' not placed'"></b> — nobody is dropped
                      silently.
                      <template x-for="u in fm.result.unplaced" :key="u.person_id">
                        <div style="margin-top:3px"><b x-text="u.name"></b>
                          <span x-text="' — ' + u.reason"></span></div>
                      </template>
                    </div>
                  </template>

                  <template x-if="fm.result.notes.length">
                    <div style="margin-top:8px">
                      <div class="cath">Decisions the engine was told to respect</div>
                      <template x-for="(n, ix) in fm.result.notes" :key="ix">
                        <div class="note" style="margin:2px 0" x-text="n"></div>
                      </template>
                    </div>
                  </template>
                  <p class="note" x-text="fm.result.method"></p>
                </div>
              </template>

              <div class="cath">Do the work</div>
              <div class="inline" style="margin-top:0">
                <button class="btn pri" @click="openRate(s)"
                        :disabled="s.status!=='open'">Rate players…</button>
                <button class="btn" @click="openReview(s)">Review &amp; confirm…</button>
              </div>
              <p class="note" x-show="s.status!=='open'">
                Ratings can only be recorded while a session is <b>open</b>. This one is
                <b x-text="s.status"></b>.
              </p>

              <template x-if="s.status==='draft' || s.status==='open'">
                <div style="margin-top:14px;border-top:1px solid var(--line);padding-top:10px">
                  <div class="inline" style="margin:0">
                    <button class="btn sm" x-show="delConfirm!==s.id"
                            @click="delConfirm=s.id; delErr=''">Delete this session</button>
                    <template x-if="delConfirm===s.id">
                      <span class="inline" style="margin:0;gap:8px">
                        <span class="note" style="margin:0">Delete
                          <b x-text="s.name"></b> permanently?</span>
                        <button class="btn sm pri" @click="deleteSession(s)">Yes, delete</button>
                        <button class="btn sm" @click="delConfirm=''">Keep it</button>
                      </span>
                    </template>
                  </div>
                  <p class="note" style="margin:6px 0 0">A session that holds ratings cannot be
                    deleted — close it instead. Ratings are a permanent record.</p>
                  <p x-show="delErr" x-text="delErr" class="err"></p>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
    </div>
    </template>

    </div>
    </template>

  </div></div>

  <!-- ─────────── PLAYERS (modal) ───────────
       Three doors, one record: staff entry here, EOI and import later. They
       differ in how much TRUST attaches to the data, never in what they
       produce — so this screen writes the same row an import will.

       Verification is RECONCILIATION, not interrogation. The parent supplied
       this data; asking them to confirm it tests transcription, not truth. A
       club matches the association's registration, which the parent already
       attested to and paid against, and only contacts a family where the two
       disagree. Hence three sources, and an override that must say why. ── -->

  <!-- ─────────── ADD A PLAYER (modal) ───────────
       A focused dialog rather than a mode of the directory: you are not
       browsing while you type a new child in. It lands UNVERIFIED like every
       other door, and the duplicate check runs before the row can exist. ── -->
  <template x-if="pm.adding">
    <div class="modal" style="z-index:90" @click.self="pm.adding=false">
      <div class="box sm">
        <div class="mhead"><h3>Add a player</h3>
          <button class="x" @click="pm.adding=false" title="Close">×</button></div>
        <div class="mbody">
          <div class="row2">
            <div class="field"><label class="fl">Given name</label>
              <input type="text" x-model="pe.given" @blur="checkDupes()"></div>
            <div class="field"><label class="fl">Family name</label>
              <input type="text" x-model="pe.family" @blur="checkDupes()"></div>
          </div>
          <div class="row2">
            <div class="field"><label class="fl">Date of birth</label>
              <input type="date" x-model="pe.dob" @blur="checkDupes()"></div>
            <div class="field"><label class="fl">Gender</label>
              <select x-model="pe.gender">
                <option value="">—</option><option value="F">F</option>
                <option value="M">M</option><option value="X">X</option></select></div>
          </div>

          <template x-if="pe.dupes.length">
            <div class="warnbar" style="border-radius:8px;border:1px solid var(--warnline);margin:0 0 10px">
              <b x-text="pe.dupes.length===1 ? 'This player may already be here'
                                             : 'These players may already be here'"></b>
              <template x-for="d in pe.dupes" :key="d.person_id">
                <div style="margin-top:4px">
                  <b x-text="d.given_name+' '+d.family_name"></b>
                  <span x-text="' — '+d.reason+' ('+d.confidence+')'"></span>
                  <button class="btn sm" style="margin-left:6px"
                          @click="pm.adding=false; selectPlayer(people.find(p=>p.id===d.person_id))">
                    Open that record instead</button>
                </div>
              </template>
            </div>
          </template>

          <p class="note" style="margin-top:0">Lands <b>unverified</b> — verify it on the record once
            you have matched the registration. Flagged <b>DEMO</b>: this version holds fabricated
            data only.</p>
          <div class="inline">
            <button class="btn pri" @click="savePerson()"
                    :disabled="pe.busy || !pe.given.trim() || !pe.family.trim()"
                    x-text="pe.busy ? 'Saving…' : 'Add player'"></button>
            <button class="btn" @click="pm.adding=false">Cancel</button>
          </div>
          <p x-show="pe.err" x-text="pe.err" class="err"></p>
        </div>
      </div>
    </div>
  </template>

  <!-- ─────────── CLUB SETTINGS (modal) ───────────
       The age rule and the club's own words for things. Ported from the TMS,
       where brackets and the cutoff are settings rather than constants —
       associations band differently and reckon age at different dates. ── -->
  <!-- ── one age group, and nothing else ─────────────────────────────────── -->
  <template x-if="modal==='formation' && fp.group">
    <div class="modal" @click.self="modal=''">
      <div class="box lg">
        <div class="mhead">
          <h3 x-text="fp.group"></h3>
          <span class="c" x-text="fPool().length+' players'"></span>
          <span class="c" x-text="'average '+f2(fMean(fPool().map(p=>fVal(p))))"></span>
          <span class="c grp" x-show="fp.phase!=='setup'"
                x-text="'graded on '+(fp.basis==='points'?'points per game':'coach rating')"></span>
          <span class="c" x-show="fp.phase==='draft'">draft board · nothing written yet · the engine is not running</span>
          <span class="c" x-show="fp.phase==='accept'">about to write the teams and the offers</span>
          <span class="c" x-show="fp.saved" x-text="fp.saved"></span>
          <button class="x" @click="modal=''" title="Close">×</button>
        </div>
        <div class="mbody" x-show="fp.phase==='setup'">

          <div class="cath">What the teams are graded on</div>
          <div class="fbasis">
            <template x-for="b in ['rating','points']" :key="b">
              <div class="fb" :class="fp.basis===b?'on':''" @click="fSetBasis(b)">
                <b x-text="(fp.basis===b?'■ ':'□ ')+(b==='rating'?'Coach rating':'Points per game')"></b>
                <p x-show="b==='rating'">What the coaches saw at the trial. A team is judged on its
                  <b>average</b>.</p>
                <p x-show="b==='points'">What they actually scored last season, per game, brought
                  forward. A team is judged on the <b>points it projects to score</b>, and it can
                  only see players who were here last year.</p>
                <p><b x-text="fVisible(b)"></b> of <span x-text="fPool().length"></span>
                  players are visible to it.</p>
              </div>
            </template>
          </div>

          <div class="cath">Teams this club is entering</div>
          <div class="ftms">
            <template x-for="(t,i) in fp.teams" :key="i">
              <span class="ftm"><span x-text="fDivLabel(t)"></span>
                <button @click="fDropTeam(i)" title="remove">×</button></span>
            </template>
            <select x-model.number="fp.newdiv" style="width:auto">
              <template x-for="d in [1,2,3,4,5,6,7,8]" :key="d">
                <option :value="d" x-text="fDivLabel(d)" :selected="d===fp.newdiv"></option>
              </template>
            </select>
            <button class="btn sm" @click="fAddTeam(fp.newdiv)">Enter a team</button>
            <button class="btn sm" style="margin-left:auto" @click="fNameOpen()">Division names…</button>
          </div>

          <!-- ── what the association calls each division ────────────────────
               The RANK orders and bands; this is only what gets printed. Club-
               wide, because a division is the association's competition — rank 3
               is the same competition in U12 as in U18. ── -->
          <div class="fnm" x-show="fp.naming" x-cloak>
            <div class="fnmh">
              <b>What your association calls each division</b>
              <span class="c">applies everywhere, not just <span x-text="fp.group"></span></span>
            </div>
            <div class="fnmp">
              <label class="fl">Everything you have not named</label>
              <input type="text" x-model="fp.pattern" placeholder="Div {n}" style="width:150px">
              <span class="note" style="margin:0">
                <code>{n}</code> is the number. <b x-text="fNameFallback(4)"></b> for division 4.</span>
            </div>
            <table class="fbt">
              <tr><th>Rank</th><th>What you call it</th><th></th></tr>
              <template x-for="d in fNameRanks()" :key="d">
                <tr>
                  <td class="num" x-text="d"></td>
                  <td><input type="text" :value="fp.names[String(d)]||''"
                             @input="fNameSet(d,$event.target.value)"
                             :placeholder="fNameFallback(d)" style="width:210px"></td>
                  <td><span class="c" x-show="!fp.names[String(d)]">using the pattern</span></td>
                </tr>
              </template>
            </table>
            <p class="note" style="margin-bottom:6px" x-show="!fNameRanks().length">
              Enter a team above and its division will appear here to be named.</p>
            <div class="inline">
              <button class="btn pri sm" @click="fSaveNames()" :disabled="fp.busy">Save the names</button>
              <button class="btn sm" @click="fp.naming=false">Cancel</button>
              <span class="c bad" x-show="fp.namesErr" x-text="fp.namesErr"></span>
            </div>
          </div>
          <p class="note">Enter the divisions the association actually offers you — they do not have
            to run 1, 2, 3. <b>Two teams entered in the same division share one band</b> and are
            balanced against each other.</p>

          <div class="cath">What a re-run may move</div>
          <label class="fopt" :class="fp.lock?'on':''">
            <input type="checkbox" x-model="fp.lock">
            <span><b>Lock players already placed and still in age</b>
              <span class="c" x-text="fLocked().length+' locked'"></span><br>
              <span class="note" style="margin:0">Both conditions hold: they are in a team, and they
              are still in this age group. A child who has aged up has no place here to keep.</span>
            </span></label>

          <div class="ladder" style="display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;
                                     margin-top:10px">
            <span class="c">squad cap <input type="number" x-model.number="fp.cap" min="3" max="30"
              style="width:56px;margin-left:4px"></span>
            <span class="c">minimum to field <input type="number" x-model.number="fp.min" min="3"
              max="30" style="width:52px;margin-left:4px"></span>
            <button class="btn sm" @click="fEvenCounts()">Even numbers</button>
            <button class="btn sm" @click="fEvenSpan()">Even rating span</button>
          </div>

          <div class="cath" x-text="'Where the teams fall on '+(fp.basis==='points'?'points per game':'rating')+' — drag a line'"></div>
          <div class="flv" id="flv">
            <div class="bars" x-html="fBarsHTML()"></div>
            <template x-for="(v,i) in fp.cuts" :key="i">
              <div class="fcut" :data-i="i" :style="'left:'+fPct(v)+'%'"
                   @pointerdown="fDragStart($event,i)">
                <b x-text="fDivLabel(fBands()[i]?.div)+' floor '+fFx(v)"></b></div>
            </template>
            <div class="axis" x-html="fAxisHTML()"></div>
          </div>

          <template x-if="fp.basis==='points' && fMissing().length">
            <p class="note" style="color:var(--warn)">
              <b x-text="fMissing().length+' of '+fPool().length+' players have no scoring record.'"></b>
              They were not in the club last season, so this basis cannot see them and they are in
              no band below.</p>
          </template>

          <p class="note">A line is the floor of the team above it — for the top team that floor
            <b>is</b> the entry standard. <b>A team's target is what the players in its band actually
            average</b>, so it can never be a number this cohort cannot reach.</p>

          <table class="fbt">
            <tr><th>Entered as</th><th x-text="fp.basis==='points'?'Scoring band':'Rating band'"></th>
              <th class="num">Players</th><th class="num">Per team</th>
              <th class="num">Target — the band's own average</th><th></th></tr>
            <template x-for="(b,i) in fBands()" :key="i">
              <tr>
                <td><span class="sw" :style="'background:var(--d'+Math.min(6,i+1)+')'"></span>
                  <span x-text="fDivLabel(b.div)"></span>
                  <span class="c" x-show="b.teams>1" x-text="b.teams+' teams'"></span></td>
                <td x-text="fBandRange(b,i)"></td>
                <td class="num" x-text="b.n"></td>
                <td class="num" x-text="b.per"></td>
                <td class="num"><b x-text="b.n ? (fp.basis==='points'
                      ? Math.round(b.total)+' pts/game' : f2(b.avg)) : '—'"></b></td>
                <td>
                  <span class="c bad" x-show="!b.n">nobody in this band</span>
                  <span class="c wn" x-show="b.n && b.per>fp.cap"
                        x-text="b.per+' in a squad capped at '+fp.cap"></span>
                  <span class="c wn" x-show="b.n && b.per<=fp.cap && b.per<fp.min"
                        x-text="'cannot field '+fp.min"></span>
                </td>
              </tr>
            </template>
          </table>

          <!-- ── WHAT THE PLAN BUILDS, UNDER THE GRAPH ────────────────────────
               Ming, 19 Aug 2026: "I want the result from build the rosters to be
               shown under the graph where I can quickly decide how to manipulate
               the rating floor so that I don't need to go back and forth."
               So the teams sit beneath the lines that produced them. Moving a
               line marks them STALE rather than silently re-running: the engine
               is deterministic and a club should choose when it runs, but it
               must never leave a stale set of teams looking current. ── -->
          <div x-show="fp.result" x-cloak>
            <div class="cath">What this plan builds
              <span class="c wn" x-show="fp.stale">the lines have moved — build again</span>
            </div>
            <div :style="fp.stale?'opacity:.5':''">
          <p class="note" style="margin-top:0">
            <b x-text="(fp.result?.squads.length||0) + ' teams'"></b> ·
            <span x-text="fp.result?.placed + ' of ' + ((fp.result?.placed||0) + (fp.result?.unplaced.length||0)) + ' players placed'"></span>
            <span x-show="fp.result?.exchanged"
                  x-text="' · ' + fp.result?.exchanged + ' exchanged across a line for shape'"></span>
          </p>
          <p class="note" style="margin-top:0">
            <span class="c grp" x-text="'graded on '+(fp.basis==='points'?'points per game':'coach rating')"></span>
            Accepting would give <b x-text="fp.result?.squads.length"></b> standing
            team<span x-show="fp.result?.squads.length!==1">s</span> this season's roster and the
            division beside it.</p>

          <!-- HOW A MISSING SCORING RECORD WAS FILLED, and how well the fit
               actually fits. Shown whether it was used or refused — a club is
               entitled to see the refusal, and to see the correlation behind a
               number that placed their child. -->
          <p class="note" style="margin-top:0" x-show="fp.basis==='points' && fp.result?.fit">
            <template x-if="fp.result?.fit?.used">
              <span><span class="c ok">scoring filled from rating</span>
                <b x-text="fp.result?.fit?.n"></b> players in this age group have both;
                fitted <b x-text="'+'+f2(fp.result?.fit?.slope)+' points a game per rating point'"></b>,
                correlation <b x-text="f2(fp.result?.fit?.r)"></b>. Every player placed this way is
                marked <i>by rating</i> on their team.</span>
            </template>
            <template x-if="fp.basis==='points' && fp.result?.fit && !fp.result.fit.used">
              <span><span class="c wn">scoring not filled from rating</span>
                <span x-text="fp.result?.fit?.note"></span> — anybody without a record is left for you
                to place by hand.</span>
            </template>
          </p>

          <div class="sq">
            <template x-for="(s,si) in (fp.result?.squads||[])" :key="si">
              <div class="sqc" :class="s.over_cap?'short':''">
                <div class="sqh">
                  <!-- A PROPOSAL HAS NO NAMES. Ming, 20 Aug 2026: "I only want to
                       see them as team 1, team 2, team 3 etc shown." The engine
                       produced a BAND, not a club's team — naming it here invited
                       the club to read last season's Gold into a band drawn from
                       this season's players. Linking happens on the draft board,
                       against teams that actually exist in this season. -->
                  <div class="asg"><b x-text="fSqLabel(si)"></b></div>
                  <div class="row">
                    <span class="c grp" x-text="fDivLabel(s.division_rank)"></span>
                  </div>
                  <div class="row">
                    <span x-text="s.players.length+' players'"></span>
                    <span class="c" :class="fSqOff(s)?'wn':'ok'" x-show="s.players.length"
                          x-text="fSqVs(s)"></span>
                    <span class="c bad" x-show="!s.players.length">nobody in this band</span>
                    <span class="c bad" x-show="s.over_cap"
                          x-text="(s.players.length-fp.result.cap)+' over the cap of '+fp.result.cap"></span>
                    <span class="c acc" x-show="s.from_rating"
                          x-text="s.from_rating+' by rating'"></span>
                  </div>
                  <div class="row" x-show="s.players.length">
                    <span class="c" x-text="fRefText(s)"></span>
                  </div>
                </div>
                <div class="cats">
                  <template x-for="x in (s.players.length?s.shape:[])" :key="x.i">
                    <div class="catr">
                      <span class="nm2" x-text="x.label"></span>
                      <span class="tr"><i></i>
                        <b :class="x.dev<-0.35?'lo':''" :style="fBarStyle(x.dev)"></b></span>
                      <span class="dv" x-text="(x.dev>=0?'+':'')+x.dev.toFixed(2)"></span>
                    </div>
                  </template>
                  <p class="note" style="margin:0" x-show="!s.players.length">
                    Move the line above this team, or drop the team.</p>
                </div>
                <details class="nl" x-show="s.players.length">
                  <summary x-text="s.players.length+' names'"></summary>
                  <ul class="sqp">
                    <template x-for="p in s.players" :key="p.person_id">
                      <li><span x-text="p.given_name+' '+p.family_name"></span>
                        <span class="mk" style="color:var(--acc)" x-show="p.from_rating">BY RATING</span>
                        <span class="r" x-text="p.age+' · '+fVfx(p.value)"></span></li>
                    </template>
                  </ul>
                </details>
              </div>
            </template>
          </div>

          <div class="warnbox">A team can sit exactly on its target and still be built entirely of
            guards. The bars are each category against what a team at this level should look like —
            a bar left of centre is a category this team is short in.</div>

          <!-- NOBODY IS DROPPED SILENTLY. -->
          <div x-show="fp.result?.unplaced.length">
            <div class="cath">Not placed — and why</div>
            <table class="fbt">
              <template x-for="u in (fp.result?.unplaced||[])" :key="u.person_id">
                <tr><td x-text="u.name"></td><td x-text="u.reason"></td></tr>
              </template>
            </table>
          </div>
            </div>
          </div>
        </div>

        <!-- ── THE COMPARISON BOARD ────────────────────────────────────────
             Ming, 19 Aug 2026: "Once the generator confirm the proposal, enter
             drag-drop team comparison phase, where coach can move players around
             to balance like in the TMS." Confirming FREEZES the proposal — the
             engine does not run again, and every team shows what a hand move
             costs against the number its band set. ── -->
        <div class="mbody" x-show="fp.phase==='draft' && fp.frozen">
          <!-- THE DRAFT BOARD. Not a confirmation — in this product confirming is
