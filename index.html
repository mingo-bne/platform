                  <td><b x-text="r.name"></b>
                      <span class="c ok" x-show="r.is_current">current</span></td>
                  <td x-text="r.year"></td>
                  <td x-text="r.sessions"></td>
                  <td x-text="r.confirmed_sessions"></td>
                  <td x-text="r.players"></td>
                  <td>
                    <button class="btn sm" x-show="!r.is_current"
                            @click="makeCurrent(r)">Make current</button>
                    <button class="btn sm" @click="deleteSeason(r)"
                            :disabled="r.sessions+r.teams+r.players+r.offers>0">Delete</button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
          <p class="note">A season holding a trial, a team, a player record or an offer is
            <b>kept</b>. Deleting it would take the year's evaluations with it.</p>
        </div>
      </div>
    </div>
  </template>

  <!-- ─────────── RUBRICS (modal) ─────────── -->
  <template x-if="modal==='rubrics'">
    <div class="modal" @click.self="modal=''">
      <div class="box">
        <div class="mhead"><h3>Rubrics</h3>
          <span class="c">locked · scale 1–5</span>
          <button class="x" @click="modal=''" title="Close">×</button></div>
        <div class="mbody">
          <p class="note" style="margin-top:0">Identical for every club in the sport. Every club
            completes <b>Core</b>. <b>Extended</b> is for clubs that can do more, and its measures
            roll up into Core so both depths stay comparable.</p>
          <template x-for="r in rubrics" :key="r.id">
            <div class="rgrp">
              <div class="cath"><span x-text="r.name"></span>
                <b x-text="measuresOf(r.id).length+' measures'"></b></div>
              <div class="chips">
                <template x-for="m in measuresOf(r.id)" :key="m.id">
                  <span class="c" :class="r.level==='core' ? 'grp' : (m.rolls_up_to ? 'acc' : '')"
                        :title="m.rolls_up_to ? 'rolls up to '+labelOf(m.rolls_up_to)
                                : (r.level==='extended' ? 'extended signal only' : '')"
                        x-text="m.label"></span>
                </template>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>
  </template>


  <!-- ─────────── RATE (modal) ─────────── -->
  <template x-if="modal==='rate'">
    <div class="modal" @click.self="modal=''">
      <div class="box">
        <div class="mhead"><h3>Rate players</h3>
          <span class="c" x-text="rate.session?.name"></span>
          <span class="c grp" x-text="rubricName(rate.session?.rubric_id)"></span>
          <button class="x" @click="modal=''" title="Close">×</button></div>
        <div class="mbody">
          <template x-if="!rate.authorised">
            <p class="warnbar" style="border-radius:8px;border:1px solid var(--warnline)">
              You are not authorised to rate in this session. Authorisation is explicit and per
              session — add yourself under <b>Authorised raters</b> first.</p>
          </template>

          <template x-if="rate.authorised">
          <div class="split">
            <div>
              <div class="cath">Players <b x-text="activePeople().length"></b></div>
              <div class="plist">
                <template x-for="p in activePeople()" :key="p.id">
                  <div class="pitem" :class="rate.person?.id===p.id?'on':''" @click="pickPlayer(p)">
                    <span x-text="p.given_name+' '+p.family_name"></span>
                    <span class="st" x-text="rate.done[p.id] ? '✓ rated' : ''"></span>
                  </div>
                </template>
              </div>
            </div>

            <div>
              <template x-if="!rate.person">
                <div class="empty">Choose a player to start.</div>
              </template>
              <template x-if="rate.person">
              <div>
                <div class="cath">
                  <span x-text="rate.person.given_name+' '+rate.person.family_name"></span>
                  <b x-text="Object.keys(rate.scores).length+' of '+rateMeasures().length+' scored'"></b>
                </div>
                <template x-for="m in rateMeasures()" :key="m.id">
                  <div class="mrow">
                    <span class="lb" x-text="m.label"></span>
                    <div class="scale">
                      <template x-for="v in scaleOf(m)" :key="v">
                        <button class="sv" :class="rate.scores[m.id]===v?'on':''"
                                @click="rate.scores[m.id]=v" x-text="v"></button>
                      </template>
                    </div>
                  </div>
                </template>
                <div class="field" style="margin-top:10px">
                  <label class="fl">Note (optional)</label>
                  <input type="text" x-model="rate.note" placeholder="anything worth recording">
                </div>
                <div class="inline" style="margin-top:0">
                  <button class="btn pri" @click="saveRating()"
                          :disabled="!Object.keys(rate.scores).length||busy">Save rating</button>
                  <button class="btn" @click="rate.scores={};rate.note=''">Clear</button>
                </div>
                <p class="note">Saved ratings cannot be edited. A correction is recorded as a
                  resolution by the head coach, never by changing the original.</p>
                <p x-show="rate.err" x-text="rate.err" class="err"></p>
                <p x-show="rate.msg" x-text="rate.msg" class="msg"></p>
              </div>
              </template>
            </div>
          </div>
          </template>
        </div>
      </div>
    </div>
  </template>

  <!-- ─────────── REVIEW & CONFIRM (modal) ─────────── -->
  <template x-if="modal==='review'">
    <div class="modal" @click.self="modal=''">
      <div class="box">
        <div class="mhead"><h3>Review &amp; confirm</h3>
          <span class="c" x-text="review.session?.name"></span>
          <span class="c" :class="review.session?.status==='confirmed'?'ok':'grp'"
                x-text="review.session?.status"></span>
          <button class="x" @click="modal=''" title="Close">×</button></div>
        <div class="mbody">
          <div class="statrow" style="border:1px solid var(--line);border-radius:8px;margin-bottom:12px">
            <div><b x-text="review.rows.filter(r=>r.coverage==='complete').length"></b>complete</div>
            <div><b x-text="review.rows.filter(r=>r.coverage==='partial').length"></b>partial</div>
            <div><b x-text="review.rows.filter(r=>r.coverage==='not rated').length"></b>not rated</div>
            <div><b x-text="flagged().length"></b>to look at</div>
            <div><b x-text="sessionMean()"></b>session mean</div>
          </div>

          <div class="cath">Coverage and disagreement
            <b x-text="'threshold '+review.threshold"></b></div>
          <p class="note" style="margin-top:0">Rows are highlighted where two raters differ by more
            than the threshold. Confirming with gaps is allowed and recorded.</p>
          <div class="scroll" style="max-height:320px">
            <table class="jt">
              <thead><tr><th>Player</th><th style="width:66px">Rating</th>
                <th style="width:90px">Coverage</th>
                <th style="width:70px">Scored</th><th style="width:70px">Raters</th>
                <th style="width:74px">Spread</th><th style="width:64px"></th></tr></thead>
              <tbody>
                <template x-for="r in review.rows" :key="r.person_id">
                  <tr :class="r.worst_spread > review.threshold ? 'flag' : ''">
                    <td x-text="r.given_name+' '+r.family_name"></td>
                    <td><b x-text="meanOf(r.person_id)"></b></td>
                    <td><span class="c" :class="r.coverage==='complete'?'ok':
                          (r.coverage==='partial'?'wn':'')" x-text="r.coverage"></span></td>
                    <td x-text="r.measures_scored+'/'+r.measure_count"></td>
                    <td x-text="r.assessment_count"></td>
                    <td x-text="r.worst_spread || ''"></td>
                    <td><button class="btn sm" x-show="r.measures_scored"
                          @click="openPlayer(r.person_id)">Detail</button></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>

          <div class="cath">Confirm</div>
          <template x-if="review.session?.status==='confirmed'">
            <p class="okbar" style="border-radius:8px;border:1px solid var(--okline)">
              Confirmed. The formation engine can now use this session — and it cannot be reopened.</p>
          </template>
          <template x-if="review.session?.status!=='confirmed'">
            <div>
              <p class="note" style="margin-top:0">Confirming closes the session as a whole and is
                recorded against your name. Only a head coach or club admin can do it.</p>
              <button class="btn pri" @click="confirmSession()"
                :disabled="busy || !['head_coach','club_admin'].includes(me?.role)">
                Confirm this session</button>
              <p x-show="!['head_coach','club_admin'].includes(me?.role)" class="note">
                Your role is <b x-text="me?.role"></b>, so you cannot confirm.</p>
              <p x-show="review.err" x-text="review.err" class="err"></p>
            </div>
          </template>
        </div>
      </div>
    </div>
  </template>

  <!-- ─────────── PLAYER (modal) ─────────── -->
  <!-- Layered above Review, because it is summoned FROM Review and Review is still
       the thing you are doing. Escape or the × returns you to it, in place. -->

  <!-- ─────────── MORE (modal) ─────────── -->
  <template x-if="modal==='more'">
    <div class="modal" @click.self="modal=''">
      <div class="box sm">
        <div class="mhead"><h3>More</h3>
          <button class="x" @click="modal=''" title="Close">×</button></div>
        <div class="mbody">
          <div class="cath">This session</div>
          <dl class="kv">
            <dt>Signed in as</dt><dd x-text="userEmail"></dd>
            <dt>User id</dt><dd x-text="userId"></dd>
            <template x-if="org">
              <span style="display:contents">
                <dt>Organisation</dt><dd x-text="org.name"></dd>
                <dt>Organisation id</dt><dd x-text="org.id"></dd>
                <dt>Edition</dt><dd x-text="org.edition"></dd>
              </span>
            </template>
            <dt>Database</dt><dd x-text="cfg.url"></dd>
          </dl>

          <div class="cath">Tenant isolation</div>
          <p class="note" style="margin-top:0">Every count comes from an unfiltered query — there is
            no <code>where org_id</code> anywhere in this app. The database returns only your
            organisation's rows.</p>
          <div class="statrow" style="border:1px solid var(--line);border-radius:8px">
            <div><b x-text="orgs.length"></b>organisations</div>
            <div><b x-text="people.length"></b>players</div>
            <div><b x-text="members.length"></b>members</div>
            <div><b x-text="measures.length"></b>rubric measures</div>
          </div>

          <div class="cath">Actions</div>
          <div class="inline" style="margin-top:0">
            <button class="btn" @click="load();modal=''">Reload data</button>
            <button class="btn" @click="resetCfg()">Change database</button>
            <button class="btn" @click="signOut()">Sign out</button>
          </div>
          <p class="note">v0.1 · foundation. Rating capture, the formation engine and imports are
            the next increments.</p>
        </div>
      </div>
    </div>
  </template>

</div>
</template>

</div>

<script>
function app(){ return {
  screen:'setup', cfg:{url:'',key:''}, sb:null,
  email:'', msg:'', err:'', busy:false,
  userId:'', userEmail:'',
  orgs:[], org:null, me:null, members:[], people:[], measures:[], rubrics:[], sessions:[],
  allSessions:[],
  pf:{q:'',show:'active',gender:'',age:null,year:new Date().getFullYear()},
  qv:{open:false,note:'',busy:false,err:''},
  pe:{id:null,given:'',family:'',dob:'',gender:'',ref:'',status:'active',
      verification:'unverified',vsource:'',vnote:'',
      dupes:[],delConfirm:false,err:'',busy:false},
  sel:null, blocks:[], auths:[], blockErr:'', modal:'', delConfirm:'', delErr:'', peopleErr:'', statusErr:'',
  authErr:'',
  rate:{session:null,authorised:false,person:null,scores:{},note:'',done:{},err:'',msg:''},
  review:{session:null,rows:[],threshold:2,err:'',scores:{}},
  pm:{personId:'',mode:'profile',editing:false,adding:false,returnTo:'',name:'',sessionName:'',mean:'',coverage:'',
      detail:[],history:[],resolutions:[],err:''},
  rz:{measure_id:'',source:'',adopted:null,score:null,rationale:'',err:'',busy:false},
  stage:'admin', queueRows:[], onlyWaiting:false,
  fm:{plan:'Gold 8, Navy 8, White 8', busy:false, err:'', result:null, sessionId:''},
  court:{sessions:[],session:null,people:[],measures:[],rated:{},person:null,
         scores:{},note:'',err:'',msg:''},
  queue:[], rejected:[], syncing:false, online:true,
  newSession:{open:false,name:'',opens:'',closes:'',rubric_id:''},
  seasons:[], seasonRows:[], seasonId:'', seasonErr:'',
  newSeason:{name:'',year:new Date().getFullYear(),starts:'',ends:'',current:false},
  newBlock:{date:'',start:'18:00',end:'20:00',venue:''},
  newAuth:{membership_id:''},

  async boot(){
    const saved = localStorage.getItem('platform.cfg');
    if(!saved){ this.screen='setup'; return; }
    this.cfg = JSON.parse(saved);
    this.connect();
    const {data:{session}} = await this.sb.auth.getSession();
    if(session){ await this.afterLogin(session); } else { this.screen='signin'; }
    this.sb.auth.onAuthStateChange(async (_e,s)=>{ if(s) await this.afterLogin(s); });
  },

  connect(){ this.sb = window.supabase.createClient(this.cfg.url, this.cfg.key); },

  saveCfg(){
    this.err='';
    try{
      if(!/^https:\/\/.+\.supabase\.co\/?$/.test(this.cfg.url.trim()))
        throw new Error('That does not look like a Supabase project URL.');
      this.cfg.url = this.cfg.url.trim().replace(/\/$/,'');
      this.cfg.key = this.cfg.key.trim();
      if(this.cfg.key.includes('service_role'))
        throw new Error('That looks like the service_role key. Use the anon public key.');
      localStorage.setItem('platform.cfg', JSON.stringify(this.cfg));
      this.connect(); this.screen='signin';
    }catch(e){ this.err = e.message; }
  },

  resetCfg(){ localStorage.removeItem('platform.cfg'); location.reload(); },

  async signIn(){
    this.busy=true; this.err=''; this.msg='';
    const {error} = await this.sb.auth.signInWithOtp({
      email:this.email, options:{ emailRedirectTo: window.location.href.split('#')[0] }
    });
    this.busy=false;
    if(error){ this.err = error.message; }
    else { this.msg = 'Check your email — the link signs you straight in.'; }
  },

  async signOut(){ await this.sb.auth.signOut(); location.reload(); },

  async afterLogin(session){
    this.userId = session.user.id; this.userEmail = session.user.email;
    this.screen='app';
    this.loadQueue(); this.loadRejected();
    this.online = navigator.onLine !== false;
    addEventListener('online',  () => { this.online = true;  this.flushQueue(); });
    addEventListener('offline', () => { this.online = false; });
    await this.load();
    this.flushQueue();
  },

  async load(){
    this.err=''; this.authErr=''; this.blockErr='';
    const q = async (t,sel='*',order=null)=>{
      let r = this.sb.from(t).select(sel);
      if(order) r = r.order(order);
      const {data,error} = await r;
      if(error){ this.err = t+': '+error.message; return []; }
      return data||[];
    };
    this.orgs     = await q('organisation');
    this.org      = this.orgs[0] || null;
    this.members  = await q('membership');
    this.me       = this.members.find(m=>m.user_id===this.userId) || null;
    // the directory view, not the bare table: it carries the verification
    // evidence and how many confirmed sessions each player already has
    this.people   = await q('v_person_directory','*','family_name');
    this.rubrics  = (await q('rubric','*','level')).filter(r=>r.org_id===null);
    this.measures = await q('rubric_measure','*','sort_order');
    if(!this.newSession.rubric_id){
      const core = this.rubrics.find(r=>r.level==='core');
      this.newSession.rubric_id = (core||this.rubrics[0])?.id || '';
    }
    // The season is the scope everything below reads through. A club with no
    // season cannot create a trial at all — the database refuses it — so the
    // stage says so rather than failing on the button.
    this.seasons    = await q('season','*','year');
    this.seasonRows = await q('v_season_summary','*','year');
    if(!this.seasons.find(s => s.id === this.seasonId)){
      this.seasonId = (this.seasons.find(s => s.is_current) || this.seasons[0] || {}).id || '';
    }
    const all = await q('rating_session','*','opens_at');
    this.allSessions = all;
    this.sessions = this.seasonId ? all.filter(s => s.season_id === this.seasonId) : all;
    // The player directory reckons age against the season's own year.
    const cur = this.seasons.find(s => s.id === this.seasonId);
    if(cur && cur.year) this.pf.year = cur.year;
    await this.loadSessionQueue();
  },

  // ── seasons ─────────────────────────────────────────────────────────────
  seasonOptionLabel(s){
    const n = this.allSessions.filter(x => x.season_id === s.id).length;
    return s.name
         + (n ? ' · ' + n + (n===1 ? ' trial' : ' trials') : ' · empty')
         + (s.is_current ? ' · current' : '');
  },
  elsewhereSeasons(){
    return this.seasons.filter(s =>
      s.id !== this.seasonId && this.allSessions.some(x => x.season_id === s.id));
  },
  seasonName(id){ return this.seasons.find(s => s.id === id)?.name || '(no season)'; },
  seasonYear(id){ return this.seasons.find(s => s.id === id)?.year || null; },
  onSeasonChange(){
    this.sel = null; this.onlyWaiting = false;
    this.sessions = this.allSessions.filter(s => s.season_id === this.seasonId);
    const y = this.seasonYear(this.seasonId);
    if(y) this.pf.year = y;
  },
  async createSeason(){
    this.seasonErr=''; this.busy=true;
    const {error} = await this.sb.from('season').insert({
      org_id:this.org.id,
      name:this.newSeason.name.trim(),
      year:Number(this.newSeason.year),
      starts_on:this.newSeason.starts || null,
      ends_on:this.newSeason.ends || null,
      is_current:!!this.newSeason.current
    });
    this.busy=false;
    if(error){
      this.seasonErr = /season_name_uq/.test(error.message)
        ? 'There is already a season with that name in this club.' : error.message;
      return;
    }
    this.newSeason={name:'',year:new Date().getFullYear(),starts:'',ends:'',current:false};
    await this.load();
  },
  async makeCurrent(r){
    this.seasonErr='';
    // The trigger stands the previous one down, so this is one write, not two.
    const {error} = await this.sb.from('season').update({is_current:true}).eq('id', r.id);

  nameOf(mid){ const m=this.members.find(x=>x.id===mid); return m? m.display_name : mid; },
  measuresOf(rid){ return this.measures.filter(m=>m.rubric_id===rid); },

  async createSession(){

    }
    if(!this.newSession.rubric_id){ this.err='Choose a rubric.'; return; }
    if(!this.seasonId){ this.err='Create a season first — a trial has to belong to one.'; return; }
    this.busy=true;
    // Dates are picked as calendar dates. Send them as UTC day boundaries so the
    // database sees exactly the days chosen, with no timezone drift either way.
    const {error} = await this.sb.from('rating_session').insert({
      org_id:this.org.id, season_id:this.seasonId,

  // ── forming teams ──────────────────────────────────────────────────────
  // The engine itself is NOT here. It runs as a Supabase Edge Function, because
  // this file is served from a public repository and the solver is the one
  // piece of the product worth protecting. All this does is describe the teams,
  // ask, and show what came back.
  parsePlan(text){
    // "Gold 8, Navy 8 F, U12 White 10" -> [{label,size,gender}]
    return String(text).split(',').map(x => x.trim()).filter(Boolean).map(part => {
      const m = part.match(/^(.*?)\s+(\d+)\s*([FM])?$/i);
      if(!m) return {label: part, size: 10, gender: null};
      return {label: m[1].trim(), size: Number(m[2]),
              gender: m[3] ? m[3].toUpperCase() : null};
    }).filter(t => t.label && t.size > 0);
  },

  async runFormation(s){
    this.fm.err = ''; this.fm.busy = true; this.fm.sessionId = s.id;
    const teams = this.parsePlan(this.fm.plan);
    if(!teams.length){ this.fm.busy=false; this.fm.err='Describe at least one team.'; return; }
    const dup = teams.map(t=>t.label).filter((l,i,a)=>a.indexOf(l)!==i);
    if(dup.length){ this.fm.busy=false; this.fm.err='Two teams cannot share the name "'+dup[0]+'".'; return; }
    const {data, error} = await this.sb.functions.invoke('formation', {
      body: {session_id: s.id, teams}
    });
    this.fm.busy = false;
    if(error){ this.fm.err = error.message || String(error); return; }
    if(data?.error){ this.fm.err = data.error; return; }
    this.fm.result = data;
  },

  // A lock says "leave this player here when you re-run". It belongs to the
  // SESSION, not to the run, so it survives a regenerate — which is the whole
  // point of it.
  async toggleLock(s, pl, label){
    this.fm.err = '';
    if(pl.locked){
      const {error} = await this.sb.from('formation_lock').delete()
        .eq('session_id', s.id).eq('person_id', pl.person_id);

    } else {
      const {error} = await this.sb.from('formation_lock').insert({
        org_id: this.org.id, session_id: s.id, person_id: pl.person_id,
        team_label: label, locked_by: this.me.id
      });
      if(error){ this.fm.err = error.message; return; }
    }
    await this.runFormation(s);
  },

  q(sessionId){ return this.queueRows.find(r => r.session_id === sessionId) || null; },
  waitingCount(){ return this.queueRows.filter(r => r.needs_you).length; },

  async openSession(s){

  async addBlock(){
    this.blockErr=''; this.err='';
    const s = this.sel;
    if(!this.newBlock.date){ this.blockErr='Pick a date for this day.'; return; }
    const lo = s.opens_at.slice(0,10), hi = s.closes_at.slice(0,10);
    if(this.newBlock.date < lo || this.newBlock.date > hi){

    if(this.newBlock.end <= this.newBlock.start){

      ends_at:this.newBlock.end, venue:this.newBlock.venue,
      sort_order:this.blocks.length+1
    });
    if(error){ this.blockErr=error.message; return; }

  scaleOf(m){ const a=[]; for(let v=(m.scale_min??1); v<=(m.scale_max??5); v++) a.push(v); return a; },

  async saveRating(){

      org_id:this.org.id, session_id:this.rate.session.id,

    }).select('id').single();

  async openReview(s){
    this.modal='review';
    this.review={session:s,rows:[],threshold:2,err:'',scores:{}};
    this.pm.personId=''; this.pm.editing=false; this.pm.returnTo='';

      .select('divergence_threshold_measure').eq('org_id',this.org.id).maybeSingle();
    if(prof) this.review.threshold = Number(prof.divergence_threshold_measure);
    const {data:rows,error} = await this.sb.from('v_session_review').select('*')
      .eq('session_id',s.id).order('family_name');
    if(error){ this.review.err=error.message; return; }
    this.review.rows = rows||[];
    // The average is a plain mean over every measure rated, Size included —
    // the same arithmetic the TMS uses (ratingAvgAt). Computed in the database.
    const {data:sc} = await this.sb.from('v_session_player_score').select('*')
      .eq('session_id',s.id);

  // ── the number ─────────────────────────────────────────────────────────
  meanOf(personId){
    const x = this.review.scores?.[personId];
    return x ? Number(x.mean_score).toFixed(2) : '—';
  },
  sessionMean(){
    const v = Object.values(this.review.scores || {}).map(x => Number(x.mean_score));
    if(!v.length) return '—';
    return (v.reduce((a,b)=>a+b,0) / v.length).toFixed(2);
  },

  // ══════════════════════ COURTSIDE ══════════════════════
  // The coach's own device. Two rules shape all of this:
  //
  //   1. A rating is SAVED THE MOMENT IT IS TAKEN, to this device. Uploading is
  //      a separate, later, retryable thing. A school hall on trial night has no
  //      usable wifi and that is precisely when this has to work.
  //   2. Nobody is pre-assigned. The squad list shows who has already been rated
  //      and by whom, and coaches pick up whoever has not been. Two coaches
  //      rating the same player is allowed by design (decision F4) — both are
  //      kept and the head coach sees the spread.
  //
  // Idempotence comes free from the schema: the client generates the assessment
  // id, and assessment_score is keyed on (assessment_id, measure_id). A retry
  // that re-posts the same rating writes nothing new.

  QKEY(){ return 'platform.queue.' + (this.userId || 'anon'); },
  loadQueue(){
    try { this.queue = JSON.parse(localStorage.getItem(this.QKEY()) || '[]'); }
    catch { this.queue = []; }
  },
  saveQueue(){ localStorage.setItem(this.QKEY(), JSON.stringify(this.queue)); },
  RKEY(){ return 'platform.rejected.' + (this.userId || 'anon'); },
  loadRejected(){
    try { this.rejected = JSON.parse(localStorage.getItem(this.RKEY()) || '[]'); }
    catch { this.rejected = []; }
  },
  saveRejected(){ localStorage.setItem(this.RKEY(), JSON.stringify(this.rejected)); },

  CKEY(id){ return 'platform.court.' + id; },
  cacheSession(bundle){
    try { localStorage.setItem(this.CKEY(bundle.session.id), JSON.stringify(bundle)); } catch {}
  },
  cachedSession(id){
    try { return JSON.parse(localStorage.getItem(this.CKEY(id)) || 'null'); } catch { return null; }
  },

  uuid(){
    if(crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = crypto.getRandomValues(new Uint8Array(1))[0] % 16;
      return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
  },

  async openCourt(){
    this.stage = 'court';
    this.court.err = ''; this.court.session = null; this.court.person = null;
    const {data, error} = await this.sb.from('session_authorisation')
      .select('session_id, rating_session!inner(id,name,status,opens_at,closes_at,rubric_id)')
      .eq('membership_id', this.me.id);
    if(error){
      // No connection: fall back to whatever this device already knows.
      this.court.sessions = this.knownSessions();
      this.court.err = this.court.sessions.length ? '' :
        'Cannot reach the database, and this device has no session saved yet.';
      return;
    }
    this.court.sessions = (data || [])
      .map(r => r.rating_session)
      .filter(s => s && s.status === 'open');
    this.court.sessions.forEach(s => {
      const b = this.cachedSession(s.id) || {};
      this.cacheSession({...b, session: s});
    });
  },
  knownSessions(){
    const out = [];
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(!k || k.indexOf('platform.court.') !== 0) continue;
      try { const b = JSON.parse(localStorage.getItem(k)); if(b?.session) out.push(b.session); }
      catch {}
    }
    return out;
  },

  async pickCourtSession(s){
    this.court.session = s; this.court.person = null;
    this.court.err = ''; this.court.msg = '';
    const cached = this.cachedSession(s.id);
    if(cached){ this.court.people = cached.people || []; this.court.measures = cached.measures || [];
                this.court.rated = cached.rated || {}; }
    const [{data:ppl, error:e1}, {data:ms, error:e2}, {data:det}] = await Promise.all([
      this.sb.from('person').select('id,given_name,family_name').order('family_name'),
      this.sb.from('rubric_measure').select('*').eq('rubric_id', s.rubric_id).order('sort_order'),
      this.sb.from('v_rating_detail').select('person_id,membership_id,rater_name')
        .eq('session_id', s.id)
    ]);
    if(e1 || e2){
      if(!cached) this.court.err =
        'Cannot reach the database, and this session is not saved on this device yet. ' +
        'Open it once while you have a connection.';
      return;
    }
    this.court.people   = ppl || [];
    this.court.measures = ms  || [];
    const rated = {};
    (det || []).forEach(d => {
      rated[d.person_id] = rated[d.person_id] || {names:new Set(), mine:false};
      rated[d.person_id].names.add(d.rater_name);
      if(d.membership_id === this.me.id) rated[d.person_id].mine = true;
    });
    // Sets do not survive JSON, so store plain arrays.
    this.court.rated = Object.fromEntries(Object.entries(rated)
      .map(([k,v]) => [k, {names:[...v.names], mine:v.mine}]));
    this.applyQueueToRated();
    this.cacheSession({session:s, people:this.court.people,
                       measures:this.court.measures, rated:this.court.rated});
  },
  // Anything still sitting in the queue counts as rated — the coach did the work,
  // it just has not left the device.
  applyQueueToRated(){
    this.queue.filter(q => q.session_id === this.court.session?.id).forEach(q => {
      const r = this.court.rated[q.person_id] || {names:[], mine:false};
      if(!r.names.includes(this.me.display_name)) r.names.push(this.me.display_name);
      r.mine = true;
      this.court.rated[q.person_id] = r;
    });
  },
  courtMeasures(){ return this.court.measures; },
  courtRated(id){ return !!this.court.rated[id]; },
  courtMine(id){ return !!this.court.rated[id]?.mine; },
  courtWho(id){
    const r = this.court.rated[id];
    if(!r) return 'not rated yet';
    return 'rated by ' + r.names.join(', ');
  },
  courtDone(){ return Object.keys(this.court.rated).length; },

  pickCourtPlayer(p){
    this.court.person = p; this.court.scores = {}; this.court.note = ''; this.court.msg = '';
  },

  // Save = write to this device. Uploading is a separate concern.
  saveCourt(){
    const q = {
      id: this.uuid(),
      org_id: this.org.id,
      session_id: this.court.session.id,
      person_id: this.court.person.id,
      membership_id: this.me.id,
      submitted_at: new Date().toISOString(),
      note: this.court.note || null,
      scores: Object.entries(this.court.scores).map(([measure_id, score]) => ({measure_id, score}))
    };
    this.queue.push(q); this.saveQueue();
    const r = this.court.rated[q.person_id] || {names:[], mine:false};
    if(!r.names.includes(this.me.display_name)) r.names.push(this.me.display_name);
    r.mine = true; this.court.rated[q.person_id] = r;
    this.cacheSession({session:this.court.session, people:this.court.people,
                       measures:this.court.measures, rated:this.court.rated});
    this.court.person = null; this.court.scores = {}; this.court.note = '';
    this.flushQueue();
  },

  async flushQueue(){
    if(this.syncing || !this.queue.length) return;
    this.syncing = true;
    const still = [];
    for(const q of this.queue){
      const r = await this.sendOne(q);
      if(r.status === 'retry')   { still.push(q); }
      if(r.status === 'refused') { this.rejected.push({...q, reason:r.reason}); }
      // 'sent' simply falls off the queue.
    }
    this.queue = still; this.saveQueue(); this.saveRejected();
    this.syncing = false;
  },
  // A refusal is the coach's to see and decide about. It is never silently
  // dropped and never retried into a loop.
  discardRejected(id){
    this.rejected = this.rejected.filter(r => r.id !== id);
    this.saveRejected();
  },
  requeueRejected(id){
    const r = this.rejected.find(x => x.id === id);
    if(!r) return;
    this.rejected = this.rejected.filter(x => x.id !== id);
    const {reason, ...clean} = r;
    this.queue.push(clean);
    this.saveRejected(); this.saveQueue();
    this.flushQueue();
  },
  nameOfPerson(id){
    const p = (this.court.people || []).find(x => x.id === id);
    return p ? p.given_name + ' ' + p.family_name : 'a player';
  },
  // Three outcomes, not two. A rating that COULD NOT BE SENT and a rating the
  // database REFUSED are different problems and must not share a code path:
  // the first is worth retrying forever, the second never will be. Treating a
  // refusal as a network failure loops it silently and reports the app offline
  // while it is sitting on wifi.
  //
  // The discriminator is whether the request reached the database at all. If it
  // did, PostgREST returns an error carrying a `code` — a SQLSTATE from one of
  // our own triggers (P0001), an RLS refusal (42501), a constraint. If it did
  // not, there is no code, only a transport message.
  async sendOne(q){
    const {error:e1} = await this.sb.from('assessment').upsert({
      id:q.id, org_id:q.org_id, session_id:q.session_id, person_id:q.person_id,
      membership_id:q.membership_id, submitted_at:q.submitted_at
    }, {onConflict:'id', ignoreDuplicates:true});
    if(e1) return this.classify(e1);
    const {error:e2} = await this.sb.from('assessment_score').upsert(
      q.scores.map(x => ({assessment_id:q.id, measure_id:x.measure_id,
                          score:x.score, note:q.note})),
      {onConflict:'assessment_id,measure_id', ignoreDuplicates:true});
    if(e2) return this.classify(e2);
    this.online = true;
    return {status:'sent'};
  },
  classify(error){
    const reachedTheDatabase = !!error?.code;
    if(!reachedTheDatabase){ this.online = false; return {status:'retry'}; }
    this.online = true;
    return {status:'refused', reason: error.message || 'The database refused this rating.'};
  },

  // ── the player modal ───────────────────────────────────────────────────
  // Summoned from Review (and later from the Players list). It carries two
  // things: what happened in THIS session, pass by pass, and the player's
  // approved record across every session that has been confirmed.
  async openPlayer(personId){
    const row = this.review.rows.find(r => r.person_id === personId) || {};
    const sc  = this.review.scores?.[personId];
    const dir = this.people.find(p => p.id === personId);
    this.pe = dir ? this.bufferFrom(dir) : this.blankPerson();
    this.modal = 'players';
    this.pm = {
      personId, mode:'session', editing:false, adding:false, returnTo:'review',
      name: [row.given_name, row.family_name].filter(Boolean).join(' '),
      sessionName: this.review.session?.name || '',
      mean: sc ? Number(sc.mean_score).toFixed(2) : '',
      coverage: row.coverage || '',
      detail: [], history: [], err: ''
    };
    this.rz = {measure_id:'',source:'',adopted:null,score:null,rationale:'',err:'',busy:false};
    const [{data:d, error:e1}, {data:h, error:e2}, {data:rs}] = await Promise.all([
      this.sb.from('v_rating_detail').select('*')
        .eq('session_id', this.review.session.id).eq('person_id', personId)
        .order('measure_sort'),
      this.sb.from('v_player_history').select('*')
        .eq('person_id', personId).order('session_date'),
      this.sb.from('v_session_resolution').select('*')
        .eq('session_id', this.review.session.id).eq('person_id', personId)
    ]);
    if(e1){ this.pm.err = e1.message; return; }
    this.pm.detail      = d  || [];
    this.pm.history     = e2 ? [] : (h || []);
    this.pm.resolutions = (rs || []).filter(r => r.is_resolved);
  },

  // ── settling a divergence ──────────────────────────────────────────────
  // Two acts, one record. ADOPTED means the head coach picked a rater and said
  // that one is right; OWN means he formed his own judgement. Neither writes an
  // assessment — a head coach's score is not a fourth rating. If it were, it
  // would join the mean and move the spread, rewriting what the coaches said.
  res(measureId){ return (this.pm.resolutions || []).find(r => r.measure_id === measureId) || null; },
  effOf(m){
    const r = this.res(m.measure_id);
    return r ? Number(r.resolved_score).toFixed(2) : (m.mean ?? '–');
  },
  canResolve(){
    return ['head_coach','club_admin'].includes(this.me?.role)
        && ['open','closed'].includes(this.review.session?.status);
  },
  rzMeasure(){
    return this.pmMeasures().find(m => m.measure_id === this.rz.measure_id)
        || {scale_min:1, scale_max:5};
  },
  toggleResolve(m){
    if(this.rz.measure_id === m.measure_id){ this.rz.measure_id=''; return; }
    const existing = this.res(m.measure_id);
    this.rz = {
      measure_id: m.measure_id,
      source: existing?.source || '',
      adopted: existing?.adopted_membership_id || null,
      score: existing ? Number(existing.resolved_score) : null,
      rationale: existing?.rationale || '',
      err:'', busy:false
    };
  },
  async saveResolution(m){
    this.rz.err=''; this.rz.busy=true;
    const row = {
      org_id: this.org.id,
      session_id: this.review.session.id,
      person_id: this.pm.personId,
      measure_id: m.measure_id,
      resolved_score: this.rz.score,
      resolving_membership_id: this.me.id,
      source: this.rz.source || 'own',
      adopted_membership_id: this.rz.source === 'adopted' ? this.rz.adopted : null,
      rationale: this.rz.rationale || null
    };
    const {error} = await this.sb.from('assessment_resolution')
      .upsert(row, {onConflict:'session_id,person_id,measure_id'});
    this.rz.busy=false;
    if(error){ this.rz.err = error.message; return; }
    this.rz.measure_id='';
    const {data:rs} = await this.sb.from('v_session_resolution').select('*')
      .eq('session_id', this.review.session.id).eq('person_id', this.pm.personId);
    this.pm.resolutions = (rs || []).filter(r => r.is_resolved);
    await this.loadSessionQueue();
  },

  // One column per rating PASS, oldest first. Two passes by the same coach stay
  // separate — seeing what was actually said is the whole point.
  pmRaters(){
    const seen = new Map();
    (this.pm.detail || []).forEach(d => {
      if(!seen.has(d.assessment_id))
        seen.set(d.assessment_id, {key:d.assessment_id, name:d.rater_name,
                                   mid:d.membership_id,
                                   at:d.recorded_at, when:this.shortWhen(d.recorded_at)});
    });
    return [...seen.values()].sort((a,b) => String(a.at).localeCompare(String(b.at)));
  },
  // Every measure in the session's rubric, whether anybody rated it or not.
  // A gap is the head coach's to close as much as a disagreement is his to
  // settle — he is the one who explains the whole record to a parent.
  pmMeasures(){
    const byMeasure = new Map();
    (this.measuresOf(this.review.session?.rubric_id) || []).forEach(m => {
      byMeasure.set(m.id, {measure_id:m.id, label:m.label, sort:m.sort_order,
                           scale_min:m.scale_min ?? 1, scale_max:m.scale_max ?? 5,
                           by:{}, vals:[]});
    });
    (this.pm.detail || []).forEach(d => {
      if(!byMeasure.has(d.measure_id))
        byMeasure.set(d.measure_id,
          {measure_id:d.measure_id, label:d.measure_label, sort:d.measure_sort,
           scale_min:1, scale_max:5, by:{}, vals:[]});
      const m = byMeasure.get(d.measure_id);
      m.by[d.assessment_id] = d.score;
      m.vals.push(Number(d.score));
    });
    return [...byMeasure.values()]
      .sort((a,b) => a.sort - b.sort)
      .map(m => ({...m,
        rated: m.vals.length > 0,
        mean:  m.vals.length ? (m.vals.reduce((a,b)=>a+b,0) / m.vals.length).toFixed(2) : null,
        spread: m.vals.length ? Math.max(...m.vals) - Math.min(...m.vals) : 0}));
  },
  pmWorst(){
    const v = this.pmMeasures().map(m => m.spread);
    return v.length ? Math.max(...v) : 0;
  },
  // The approved record, one row per confirmed session, oldest first.
  pmHistory(){
    const bySession = new Map();
    (this.pm.history || []).forEach(h => {
      if(!bySession.has(h.session_id))
        bySession.set(h.session_id, {session_id:h.session_id, session_name:h.session_name,
                                     session_date:h.session_date, vals:[], anyResolved:false});
      const x = bySession.get(h.session_id);
      x.vals.push(Number(h.score));
      if(h.source === 'resolved') x.anyResolved = true;
    });
    return [...bySession.values()]
      .sort((a,b) => String(a.session_date).localeCompare(String(b.session_date)))
      .map(x => ({...x, n:x.vals.length,
        mean:(x.vals.reduce((a,b)=>a+b,0) / x.vals.length).toFixed(2)}));
  },
  // ── the shape and the trend ────────────────────────────────────────────
  // `radarSVG` is ported from the TMS (build/src/app.js) unchanged in geometry
  // and nearly unchanged in code, so a player drawn here and a player drawn
  // there are the same picture. Rings at 1..5, the 3 ring dashed as the
  // reference line, axis names outside, long names broken over two lines.
  //
  // Accessibility: two series are told apart by dash AND colour, and the table
  // beside the chart writes out every value and every change. Nothing here is
  // encoded by colour alone.
  esc(t){ return String(t).replace(/[&<>"]/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); },

  radarSVG(labels, series, size){
    const N = labels.length; if(!N) return '';
    const padx = 58;
    const R = size/2 - 30, cx = size/2, cy = size/2 + 2;
    const ang = i => (Math.PI*2*i/N) - Math.PI/2;
    const pt  = (i,v) => [cx + Math.cos(ang(i))*R*(v/5), cy + Math.sin(ang(i))*R*(v/5)];
    const poly = v => labels.map((_,i) => pt(i,v).join(',')).join(' ');
    let h = `<svg viewBox="${-padx} 0 ${size+padx*2} ${size}" width="${size+padx*2}" `
          + `height="${size}" style="display:block" role="img" `
          + `aria-label="Rating shape across ${N} measures, scored 1 to 5">`;
    for(let r=1; r<=5; r++)
      h += `<polygon points="${poly(r)}" fill="none" `
         + `stroke="${r===3?'#b9b7ae':'#e6e4dc'}" stroke-width="${r===3?1.1:0.8}"`
         + `${r===3?' stroke-dasharray="3 2"':''}/>`;
    labels.forEach((_,i) => { const [x,y] = pt(i,5);
      h += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#e6e4dc" stroke-width="0.8"/>`; });
    series.forEach(sr => {
      const pts = labels.map((_,i) => { const v = sr.vals[i]; return pt(i, v==null?0:v).join(','); }).join(' ');
      h += `<polygon points="${pts}" fill="${sr.fill||'none'}" stroke="${sr.stroke}" `
         + `stroke-width="${sr.w||1.6}"${sr.dash?` stroke-dasharray="${sr.dash}"`:''}/>`;
      if(sr.dot) labels.forEach((_,i) => { const v = sr.vals[i]; if(v==null) return;
        const [x,y] = pt(i,v); h += `<circle cx="${x}" cy="${y}" r="2.4" fill="${sr.stroke}"/>`; });
    });
    labels.forEach((lab,i) => { const [x,y] = pt(i,5.8);
      const an = ang(i), mid = Math.abs(Math.cos(an)) < 0.25;
      const anc = mid ? 'middle' : (Math.cos(an) > 0 ? 'start' : 'end');
      const sp = String(lab).indexOf(' ');
      const two = (String(lab).length > 11 && sp > 0);
      const lines = two ? [String(lab).slice(0,sp), String(lab).slice(sp+1)] : [String(lab)];
      const y0 = y + 3 - (two ? 5 : 0);
      h += `<text x="${x}" y="${y0}" font-size="9" fill="#55554E" text-anchor="${anc}">`
         + lines.map((l,k) => `<tspan x="${x}" dy="${k?10:0}">${this.esc(l)}</tspan>`).join('')
         + '</text>';
    });
    return h + '</svg>';
  },

  // One row per measure of the LATEST confirmed session, with the change since
  // the one before it. Measures are ordered as the rubric orders them.
  pmShapeRows(){
    const hist = this.pmHistory();
    if(!hist.length) return [];
    const latest = hist[hist.length-1].session_id;
    const prev   = hist.length > 1 ? hist[hist.length-2].session_id : null;
    const byMeasure = new Map();
    (this.pm.history || []).forEach(h => {
      if(!byMeasure.has(h.measure_id))
        byMeasure.set(h.measure_id,
          {measure_id:h.measure_id, label:h.measure_label, sort:h.measure_sort,
           now:null, was:null});
      const m = byMeasure.get(h.measure_id);
      if(h.session_id === latest) m.now = Number(h.score);
      if(prev && h.session_id === prev) m.was = Number(h.score);
    });
    return [...byMeasure.values()]
      .filter(m => m.now != null)
      .sort((a,b) => a.sort - b.sort)
      .map(m => ({...m, delta: m.was == null ? null : m.now - m.was}));
  },

  playerRadar(){
    const rows = this.pmShapeRows();
    if(!rows.length) return '';
    const labels = rows.map(r => r.label);
    const series = [];
    if(rows.some(r => r.was != null))
      series.push({vals: rows.map(r => r.was), stroke:'#8b8981', dash:'4 3', w:1.3});
    series.push({vals: rows.map(r => r.now), stroke:'#1F3864',
                 fill:'rgba(31,56,100,.10)', w:1.8, dot:true});
    return this.radarSVG(labels, series, 210);
  },

  shortWhen(ts){
    if(!ts) return '';
    const d = String(ts).slice(0,10), t = String(ts).slice(11,16);
    return d + (t ? ' ' + t : '');
  },

  async confirmSession(){
    this.review.err=''; this.busy=true;
    const {error} = await this.sb.from('rating_session')
      .update({status:'confirmed', confirmed_by:this.me.id})
      .eq('id',this.review.session.id);
    this.busy=false;
    if(error){ this.review.err=error.message; return; }
    this.review.session.status='confirmed';
    await this.load();
  },

  unauthorisedMembers(){
    const has = new Set(this.auths.map(a=>a.membership_id));
    return this.members.filter(m=>!has.has(m.id));
  },

  // ── lifecycle ──────────────────────────────────────────────────────────
  // What is still stopping the open session from opening, in one phrase.
  // Returns '' when nothing is. The database enforces the same rule.
  openBlockers(){
    const missing = [];
    if(!this.blocks.length) missing.push('at least one day');
    if(!this.auths.length)  missing.push('at least one authorised rater');
    return missing.join(' and ');
  },

  // draft → open → closed → confirmed, and closed can reopen. The database
  // owns which moves exist and what opening requires; this just asks.
  async setStatus(s, next){
    this.statusErr='';
    const {error} = await this.sb.from('rating_session')
      .update({status: next}).eq('id', s.id);
    if(error){ this.statusErr = error.message; return; }
    s.status = next;
    const keep = this.sel; this.sel=null;
    await this.load();
    if(keep) await this.openSession(this.sessions.find(x=>x.id===keep.id) || keep);
  },

  // ── removal ────────────────────────────────────────────────────────────
  // The database is the authority on all three of these. Every message below
  // is either the trigger's own words or a plain reading of a Postgres code —
  // nothing here decides whether the delete is allowed.
  friendlyDeleteError(error, fallback){
    const m = error?.message || '';
    if (error?.code === '23503') return 'Something still depends on this, so it cannot be removed.';
    if (error?.code === '42501' || /row-level security/i.test(m))
      return 'You do not have permission to remove this.';
    return m || fallback;
  },

  async removeBlock(b){
    this.blockErr='';
    const {error} = await this.sb.from('session_block').delete().eq('id', b.id);
    if(error){ this.blockErr = this.friendlyDeleteError(error,'That day could not be removed.'); return; }
    const s=this.sel; this.sel=null; await this.openSession(s);
  },

  async removeAuth(a){
    this.authErr='';
    const {error} = await this.sb.from('session_authorisation').delete().eq('id', a.id);
    if(error){ this.authErr = this.friendlyDeleteError(error,'That authorisation could not be removed.'); return; }
    const s=this.sel; this.sel=null; await this.openSession(s);
  },

  async deleteSession(s){
    this.delErr='';
    const {error} = await this.sb.from('rating_session').delete().eq('id', s.id);
    if(error){
      this.delErr = this.friendlyDeleteError(error,'That session could not be deleted.');
      return;
    }
    this.delConfirm=''; this.sel=null;
    await this.load();
  },

  // ── the player record ───────────────────────────────────────────────────
  // Three doors write this same row: staff entry here, EOI and import later.
  // They differ in the TRUST attached, not in what they produce, so the shape
  // stays one shape and `source` says which door it came through.
  activePeople(){ return this.people.filter(p => p.status !== 'inactive'); },
  peopleShown(){
    const q = this.pf.q.trim().toLowerCase();
    // Opened from a review, the list is scoped to that session — Ming's old
    // complaint was scrolling up and down to get between players.
    const scope = (this.pm.returnTo==='review' && this.review?.rows?.length)
      ? new Set(this.review.rows.map(r => r.person_id)) : null;
    return this.people.filter(p => {
      if(scope) return scope.has(p.id) &&
        (!q || (p.given_name+' '+p.family_name).toLowerCase().includes(q));
      if(this.pf.show==='active'     && p.status==='inactive') return false;
      if(this.pf.show==='inactive'   && p.status!=='inactive') return false;
      if(this.pf.show==='unverified' && p.verification==='verified') return false;
      if(this.pf.gender && p.gender !== this.pf.gender) return false;
      if(this.pf.age !== null && this.ageAt(p.dob, this.pf.year) !== this.pf.age) return false;
      if(!q) return true;
      return (p.given_name+' '+p.family_name).toLowerCase().includes(q);
    });
  },
  // AGE, NOT AGE GROUP. This is arithmetic — age at 31 December of a chosen
  // year — and nothing more. "U12" / "U14" is an ASSOCIATION'S OWN banding
  // convention, it varies between them, and it is only meaningful against a
  // season year. Hard-coding a band here would invent a rule this platform has
  // no business inventing; it belongs with the season and org_profile.
  ageAt(dob, year){
    if(!dob) return null;
    return Number(year) - Number(String(dob).slice(0,4));
  },
  ageYears(){
    const y = new Date().getFullYear();
    return [y-1, y, y+1, y+2];
  },
  ageGroups(){
    const seen = {};
    this.people.forEach(p => {
      if(this.pf.show==='active'   && p.status==='inactive') return;
      if(this.pf.show==='inactive' && p.status!=='inactive') return;
      if(this.pf.gender && p.gender !== this.pf.gender) return;
      const a = this.ageAt(p.dob, this.pf.year);
      if(a === null) return;
      seen[a] = (seen[a]||0) + 1;
    });
    return Object.keys(seen).map(Number).sort((a,b)=>a-b).map(a => ({age:a, n:seen[a]}));
  },
  unverifiedCount(){ return this.people.filter(p => p.verification!=='verified').length; },
  ratedCount(id){ return this.people.find(p=>p.id===id)?.sessions_rated || 0; },
  ageOf(dob){
    if(!dob) return '';
    const d=new Date(dob+'T00:00:00Z'), n=new Date();
    let a=n.getUTCFullYear()-d.getUTCFullYear();
    const m=n.getUTCMonth()-d.getUTCMonth();
    if(m<0 || (m===0 && n.getUTCDate()<d.getUTCDate())) a--;
    return a;
  },
  vsourceLabel(s){
    return s==='association' ? 'matched to the association’s registration'
         : s==='attested'    ? 'attested by the parent at registration'
         : s==='admin'       ? 'a club admin’s own authority' : '';
  },
  vsourceShort(s){
    return s==='association' ? 'reg.' : s==='attested' ? 'parent'
         : s==='admin' ? 'admin' : 'verified';
  },

  blankPerson(){
    return {id:null,given:'',family:'',dob:'',gender:'',ref:'',status:'active',
            verification:'unverified',vsource:'',vnote:'',
            dupes:[],delConfirm:false,err:'',busy:false};
  },
  // The edit buffer is filled from the directory row, so the card can be READ
  // before anybody decides to change anything. Apple's Contacts shape: one card
  // per person, edit is a mode it enters, not a second screen.
  bufferFrom(p){
    return {id:p.id, given:p.given_name||'', family:p.family_name||'', dob:p.dob||'',
            gender:p.gender||'', ref:p.external_ref||'', status:p.status||'active',
            verification:p.verification||'unverified', vsource:p.verified_source||'',
            vnote:p.verified_note||'',
            dupes:[], delConfirm:false, err:'', busy:false};
  },
  pmRow(){ return this.people.find(p => p.id === this.pm.personId) || null; },
  canEditPlayer(){ return ['head_coach','club_admin'].includes(this.me?.role); },
  sourceLabel(s){
    return s==='eoi'    ? 'an expression of interest'
         : s==='import' ? 'an import'
         : s==='seed'   ? 'the demo seed' : 'staff entry';
  },
  cancelEdit(){
    if(!this.pm.personId){ this.pm.adding=false; return; }  // a new player, abandoned
    this.pe = this.bufferFrom(this.pmRow() || {});
    this.pm.editing = false;
  },

  // ── the player card ─────────────────────────────────────────────────────
  // One surface per player, reached from the directory OR from a review row.
  // From the directory it shows details, verification and the permanent record;
  // from a review it also shows what each rater said in that session.
  startAdd(){
    this.peopleErr='';
    this.pe = this.blankPerson();
    this.pm.adding = true;
  },
  // Selecting on the left swaps the pane on the right. No dialog per player —
  // Ming, 13 Aug 2026: scroll the list and the detail follows.
  async selectPlayer(p){
    if(!p) return;
    if(this.pm.editing) this.cancelEdit();
    if(this.pm.returnTo==='review' && this.review?.session){ await this.openPlayer(p.id); return; }
    this.peopleErr='';
    this.pe = this.bufferFrom(p);
    Object.assign(this.pm, {personId:p.id, mode:'profile', editing:false, adding:false,
      name:[p.given_name,p.family_name].filter(Boolean).join(' '),
      sessionName:'', mean:'', coverage:'',
      detail:[], history:[], resolutions:[], err:''});
    this.rz = {measure_id:'',source:'',adopted:null,score:null,rationale:'',err:'',busy:false};
    if(!this.ratedCount(p.id)) return;
    const {data:h, error} = await this.sb.from('v_player_history')
      .select('*').eq('person_id', p.id).order('session_date');
    if(error){ this.pm.err = error.message; return; }
    this.pm.history = h || [];
  },

  // ── verifying in one click ──────────────────────────────────────────────
  // Writes straight away. Verification is repeated dozens of times in a sitting
  // and must not cost an edit-change-save round trip; editing a record is the
  // rare act, not this one.
  async quickVerify(src, note){
    if(!this.pm.personId || this.pm.editing) return;
    this.qv.err=''; this.qv.busy=true;
    const {error} = await this.sb.from('person').update({
      verification:'verified', verified_source:src, verified_by:this.me?.id,
      verified_note: src==='admin' ? (note||'').trim() : null
    }).eq('id', this.pm.personId);
    this.qv.busy=false;
    if(error){ this.qv.err = error.message; return; }
    this.qv = {open:false,note:'',busy:false,err:''};
    await this.refreshCard();
  },
  async quickUnverify(){
    if(!this.pm.personId) return;
    this.qv.err=''; this.qv.busy=true;
    const {error} = await this.sb.from('person')
      .update({verification:'unverified'}).eq('id', this.pm.personId);
    this.qv.busy=false;
    if(error){ this.qv.err = error.message; return; }
    await this.refreshCard();
  },
  async refreshCard(){
    await this.load();
    const p = this.pmRow();
    if(p) this.pe = this.bufferFrom(p);
  },

  setVerification(src){
    if(!src){ this.pe.verification='unverified'; this.pe.vsource='';
              this.pe.vnote=''; return; }
    this.pe.verification='verified'; this.pe.vsource=src;
    if(src!=='admin') this.pe.vnote='';
  },

  // Verification's FIRST job is "is this person already here", not "are these
  // fields right". match_person() lives in the database precisely so staff
  // entry and, later, import can never disagree about who is a duplicate.
  async checkDupes(){
    this.pe.dupes=[];
    const g=this.pe.given.trim(), f=this.pe.family.trim();
    if(!g || !f || !this.org) return;
    const {data,error} = await this.sb.rpc('match_person',{
      p_org:this.org.id, p_given:g, p_family:f, p_dob:this.pe.dob||null});
    if(error) return;
    this.pe.dupes = (data||[]).filter(d => d.person_id !== this.pe.id);
  },

  async savePerson(){
    this.pe.err=''; this.pe.busy=true;
    const verified = this.pe.verification==='verified';
    const row = {
      given_name: this.pe.given.trim(),
      family_name: this.pe.family.trim(),
      dob: this.pe.dob || null,
      gender: this.pe.gender || null,
      external_ref: this.pe.ref.trim() || null,
      status: this.pe.status,
      verification: verified ? 'verified' : 'unverified',
      verified_source: verified ? (this.pe.vsource || null) : null,
      verified_note:   verified ? (this.pe.vnote.trim() || null) : null,
      verified_by:     verified ? this.me?.id : null
    };
    let error;
    if(this.pe.id){
      ({error} = await this.sb.from('person').update(row).eq('id', this.pe.id));
    }else{
      // HARD RULE: this version holds fabricated data only, so every record
      // created here is flagged. Do not make this conditional.
      ({error} = await this.sb.from('person')
                    .insert({...row, org_id:this.org.id, source:'staff', is_demo:true}));
    }
    this.pe.busy=false;
    if(error){ this.pe.err = error.message; return; }
    await this.load();
    // stay on the record that was just written, in read mode
    const saved = this.pe.id
      ? this.pmRow()
      : this.people.find(p => p.given_name===row.given_name
                           && p.family_name===row.family_name && p.dob===row.dob);
    if(saved){ await this.selectPlayer(saved); }
    this.pm.editing = false; this.pm.adding = false;
  },

  async deletePerson(){
    this.pe.err='';
    const {error} = await this.sb.from('person').delete().eq('id', this.pe.id);
    if(error){
      this.pe.err = this.friendlyDeleteError(error,'That player could not be deleted.');
      this.pe.delConfirm=false;
      return;
    }
    this.pm.personId=''; this.pm.editing=false;
    await this.load();
  },

  async addAuth(){
    this.authErr='';
    const {error} = await this.sb.from('session_authorisation').insert({
      org_id:this.org.id, session_id:this.sel.id,
      membership_id:this.newAuth.membership_id, authorised_by:this.me.id
    });
    if(error){
      this.authErr = error.code==='23505'
        ? 'That person is already authorised for this session.'
        : error.message;
      return;
    }
    this.newAuth.membership_id='';
    const s=this.sel; this.sel=null; await this.openSession(s);
  }
}}
</script>
</body>
</html>
