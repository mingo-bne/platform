                    <button class="btn sm" x-show="pm.editing" @click="cancelEdit()">Cancel</button>
                  </div>

          <p x-show="pm.err" x-text="pm.err" class="err" style="margin-top:0"></p>

          <!-- ── details ─────────────────────────────────────────────────── -->
          <div class="cath">Details</div>
          <div class="dl">
            <div class="r"><span class="k">Given name</span>
              <span class="v" x-show="!pm.editing" x-text="pe.given"></span>
              <input type="text" x-show="pm.editing" x-model="pe.given" @blur="checkDupes()"></div>
            <div class="r"><span class="k">Family name</span>
              <span class="v" x-show="!pm.editing" x-text="pe.family"></span>
              <input type="text" x-show="pm.editing" x-model="pe.family" @blur="checkDupes()"></div>
            <div class="r"><span class="k">Date of birth</span>
              <span class="v" x-show="!pm.editing" :class="pe.dob?'':'none'"
                    x-text="pe.dob ? pe.dob+'  ('+ageOf(pe.dob)+' years)' : 'not recorded'"></span>
              <input type="date" x-show="pm.editing" x-model="pe.dob" @blur="checkDupes()"></div>
            <div class="r"><span class="k">Gender</span>
              <span class="v" x-show="!pm.editing" :class="pe.gender?'':'none'"
                    x-text="pe.gender || 'not recorded'"></span>
              <select x-show="pm.editing" x-model="pe.gender">
                <option value="">—</option><option value="F">F</option>
                <option value="M">M</option><option value="X">X</option></select></div>
            <div class="r"><span class="k">Association ref</span>
              <span class="v" x-show="!pm.editing" :class="pe.ref?'':'none'"
                    x-text="pe.ref || 'none held'"></span>
              <input type="text" x-show="pm.editing" x-model="pe.ref"
                     placeholder="e.g. BC-2027-00412"></div>
            <div class="r" x-show="pm.editing || pe.status==='inactive'">
              <span class="k">Status</span>
              <span class="v" x-show="!pm.editing" x-text="pe.status"></span>
              <select x-show="pm.editing" x-model="pe.status">
                <option value="active">Active</option>
                <option value="inactive">Inactive — off the lists, ratings kept</option></select></div>
            <div class="r" x-show="!pm.editing && pm.personId"><span class="k">Came in as</span>
              <span class="v" x-text="sourceLabel(pmRow()?.source)"></span></div>
          </div>

          <!-- The duplicate check runs BEFORE a second record can exist. Same
               rule import will use — match_person(), not a second implementation
               that quietly disagrees with the first. -->
          <template x-if="pm.editing && pe.dupes.length">
            <div class="warnbar" style="border-radius:8px;border:1px solid var(--warnline);
                        margin:10px 0 0">
              <b x-text="pe.dupes.length===1 ? 'This player may already be here'
                                             : 'These players may already be here'"></b>
              <template x-for="d in pe.dupes" :key="d.person_id">
                <div style="margin-top:4px">
                  <b x-text="d.given_name+' '+d.family_name"></b>
                  <span x-text="' — '+d.reason+' ('+d.confidence+')'"></span>
                  <button class="btn sm" style="margin-left:6px"
                          @click="selectPlayer(people.find(p=>p.id===d.person_id))">
                    Open that record instead</button>
                </div>
              </template>
            </div>
          </template>

          <!-- ── verification ────────────────────────────────────────────── -->
          <div class="cath">Verification</div>
          <p class="note" style="margin:0 0 6px" x-show="!pm.editing">
            <span x-show="pe.verification==='verified'">Checked
              <b x-text="vsourceLabel(pe.vsource)"></b><span x-show="pmRow()?.verified_by_name">,
              by <b x-text="pmRow()?.verified_by_name"></b></span><span
              x-show="pmRow()?.verified_at"> on <b x-text="fmt(pmRow()?.verified_at)"></b></span>.
              <span x-show="pe.vnote"><br>Reason given: <i x-text="pe.vnote"></i></span></span>
            <span x-show="pe.verification!=='verified'">Nobody has checked this record yet, so this
              player <b>cannot be offered a place</b>. Rating is unaffected.</span>
          </p>

          <!-- ── verifying, without going into edit ──────────────────────────
               Ming, 13 Aug 2026: "to go into edit and confirm is too much
               burden". Verification is the act a club repeats dozens of times
               in a sitting, so it is one click from the card. Editing a record
               is rare; verifying one is not. The `admin` path still asks for a
               reason, because that is the whole difference between an override
               and a bypass — but it asks inline, not in a different mode. ── -->
          <template x-if="!pm.editing && canEditPlayer()">
            <div>
              <div class="inline" style="margin-top:0" x-show="pe.verification!=='verified'">
                <button class="btn pri" @click="quickVerify('association')"
                        :disabled="qv.busy">Matched the registration</button>
                <button class="btn" @click="quickVerify('attested')"
                        :disabled="qv.busy">Parent attested</button>
                <button class="btn" @click="qv.open=!qv.open"
                        x-text="qv.open ? 'Cancel' : 'My own authority…'"></button>
              </div>

              <div class="inline" style="margin-top:0" x-show="pe.verification==='verified'">
                <button class="btn" @click="quickUnverify()" :disabled="qv.busy">Unverify</button>
                <span class="c" x-show="!pe.dob">no date of birth on record</span>
              </div>

              <div x-show="qv.open" style="margin-top:8px">
                <div class="field" style="margin-bottom:6px">
                  <label class="fl">What did you check? — this goes on the record</label>
                  <input type="text" x-model="qv.note" @keydown.enter="quickVerify('admin', qv.note)"
                         placeholder="e.g. birth certificate sighted, Connect record not live yet">
                </div>
                <button class="btn pri" @click="quickVerify('admin', qv.note)"
                        :disabled="!qv.note.trim() || qv.busy">Verify on my authority</button>
              </div>
              <p x-show="qv.err" x-text="qv.err" class="err"></p>
              <p class="note" x-show="pe.verification!=='verified' && !qv.open" style="margin-top:6px">
                <span x-text="unverifiedCount()"></span> still to check.
              </p>
            </div>
          </template>

          <template x-if="pm.editing">
            <div>
              <p class="note" style="margin:0 0 6px">A club is downstream of the association, whose
                registration the parent already attested to — so match that, and only go back to a
                family where the two disagree.</p>
              <div class="vsrc">
                <button class="btn" :class="pe.verification==='verified' && pe.vsource==='association' ? 'pri':''"
                        @click="setVerification('association')">Matched the registration</button>
                <button class="btn" :class="pe.verification==='verified' && pe.vsource==='attested' ? 'pri':''"
                        @click="setVerification('attested')">Parent attested</button>
                <button class="btn" :class="pe.verification==='verified' && pe.vsource==='admin' ? 'pri':''"
                        @click="setVerification('admin')">My own authority</button>
                <button class="btn" :class="pe.verification!=='verified' ? 'pri':''"
                        @click="setVerification('')">Not verified</button>
              </div>
              <!-- The override has to say what was actually checked. That is the
                   whole difference between an override and a bypass. -->
              <div class="field" x-show="pe.verification==='verified' && pe.vsource==='admin'"
                   style="margin-top:8px">
                <label class="fl">What did you check? — this is the reason on the record</label>
                <input type="text" x-model="pe.vnote"
                       placeholder="e.g. birth certificate sighted, Connect record not live yet">
              </div>
              <p class="note" x-show="pe.verification==='verified'" style="margin-top:8px">
                Changing the date of birth un-verifies this record — the registration it was matched
                against is keyed on that date, so somebody has to look again.</p>
              <p class="note" x-show="!pm.personId">Anything created here is flagged <b>DEMO</b>.
                This version holds fabricated data only.</p>

              <div class="inline" style="margin-top:10px" x-show="pm.personId">
                <button class="btn" x-show="!pe.delConfirm" @click="pe.delConfirm=true">Delete…</button>
                <template x-if="pe.delConfirm">
                  <span class="inline" style="margin:0">
                    <span class="c wn">Delete permanently?</span>
                    <button class="btn" @click="deletePerson()">Yes, delete</button>
                    <button class="btn" @click="pe.delConfirm=false">No</button>
                  </span>
                </template>
              </div>
              <p class="note" x-show="pe.delConfirm">A player who has been rated cannot be deleted —
                the ratings would go with them. Mark them <b>inactive</b> instead; they leave the
                lists and the record survives.</p>
              <p x-show="pe.err" x-text="pe.err" class="err"></p>
            </div>
          </template>

          <template x-if="!pm.editing && !pm.detail.length && !pm.err && pm.mode!=='profile'">
            <div class="empty">Nothing recorded for this player in this session yet.</div>
          </template>


          <template x-if="pm.detail.length">
            <div>
              <div class="statrow" style="border:1px solid var(--line);border-radius:8px;margin-bottom:12px">
                <div><b x-text="pm.mean"></b>rating</div>
                <div><b x-text="pmRaters().length"></b><span x-text="pmRaters().length===1?'pass':'passes'"></span></div>
                <div><b x-text="pmMeasures().length"></b>measures</div>
                <div><b x-text="pmWorst()"></b>worst spread</div>
              </div>

              <div class="cath">What each rater said
                <b x-text="'threshold '+review.threshold"></b></div>
              <div class="inline" style="margin:0 0 6px">
                <template x-for="w in pmRaters()" :key="w.key">
                  <span class="c grp"><span x-text="w.name"></span> ·
                    <span x-text="w.when"></span></span>
                </template>
              </div>
              <div class="pc">
                <template x-for="m in pmMeasures()" :key="m.measure_id">
                  <div>
                  <div class="pcr" :class="res(m.measure_id) ? 'settled'
                                        : (!m.rated ? 'gap'
                                        : (m.spread > review.threshold ? 'wide' : ''))">
                    <span class="lb" x-text="m.label"></span>
                    <span class="passes">
                      <template x-for="w in pmRaters()" :key="w.key">
                        <span class="pv" :class="m.by[w.key] == null ? 'none' : ''"
                              x-text="m.by[w.key] ?? '–'"></span>
                      </template>
                    </span>
                    <span class="meter" :title="effOf(m) + ' of 5'">
                      <i :style="'width:'+ (isNaN(effOf(m)) ? 0 : effOf(m)/5*100) +'%'"></i>
                    </span>
                    <span class="mn" x-text="effOf(m)"></span>
                    <span class="sp" x-text="res(m.measure_id)
                          ? (res(m.measure_id).source==='adopted'
                              ? 'took '+res(m.measure_id).adopted_name
                              : 'HC call')
                          : (!m.rated ? 'not rated' : (m.spread ? 'spread '+m.spread : ''))"></span>
                    <span class="act">
                      <button class="btn sm" x-show="canResolve()"
                              @click="toggleResolve(m)"
                              x-text="rz.measure_id===m.measure_id ? 'Cancel'
                                    : (res(m.measure_id) ? 'Change' : 'Override')"></button>
                    </span>
                  </div>

                  <!-- Pick one of the raters, or record your own. Both are the head
                       coach's call; only the record of WHOSE call differs. -->
                  <div class="rz" x-show="rz.measure_id===m.measure_id">
                    <div class="cath" style="margin-top:0">The head coach's call</div>
                    <p class="note" style="margin:0 0 7px">A session is usually run by the coaching
                      staff; the head coach carries the final say on every rating, and the
                      explanation with it.</p>
                    <template x-for="w in pmRaters()" :key="w.key">
                      <div class="opt" x-show="m.by[w.key] != null"
                           :class="rz.source==='adopted' && rz.adopted===w.mid ? 'on' : ''"
                           @click="rz.source='adopted'; rz.adopted=w.mid; rz.score=m.by[w.key]">
                        <span class="v" x-text="m.by[w.key]"></span>
                        <span>Take <b x-text="w.name"></b>'s rating</span>
                      </div>
                    </template>
                    <div class="opt" :class="rz.source==='own' ? 'on' : ''"
                         @click="rz.source='own'; rz.adopted=null">
                      <span class="v" x-text="rz.source==='own' && rz.score ? rz.score : '?'"></span>
                      <span>Record my own</span>
                      <span class="scale" style="margin-left:auto">
                        <template x-for="v in scaleOf(rzMeasure())" :key="v">
                          <button class="sv" :class="rz.source==='own' && rz.score===v ? 'on' : ''"
                                  @click.stop="rz.source='own'; rz.adopted=null; rz.score=v"
                                  x-text="v"></button>
                        </template>
                      </span>
                    </div>
                    <div class="field" style="margin:8px 0 0">
                      <label class="fl">Why — optional, and only for you. The head coach's
                        authority does not rest on writing it down</label>
                      <input type="text" x-model="rz.rationale"
                             placeholder="e.g. watched the second half">
                    </div>
                    <div class="inline" style="margin-top:8px">
                      <button class="btn pri" @click="saveResolution(m)"
                              :disabled="!rz.score || rz.busy">Save the call</button>
                      <button class="btn" @click="rz.measure_id=''">Cancel</button>
                    </div>
                    <p x-show="rz.err" x-text="rz.err" class="err"></p>
                  </div>
                  </div>
                </template>
              </div>
              <p class="note" x-show="pmRaters().length>1">One box per rating pass, in the order
                they were taken. Where the same coach rated twice the passes stay separate —
                nothing is averaged away before you see it. The bar repeats the mean; it does not
                add anything the number does not already say.</p>
              <p class="note" x-show="pmRaters().length===1">One pass, so there is nothing to
                disagree with yet. Spread appears once a second coach rates this player.</p>
            </div>
          </template>

          <!-- The shape. Ported from the TMS `radarSVG` so the two systems draw a
               player the same way. Series are distinguished by BOTH colour and
               dash, and every value is written out beside the chart, so nothing
               depends on telling two colours apart. -->
          <template x-if="pmHistory().length">
            <div>
              <div class="cath">The shape
                <b x-text="pmHistory().length > 1
                     ? 'latest against the one before'
                     : 'one confirmed session so far'"></b></div>
              <div class="shape">
                <div>
                  <div x-html="playerRadar()"></div>
                  <div class="leg">
                    <div><i :style="'border-color:var(--navy)'"></i>
                      <span x-text="pmHistory()[pmHistory().length-1]?.session_name"></span></div>
                    <div x-show="pmHistory().length > 1">
                      <i style="border-color:var(--ink3);border-top-style:dashed"></i>
                      <span x-text="pmHistory()[pmHistory().length-2]?.session_name"></span></div>
                  </div>
                </div>
                <table class="vtab">
                  <thead><tr>
                    <th>Measure</th>
                    <th class="r">Rating</th>
                    <th class="r" x-show="pmHistory().length>1">Change</th>
                  </tr></thead>
                  <tbody>
                    <template x-for="r in pmShapeRows()" :key="r.measure_id">
                      <tr>
                        <td x-text="r.label"></td>
                        <td class="r v" x-text="r.now.toFixed(2)"></td>
                        <td class="r d dlt" x-show="pmHistory().length>1"
                            :class="r.delta > 0 ? 'up' : (r.delta < 0 ? 'dn' : 'flat')"
                            x-text="r.delta == null ? '—'
                                  : (r.delta > 0 ? '▲ +' : (r.delta < 0 ? '▼ ' : '– '))
                                    + (r.delta === 0 ? '0.00' : r.delta.toFixed(2))"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
          </template>

          <!-- The trend. One bar per confirmed session, oldest first. With a
               single session it is a single bar and says so — better than an
               empty frame pretending a line exists. -->
          <template x-if="pmHistory().length">
            <div>
              <div class="cath">Overall, session by session</div>
              <div class="trend">
                <div class="tline">
                  <template x-for="h in pmHistory()" :key="h.session_id">
                    <b :style="'height:'+ Math.max(3, h.mean/5*34) +'px'"
                       :title="h.session_name + ' — ' + h.mean"></b>
                  </template>
                </div>
                <div class="inline" style="margin-top:5px">
                  <template x-for="h in pmHistory()" :key="h.session_id">
                    <span class="c"><span x-text="h.session_date"></span> ·
                      <b x-text="h.mean"></b></span>
                  </template>
                </div>
              </div>
              <p class="note" x-show="pmHistory().length === 1">
                One confirmed session. The trend fills in as more are signed off — this is the
                first point on it.</p>
              <p class="note" x-show="pmHistory().length > 1">
                Overall is the plain mean across every approved measure in that session, the same
                arithmetic the rating itself uses.</p>
            </div>
          </template>

          <div class="cath">Approved record</div>
          <template x-if="!pm.history.length">
            <p class="note" style="margin-top:0">Nothing approved yet. A rating enters this player's
              permanent record when the head coach confirms the session it came from.</p>
          </template>
          <template x-if="pm.history.length">
            <div>
              <template x-for="h in pmHistory()" :key="h.session_id">
                <div class="sess">
                  <span class="big" x-text="h.mean"></span>
                  <div class="body">
                    <div class="t" x-text="h.session_name"></div>
                    <div class="d"><span x-text="h.session_date"></span> ·
                      <span x-text="h.n"></span> measures</div>
                  </div>
                  <span class="c" :class="h.anyResolved?'acc':''"
                        x-text="h.anyResolved?'resolved':'mean'"></span>
                </div>
              </template>
              <p class="note">One card per confirmed session, oldest first. The matrix and the
                trend chart will read from this same record.</p>
            </div>
          </template>
                </div>
              </template>
            </div>
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- ─────────── ADD A PLAYER (modal) ───────────
       A focused dialog rather than a mode of the directory: you are not
       browsing while you type a new child in. It lands UNVERIFIED like every
       other door, and the duplicate check runs before the row can exist. ── -->
  <template x-if="pm.adding">
    <div class="modal" style="z-index:90" @click.self="pm.adding=false">
      <div class="box sm">
        <div class="mhead"><h3>Add a player</h3>
          <button class="x" @click="pm.adding=false" title="Close">×</button></div>
        <div class="mbody">
          <div class="row2">
            <div class="field"><label class="fl">Given name</label>
              <input type="text" x-model="pe.given" @blur="checkDupes()"></div>
            <div class="field"><label class="fl">Family name</label>
              <input type="text" x-model="pe.family" @blur="checkDupes()"></div>
          </div>
          <div class="row2">
            <div class="field"><label class="fl">Date of birth</label>
              <input type="date" x-model="pe.dob" @blur="checkDupes()"></div>
            <div class="field"><label class="fl">Gender</label>
              <select x-model="pe.gender">
                <option value="">—</option><option value="F">F</option>
                <option value="M">M</option><option value="X">X</option></select></div>
          </div>

          <template x-if="pe.dupes.length">
            <div class="warnbar" style="border-radius:8px;border:1px solid var(--warnline);margin:0 0 10px">
              <b x-text="pe.dupes.length===1 ? 'This player may already be here'
                                             : 'These players may already be here'"></b>
              <template x-for="d in pe.dupes" :key="d.person_id">
                <div style="margin-top:4px">
                  <b x-text="d.given_name+' '+d.family_name"></b>
                  <span x-text="' — '+d.reason+' ('+d.confidence+')'"></span>
                  <button class="btn sm" style="margin-left:6px"
                          @click="pm.adding=false; selectPlayer(people.find(p=>p.id===d.person_id))">
                    Open that record instead</button>
                </div>
              </template>
            </div>
          </template>

          <p class="note" style="margin-top:0">Lands <b>unverified</b> — verify it on the record once
            you have matched the registration. Flagged <b>DEMO</b>: this version holds fabricated
            data only.</p>
          <div class="inline">
            <button class="btn pri" @click="savePerson()"
                    :disabled="pe.busy || !pe.given.trim() || !pe.family.trim()"
                    x-text="pe.busy ? 'Saving…' : 'Add player'"></button>
            <button class="btn" @click="pm.adding=false">Cancel</button>
          </div>
          <p x-show="pe.err" x-text="pe.err" class="err"></p>
        </div>
      </div>
    </div>
  </template>

  <!-- ─────────── CLUB SETTINGS (modal) ───────────
       The age rule and the club's own words for things. Ported from the TMS,
       where brackets and the cutoff are settings rather than constants —
       associations band differently and reckon age at different dates. ── -->
  <!-- ── one age group, and nothing else ─────────────────────────────────── -->
  <template x-if="modal==='formation' && fp.group">
    <div class="modal" @click.self="modal=''">
      <div class="box lg">
        <div class="mhead">
          <h3 x-text="fp.group"></h3>
          <span class="c" x-text="fPool().length+' players'"></span>
          <span class="c" x-text="'average '+f2(fMean(fPool().map(p=>fVal(p))))"></span>
          <span class="c grp" x-show="fp.phase!=='setup'"
                x-text="'graded on '+(fp.basis==='points'?'points per game':'coach rating')"></span>
          <span class="c" x-show="fp.phase==='compare'">proposal confirmed · the engine is not running</span>
          <span class="c" x-show="fp.saved" x-text="fp.saved"></span>
          <button class="x" @click="modal=''" title="Close">×</button>
        </div>
        <div class="mbody" x-show="fp.phase==='setup'">

          <div class="cath">What the teams are graded on</div>
          <div class="fbasis">
            <template x-for="b in ['rating','points']" :key="b">
              <div class="fb" :class="fp.basis===b?'on':''" @click="fSetBasis(b)">
                <b x-text="(fp.basis===b?'■ ':'□ ')+(b==='rating'?'Coach rating':'Points per game')"></b>
                <p x-show="b==='rating'">What the coaches saw at the trial. A team is judged on its
                  <b>average</b>.</p>
                <p x-show="b==='points'">What they actually scored last season, per game, brought
                  forward. A team is judged on the <b>points it projects to score</b>, and it can
                  only see players who were here last year.</p>
                <p><b x-text="fVisible(b)"></b> of <span x-text="fPool().length"></span>
                  players are visible to it.</p>
              </div>
            </template>
          </div>

          <div class="cath">Teams this club is entering</div>
          <div class="ftms">
            <template x-for="(t,i) in fp.teams" :key="i">
              <span class="ftm"><span x-text="fDivLabel(t)"></span>
                <button @click="fDropTeam(i)" title="remove">×</button></span>
            </template>
            <select x-model.number="fp.newdiv" style="width:auto">
              <template x-for="d in [1,2,3,4,5,6,7,8]" :key="d">
                <option :value="d" x-text="fDivLabel(d)" :selected="d===fp.newdiv"></option>
              </template>
            </select>
            <button class="btn sm" @click="fAddTeam(fp.newdiv)">Enter a team</button>
            <button class="btn sm" style="margin-left:auto" @click="fNameOpen()">Division names…</button>
          </div>

          <!-- ── what the association calls each division ────────────────────
               The RANK orders and bands; this is only what gets printed. Club-
               wide, because a division is the association's competition — rank 3
               is the same competition in U12 as in U18. ── -->
          <div class="fnm" x-show="fp.naming" x-cloak>
            <div class="fnmh">
              <b>What your association calls each division</b>
              <span class="c">applies everywhere, not just <span x-text="fp.group"></span></span>
            </div>
            <div class="fnmp">
              <label class="fl">Everything you have not named</label>
              <input type="text" x-model="fp.pattern" placeholder="Div {n}" style="width:150px">
              <span class="note" style="margin:0">
                <code>{n}</code> is the number. <b x-text="fNameFallback(4)"></b> for division 4.</span>
            </div>
            <table class="fbt">
              <tr><th>Rank</th><th>What you call it</th><th></th></tr>
              <template x-for="d in fNameRanks()" :key="d">
                <tr>
                  <td class="num" x-text="d"></td>
                  <td><input type="text" :value="fp.names[String(d)]||''"
                             @input="fNameSet(d,$event.target.value)"
                             :placeholder="fNameFallback(d)" style="width:210px"></td>
                  <td><span class="c" x-show="!fp.names[String(d)]">using the pattern</span></td>
                </tr>
              </template>
            </table>
            <p class="note" style="margin-bottom:6px" x-show="!fNameRanks().length">
              Enter a team above and its division will appear here to be named.</p>
            <div class="inline">
              <button class="btn pri sm" @click="fSaveNames()" :disabled="fp.busy">Save the names</button>
              <button class="btn sm" @click="fp.naming=false">Cancel</button>
              <span class="c bad" x-show="fp.namesErr" x-text="fp.namesErr"></span>
            </div>
          </div>
          <p class="note">Enter the divisions the association actually offers you — they do not have
            to run 1, 2, 3. <b>Two teams entered in the same division share one band</b> and are
            balanced against each other.</p>

          <div class="cath">What a re-run may move</div>
          <label class="fopt" :class="fp.lock?'on':''">
            <input type="checkbox" x-model="fp.lock">
            <span><b>Lock players already placed and still in age</b>
              <span class="c" x-text="fLocked().length+' locked'"></span><br>
              <span class="note" style="margin:0">Both conditions hold: they are in a team, and they
              are still in this age group. A child who has aged up has no place here to keep.</span>
            </span></label>

          <div class="ladder" style="display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;
                                     margin-top:10px">
            <span class="c">squad cap <input type="number" x-model.number="fp.cap" min="3" max="30"
              style="width:56px;margin-left:4px"></span>
            <span class="c">minimum to field <input type="number" x-model.number="fp.min" min="3"
              max="30" style="width:52px;margin-left:4px"></span>
            <button class="btn sm" @click="fEvenCounts()">Even numbers</button>
            <button class="btn sm" @click="fEvenSpan()">Even rating span</button>
          </div>

          <div class="cath" x-text="'Where the teams fall on '+(fp.basis==='points'?'points per game':'rating')+' — drag a line'"></div>
          <div class="flv" id="flv">
            <div class="bars" x-html="fBarsHTML()"></div>
            <template x-for="(v,i) in fp.cuts" :key="i">
              <div class="fcut" :data-i="i" :style="'left:'+fPct(v)+'%'"
                   @pointerdown="fDragStart($event,i)">
                <b x-text="fDivLabel(fBands()[i]?.div)+' floor '+fFx(v)"></b></div>
            </template>
            <div class="axis" x-html="fAxisHTML()"></div>
          </div>

          <template x-if="fp.basis==='points' && fMissing().length">
            <p class="note" style="color:var(--warn)">
              <b x-text="fMissing().length+' of '+fPool().length+' players have no scoring record.'"></b>
              They were not in the club last season, so this basis cannot see them and they are in
              no band below.</p>
          </template>

          <p class="note">A line is the floor of the team above it — for the top team that floor
            <b>is</b> the entry standard. <b>A team's target is what the players in its band actually
            average</b>, so it can never be a number this cohort cannot reach.</p>

          <table class="fbt">
            <tr><th>Entered as</th><th x-text="fp.basis==='points'?'Scoring band':'Rating band'"></th>
              <th class="num">Players</th><th class="num">Per team</th>
              <th class="num">Target — the band's own average</th><th></th></tr>
            <template x-for="(b,i) in fBands()" :key="i">
              <tr>
                <td><span class="sw" :style="'background:var(--d'+Math.min(6,i+1)+')'"></span>
                  <span x-text="fDivLabel(b.div)"></span>
                  <span class="c" x-show="b.teams>1" x-text="b.teams+' teams'"></span></td>
                <td x-text="fBandRange(b,i)"></td>
                <td class="num" x-text="b.n"></td>
                <td class="num" x-text="b.per"></td>
                <td class="num"><b x-text="b.n ? (fp.basis==='points'
                      ? Math.round(b.total)+' pts/game' : f2(b.avg)) : '—'"></b></td>
                <td>
                  <span class="c bad" x-show="!b.n">nobody in this band</span>
                  <span class="c wn" x-show="b.n && b.per>fp.cap"
                        x-text="b.per+' in a squad capped at '+fp.cap"></span>
                  <span class="c wn" x-show="b.n && b.per<=fp.cap && b.per<fp.min"
                        x-text="'cannot field '+fp.min"></span>
                </td>
              </tr>
            </template>
          </table>

          <!-- ── WHAT THE PLAN BUILDS, UNDER THE GRAPH ────────────────────────
               Ming, 19 Aug 2026: "I want the result from build the rosters to be
               shown under the graph where I can quickly decide how to manipulate
               the rating floor so that I don't need to go back and forth."
               So the teams sit beneath the lines that produced them. Moving a
               line marks them STALE rather than silently re-running: the engine
               is deterministic and a club should choose when it runs, but it
               must never leave a stale set of teams looking current. ── -->
          <div x-show="fp.result" x-cloak>
            <div class="cath">What this plan builds
              <span class="c wn" x-show="fp.stale">the lines have moved — build again</span>
            </div>
            <div :style="fp.stale?'opacity:.5':''">
          <p class="note" style="margin-top:0">
            <b x-text="(fp.result?.squads.length||0) + ' teams'"></b> ·
            <span x-text="fp.result?.placed + ' of ' + ((fp.result?.placed||0) + (fp.result?.unplaced.length||0)) + ' players placed'"></span>
            <span x-show="fp.result?.exchanged"
                  x-text="' · ' + fp.result?.exchanged + ' exchanged across a line for shape'"></span>
          </p>
          <p class="note" style="margin-top:0">
            <span class="c grp" x-text="'graded on '+(fp.basis==='points'?'points per game':'coach rating')"></span>
            Accepting would give <b x-text="fp.result?.squads.length"></b> standing
            team<span x-show="fp.result?.squads.length!==1">s</span> this season's roster and the
            division beside it.</p>

          <div class="sq">
            <template x-for="(s,si) in (fp.result?.squads||[])" :key="si">
              <div class="sqc" :class="(s.players.length<fp.min || s.over_cap)?'short':''">
                <div class="sqh">
                  <!-- EVERY standing team is offered on EVERY roster; assigning one
                       twice is flagged, never prevented (ADR-008). -->
                  <div class="asg">
                    <!-- :selected per option, not :value on the select — the options
                         come from a template and do not exist when :value binds, so
                         the select showed "name it later" over a proposed name. -->
                    <select @change="fAssignTo(s.division_rank+'#'+s.ordinal, $event.target.value)">
                      <template x-for="n in fTeamOptions()" :key="n">
                        <option :value="n" :selected="n===fAssignedName(s)" x-text="n"></option>
                      </template>
                      <option value="" :selected="!fAssignedName(s)">— name it later —</option>
                    </select>
                  </div>
                  <div class="row">
                    <span class="c grp" x-text="fDivLabel(s.division_rank)"></span>
                    <span class="c" x-text="fLastDivNote(s)"></span>
                  </div>
                  <div class="row">
                    <span x-text="s.players.length+' players'"></span>
                    <span class="c" :class="fSqOff(s)?'wn':'ok'" x-show="s.players.length"
                          x-text="fSqVs(s)"></span>
                    <span class="c bad" x-show="!s.players.length">nobody in this band</span>
                    <span class="c bad" x-show="s.over_cap"
                          x-text="(s.players.length-fp.result.cap)+' over the cap of '+fp.result.cap"></span>
                    <span class="c wn" x-show="!s.over_cap && s.players.length && s.players.length<fp.min"
                          x-text="'under '+fp.min"></span>
                    <span class="c bad" x-show="fAssignedTwice(s)">this team is assigned twice</span>
                  </div>
                  <div class="row" x-show="s.players.length">
                    <span class="c" x-text="fRefText(s)"></span>
                  </div>
                </div>
                <div class="cats">
                  <template x-for="x in (s.players.length?s.shape:[])" :key="x.i">
                    <div class="catr">
                      <span class="nm2" x-text="x.label"></span>
                      <span class="tr"><i></i>
                        <b :class="x.dev<-0.35?'lo':''" :style="fBarStyle(x.dev)"></b></span>
                      <span class="dv" x-text="(x.dev>=0?'+':'')+x.dev.toFixed(2)"></span>
                    </div>
                  </template>
                  <p class="note" style="margin:0" x-show="!s.players.length">
                    Move the line above this team, or drop the team.</p>
                </div>
                <details class="nl" x-show="s.players.length">
                  <summary x-text="s.players.length+' names'"></summary>
                  <ul class="sqp">
                    <template x-for="p in s.players" :key="p.person_id">
                      <li><span x-text="p.given_name+' '+p.family_name"></span>
                        <span class="r" x-text="p.age+' · '+fVfx(p.value)"></span></li>
                    </template>
                  </ul>
                </details>
              </div>
            </template>
          </div>

          <div class="warnbox">A team can sit exactly on its target and still be built entirely of
            guards. The bars are each category against what a team at this level should look like —
            a bar left of centre is a category this team is short in.</div>

          <!-- NOBODY IS DROPPED SILENTLY. -->
          <div x-show="fp.result?.unplaced.length">
            <div class="cath">Not placed — and why</div>
            <table class="fbt">
              <template x-for="u in (fp.result?.unplaced||[])" :key="u.person_id">
                <tr><td x-text="u.name"></td><td x-text="u.reason"></td></tr>
              </template>
            </table>
          </div>
            </div>
          </div>
        </div>

        <!-- ── THE COMPARISON BOARD ────────────────────────────────────────
             Ming, 19 Aug 2026: "Once the generator confirm the proposal, enter
             drag-drop team comparison phase, where coach can move players around
             to balance like in the TMS." Confirming FREEZES the proposal — the
             engine does not run again, and every team shows what a hand move
             costs against the number its band set. ── -->
        <div class="mbody" x-show="fp.phase==='compare' && fp.frozen">
          <div class="cath">Move players between teams</div>
          <p class="note" style="margin:0 0 8px" x-show="fMovedCount()">
            <b x-text="fMovedCount()+' player'+(fMovedCount()===1?'':'s')+' moved by hand.'"></b>
            Every move is on screen and against the proposal — the engine is not re-running, so
            nothing you have decided gets undone.</p>
          <p class="note" style="margin:0 0 8px" x-show="!fMovedCount()">
            Drag a name from one team to another. The proposal is frozen: from here every change is
            yours, and each team shows what it costs against the number its band set.</p>

          <!-- THREE LENSES OVER ONE ROSTER, and they are sport-scoped. -->
          <div class="lens">
            <template x-for="l in fLensList()" :key="l.k">
              <button class="lb" :class="l.k===(fLens()||{}).k?'on':''"
                      @click="fSetLens(l.k)" x-text="l.t"></button>
            </template>
            <span class="c" x-text="fLensNote()"></span>
            <span class="c">three separate questions — a stretch five is a Big who is a Shooter</span>
          </div>

          <div class="cmp">
            <template x-for="col in fBoard()" :key="col.ci">
              <div class="col" :class="(col.players.length>fp.cap||col.players.length<fp.min)?'warn':''"
                   @dragover.prevent @drop.prevent="fDrop($event,col.ci)">
                <div class="colh">
                  <b x-text="fShortName(col.team)||fDivLabel(col.division_rank)"></b>
                  <div class="mt">
                    <span class="c grp" x-text="fDivLabel(col.division_rank)"></span>
                    <span class="c" x-text="col.players.length+' players'"></span>
                    <span class="c" :class="fColOff(col)?'wn':'ok'" x-text="fColVs(col)"></span>
                    <template x-if="fColRef(col)">
                      <span class="c"><span x-text="fColRef(col).label"></span>
                        <b x-text="fColRef(col).text"></b></span>
                    </template>
                    <span class="c bad" x-show="col.players.length>fp.cap">over the cap</span>
                    <span class="c wn" x-show="col.players.length && col.players.length<fp.min"
                          x-text="'under '+fp.min"></span>
                    <span class="c acc" x-show="col.moveIn||col.moveOut"
                          x-text="(col.moveIn?'+'+col.moveIn:'')
                                 +((col.moveIn&&col.moveOut)?' ':'')
                                 +(col.moveOut?'−'+col.moveOut:'')+' by hand'"></span>
                  </div>
                </div>

                <!-- the mix at a glance; every count is in the title text too -->
                <div class="zbar" :title="col.title">
                  <template x-for="z in col.slots" :key="z.k">
                    <i :style="'width:'+z.w+'%;background:'+z.c"></i>
                  </template>
                </div>

                <template x-for="z in col.slots" :key="z.k">
                  <div class="zsec" @dragover.prevent @drop.prevent.stop="fDrop($event,col.ci,z.k)">
                    <div class="zh"><i :style="'background:'+z.c"></i>
                      <span x-text="z.t" style="margin-left:0"></span>
                      <span x-text="z.n"></span></div>
                    <ul class="pl">
                      <template x-for="p in z.players" :key="p.person_id">
                        <li draggable="true" @dragstart="fDragStartPlayer($event,p.person_id)">
                          <button class="st" :class="fIsStar(col.ci,p.person_id)?'on':''"
                                  @click.stop="fToggleStar(col.ci,p.person_id)" title="star">★</button>
                          <span :class="fMoved(p.person_id)?'mvn':''"
                                x-text="(p.given_name+' '+p.family_name).replace('DEMO_','')"></span>
                          <span class="mk" x-show="fMoved(p.person_id)">MOVED</span>
                          <span class="mk" style="color:var(--ok)" x-show="p.locked">LOCKED</span>
                          <span class="mk" style="color:var(--ink3)" x-show="fCoarseNote(col.ci,p.person_id)"
                                x-text="fCoarseNote(col.ci,p.person_id)"></span>
                          <template x-for="t in fOtherAxes(col.ci,p.person_id)" :key="t">
                            <span class="ax" x-text="t"></span></template>
                          <span class="r" x-text="p.age+' · '+fVfx(p.value)"></span>
                        </li>
                      </template>
                      <li class="ph" x-show="!z.n">—</li>
                    </ul>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </div>

        <div class="mfoot">
          <button class="btn pri" x-show="fp.phase==='setup'"
                  @click="fGenerate()" :disabled="fp.busy || !fp.teams.length"
                  x-text="fp.result ? (fp.stale?'Build again':'Build again') : 'Build the rosters'"></button>
          <button class="btn" x-show="fp.phase==='setup'"
                  @click="fSavePlan()" :disabled="fp.busy">Save without building</button>
          <!-- CONFIRMING FREEZES IT. From here the engine does not run again. -->
          <button class="btn pri" x-show="fp.phase==='setup' && fp.result && !fp.stale"
                  @click="fConfirmProposal()">Confirm this proposal</button>
          <button class="btn" x-show="fp.phase==='compare'" @click="fp.phase='setup'">← Back to the plan</button>
          <button class="btn" x-show="fp.phase==='compare'" @click="fRestoreProposal()"
                  :disabled="!fMovedCount()">Restore the proposal</button>
          <button class="btn" @click="modal=''">Close</button>
          <span class="c" x-show="fp.busy">working…</span>
          <span class="note" style="margin:0;margin-left:auto" x-show="fp.err" x-text="fp.err"></span>
          <span class="note" style="margin:0;margin-left:auto"
                x-show="!fp.err && fp.phase==='setup' && fp.result && !fp.stale">
            Confirm to move players by hand. Writing the rosters and the offers is the next step.</span>
          <span class="note" style="margin:0;margin-left:auto" x-show="!fp.err && fp.phase==='compare'">
            The proposal is frozen — accepting these teams is the next step and is not wired yet.</span>
        </div>
      </div>
    </div>
  </template>

  <template x-if="modal==='clubcfg'">
    <div class="modal" @click.self="modal=''">
      <div class="box">
        <div class="mhead"><h3>Club settings</h3>
          <button class="x" @click="modal=''" title="Close">×</button></div>
        <div class="mbody">
          <p class="note" style="margin-top:0">These are this club's own conventions, not rules of
            the sport. They decide which age group a player falls in and what a coach can mark on a
            roster.</p>

          <div class="cath">Age</div>
          <div class="row2">
            <div class="field"><label class="fl">Age is reckoned at</label>
              <div class="inline" style="margin-top:0">
                <input type="number" x-model.number="cfg2.cutd" min="1" max="31" style="width:70px">
                <select x-model.number="cfg2.cutm" style="width:auto">
                  <template x-for="(mn,i) in ['January','February','March','April','May','June',
                        'July','August','September','October','November','December']" :key="mn">
                    <option :value="i+1" x-text="mn"></option></template>
                </select>
              </div></div>
            <div class="field"><label class="fl">Age groups — the “under” numbers</label>
              <input type="text" x-model="cfg2.brackets" placeholder="8*, 10, 12, 14, 16, 18, 20">
            </div>
          </div>
          <p class="note" style="margin-top:0">Put <b>*</b> after a number that is a mixed group —
            <span class="mono">8*, 10, 12…</span> gives U8 Mixed, then U10 Boys / U10 Girls and so
            on. A player is in the first group whose number is above their age.</p>

          <div class="cath">On a roster</div>
          <div class="row2">
            <div class="field"><label class="fl">Roster zones</label>
              <input type="text" x-model="cfg2.zones" placeholder="Size, Skill"></div>
            <div class="field"><label class="fl">Positions — leave empty if you do not use them</label>
              <input type="text" x-model="cfg2.positions" placeholder="Guard, Forward, Center, Utility">
            </div>
          </div>
          <p class="note" style="margin-top:0">Positions are for clubs that mark them — a pathway
            club, typically. An empty list removes the control from every roster.</p>

          <div class="inline" style="margin-top:10px">
            <button class="btn pri" @click="saveClubCfg()" :disabled="cfg2.busy">Save</button>
            <button class="btn" @click="modal=''">Cancel</button>
          </div>
          <p x-show="cfg2.err" x-text="cfg2.err" class="err"></p>
          <p x-show="cfg2.msg" x-text="cfg2.msg" class="msg"></p>
        </div>
      </div>
    </div>
  </template>

  <!-- ─────────── SEASONS (modal) ───────────
       A season carries the YEAR age is reckoned against. That year is stated by
       the club, not parsed out of the name and not an age-group band — U12 /
       U14 banding is an association's own convention and differs between them.
       A season holding anything is kept, never deleted. ── -->
  <template x-if="modal==='seasons'">
    <div class="modal" @click.self="modal=''">
      <div class="box">
        <div class="mhead"><h3>Seasons</h3>
          <span class="c" x-text="seasons.length+(seasons.length===1?' season':' seasons')"></span>
          <button class="x" @click="modal=''" title="Close">×</button></div>
        <div class="mbody">
          <p class="note" style="margin-top:0">Every trial belongs to a season, and the season's
            <b>year</b> is what age eligibility is reckoned against. It is a number the club states —
            named bands like U12 are an association's own convention and are not assumed here.</p>

          <div class="srow" style="background:#fbfaf8">
            <div class="row2">
              <div class="field"><label class="fl">Season name</label>
                <input type="text" x-model="newSeason.name" placeholder="e.g. Winter 2027"></div>
              <div class="field"><label class="fl">Year age is reckoned against</label>
                <input type="number" x-model.number="newSeason.year" min="1900" max="2200"></div>
            </div>
            <div class="row2">
              <div class="field"><label class="fl">Starts (optional)</label>
                <input type="date" x-model="newSeason.starts"></div>
              <div class="field"><label class="fl">Ends (optional)</label>
                <input type="date" x-model="newSeason.ends" :min="newSeason.starts"></div>
            </div>
            <label class="fl"><input type="checkbox" x-model="newSeason.current"
                   style="width:auto;margin-right:6px">Make this the current season</label>
            <div class="inline">
              <button class="btn pri" @click="createSeason()"
                      :disabled="!newSeason.name.trim() || !newSeason.year || busy">Add season</button>
            </div>
            <p x-show="seasonErr" x-text="seasonErr" class="err"></p>
          </div>

          <table class="jt" x-show="seasonRows.length" style="margin-top:10px">
            <thead><tr><th>Season</th><th style="width:60px">Year</th>
              <th style="width:70px">Trials</th><th style="width:80px">Confirmed</th>
              <th style="width:70px">Players</th><th style="width:150px"></th></tr></thead>
            <tbody>
              <template x-for="r in seasonRows" :key="r.id">
                <tr>
                  <td><b x-text="r.name"></b>
                      <span class="c ok" x-show="r.is_current">current</span></td>
                  <td x-text="r.year"></td>
                  <td x-text="r.sessions"></td>
                  <td x-text="r.confirmed_sessions"></td>
                  <td x-text="r.players"></td>
                  <td>
                    <button class="btn sm" x-show="!r.is_current"
                            @click="makeCurrent(r)">Make current</button>
                    <button class="btn sm" @click="deleteSeason(r)"
                            :disabled="r.sessions+r.teams+r.players+r.offers>0">Delete</button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
          <p class="note">A season holding a trial, a team, a player record or an offer is
            <b>kept</b>. Deleting it would take the year's evaluations with it.</p>
        </div>
      </div>
    </div>
  </template>

  <!-- ─────────── RUBRICS (modal) ─────────── -->
  <template x-if="modal==='rubrics'">
    <div class="modal" @click.self="modal=''">
      <div class="box">
        <div class="mhead"><h3>Rubrics</h3>
          <span class="c">locked · scale 1–5</span>
          <button class="x" @click="modal=''" title="Close">×</button></div>
        <div class="mbody">
          <p class="note" style="margin-top:0">Identical for every club in the sport. Every club
            completes <b>Core</b>. <b>Extended</b> is for clubs that can do more, and its measures
            roll up into Core so both depths stay comparable.</p>
          <template x-for="r in rubrics" :key="r.id">
            <div class="rgrp">
              <div class="cath"><span x-text="r.name"></span>
                <b x-text="measuresOf(r.id).length+' measures'"></b></div>
              <div class="chips">
                <template x-for="m in measuresOf(r.id)" :key="m.id">
                  <span class="c" :class="r.level==='core' ? 'grp' : (m.rolls_up_to ? 'acc' : '')"
                        :title="m.rolls_up_to ? 'rolls up to '+labelOf(m.rolls_up_to)
                                : (r.level==='extended' ? 'extended signal only' : '')"
                        x-text="m.label"></span>
                </template>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>
  </template>


  <!-- ─────────── RATE (modal) ─────────── -->
  <template x-if="modal==='rate'">
    <div class="modal" @click.self="modal=''">
      <div class="box">
        <div class="mhead"><h3>Rate players</h3>
          <span class="c" x-text="rate.session?.name"></span>
          <span class="c grp" x-text="rubricName(rate.session?.rubric_id)"></span>
          <button class="x" @click="modal=''" title="Close">×</button></div>
        <div class="mbody">
          <template x-if="!rate.authorised">
            <p class="warnbar" style="border-radius:8px;border:1px solid var(--warnline)">
              You are not authorised to rate in this session. Authorisation is explicit and per
              session — add yourself under <b>Authorised raters</b> first.</p>
          </template>

          <template x-if="rate.authorised">
          <div class="split">
            <div>
              <div class="cath">Players <b x-text="activePeople().length"></b></div>
              <div class="plist">
                <template x-for="p in activePeople()" :key="p.id">
                  <div class="pitem" :class="rate.person?.id===p.id?'on':''" @click="pickPlayer(p)">
                    <span x-text="p.given_name+' '+p.family_name"></span>
                    <span class="st" x-text="rate.done[p.id] ? '✓ rated' : ''"></span>
                  </div>
                </template>
              </div>
            </div>

            <div>
              <template x-if="!rate.person">
                <div class="empty">Choose a player to start.</div>
              </template>
              <template x-if="rate.person">
              <div>
                <div class="cath">
                  <span x-text="rate.person.given_name+' '+rate.person.family_name"></span>
                  <b x-text="Object.keys(rate.scores).length+' of '+rateMeasures().length+' scored'"></b>
                </div>
                <template x-for="m in rateMeasures()" :key="m.id">
                  <div class="mrow">
                    <span class="lb" x-text="m.label"></span>
                    <div class="scale">
                      <template x-for="v in scaleOf(m)" :key="v">
                        <button class="sv" :class="rate.scores[m.id]===v?'on':''"
                                @click="rate.scores[m.id]=v" x-text="v"></button>
                      </template>
                    </div>
                  </div>
                </template>
                <div class="field" style="margin-top:10px">
                  <label class="fl">Note (optional)</label>
                  <input type="text" x-model="rate.note" placeholder="anything worth recording">
                </div>
                <div class="inline" style="margin-top:0">
                  <button class="btn pri" @click="saveRating()"
                          :disabled="!Object.keys(rate.scores).length||busy">Save rating</button>
                  <button class="btn" @click="rate.scores={};rate.note=''">Clear</button>
                </div>
                <p class="note">Saved ratings cannot be edited. A correction is recorded as a
                  resolution by the head coach, never by changing the original.</p>
                <p x-show="rate.err" x-text="rate.err" class="err"></p>
                <p x-show="rate.msg" x-text="rate.msg" class="msg"></p>
              </div>
              </template>
            </div>
          </div>
          </template>
        </div>
      </div>
    </div>
  </template>

  <!-- ─────────── REVIEW & CONFIRM (modal) ─────────── -->
  <template x-if="modal==='review'">
    <div class="modal" @click.self="modal=''">
      <div class="box">
        <div class="mhead"><h3>Review &amp; confirm</h3>
          <span class="c" x-text="review.session?.name"></span>
          <span class="c" :class="review.session?.status==='confirmed'?'ok':'grp'"
                x-text="review.session?.status"></span>
          <button class="x" @click="modal=''" title="Close">×</button></div>
        <div class="mbody">
          <div class="statrow" style="border:1px solid var(--line);border-radius:8px;margin-bottom:12px">
            <div><b x-text="review.rows.filter(r=>r.coverage==='complete').length"></b>complete</div>
            <div><b x-text="review.rows.filter(r=>r.coverage==='partial').length"></b>partial</div>
            <div><b x-text="review.rows.filter(r=>r.coverage==='not rated').length"></b>not rated</div>
            <div><b x-text="flagged().length"></b>to look at</div>
            <div><b x-text="sessionMean()"></b>session mean</div>
          </div>

          <div class="cath">Coverage and disagreement
            <b x-text="'threshold '+review.threshold"></b></div>
          <p class="note" style="margin-top:0">Rows are highlighted where two raters differ by more
            than the threshold. Confirming with gaps is allowed and recorded.</p>
          <div class="scroll" style="max-height:320px">
            <table class="jt">
              <thead><tr><th>Player</th><th style="width:66px">Rating</th>
                <th style="width:90px">Coverage</th>
                <th style="width:70px">Scored</th><th style="width:70px">Raters</th>
                <th style="width:74px">Spread</th><th style="width:64px"></th></tr></thead>
              <tbody>
                <template x-for="r in review.rows" :key="r.person_id">
                  <tr :class="r.worst_spread > review.threshold ? 'flag' : ''">
                    <td x-text="r.given_name+' '+r.family_name"></td>
                    <td><b x-text="meanOf(r.person_id)"></b></td>
                    <td><span class="c" :class="r.coverage==='complete'?'ok':
                          (r.coverage==='partial'?'wn':'')" x-text="r.coverage"></span></td>
                    <td x-text="r.measures_scored+'/'+r.measure_count"></td>
                    <td x-text="r.assessment_count"></td>
                    <td x-text="r.worst_spread || ''"></td>
                    <td><button class="btn sm" x-show="r.measures_scored"
                          @click="openPlayer(r.person_id)">Detail</button></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>

          <div class="cath">Confirm</div>
          <template x-if="review.session?.status==='confirmed'">
            <p class="okbar" style="border-radius:8px;border:1px solid var(--okline)">
              Confirmed. The formation engine can now use this session — and it cannot be reopened.</p>
          </template>
          <template x-if="review.session?.status!=='confirmed'">
            <div>
              <p class="note" style="margin-top:0">Confirming closes the session as a whole and is
                recorded against your name. Only a head coach or club admin can do it.</p>
              <button class="btn pri" @click="confirmSession()"
                :disabled="busy || !['head_coach','club_admin'].includes(me?.role)">
                Confirm this session</button>
              <p x-show="!['head_coach','club_admin'].includes(me?.role)" class="note">
                Your role is <b x-text="me?.role"></b>, so you cannot confirm.</p>
              <p x-show="review.err" x-text="review.err" class="err"></p>
            </div>
          </template>
        </div>
      </div>
    </div>
  </template>

  <!-- ─────────── PLAYER (modal) ─────────── -->
  <!-- Layered above Review, because it is summoned FROM Review and Review is still
       the thing you are doing. Escape or the × returns you to it, in place. -->

  <!-- ─────────── MORE (modal) ─────────── -->
  <template x-if="modal==='more'">
    <div class="modal" @click.self="modal=''">
      <div class="box sm">
        <div class="mhead"><h3>More</h3>
          <button class="x" @click="modal=''" title="Close">×</button></div>
        <div class="mbody">
          <div class="cath">This session</div>
          <dl class="kv">
            <dt>Signed in as</dt><dd x-text="userEmail"></dd>
            <dt>User id</dt><dd x-text="userId"></dd>
            <template x-if="org">
              <span style="display:contents">
                <dt>Organisation</dt><dd x-text="org.name"></dd>
                <dt>Organisation id</dt><dd x-text="org.id"></dd>
                <dt>Edition</dt><dd x-text="org.edition"></dd>
              </span>
            </template>
            <dt>Database</dt><dd x-text="cfg.url"></dd>
          </dl>

          <div class="cath">Tenant isolation</div>
          <p class="note" style="margin-top:0">Every count comes from an unfiltered query — there is
            no <code>where org_id</code> anywhere in this app. The database returns only your
            organisation's rows.</p>
          <div class="statrow" style="border:1px solid var(--line);border-radius:8px">
            <div><b x-text="orgs.length"></b>organisations</div>
            <div><b x-text="people.length"></b>players</div>
            <div><b x-text="members.length"></b>members</div>
            <div><b x-text="measures.length"></b>rubric measures</div>
          </div>

          <div class="cath">Actions</div>
          <div class="inline" style="margin-top:0">
            <button class="btn" @click="load();modal=''">Reload data</button>
            <button class="btn" @click="resetCfg()">Change database</button>
            <button class="btn" @click="signOut()">Sign out</button>
          </div>
          <p class="note">v0.1 · foundation. Rating capture, the formation engine and imports are
            the next increments.</p>
        </div>
      </div>
    </div>
  </template>

</div>
</template>

</div>

<script>
function app(){ return {
  screen:'setup', cfg:{url:'',key:''}, sb:null,
  email:'', msg:'', err:'', busy:false,
  userId:'', userEmail:'',
  orgs:[], org:null, me:null, members:[], people:[], measures:[], rubrics:[], sessions:[],
  allSessions:[],
  pf:{q:'',show:'active',gender:'',age:null,year:new Date().getFullYear()},
  teams:[], teamSeasons:[], roster:[], pool:[], clubCfg:null,
  cfg2:{cutd:31,cutm:12,brackets:'',zones:'',positions:'',busy:false,err:'',msg:''},
  tm:{selected:'',adding:false,name:'',grp:'',div:'',q:'',scope:'grp',hidePlaced:true,
      drag:null,over:false,busy:false,err:''},
  qv:{open:false,note:'',busy:false,err:''},
  pe:{id:null,given:'',family:'',dob:'',gender:'',ref:'',status:'active',
      verification:'unverified',vsource:'',vnote:'',
      dupes:[],delConfirm:false,err:'',busy:false},
  sel:null, blocks:[], auths:[], blockErr:'', modal:'', delConfirm:'', delErr:'', peopleErr:'', statusErr:'',
  authErr:'',
  rate:{session:null,authorised:false,person:null,scores:{},note:'',done:{},err:'',msg:''},
  review:{session:null,rows:[],threshold:2,err:'',scores:{}},
  pm:{personId:'',mode:'profile',editing:false,adding:false,returnTo:'',name:'',sessionName:'',mean:'',coverage:'',
      detail:[],history:[],resolutions:[],err:''},
  rz:{measure_id:'',source:'',adopted:null,score:null,rationale:'',err:'',busy:false},
  stage:'admin', queueRows:[], onlyWaiting:false,
  fm:{plan:'Gold 8, Navy 8, White 8', busy:false, err:'', result:null, sessionId:''},
  court:{sessions:[],session:null,people:[],measures:[],rated:{},person:null,
         scores:{},note:'',err:'',msg:''},
  queue:[], rejected:[], syncing:false, online:true,
  newSession:{open:false,name:'',opens:'',closes:'',rubric_id:''},
  seasons:[], seasonRows:[], seasonId:'', seasonErr:'',
  newSeason:{name:'',year:new Date().getFullYear(),starts:'',ends:'',current:false},
  newBlock:{date:'',start:'18:00',end:'20:00',venue:''},
  newAuth:{membership_id:''},

  async boot(){
    const saved = localStorage.getItem('platform.cfg');
    if(!saved){ this.screen='setup'; return; }
    this.cfg = JSON.parse(saved);
    this.connect();
    const {data:{session}} = await this.sb.auth.getSession();
    if(session){ await this.afterLogin(session); } else { this.screen='signin'; }
    this.sb.auth.onAuthStateChange(async (_e,s)=>{ if(s) await this.afterLogin(s); });
  },

  connect(){ this.sb = window.supabase.createClient(this.cfg.url, this.cfg.key); },

  saveCfg(){
    this.err='';
    try{
      if(!/^https:\/\/.+\.supabase\.co\/?$/.test(this.cfg.url.trim()))
        throw new Error('That does not look like a Supabase project URL.');
      this.cfg.url = this.cfg.url.trim().replace(/\/$/,'');
      this.cfg.key = this.cfg.key.trim();
      if(this.cfg.key.includes('service_role'))
        throw new Error('That looks like the service_role key. Use the anon public key.');
      localStorage.setItem('platform.cfg', JSON.stringify(this.cfg));
      this.connect(); this.screen='signin';
    }catch(e){ this.err = e.message; }
  },

  resetCfg(){ localStorage.removeItem('platform.cfg'); location.reload(); },

  async signIn(){
    this.busy=true; this.err=''; this.msg='';
    const {error} = await this.sb.auth.signInWithOtp({
      email:this.email, options:{ emailRedirectTo: window.location.href.split('#')[0] }
    });
    this.busy=false;
    if(error){ this.err = error.message; }
    else { this.msg = 'Check your email — the link signs you straight in.'; }
  },

  async signOut(){ await this.sb.auth.signOut(); location.reload(); },

  async afterLogin(session){
    this.userId = session.user.id; this.userEmail = session.user.email;
    this.screen='app';
    this.loadQueue(); this.loadRejected();
    this.online = navigator.onLine !== false;
    addEventListener('online',  () => { this.online = true;  this.flushQueue(); });
    addEventListener('offline', () => { this.online = false; });
    await this.load();
    this.flushQueue();
  },

  async load(){
    this.err=''; this.authErr=''; this.blockErr='';
    const q = async (t,sel='*',order=null)=>{
      let r = this.sb.from(t).select(sel);
      if(order) r = r.order(order);
      const {data,error} = await r;
      if(error){ this.err = t+': '+error.message; return []; }
      return data||[];
    };
    this.orgs     = await q('organisation');
    this.org      = this.orgs[0] || null;
    this.members  = await q('membership');
    this.me       = this.members.find(m=>m.user_id===this.userId) || null;
    // the directory view, not the bare table: it carries the verification
    // evidence and how many confirmed sessions each player already has
    this.people   = await q('v_person_directory','*','family_name');
    this.rubrics  = (await q('rubric','*','level')).filter(r=>r.org_id===null);
    this.measures = await q('rubric_measure','*','sort_order');
    if(!this.newSession.rubric_id){
      const core = this.rubrics.find(r=>r.level==='core');
      this.newSession.rubric_id = (core||this.rubrics[0])?.id || '';
    }
    // The season is the scope everything below reads through. A club with no
    // season cannot create a trial at all — the database refuses it — so the
    // stage says so rather than failing on the button.
    this.seasons    = await q('season','*','year');
    this.seasonRows = await q('v_season_summary','*','year');
    if(!this.seasons.find(s => s.id === this.seasonId)){
      this.seasonId = (this.seasons.find(s => s.is_current) || this.seasons[0] || {}).id || '';
    }
    const all = await q('rating_session','*','opens_at');
    this.allSessions = all;
    this.sessions = this.seasonId ? all.filter(s => s.season_id === this.seasonId) : all;
    // The player directory reckons age against the season's own year.
    const cur = this.seasons.find(s => s.id === this.seasonId);
    if(cur && cur.year) this.pf.year = cur.year;
    await this.loadSessionQueue();
  },

  // ── seasons ─────────────────────────────────────────────────────────────
  seasonOptionLabel(s){
    const n = this.allSessions.filter(x => x.season_id === s.id).length;
    return s.name
         + (n ? ' · ' + n + (n===1 ? ' trial' : ' trials') : ' · empty')
         + (s.is_current ? ' · current' : '');
  },
  elsewhereSeasons(){
    return this.seasons.filter(s =>
      s.id !== this.seasonId && this.allSessions.some(x => x.season_id === s.id));
  },
  seasonName(id){ return this.seasons.find(s => s.id === id)?.name || '(no season)'; },
  seasonYear(id){ return this.seasons.find(s => s.id === id)?.year || null; },
  onSeasonChange(){
    this.sel = null; this.onlyWaiting = false;
    this.sessions = this.allSessions.filter(s => s.season_id === this.seasonId);
    const y = this.seasonYear(this.seasonId);
    if(y) this.pf.year = y;
  },
  async createSeason(){
    this.seasonErr=''; this.busy=true;
    const {error} = await this.sb.from('season').insert({
      org_id:this.org.id,
      name:this.newSeason.name.trim(),
      year:Number(this.newSeason.year),
      starts_on:this.newSeason.starts || null,
      ends_on:this.newSeason.ends || null,
      is_current:!!this.newSeason.current
    });
    this.busy=false;
    if(error){
      this.seasonErr = /season_name_uq/.test(error.message)
        ? 'There is already a season with that name in this club.' : error.message;
      return;
    }
    this.newSeason={name:'',year:new Date().getFullYear(),starts:'',ends:'',current:false};
    await this.load();
  },
  async makeCurrent(r){
    this.seasonErr='';
    // The trigger stands the previous one down, so this is one write, not two.
    const {error} = await this.sb.from('season').update({is_current:true}).eq('id', r.id);
    if(error){ this.seasonErr=error.message; return; }
    this.seasonId = r.id;
    await this.load();
  },
  async deleteSeason(r){
    this.seasonErr='';
    const {error} = await this.sb.from('season').delete().eq('id', r.id);
    if(error){ this.seasonErr = error.message; return; }
    await this.load();
  },

  // ══════════════════════ TEAMS ══════════════════════
  // The team NAME is club-level; what is edited here is its roster for the
  // SELECTED SEASON. A player sits in one team per age group and may be placed
  // in as many age groups as the club wants — that is the fill-in case.
  async openTeams(){
    this.stage='teams'; this.tm.err='';
    await this.loadTeams();
  },
  async loadTeams(){
    if(!this.org) return;
    const q = async (t, sel='*', filt=null) => {
      let r = this.sb.from(t).select(sel);
      if(filt) r = r.eq(filt[0], filt[1]);
      const {data,error} = await r;
      if(error){ this.tm.err = t+': '+error.message; return []; }
      return data||[];
    };
    this.teams       = await q('team');
    this.clubCfg     = (await q('org_profile'))[0] || null;
    this.teamSeasons = this.seasonId
      ? (await q('team_season','*',['season_id',this.seasonId])).map(ts => ({
          ...ts, team_name: (this.teams.find(t=>t.id===ts.team_id)||{}).name || '(unnamed)' }))
      : [];
    this.roster = this.seasonId ? await q('v_roster','*',['season_id',this.seasonId]) : [];
    this.pool   = this.seasonId ? await q('v_player_pool','*',['season_id',this.seasonId]) : [];
    if(!this.teamSeasons.find(ts=>ts.id===this.tm.selected)){
      this.tm.selected = (this.teamSeasons[0]||{}).id || '';
    }
  },

  // ── club settings ──────────────────────────────────────────────────────
  openClubCfg(){
    const c = this.clubCfg || {};
    this.cfg2 = {
      cutd: c.age_cutoff?.d ?? 31,
      cutm: c.age_cutoff?.m ?? 12,
      brackets: (c.age_brackets || []).map(b => b.u + (b.mixed ? '*' : '')).join(', '),
      zones: (c.roster_zones || []).join(', '),
      positions: (c.positions || []).join(', '),
      busy:false, err:'', msg:''};
  },
  async saveClubCfg(){
    this.cfg2.err=''; this.cfg2.msg=''; this.cfg2.busy=true;
    const brackets = this.cfg2.brackets.split(',').map(x=>x.trim()).filter(Boolean)
      .map(x => ({u: parseInt(x,10), mixed: x.includes('*')}))
      .filter(b => !isNaN(b.u)).sort((a,b)=>a.u-b.u);
    const list = s => s.split(',').map(x=>x.trim()).filter(Boolean);
    const {error} = await this.sb.from('org_profile').update({
      age_cutoff: {d:Number(this.cfg2.cutd), m:Number(this.cfg2.cutm)},
      age_brackets: brackets,
      roster_zones: list(this.cfg2.zones),
      positions: list(this.cfg2.positions)
    }).eq('org_id', this.org.id);
    this.cfg2.busy=false;
    if(error){ this.cfg2.err = error.message; return; }
    this.cfg2.msg = 'Saved. Age groups are recomputed from this for every player.';
    await this.loadTeams();
  },

  zones(){ return this.clubCfg?.roster_zones || []; },
  positions(){ return this.clubCfg?.positions || []; },
  selTeam(){ return this.teamSeasons.find(ts=>ts.id===this.tm.selected) || null; },
  rosterOf(tsId){
    return this.roster.filter(r=>r.team_season_id===tsId)
      .sort((a,b)=> (b.rating||0)-(a.rating||0)
        || (a.family_name+a.given_name).localeCompare(b.family_name+b.given_name));
  },
  rosterAvg(tsId){
    const v = this.rosterOf(tsId).map(r=>Number(r.rating)).filter(n=>!isNaN(n));
    return v.length ? (v.reduce((a,b)=>a+b,0)/v.length).toFixed(2) : '';
  },

  // ══ FORMATION ══════════════════════════════════════════════════════════════
  //  The club moves LINES on the cohort's distribution; a team's target is read
  //  off the band they cut. That is the whole of ADR-007: a number typed at a
  //  cohort can be unreachable, a number read off it never is.
  fp:{group:'', basis:'rating', teams:[], cuts:[], cap:10, min:8, lock:true,
      newdiv:1, err:'', busy:false, saved:'', plans:[], scoring:[], drag:null,
      phase:'setup', result:null,
      naming:false, names:{}, pattern:'Div {n}', namesErr:'', gender:'', stale:false,
      lenses:[], lens:'', marks:{}, stars:{}, assign:{}, frozen:null, by:{}, moves:{}},

  async openFormation(){
    this.stage='formation'; this.fp.err='';
    await this.loadFormation();
  },
  async loadFormation(){
    if(!this.org || !this.seasonId) return;
    const q = async (t, filt) => {
      let r = this.sb.from(t).select('*');
      if(filt) r = r.eq(filt[0], filt[1]);
      const {data,error} = await r;
      if(error){ this.fp.err = t+': '+error.message; return []; }
      return data||[];
    };
    this.clubCfg  = (await q('org_profile'))[0] || this.clubCfg;
    this.teams    = await q('team');
    this.teamSeasons = (await q('team_season',['season_id',this.seasonId])).map(ts => ({
      ...ts, team_name:(this.teams.find(t=>t.id===ts.team_id)||{}).name || '(unnamed)' }));
    this.pool     = await q('v_player_pool',['season_id',this.seasonId]);
    this.fp.plans = await q('formation_plan',['season_id',this.seasonId]);
    //  THE LENSES BELONG TO THE SPORT — defined once, read by every club,
    //  authored by no tenant. The club's sport is on the organisation; if it is
    //  not set, take whichever sport actually declares lenses rather than naming
    //  one here.
    const sports = await q('sport');
    const mine = sports.find(x=>x.id===this.org?.primary_sport_id);
    this.fp.lenses = ((mine&&mine.lenses&&mine.lenses.length ? mine
                       : sports.find(x=>x.lenses&&x.lenses.length)) || {}).lenses || [];
    if(!this.fp.lens) this.fp.lens=(this.fLensList()[0]||{}).k||'';
    //  Scoring is LAST season's, so take the most recent record per player from
    //  any season earlier than this one.
    const year = (this.seasons.find(s=>s.id===this.seasonId)||{}).year;
    const rows = await q('v_player_scoring');
    const best = {};
    rows.filter(r => year==null || r.year < year)
        .forEach(r => { const b=best[r.person_id];
          if(!b || (r.year||0) > (b.year||0)) best[r.person_id]=r; });
    this.fp.scoring = Object.values(best);
  },

  // ── the club's own numbers, never constants in here ──────────────────────
  fCfg(){ const c=this.clubCfg||{};
    return {growth:+c.age_growth||1.34, step:+c.age_step||0.15, div:+c.age_div||2,
            compound:c.age_shift_compound!==false, cap:+c.squad_cap_default||10}; },

  fByAge(a,b){ return (parseInt(String(a).replace(/\D/g,''))||999)
                    - (parseInt(String(b).replace(/\D/g,''))||999); },
  fAllGroups(){
    return [...new Set(this.pool.filter(p=>p.age_group).map(p=>p.age_group))]
      .sort((a,b)=>this.fByAge(a,b));
  },
  //  A band's gender is whatever the club's own bracket rule put on the end of
  //  its name — "U14 Boys", "U8 Mixed". Read off the groups that exist rather
  //  than named here, because the words are the club's, not the platform's.
  fGenderOf(g){ const w=String(g||'').trim().split(/\s+/); return w.length>1?w[w.length-1]:''; },
  //  Sorted, not in the order the age groups happen to fall — otherwise the
  //  chips reorder themselves the day a club registers a younger cohort.
  fGenders(){
    return [...new Set(this.fAllGroups().map(g=>this.fGenderOf(g)).filter(Boolean))]
      .sort((a,b)=>a.localeCompare(b));
  },
  fGroups(){
    const gs=this.fAllGroups(), all=this.fGenders();
    if(!all.length) return gs;
    const pick = all.includes(this.fp.gender) ? this.fp.gender : all[0];
    if(this.fp.gender!==pick) this.fp.gender=pick;
    return gs.filter(g=>this.fGenderOf(g)===pick);
  },
  fPoolOf(g){ return this.pool.filter(p=>p.age_group===g); },
  fPool(){ return this.fPoolOf(this.fp.group); },
  fMean(a){ const v=a.filter(x=>x!=null); return v.length? v.reduce((x,y)=>x+ +y,0)/v.length : 0; },
  f2(v){ return (Math.round((v||0)*100)/100).toFixed(2); },

  //  A scoring record is a YEAR OLD. Same age group next season means a year's
  //  growth; a band up means older opposition. The club decides whether a mover
  //  gets both — see org_profile.age_shift_compound.
  fPpg(p){
    const r = this.fp.scoring.find(s=>s.person_id===p.person_id);
    if(!r || r.ppg==null) return null;
