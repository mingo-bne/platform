               what a head coach does to a rating session, and it cannot be undone.
               Nothing on this surface writes anything; Accept does. -->
          <div class="cath">Draft board — move players between teams</div>
          <!-- Says what it is and what it is not. A board kept in the page is
               not a saved board, and a screen that implied it was would cost
               somebody a whole afternoon exactly once. -->
          <p class="warnbar" style="margin:0 0 8px;border-radius:8px;border:1px solid var(--warnline)"
             x-show="fp.resumed">
            Picked up where you left it. This board is held on this page only — it survives leaving
            Formation, but <b>not a reload</b>. Accept when you are done with it.</p>
          <p class="note" style="margin:0 0 8px" x-show="fMovedCount()">
            <b x-text="fMovedCount()+' player'+(fMovedCount()===1?'':'s')+' moved by hand.'"></b>
            Every move is on screen and against the proposal — the engine is not re-running, so
            nothing you have decided gets undone.</p>
          <p class="note" style="margin:0 0 8px" x-show="!fMovedCount()">
            Drag a name from one team to another. The engine's proposal is frozen and it is not
            running again: from here every change is yours, and each team shows what it costs
            against the number its band set. <b>Nothing here is written</b> until you accept.</p>

          <!-- THREE LENSES OVER ONE ROSTER, and they are sport-scoped. -->
          <div class="lens">
            <template x-for="l in fLensList()" :key="l.k">
              <button class="lb" :class="l.k===(fLens()||{}).k?'on':''"
                      @click="fSetLens(l.k)" x-text="l.t"></button>
            </template>
            <span class="c" x-text="fLensNote()"></span>
            <span class="c">three separate questions — a stretch five is a Big who is a Shooter</span>
          </div>

          <div class="cmp">
            <template x-for="col in fBoard()" :key="col.ci">
              <!-- Only OVER the cap is flagged. Ming, 19 Aug 2026: "I don't want
                   under 8 shown for team less than 8 players, player count shown
                   is already enough." And the border follows the chip — a warn
                   border with no chip beside it would be colour alone. -->
              <div class="col" :class="col.players.length>fp.cap?'warn':''"
                   @dragover.prevent @drop.prevent="fDrop($event,col.ci)">
                <div class="colh">
                  <!-- THE COLUMN IS "Team 1" UNTIL IT IS LINKED. The label is
                       the band's position, not a name; the name arrives only when
                       the club points this column at a team that exists in this
                       season and age group. -->
                  <b x-text="col.ref_team ? col.ref_team.team_name : fSqLabel(col.ci)"></b>
                  <div class="mt">
                    <span class="c grp" x-text="fDivLabel(col.division_rank)"></span>
                    <span class="c" x-text="col.players.length+' players'"></span>
                    <span class="c" :class="fColOff(col)?'wn':'ok'" x-text="fColVs(col)"></span>
                    <span class="c" x-show="col.ref"><span x-text="col.ref?.label"></span>
                      <b x-text="col.ref?.text"></b></span>
                    <span class="c bad" x-show="col.players.length>fp.cap">over the cap</span>
                    <span class="c acc" x-show="col.moveIn||col.moveOut"
                          x-text="(col.moveIn?'+'+col.moveIn:'')
                                 +((col.moveIn&&col.moveOut)?' ':'')
                                 +(col.moveOut?'−'+col.moveOut:'')+' by hand'"></span>
                  </div>

                  <!-- ── LINK THIS BAND TO A TEAM ── only teams already entered
                       in this season and age group are offered. Nothing is
                       remembered from last season and nothing is inferred. -->
                  <div class="asg" style="margin-top:6px">
                    <select @change="fLinkTo(col.ci, $event.target.value)">
                      <option value="" :selected="!col.ref_team">— link a team —</option>
                      <template x-for="t in fLinkable(col.ci)" :key="t.id">
                        <option :value="t.id" :disabled="t.used"
                                :selected="col.ref_team && col.ref_team.id===t.id"
                                x-text="t.name+(t.div?' · '+t.div:'')+(t.used?' — already linked':'')"></option>
                      </template>
                    </select>
                    <button class="lnk" style="margin-top:4px"
                            @click="fNewTeamOpen(col.ci)">or create a new team…</button>
                  </div>

                  <!-- creating one, without leaving the draft -->
                  <template x-if="fNewTeamOpenOn(col.ci)">
                    <div class="srow" style="margin-top:6px;padding:8px">
                      <div class="field" style="margin-bottom:6px">
                        <label class="fl">Team name</label>
                        <!-- the club's own names, offered as you type — the same
                             autocomplete the Teams stage has -->
                        <input type="text" x-model="fp.nt.name" placeholder="e.g. Northside Yellow"
                               list="teamNamesF"></div>
                      <datalist id="teamNamesF">
                        <template x-for="t in teams" :key="t.id"><option :value="t.name"></option></template>
                      </datalist>
                      <div class="field" style="margin-bottom:6px">
                        <label class="fl">Division
                          <span style="color:var(--ink3);font-weight:400">— optional</span></label>
                        <input type="text" x-model="fp.nt.div"
                               :placeholder="fDivLabel(col.division_rank)"></div>
                      <p class="note" style="margin:0 0 6px" x-show="fNewTeamTidy()
                            && fNewTeamTidy()!==(fp.nt.name||'').trim()">
                        Will be recorded as <b x-text="fNewTeamTidy()"></b>.</p>
                      <p class="note" style="margin:0 0 6px" x-show="fNtProposed()">
                        Many clubs put the age group in front of the name.
                        <button class="lnk" @click="fNtUsePrefix()">Enter it as
                          <b x-text="fNtProposed()"></b></button>
                      </p>
                      <p class="note" style="margin:0 0 6px"
                         x-text="'It is entered in '+fp.group+', '+seasonName(seasonId)
                                 +' — the same as creating it on the Teams stage.'"></p>
                      <div class="stop" x-show="fp.nt.err" style="margin-bottom:6px">
                        <b x-text="fp.nt.err"></b></div>
                      <div class="inline" style="margin:0">
                        <button class="btn sm pri" @click="fNewTeamSave()"
                                :disabled="!fp.nt.name.trim() || fp.nt.busy">Create and link</button>
                        <button class="btn sm" @click="fNewTeamClose()">Cancel</button>
                      </div>
                    </div>
                  </template>
                </div>

                <!-- THE RATING SHAPE, as in the TMS. Solid is this team; dashed
                     is the age group's own profile. Redrawn after a hand move,
                     so the picture and the roster never disagree. Every value is
                     written out beneath — nothing here is colour alone. -->
                <div class="cshape" x-show="col.players.length && (fp.result?.categories||[]).length">
                  <!-- x-if, not x-show: the shape must LEAVE the page rather than
                       be hidden, so nothing can read a stale one. -->
                  <template x-if="!fHasCat(col.players)">
                    <p class="note" style="margin:2px 0">The rating shape needs the per-measure
                      scores, and this proposal did not carry them. <b>Build again</b> and it will
                      draw.</p>
                  </template>
                  <template x-if="fHasCat(col.players)">
                  <div>
                  <div class="csvg" x-html="fRadar(col.players)"></div>
                  <div class="cskey">
                    <span class="lg"><i class="fill"></i>this team</span>
                    <span class="lg"><i class="dash"></i><span x-text="fp.group"></span> average</span>
                    <template x-for="c in fColShape(col)" :key="c.i">
                      <span class="cv" :class="c.dev<-0.35?'lo':''">
                        <span x-text="c.label"></span><b x-text="f2(c.got)"></b>
                        <i x-text="(c.dev>=0?'+':'−')+f2(Math.abs(c.dev))"></i></span>
                    </template>
                  </div>
                  </div>
                  </template>
                </div>

                <!-- the mix at a glance; every count is in the title text too -->
                <div class="zbar" :title="col.title">
                  <template x-for="z in col.slots" :key="z.k">
                    <i :style="'width:'+z.w+'%;background:'+z.c"></i>
                  </template>
                </div>

                <template x-for="z in col.slots" :key="z.k">
                  <div class="zsec" @dragover.prevent @drop.prevent.stop="fDrop($event,col.ci,z.k)">
                    <div class="zh"><i :style="'background:'+z.c"></i>
                      <span x-text="z.t" style="margin-left:0"></span>
                      <span x-text="z.n"></span></div>
                    <ul class="pl">
                      <template x-for="p in z.players" :key="p.person_id">
                        <li draggable="true" @dragstart="fDragStartPlayer($event,p.person_id)">
                          <button class="st" :class="fIsStar(col.ci,p.person_id)?'on':''"
                                  @click.stop="fToggleStar(col.ci,p.person_id)" title="star">★</button>
                          <span :class="fMoved(p.person_id)?'mvn':''"
                                x-text="(p.given_name+' '+p.family_name).replace('DEMO_','')"></span>
                          <span class="mk" x-show="fMoved(p.person_id)">MOVED</span>
                          <span class="mk" style="color:var(--ok)" x-show="p.locked">LOCKED</span>
                          <span class="mk" style="color:var(--acc)" x-show="p.from_rating">BY RATING</span>
                          <span class="mk" style="color:var(--ink3)" x-show="fCoarseNote(col.ci,p.person_id)"
                                x-text="fCoarseNote(col.ci,p.person_id)"></span>
                          <template x-for="t in fOtherAxes(col.ci,p.person_id)" :key="t">
                            <span class="ax" x-text="t"></span></template>
                          <span class="r" x-text="p.age+' · '+fVfx(p.value)"></span>
                        </li>
                      </template>
                      <li class="ph" x-show="!z.n">—</li>
                    </ul>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </div>

        <!-- ══ ACCEPTING ═══════════════════════════════════════════════════
             The only step in Formation that writes anything about a child, so
             it says what it is about to do before it does it, and what it
             cannot do and why. The database refuses all of the same things —
             this is that answer EARLY, so a club fixes them in one pass. -->
        <div class="mbody" x-show="fp.phase==='accept'">
          <div class="cath">What accepting writes</div>
          <p class="note" style="margin-top:0">
            <b x-text="fAcceptRows().length + ' teams'"></b> entered in
            <b x-text="seasonName(seasonId)"></b>, <b x-text="fAcceptCount()"></b> players on their
            rosters, and a place offered to each of them. Families answer the offer; a decline takes
            that player off the roster and leaves them training with the club.
            <b>Nothing here re-runs the engine.</b></p>

          <table class="acct">
            <thead><tr><th>Team</th><th>Division</th><th class="r">Players</th>
              <th x-text="fp.basis==='points'?'Projected':'Average'"></th>
              <th>Over the cap — why</th></tr></thead>
            <tbody>
              <template x-for="r in fAcceptRows()" :key="r.ci">
                <tr>
                  <td><b x-text="r.name || '— not linked —'"></b>
                    <div class="how" style="font-size:11px;color:var(--ink3)" x-text="r.band"></div>
                    <div class="how" style="color:var(--bad);font-size:11px" x-show="r.unver.length"
                         x-text="'not verified: '+r.unverT"></div></td>
                  <td x-text="r.div"></td>
                  <td class="r" x-text="r.n"></td>
                  <td x-text="r.vs"></td>
                  <td>
                    <!-- the reason is required only where the cap is exceeded, and
                         it is the same rule as an admin verification: the stated
                         reason is the whole difference between an override and a
                         bypass. -->
                    <template x-if="r.over>0">
                      <div><input type="text" :value="fp.acc.caps[r.ci]||''"
                             @input="fp.acc.caps[r.ci]=$event.target.value; fp.acc.caps={...fp.acc.caps}"
                             :placeholder="r.over+' over — say why'"></div>
                    </template>
                    <span class="c" x-show="r.over<=0" style="color:var(--ink3)">within the cap</span>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>

          <div class="field" style="margin-top:12px">
            <label class="fl">A note on every offer <span style="color:var(--ink3)">— optional</span></label>
            <input type="text" x-model="fp.acc.note"
                   placeholder="e.g. Trials 12 March · training starts the week of the 24th">
          </div>

          <template x-for="st in fAcceptStops()" :key="st.k">
            <div class="stop">
              <b x-text="st.t"></b><div class="how" x-text="st.how"></div>
              <!-- CLEARED WHERE IT IS RAISED. The run is live-only until it is
                   persisted, so sending a coach to Players to tick eight records
                   costs them the board. The same three acts as the player card,
                   in the same order, one record at a time — never a bulk tick,
                   because a gate that clears for everybody at once is not one.
                   The three fields the association's registration is matched
                   against are on the row, so the check is made here. -->
              <template x-if="st.k==='unver'">
                <div class="vfy">
                  <p class="how" x-text="fVerifyWhy()"></p>
                  <template x-for="u in st.people" :key="u.id">
                    <div>
                      <div class="vfyr">
                        <span class="who"><b x-text="u.name"></b>
                          <span x-text="u.dob+' · '+u.gender+' · '+u.grp"></span></span>
                        <button class="btn sm" :disabled="fvfy.busy===u.id"
                                @click="fVerify(u.id,'association')">Matched the registration</button>
                        <button class="btn sm" :disabled="fvfy.busy===u.id"
                                @click="fVerify(u.id,'attested')">Parent attested</button>
                        <button class="btn sm" :class="fvfy.open===u.id?'pri':''"
                                @click="fvfy.note=''; fvfy.err='';
                                        fvfy.open = fvfy.open===u.id?'':u.id">My own authority…</button>
                      </div>
                      <!-- the stated reason is the whole difference between an
                           override and a bypass, so it is required here exactly
                           as it is on the card -->
                      <div class="vfyn" x-show="fvfy.open===u.id">
                        <input type="text" x-model="fvfy.note"
                               placeholder="Why you are standing behind this record — e.g. registration not yet transferred, birth certificate sighted">
                        <button class="btn sm pri" :disabled="fvfy.busy===u.id"
                                @click="fVerify(u.id,'admin')">Record it</button>
                      </div>
                    </div>
                  </template>
                  <p class="note" style="margin:6px 0 0" x-show="fvfy.err"
                     x-text="fvfy.err"></p>
                </div>
              </template>
            </div>
          </template>

          <!-- A REFUSAL IS A RED BOX WHERE THE WORK IS, NOT GREY TEXT IN THE
               FOOTER. It used to render as a small `.note` at the far right of
               the button row, which is where a message goes to be missed. -->
          <div class="stop" x-show="fp.acc.err">
            <b x-text="fp.acc.err"></b>
            <div class="how">Nothing was written. Fix what is named here or above, then press it
              again.</div>
          </div>

          <div class="warnbox" x-show="!fAcceptStops().length && !fp.acc.err">
            A place is binding at <b>registration</b>, not at acceptance. Accepting here enters the
            teams and puts the offers out; nobody is registered by it.</div>

          <div class="wrote" x-show="fp.acc.done">
            <b x-text="(fp.acc.done?.teams_created||0)+' teams created, '
                      +(fp.acc.done?.teams_reused||0)+' already had a name, '
                      +(fp.acc.done?.placed||0)+' players placed.'"></b>
            The offers are out. Answers are recorded on the player, and the rosters follow them.</div>
        </div>

        <div class="mfoot">
          <button class="btn pri" x-show="fp.phase==='setup'"
                  @click="fGenerate()" :disabled="fp.busy || !fp.teams.length"
                  x-text="fp.result ? (fp.stale?'Build again':'Build again') : 'Build the rosters'"></button>
          <button class="btn" x-show="fp.phase==='setup'"
                  @click="fSavePlan()" :disabled="fp.busy">Save without building</button>
          <!-- THE DRAFT BOARD FREEZES THE ENGINE, and writes nothing. From here
               every change is the coach's. -->
          <button class="btn pri" x-show="fp.phase==='setup' && fp.result && !fp.stale"
                  @click="fOpenDraft()">Open the draft board →</button>
          <button class="btn" x-show="fp.phase==='draft'" @click="fp.phase='setup'">← Back to the plan</button>
          <button class="btn" x-show="fp.phase==='draft'" @click="fRestoreProposal()"
                  :disabled="!fMovedCount()">Restore the proposal</button>
          <button class="btn pri" x-show="fp.phase==='draft'"
                  @click="fp.acc.err=''; fp.acc.done=null; fp.phase='accept'">Accept these teams…</button>
          <button class="btn" x-show="fp.phase==='accept'" @click="fp.phase='draft'">← Back to the draft board</button>
          <!-- A CONTROL IS NEVER DISABLED BY A DERIVED METHOD. Ming, 20 Aug 2026,
               sat in front of a dead button with nothing on screen explaining it:
               `:disabled` was computed from `fAcceptStops().length`, it evaluated
               to true once while the bands were still unlinked, and it never ran
               again when the reason went away. A disabled control that cannot say
               why is the worst state in the product — it is indistinguishable
               from a broken app. It now only greys out while it is WORKING, which
               is a plain reactive flag. Everything else is refused on the press,
               and the refusal is shown. -->
          <button class="btn pri" x-show="fp.phase==='accept' && !fp.acc.done"
                  @click="fAccept()" :disabled="fp.acc.busy">
            Enter the teams and send the offers</button>
          <button class="btn pri" x-show="fp.phase==='accept' && fp.acc.done"
                  @click="fAcceptToTeams()">Open the rosters →</button>
          <button class="btn" @click="modal=''">Close</button>
          <span class="c" x-show="fp.busy || fp.acc.busy">working…</span>
          <span class="note" style="margin:0;margin-left:auto" x-show="fp.err" x-text="fp.err"></span>
          <span class="note" style="margin:0;margin-left:auto"
                x-show="!fp.err && fp.phase==='setup' && fp.result && !fp.stale">
            Open the draft board to move players by hand, then accept.</span>
          <span class="note" style="margin:0;margin-left:auto" x-show="!fp.err && fp.phase==='draft'">
            A draft — nothing is written until you accept. Move players by hand, then accept the teams.</span>
        </div>
      </div>
    </div>
  </template>

  <!-- SETUP holds the two things a club looks at rarely and reads together: its
       own conventions, and the rubrics it rates against. One dialog with a tab,
       not two header buttons — the ellipsis marks it as a dialog, which is
       Ming's own convention and the reason the five sections carry none. -->
  <template x-if="modal==='setup'">
    <div class="modal" @click.self="modal=''">
      <div class="box">
        <div class="mhead"><h3>Setup</h3>
          <button class="lb" :class="setupTab==='club'?'on':''"
                  @click="setupTab='club'">This club</button>
          <button class="lb" :class="setupTab==='rubrics'?'on':''"
                  @click="setupTab='rubrics'">Rubrics</button>
          <span class="c" x-show="setupTab==='rubrics'">locked · scale 1–5</span>
          <button class="x" @click="modal=''" title="Close">×</button></div>

        <div class="mbody" x-show="setupTab==='rubrics'">
          <p class="note" style="margin-top:0">Identical for every club in the sport. Every club
            completes <b>Core</b>. <b>Extended</b> is for clubs that can do more, and its measures
            roll up into Core so both depths stay comparable.</p>
          <template x-for="r in rubrics" :key="r.id">
            <div class="rgrp">
              <div class="cath"><span x-text="r.name"></span>
                <b x-text="measuresOf(r.id).length+' measures'"></b></div>
              <div class="chips">
                <template x-for="m in measuresOf(r.id)" :key="m.id">
                  <span class="c" :class="r.level==='core' ? 'grp' : (m.rolls_up_to ? 'acc' : '')"
                        x-text="m.label"></span>
                </template>
              </div>
            </div>
          </template>
          <p class="note">A tenant never authors a measure. Adding a sport is seeding, not coding.</p>
        </div>

        <div class="mbody" x-show="setupTab==='club'">
          <p class="note" style="margin-top:0">These are this club's own conventions, not rules of
            the sport. They decide which age group a player falls in and what a coach can mark on a
            roster.</p>

          <div class="cath">Age</div>
          <div class="row2">
            <div class="field"><label class="fl">Age is reckoned at</label>
              <div class="inline" style="margin-top:0">
                <input type="number" x-model.number="cfg2.cutd" min="1" max="31" style="width:70px">
                <select x-model.number="cfg2.cutm" style="width:auto">
                  <template x-for="(mn,i) in ['January','February','March','April','May','June',
                        'July','August','September','October','November','December']" :key="mn">
                    <option :value="i+1" x-text="mn"></option></template>
                </select>
              </div></div>
            <div class="field"><label class="fl">Age groups — the “under” numbers</label>
              <input type="text" x-model="cfg2.brackets" placeholder="8*, 10, 12, 14, 16, 18, 20">
            </div>
          </div>
          <p class="note" style="margin-top:0">Put <b>*</b> after a number that is a mixed group —
            <span class="mono">8*, 10, 12…</span> gives U8 Mixed, then U10 Boys / U10 Girls and so
            on. A player is in the first group whose number is above their age.</p>

          <!-- A CLUB CHOOSES WHICH LENSES IT USES; THE SPORT SAYS WHAT THEY ARE.
               This replaced two free-text lists — "Size, Skill" and "Guard,
               Forward, Center, Utility" — that asked a club to retype vocabulary
               the sport already defines. Two places to say what a Guard is, and
               they drift. Same rule as the rubrics. -->
          <div class="cath">On a roster</div>
          <p class="note" style="margin-top:0">Tick the ways you want a roster cut. The slots inside
            each are the sport's, the same for every club — you are choosing which questions your
            coaches are asked, not inventing the answers.</p>
          <div class="fopts">
            <template x-for="l in sportLenses()" :key="l.k">
              <label class="fopt" :class="cfg2.lenses.includes(l.k)?'on':''">
                <input type="checkbox" :checked="cfg2.lenses.includes(l.k)"
                       @change="toggleLens(l.k)">
                <span><b x-text="l.t"></b>
                  <span class="c" x-text="{zone:'how the squad is built',
                        role:'what a player does',
                        position:'where a player lines up'}[l.axis] || ''"></span>
                  <span class="note" style="margin:2px 0 0"
                        x-text="l.slots.map(z=>z.t).join(' · ')"></span></span>
              </label>
            </template>
          </div>
          <p class="note" x-show="!sportLenses().length">This sport does not define any yet.</p>
          <p class="note" x-show="!cfg2.lenses.length && sportLenses().length">
            None ticked means <b>all of them</b>. Untick everything to keep it that way.</p>

          <div class="inline" style="margin-top:10px">
            <button class="btn pri" @click="saveClubCfg()" :disabled="cfg2.busy">Save</button>
            <button class="btn" @click="modal=''">Cancel</button>
          </div>
          <p x-show="cfg2.err" x-text="cfg2.err" class="err"></p>
          <p x-show="cfg2.msg" x-text="cfg2.msg" class="msg"></p>
        </div>
      </div>
    </div>
  </template>

  <!-- ─────────── RATE (modal) ─────────── -->
  <template x-if="modal==='rate'">
    <div class="modal" @click.self="modal=''">
      <div class="box">
        <div class="mhead"><h3>Rate players</h3>
          <span class="c" x-text="rate.session?.name"></span>
          <span class="c grp" x-text="rubricName(rate.session?.rubric_id)"></span>
          <button class="x" @click="modal=''" title="Close">×</button></div>
        <div class="mbody">
          <template x-if="!rate.authorised">
            <p class="warnbar" style="border-radius:8px;border:1px solid var(--warnline)">
              You are not authorised to rate in this session. Authorisation is explicit and per
              session — add yourself under <b>Authorised raters</b> first.</p>
          </template>

          <template x-if="rate.authorised">
          <div class="split">
            <div>
              <div class="cath">Players <b x-text="activePeople().length"></b></div>
              <div class="plist">
                <template x-for="p in activePeople()" :key="p.id">
                  <div class="pitem" :class="rate.person?.id===p.id?'on':''" @click="pickPlayer(p)">
                    <span x-text="p.given_name+' '+p.family_name"></span>
                    <span class="st" x-text="rate.done[p.id] ? '✓ rated' : ''"></span>
                  </div>
                </template>
              </div>
            </div>

            <div>
              <template x-if="!rate.person">
                <div class="empty">Choose a player to start.</div>
              </template>
              <template x-if="rate.person">
              <div>
                <div class="cath">
                  <span x-text="rate.person.given_name+' '+rate.person.family_name"></span>
                  <b x-text="Object.keys(rate.scores).length+' of '+rateMeasures().length+' scored'"></b>
                </div>
                <template x-for="m in rateMeasures()" :key="m.id">
                  <div class="mrow">
                    <span class="lb" x-text="m.label"></span>
                    <div class="scale">
                      <template x-for="v in scaleOf(m)" :key="v">
                        <button class="sv" :class="rate.scores[m.id]===v?'on':''"
                                @click="rate.scores[m.id]=v" x-text="v"></button>
                      </template>
                    </div>
                  </div>
                </template>
                <div class="field" style="margin-top:10px">
                  <label class="fl">Note (optional)</label>
                  <input type="text" x-model="rate.note" placeholder="anything worth recording">
                </div>
                <div class="inline" style="margin-top:0">
                  <button class="btn pri" @click="saveRating()"
                          :disabled="!Object.keys(rate.scores).length||busy">Save rating</button>
                  <button class="btn" @click="rate.scores={};rate.note=''">Clear</button>
                </div>
                <p class="note">Saved ratings cannot be edited. A correction is recorded as a
                  resolution by the head coach, never by changing the original.</p>
                <p x-show="rate.err" x-text="rate.err" class="err"></p>
                <p x-show="rate.msg" x-text="rate.msg" class="msg"></p>
              </div>
              </template>
            </div>
          </div>
          </template>
        </div>
      </div>
    </div>
  </template>

  <!-- ─────────── REVIEW & CONFIRM (modal) ─────────── -->
  <template x-if="modal==='review'">
    <div class="modal" @click.self="modal=''">
      <div class="box">
        <div class="mhead"><h3>Review &amp; confirm</h3>
          <span class="c" x-text="review.session?.name"></span>
          <span class="c" :class="review.session?.status==='confirmed'?'ok':'grp'"
                x-text="review.session?.status"></span>
          <button class="x" @click="modal=''" title="Close">×</button></div>
        <div class="mbody">
          <div class="statrow" style="border:1px solid var(--line);border-radius:8px;margin-bottom:12px">
            <div><b x-text="review.rows.filter(r=>r.coverage==='complete').length"></b>complete</div>
            <div><b x-text="review.rows.filter(r=>r.coverage==='partial').length"></b>partial</div>
            <div><b x-text="review.rows.filter(r=>r.coverage==='not rated').length"></b>not rated</div>
            <div><b x-text="flagged().length"></b>to look at</div>
            <div><b x-text="sessionMean()"></b>session mean</div>
          </div>

          <div class="cath">Coverage and disagreement
            <b x-text="'threshold '+review.threshold"></b></div>
          <p class="note" style="margin-top:0">Rows are highlighted where two raters differ by more
            than the threshold. Confirming with gaps is allowed and recorded.</p>
          <div class="scroll" style="max-height:320px">
            <table class="jt">
              <thead><tr><th>Player</th><th style="width:66px">Rating</th>
                <th style="width:90px">Coverage</th>
                <th style="width:70px">Scored</th><th style="width:70px">Raters</th>
                <th style="width:74px">Spread</th><th style="width:64px"></th></tr></thead>
              <tbody>
                <template x-for="r in review.rows" :key="r.person_id">
                  <tr :class="r.worst_spread > review.threshold ? 'flag' : ''">
                    <td x-text="r.given_name+' '+r.family_name"></td>
                    <td><b x-text="meanOf(r.person_id)"></b></td>
                    <td><span class="c" :class="r.coverage==='complete'?'ok':
                          (r.coverage==='partial'?'wn':'')" x-text="r.coverage"></span></td>
                    <td x-text="r.measures_scored+'/'+r.measure_count"></td>
                    <td x-text="r.assessment_count"></td>
                    <td x-text="r.worst_spread || ''"></td>
                    <td><button class="btn sm" x-show="r.measures_scored"
                          @click="openPlayer(r.person_id)">Detail</button></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>

          <div class="cath">Confirm</div>
          <template x-if="review.session?.status==='confirmed'">
            <p class="okbar" style="border-radius:8px;border:1px solid var(--okline)">
              Confirmed. The formation engine can now use this session — and it cannot be reopened.</p>
          </template>
          <template x-if="review.session?.status!=='confirmed'">
            <div>
              <p class="note" style="margin-top:0">Confirming closes the session as a whole and is
                recorded against your name. Only a head coach or club admin can do it.</p>
              <button class="btn pri" @click="confirmSession()"
                :disabled="busy || !['head_coach','club_admin'].includes(me?.role)">
                Confirm this session</button>
              <p x-show="!['head_coach','club_admin'].includes(me?.role)" class="note">
                Your role is <b x-text="me?.role"></b>, so you cannot confirm.</p>
              <p x-show="review.err" x-text="review.err" class="err"></p>
            </div>
          </template>
        </div>
      </div>
    </div>
  </template>

  <!-- ─────────── PLAYER (modal) ─────────── -->
  <!-- Layered above Review, because it is summoned FROM Review and Review is still
       the thing you are doing. Escape or the × returns you to it, in place. -->

  <!-- ─────────── MORE (modal) ─────────── -->
  <template x-if="modal==='more'">
    <div class="modal" @click.self="modal=''">
      <div class="box sm">
        <div class="mhead"><h3>More</h3>
          <button class="x" @click="modal=''" title="Close">×</button></div>
        <div class="mbody">
          <!-- where the product names itself -->
          <p class="note" style="margin-top:0">
            <span class="wm" style="font-size:15px;color:var(--navy)">Club<span class="f">Flow</span><span class="o">O</span></span>
            <span style="margin-left:6px">v0.1</span></p>
          <div class="cath">This session</div>
          <dl class="kv">
            <dt>Signed in as</dt><dd x-text="userEmail"></dd>
            <dt>User id</dt><dd x-text="userId"></dd>
            <template x-if="org">
              <span style="display:contents">
                <dt>Organisation</dt><dd x-text="org.name"></dd>
                <dt>Organisation id</dt><dd x-text="org.id"></dd>
                <dt>Edition</dt><dd x-text="org.edition"></dd>
              </span>
            </template>
            <dt>Database</dt><dd x-text="cfg.url"></dd>
          </dl>

          <div class="cath">Tenant isolation</div>
          <p class="note" style="margin-top:0">Every count comes from an unfiltered query — there is
            no <code>where org_id</code> anywhere in this app. The database returns only your
            organisation's rows.</p>
          <div class="statrow" style="border:1px solid var(--line);border-radius:8px">
            <div><b x-text="orgs.length"></b>organisations</div>
            <div><b x-text="people.length"></b>players</div>
            <div><b x-text="members.length"></b>members</div>
            <div><b x-text="measures.length"></b>rubric measures</div>
          </div>

          <div class="cath">Actions</div>
          <div class="inline" style="margin-top:0">
            <button class="btn" @click="load();modal=''">Reload data</button>
            <button class="btn" @click="resetCfg()">Change database</button>
            <button class="btn" @click="signOut()">Sign out</button>
          </div>
          <p class="note">v0.1 · foundation. Rating capture, the formation engine and imports are
            the next increments.</p>
        </div>
      </div>
    </div>
  </template>

</div>
</template>

</div>

<script>
function app(){ return {
  screen:'setup', cfg:{url:'',key:''}, sb:null,
  email:'', msg:'', err:'', busy:false,
  userId:'', userEmail:'',
  orgs:[], org:null, me:null, members:[], people:[], measures:[], rubrics:[], sessions:[],
  allSessions:[],
  pf:{q:'',show:'active',gender:'',age:null,year:new Date().getFullYear()},
  teams:[], teamSeasons:[], roster:[], pool:[], clubCfg:null,
  cfg2:{cutd:31,cutm:12,brackets:'',lenses:[],busy:false,err:'',msg:''},
  //  grpSel is the age group being worked; view is which of the two jobs the
  //  right-hand pane is doing — the list of teams, what a team IS, or who is in
  //  it. ename/egrp/ediv are the edit form, kept separate from the create form
  //  so opening one never half-fills the other.
  tm:{selected:'',grpSel:null,view:'list',adding:false,name:'',grp:'',div:'',
      ename:'',egrp:'',ediv:'',esaved:'',
      q:'',scope:'grp',hidePlaced:true,
      drag:null,dragRow:null,over:false,busy:false,err:'',dsaved:'',
      /* what the team card reads — see loadTeams() */
      shape:[],offers:[],regs:[],scoring:[]},
  qv:{open:false,note:'',busy:false,err:''},
  pe:{id:null,given:'',family:'',dob:'',gender:'',ref:'',status:'active',
      verification:'unverified',vsource:'',vnote:'',
      dupes:[],delConfirm:false,err:'',busy:false},
  sel:null, blocks:[], auths:[], blockErr:'', modal:'', delConfirm:'', delErr:'', peopleErr:'', statusErr:'',
  authErr:'',
  rate:{session:null,authorised:false,person:null,scores:{},note:'',done:{},err:'',msg:''},
  review:{session:null,rows:[],threshold:2,err:'',scores:{}},
  pm:{personId:'',mode:'profile',editing:false,adding:false,returnTo:'',name:'',sessionName:'',mean:'',coverage:'',
      detail:[],history:[],resolutions:[],err:''},
  rz:{measure_id:'',source:'',adopted:null,score:null,rationale:'',err:'',busy:false},
  //  The app opens on the Dashboard: what has to happen next, before you
  //  choose where to go and do it. Ming, 19 Aug 2026.
  stage:'dash', queueRows:[], onlyWaiting:false,
  fm:{plan:'Gold 8, Navy 8, White 8', busy:false, err:'', result:null, sessionId:''},
  court:{sessions:[],session:null,people:[],measures:[],rated:{},person:null,
         scores:{},note:'',err:'',msg:''},
  queue:[], rejected:[], syncing:false, online:true,
  newSession:{open:false,name:'',opens:'',closes:'',rubric_id:''},
  seasons:[], seasonRows:[], seasonId:'', seasonErr:'',
  newSeason:{name:'',year:new Date().getFullYear(),starts:'',ends:'',current:false},
  newBlock:{date:'',start:'18:00',end:'20:00',venue:''},
  newAuth:{membership_id:''},

  async boot(){
    const saved = localStorage.getItem('platform.cfg');
    if(!saved){ this.screen='setup'; return; }
    this.cfg = JSON.parse(saved);
    this.connect();
    const {data:{session}} = await this.sb.auth.getSession();
    if(session){ await this.afterLogin(session); } else { this.screen='signin'; }
    this.sb.auth.onAuthStateChange(async (_e,s)=>{ if(s) await this.afterLogin(s); });
  },

  connect(){ this.sb = window.supabase.createClient(this.cfg.url, this.cfg.key); },

  saveCfg(){
    this.err='';
    try{
      if(!/^https:\/\/.+\.supabase\.co\/?$/.test(this.cfg.url.trim()))
        throw new Error('That does not look like a Supabase project URL.');
      this.cfg.url = this.cfg.url.trim().replace(/\/$/,'');
      this.cfg.key = this.cfg.key.trim();
      if(this.cfg.key.includes('service_role'))
        throw new Error('That looks like the service_role key. Use the anon public key.');
      localStorage.setItem('platform.cfg', JSON.stringify(this.cfg));
      this.connect(); this.screen='signin';
    }catch(e){ this.err = e.message; }
  },

  resetCfg(){ localStorage.removeItem('platform.cfg'); location.reload(); },

  async signIn(){
    this.busy=true; this.err=''; this.msg='';
    const {error} = await this.sb.auth.signInWithOtp({
      email:this.email, options:{ emailRedirectTo: window.location.href.split('#')[0] }
    });
    this.busy=false;
    if(error){ this.err = error.message; }
    else { this.msg = 'Check your email — the link signs you straight in.'; }
  },

  async signOut(){ await this.sb.auth.signOut(); location.reload(); },

  async afterLogin(session){
    this.userId = session.user.id; this.userEmail = session.user.email;
    this.screen='app';
    this.loadQueue(); this.loadRejected();
    this.online = navigator.onLine !== false;
    addEventListener('online',  () => { this.online = true;  this.flushQueue(); });
    addEventListener('offline', () => { this.online = false; });
    await this.load();
    this.flushQueue();
    //  The app opens on the Dashboard, so its data has to be there when it does.
    if(this.stage==='dash') await this.openDash();
  },

  async load(){
    this.err=''; this.authErr=''; this.blockErr='';
    const q = async (t,sel='*',order=null)=>{
      let r = this.sb.from(t).select(sel);
      if(order) r = r.order(order);
      const {data,error} = await r;
      if(error){ this.err = t+': '+error.message; return []; }
      return data||[];
    };
    this.orgs     = await q('organisation');
    this.org      = this.orgs[0] || null;
    this.members  = await q('membership');
    this.me       = this.members.find(m=>m.user_id===this.userId) || null;
    // the directory view, not the bare table: it carries the verification
    // evidence and how many confirmed sessions each player already has
    this.people   = await q('v_person_directory','*','family_name');
    this.rubrics  = (await q('rubric','*','level')).filter(r=>r.org_id===null);
    this.measures = await q('rubric_measure','*','sort_order');
    //  THE LENSES BELONG TO THE SPORT and are read on every stage — the Teams
    //  roster, the comparison board and Setup all need them, so they load once
    //  here rather than only when Formation opens.
    {
      const sports = await q('sport');
      const mine = sports.find(x => x.id === this.org?.primary_sport_id);
      this.fp.lenses = ((mine && mine.lenses && mine.lenses.length ? mine
                        : sports.find(x => x.lenses && x.lenses.length)) || {}).lenses || [];
    }
    if(!this.newSession.rubric_id){
      const core = this.rubrics.find(r=>r.level==='core');
      this.newSession.rubric_id = (core||this.rubrics[0])?.id || '';
    }
    // The season is the scope everything below reads through. A club with no
    // season cannot create a trial at all — the database refuses it — so the
    // stage says so rather than failing on the button.
    this.seasons    = await q('season','*','year');
    this.seasonRows = await q('v_season_summary','*','year');
    if(!this.seasons.find(s => s.id === this.seasonId)){
      this.seasonId = (this.seasons.find(s => s.is_current) || this.seasons[0] || {}).id || '';
    }
    const all = await q('rating_session','*','opens_at');
    this.allSessions = all;
    this.sessions = this.seasonId ? all.filter(s => s.season_id === this.seasonId) : all;
    // The player directory reckons age against the season's own year.
    const cur = this.seasons.find(s => s.id === this.seasonId);
    if(cur && cur.year) this.pf.year = cur.year;
    await this.loadSessionQueue();
  },

  // ── seasons ─────────────────────────────────────────────────────────────
  seasonOptionLabel(s){
    const n = this.allSessions.filter(x => x.season_id === s.id).length;
    return s.name
         + (n ? ' · ' + n + (n===1 ? ' trial' : ' trials') : ' · empty')
         + (s.is_current ? ' · current' : '')
         + (s.archived_at ? ' · archived' : '');
  },
  //  A WORKING SCREEN OFFERS ONLY SEASONS IN PLAY. Nothing can be written to an
  //  archived one, so listing it as a scope invites a click that ends in a
  //  refusal. The one already selected stays in the list whatever its state, so
  //  arriving from the dashboard on an archived season does not silently jump.
  seasonsForWork(){
    return (this.seasons||[]).filter(s => !s.archived_at || s.id === this.seasonId);
  },
  elsewhereSeasons(){
    return this.seasons.filter(s =>
      s.id !== this.seasonId && this.allSessions.some(x => x.season_id === s.id));
  },
  seasonName(id){ return this.seasons.find(s => s.id === id)?.name || '(no season)'; },
  seasonYear(id){ return this.seasons.find(s => s.id === id)?.year || null; },
  onSeasonChange(){
    this.sel = null; this.onlyWaiting = false;
    this.sessions = this.allSessions.filter(s => s.season_id === this.seasonId);
    const y = this.seasonYear(this.seasonId);
    if(y) this.pf.year = y;
  },
  async createSeason(){
    this.seasonErr=''; this.busy=true;
    const {error} = await this.sb.from('season').insert({
      org_id:this.org.id,
      name:this.newSeason.name.trim(),
      year:Number(this.newSeason.year),
      starts_on:this.newSeason.starts || null,
      ends_on:this.newSeason.ends || null,
      is_current:!!this.newSeason.current
    });
    this.busy=false;
    if(error){
      this.seasonErr = /season_name_uq/.test(error.message)
        ? 'There is already a season with that name in this club.' : error.message;
      return;
    }
    this.newSeason={name:'',year:new Date().getFullYear(),starts:'',ends:'',current:false};
    await this.load();
  },
  async makeCurrent(r){
    this.seasonErr='';
    // The trigger stands the previous one down, so this is one write, not two.
    const {error} = await this.sb.from('season').update({is_current:true}).eq('id', r.id);
    if(error){ this.seasonErr=error.message; return; }
    this.seasonId = r.id;
    await this.load();
  },
  //  Archiving a season puts it away AND makes it read-only. Reversible on
  //  purpose: a club that finds a mistake puts it back in play, fixes it, and
  //  archives it again. The database refuses archiving the current season, or
  //  one with a trial still open — both messages come back verbatim.
  async archiveSeason(r, on){
    this.seasonErr='';
    if(on && !confirm('Archive ' + r.name + '?\n\nIt keeps everything and goes read-only — no new '
        + 'trials, teams, plans or offers — and leaves the working screens. You can put it back in '
        + 'play at any time.')) return;
    const {error} = await this.sb.from('season').update(
      on ? {archived_at:new Date().toISOString(), archived_by:this.me?.id||null}
         : {archived_at:null, archived_by:null}
    ).eq('id', r.id);
    if(error){ this.seasonErr = error.message; return; }
    //  the scope may have just been archived out from under the screens
    if(on && this.seasonId === r.id){
      const live = this.seasons.filter(x => x.id !== r.id && !x.archived_at);
      this.seasonId = (live.find(x => x.is_current) || live[0] || {}).id || '';
    }
    await this.load();
    if(this.stage === 'dash') await this.openDash();
  },
  async deleteSeason(r){
    this.seasonErr='';
    const {error} = await this.sb.from('season').delete().eq('id', r.id);
    if(error){ this.seasonErr = error.message; return; }
    await this.load();
  },

  // ══════════════════════ TEAMS ══════════════════════
  // The team NAME is club-level; what is edited here is its roster for the
  // SELECTED SEASON. A player sits in one team per age group and may be placed
  // in as many age groups as the club wants — that is the fill-in case.
  //  A LINK INTO A SECTION MUST LOAD THAT SECTION FIRST. `seasonRows` comes from
  //  `v_season_summary` and is what the whole stage counts off.
  async openSeason(){
    this.stage='season'; this.seasonErr='';
    await this.loadSeasons();
  },
  async loadSeasons(){
    if(!this.org) return;
    //  Sorted here rather than with .order(), so this loader asks the client for
    //  nothing more than select() — the same shape every other loader uses.
    const q = async (t) => {
      const {data,error} = await this.sb.from(t).select('*');
      if(error){ this.seasonErr = t+': '+error.message; return []; }
      return (data||[]).slice().sort((a,b)=>(a.year||0)-(b.year||0)
        || String(a.name||'').localeCompare(String(b.name||'')));
    };
    this.seasons    = await q('season');
    this.seasonRows = await q('v_season_summary');
  },
  async openTeams(){
    this.stage='teams'; this.tm.err='';
    await this.loadTeams();
    //  LAND ON A GROUP. An index with nothing chosen beside it reads as broken;
    //  the first group that actually has teams is the one a club is working in,
    //  and the first group overall if none has any yet.
    if(this.tm.grpSel===null || !this.allAgeGroups().includes(this.tm.grpSel)){
      const withTeams=this.allAgeGroups().find(g=>this.teamSeasonsIn(g).length);
      this.tm.grpSel = withTeams || this.allAgeGroups()[0] || null;
      this.tm.view='list';
    }
  },
  async loadTeams(){
    if(!this.org) return;
    const q = async (t, sel='*', filt=null) => {
      let r = this.sb.from(t).select(sel);
      if(filt) r = r.eq(filt[0], filt[1]);
      const {data,error} = await r;
      if(error){ this.tm.err = t+': '+error.message; return []; }
      return data||[];
    };
    this.teams       = await q('team');
    this.clubCfg     = (await q('org_profile'))[0] || null;
    this.teamSeasons = this.seasonId
      ? (await q('team_season','*',['season_id',this.seasonId])).map(ts => ({
          ...ts, team_name: (this.teams.find(t=>t.id===ts.team_id)||{}).name || '(unnamed)' }))
      : [];
    this.roster = this.seasonId ? await q('v_roster','*',['season_id',this.seasonId]) : [];
    this.pool   = this.seasonId ? await q('v_player_pool','*',['season_id',this.seasonId]) : [];
    //  ── what the TEAM CARD reads ────────────────────────────────────────
    //  The shape comes out of `v_team_shape` (migration 029) rather than the
    //  client pulling every score in the club to average ten of them.
    this.tm.shape  = this.seasonId ? await q('v_team_shape','*',['season_id',this.seasonId]) : [];
    //  accepted / registered, so the card can say where the squad actually
    //  stands. Both are small per season.
    this.tm.offers = this.seasonId ? await q('team_offer','*',['season_id',this.seasonId]) : [];
    this.tm.regs   = this.seasonId ? await q('player_season','*',['season_id',this.seasonId]) : [];
    //  A SCORING RECORD IS LAST SEASON'S. Take the most recent record per player
    //  from any season EARLIER than this one — the same rule Formation uses, and
    //  the reason a card never shows this season's own numbers back at you.
    {
      const yr = (this.seasons.find(x=>x.id===this.seasonId)||{}).year;
      const rows = this.seasonId ? await q('v_player_scoring') : [];
      const best = {};
      rows.filter(r => yr==null || r.year < yr)
          .forEach(r => { const b=best[r.person_id];
            if(!b || (r.year||0) > (b.year||0)) best[r.person_id]=r; });
      this.tm.scoring = Object.values(best);
    }
    if(!this.teamSeasons.find(ts=>ts.id===this.tm.selected)){
      this.tm.selected = (this.teamSeasons[0]||{}).id || '';
    }
  },

  // ── club settings ──────────────────────────────────────────────────────
  openClubCfg(){
    const c = this.clubCfg || {};
    this.cfg2 = {
      cutd: c.age_cutoff?.d ?? 31,
      cutm: c.age_cutoff?.m ?? 12,
      brackets: (c.age_brackets || []).map(b => b.u + (b.mixed ? '*' : '')).join(', '),
      lenses: [...(c.lenses_used || [])],
      busy:false, err:'', msg:''};
  },
  async saveClubCfg(){
    this.cfg2.err=''; this.cfg2.msg=''; this.cfg2.busy=true;
    const brackets = this.cfg2.brackets.split(',').map(x=>x.trim()).filter(Boolean)
      .map(x => ({u: parseInt(x,10), mixed: x.includes('*')}))
      .filter(b => !isNaN(b.u)).sort((a,b)=>a.u-b.u);
    const list = s => s.split(',').map(x=>x.trim()).filter(Boolean);
    const {error} = await this.sb.from('org_profile').update({
      age_cutoff: {d:Number(this.cfg2.cutd), m:Number(this.cfg2.cutm)},
      age_brackets: brackets,
      lenses_used: this.cfg2.lenses
    }).eq('org_id', this.org.id);
    this.cfg2.busy=false;
    if(error){ this.cfg2.err = error.message; return; }
    this.cfg2.msg = 'Saved. Age groups are recomputed from this for every player.';
    await this.loadTeams();
  },

  //  What the SPORT defines, and which of them this CLUB uses. Both read from
  //  one place so a roster and the comparison board can never disagree about
  //  what a Guard is.
  sportLenses(){ return this.fp.lenses || []; },
  clubLenses(){
    const used = this.clubCfg?.lenses_used || [];
    const all = this.sportLenses().map(l => ({...l,
      short: String(l.t).split(/[ /]/)[0].toLowerCase() }));
    return used.length ? all.filter(l => used.includes(l.k)) : all;
  },
  toggleLens(k){
    const cur = this.cfg2.lenses || [];
    this.cfg2.lenses = cur.includes(k) ? cur.filter(x => x !== k) : [...cur, k];
  },
  selTeam(){ return this.teamSeasons.find(ts=>ts.id===this.tm.selected) || null; },
  rosterOf(tsId){
    return this.roster.filter(r=>r.team_season_id===tsId)
      .sort((a,b)=> (b.rating||0)-(a.rating||0)
        || (a.family_name+a.given_name).localeCompare(b.family_name+b.given_name));
  },
  //  A RATING IS PRINTED, NEVER PASSED THROUGH RAW. `3.9 - 0.2` is
  //  3.6999999999999997 in IEEE 754, and a roster that shows that once is a
  //  roster nobody trusts the rest of. Two decimals, and a dash where there is
  //  no rating at all — the same shape the rest of the product uses.
  rate2(v){ return (v===null||v===undefined||v==='') ? '–' : Number(v).toFixed(2); },
  //  ══ THE TEAM CARD ═══════════════════════════════════════════════════════
  //  A port of the TMS team card (Ming, 20 Aug 2026). DERIVED ONCE — the card's
  //  numbers, its columns and its warnings all come out of `tCard()` and
  //  `tZones()`, so a number in the header can never disagree with the list
  //  beneath it. Same rule the comparison board is built on.
  seasonYear(){ return (this.seasons.find(s=>s.id===this.seasonId)||{}).year || ''; },
  tScore(pid){ return (this.tm.scoring||[]).find(s=>s.person_id===pid) || null; },
  tCard(){
    const ts=this.selTeam();
    const roster=ts ? this.rosterOf(this.tm.selected) : [];
    const grp=ts?.age_group||'';
    const outside=roster.filter(r=>this.eligRow(r).k!=='on2');
    const ages=roster.map(r=>r.age).filter(n=>n!=null);
    const rated=roster.filter(r=>r.rating!=null);
    const ids=new Set(roster.map(r=>r.person_id));
    const offers=(this.tm.offers||[]).filter(o=>ids.has(o.person_id));
    const regs=(this.tm.regs||[]).filter(x=>ids.has(x.person_id) && x.registered_at);
    //  the mix across the zone lens — "2 / 1 / 2" reads as one fact
    const z=this.tZones();
    const shape=this.tShapeRows();
    const mean=a=>a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
    const ov=mean(rated.map(r=>+r.rating));
    const gov=mean(shape.map(m=>m.group).filter(v=>v!=null));
    return {
      n:roster.length,
      onAge:roster.length-outside.length,
      outside,
      outsideLine: outside.length===1
        ? '1 player is outside '+grp+' for '+this.seasonYear()+'.'
        : outside.length+' players are outside '+grp+' for '+this.seasonYear()+'.',
      avgAge: ages.length ? (ages.reduce((a,b)=>a+b,0)/ages.length).toFixed(1) : '—',
      accepted: offers.filter(o=>o.response==='accepted').length,
      registered: regs.length,
      stars: roster.filter(r=>r.is_star).length,
      mix: z.map(c=>c.n).join(' / '),
      mixLabel: z.map(c=>String(c.t).toLowerCase()).join(' / '),
      unplaced: this.poolAll().filter(p=>p.age_group===grp).length
                - this.placedInGroup(grp).size,
      overall: ov==null?'—':ov.toFixed(1),
      groupOverall: gov==null?'—':gov.toFixed(1),
      ratedLine: rated.length===roster.length
        ? roster.length+' of '+roster.length+' rated'
        : (roster.length-rated.length)+' of this squad have no rating, so this shape is drawn from '
          +rated.length+'.',
    };
  },
  //  TWO THINGS YOU PICK OUT; EVERYONE ELSE IS THE THIRD. Other is implicit —
  //  never a state anybody has to sort into, and never something to warn about.
  tZones(){
    const lens=(this.clubLenses()||[]).find(l=>l.axis==='zone')
            || (this.sportLenses()||[]).find(l=>l.axis==='zone');
    const slots=(lens&&lens.slots)||[];
    const roster=this.rosterOf(this.tm.selected);
    const cols=slots.map((s,i)=>({k:s.k, t:s.t, i,
      players:roster.filter(r=>r.zone===s.k)}));
    cols.push({k:'', t:'Other', i:slots.length,
      players:roster.filter(r=>!r.zone || !slots.some(s=>s.k===r.zone))});
    return cols.map(c=>({...c, n:c.players.length,
                         cards:c.players.map(r=>this.tCardOf(r))}));
  },
  tCardOf(r){
    const e=this.eligRow(r), sc=this.tScore(r.person_id), yr=this.seasonYear();
    //  A NUMBER WITHOUT A RECORD IS NOT SHOWN. No games on file means no chip,
    //  never a zero — a zero reads as "played and scored nothing".
    const stats = (sc && sc.games)
      ? sc.games+' gms · '+Number(sc.ppg||0).toFixed(1)+' ppg · '
        +Number(sc.fpg||0).toFixed(1)+' fpg'
      : '';
    return {r, id:r.id,
      name:(r.given_name+' '+r.family_name),
      gender:r.gender==='M'?'Male':(r.gender==='F'?'Female':''),
      age: r.age!=null && yr ? (r.age+' in '+yr) : (r.age!=null?String(r.age):''),
      elig:e, star:!!r.is_star, stats,
      rating: r.rating!=null ? 'rated '+Number(r.rating).toFixed(1) : ''};
  },
  //  The shape comes from `v_team_shape` (migration 029) — the team's average on
  //  every measure beside the age group's own average for the same measure. The
  //  client never fetches four thousand scores to draw one picture.
  tShapeRows(){
    return (this.tm.shape||[]).filter(s=>s.team_season_id===this.tm.selected)
      .slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0))
      .map(s=>({label:s.measure_label, team:+s.team_avg,
                group:s.group_avg==null?null:+s.group_avg,
                delta:s.group_avg==null?null:(+s.team_avg - +s.group_avg),
                rated:s.rated}));
  },
  //  THE PICTURE IS THE TMS PICTURE — `radarSVG()` with its geometry untouched,
  //  and its stroke on the TMS navy, because the radar is change-both-or-neither
  //  with the TMS (ADR-034). A chart with no data refuses to draw.
  tRadar(){
    const rows=this.tShapeRows();
    if(!rows.length) return '';
    return this.radarSVG(rows.map(r=>r.label), [
      {vals:rows.map(r=>r.group), stroke:'#8A8A80', dash:'4 3', w:1.3,
       fill:'rgba(138,138,128,.08)'},
      {vals:rows.map(r=>r.team), stroke:'#1F3864', fill:'rgba(31,56,100,.20)', w:2, dot:true},
    ], 240);
  },
  //  DRAGGING A CARD BACK TO THE POOL TAKES THEM OFF. The reverse of the drag
  //  that put them there, and the only way the rail can be a drop target without
  //  meaning something different in each direction. A name dragged FROM the pool
  //  and dropped back on it is a no-op, not a removal.
  async tDropPool(){
    const row=this.tm.dragRow; this.tm.drag=null; this.tm.dragRow=null; this.tm.over=false;
    if(row) await this.unplace(row);
  },
  //  Dropping ON a zone places the player AND says what they are in this team.
  //  Dropping on the pool area is a plain placement and leaves the zone alone —
  //  the same rule as the comparison board.
  async tDropZone(ev, zone){
    const id=this.tm.drag; this.tm.drag=null; this.tm.over=false;
    if(!id) return;
    const row=this.rosterOf(this.tm.selected).find(r=>r.person_id===id);
    if(row){ await this.setSlot(row, 'zone', zone||''); return; }
    await this.place(id, zone||'');
  },
  //  The division a club intends to enter this team in, changed from the card
  //  itself. It writes the RANK as well as the label — without the rank the team
  //  is invisible to Formation, which reads the rank and nothing else.
  async tSetDivision(v){
    const ts=this.selTeam(); if(!ts) return;
    const rank=v===''?null:Number(v);
    this.tm.dsaved='';
    const {error}=await this.sb.from('team_season')
      .update({division_rank:rank, division_label: rank==null?null:this.fDivLabel(rank)})
      .eq('id', ts.id);
    if(error){ this.tm.err=error.message; return; }
    this.tm.dsaved = rank==null ? 'Division cleared.' : 'Entered as '+this.fDivLabel(rank)+'.';
    await this.loadTeams();
  },

  rosterAvg(tsId){
    const v = this.rosterOf(tsId).map(r=>Number(r.rating)).filter(n=>!isNaN(n));
    return v.length ? (v.reduce((a,b)=>a+b,0)/v.length).toFixed(2) : '';
  },

  // ══ FORMATION ══════════════════════════════════════════════════════════════
  //  The club moves LINES on the cohort's distribution; a team's target is read
  //  off the band they cut. That is the whole of ADR-007: a number typed at a
  //  cohort can be unreachable, a number read off it never is.
  setupTab:'club',
  dash:{busy:false, err:'', pipe:[], queue:[], pool:[], plans:[], ts:[], summary:[]},

  fp:{group:'', basis:'rating', teams:[], cuts:[], cap:10, min:8, lock:true,
      newdiv:1, err:'', busy:false, saved:'', plans:[], scoring:[], drag:null,
      phase:'setup', result:null, resumed:false,
      naming:false, names:{}, pattern:'Div {n}', namesErr:'', gender:'', stale:false,
      /* dashboard state lives beside it */
      lenses:[], lens:'', marks:{}, stars:{}, frozen:null, by:{}, moves:{},
      /* which team_season each column is linked to, and the inline create form.
         NOT remembered between builds — a link is to a team in THIS season. */
      link:{}, nt:{ci:null,name:'',div:'',err:'',busy:false},
      /* accepting: the note that goes on every offer, a cap reason per column,
         and what the database said it wrote */
      acc:{busy:false, err:'', note:'', caps:{}, done:null}},

  /*  VERIFYING WITHOUT LEAVING THE BOARD. Ming, 20 Aug 2026, blocked at accept
      by eight unchecked records: "I want to be able to quickly jump into the
      record and check the list and verify if needed. Or else I need a way to
      save my works so that I don't redo the whole thing again."
      `open` is the person whose admin-reason field is showing.
      TOP LEVEL, BESIDE `qv`, NOT INSIDE `fp.acc` — the accept block is
      reassigned wholesale in places, and a nested state object silently
      disappears when it is. The UI suite caught exactly that. */
  fvfy:{busy:'', err:'', open:'', note:''},

  //  A dashboard row is a way INTO Formation, so it does what arriving at
  //  Formation does — loads it — and only then opens the age group.
  async fFromDash(g){
    await this.openFormation();
    this.fp.gender = this.fGenderOf(g);
    if(!this.fPoolOf(g).length){
      this.fp.err = 'Nothing loaded for ' + g + ' in this season.';
      return;
    }
    this.fOpen(g);
  },

  openPlayersStage(){
    //  Opened from the header the directory is the whole club; opened from a
    //  review row it stays scoped to that session, so clear the scope here.
    this.stage='players'; this.modal='';
    this.pm.returnTo=''; this.pm.editing=false;
  },
  openSetup(){ this.openClubCfg(); this.modal='setup'; },
  //  WHICH STAGES ARE WORKING SURFACES. 1,020px is the reading width — right for
  //  the dashboard, a season, a player card. Teams is an index, a roster and a
  //  pool side by side, and Placement is an index and a ledger; both were being
  //  clipped inside the reading width on a screen with 700px to spare.
  wideStage(){ return this.stage==='teams' || this.stage==='placement'; },

  // ══ PLACEMENT ══════════════════════════════════════════════════════════════
  //  N6 — the season pipeline made visible. Nothing here is a new rule: the two
  //  state machines, the registration gate and the roster sync have all been in
  //  the database and tested since 12 Aug. This is the surface that lets a club
  //  answer them.
  //
  //  ORGANISED BY WHAT NEEDS DOING (Ming, 20 Aug 2026), not by team. A club
  //  chasing forty families across thirteen teams never asks "show me B14 Gold";
  //  it asks "who has not answered". So the index IS the work list, and each list
  //  carries exactly one action.
  pl:{busy:'', err:'', bucket:'answer', decline:'', ref:{}, rows:[]},
  plFeeStates:[{k:'unpaid',label:'Unpaid'},{k:'part_paid',label:'Part'},
               {k:'paid',label:'Paid'},{k:'waived',label:'Waived'}],

  //  ARRIVING WITH A LIST IN MIND. A dashboard tile knows which list it counted,
  //  so it says so — and stays a pure navigation call, which is what keeps the
  //  "the dashboard never writes" test meaningful.
  async openPlacement(bucket){
    this.stage='placement'; this.modal='';
    if(bucket) this.pl.bucket=bucket;
    await this.loadPlacement();
  },
  //  EVERY STAGE OWNS ITS DATA. Switching `stage` fetches nothing, so anything
  //  that arrives here — a header button, a dashboard tile — comes through this.
  async loadPlacement(){
    this.pl.err=''; this.pl.decline='';
    if(!this.seasonId){ this.pl.rows=[]; return; }
    const {data,error} = await this.sb.from('v_season_standing').select('*')
      .eq('season_id', this.seasonId);
    if(error){ this.pl.err = error.message; this.pl.rows=[]; return; }
    this.pl.rows = data||[];
  },

  //  DERIVED ONCE. Every row carries what its row draws — the same rule the
  //  comparison board is built on, for the same reason: a value computed inside
  //  a nested scope does not re-run when the row beside it changes.
  plAll(){
    return (this.pl.rows||[])
      .filter(r => r.person_status !== 'inactive')
      .map(r => {
        const name=(r.given_name+' '+r.family_name).replace('DEMO_','');
        const bits=[];
        if(r.rating!=null) bits.push('rated '+Number(r.rating).toFixed(2));
        else bits.push('not rated');
        //  A DATE ON A LEDGER ROW IS READ, NOT COMPUTED WITH. Formatted off the
        //  ISO string by hand — `new Date()` would shift the day by the local
        //  offset, which is the same trap the session windows carry a rule about.
        if(r.offered_at) bits.push('offered '+this.plDay(r.offered_at));
        //  BINDING IS REGISTRATION, so that is what the standing column says —
        //  never "accepted", which is only an intention until it is registered.
        let standing='training', tone='', standing2='';
        if(r.registered_at){ standing='registered'; tone='ok';
          standing2 = r.registration_ref ? 'ref '+r.registration_ref : 'no reference recorded'; }
        else if(r.offer_response==='accepted'){ standing='accepted'; tone='wn';
          standing2='not registered — the place is not binding yet'; }
        else if(r.offer_response==='declined'){ standing='declined'; tone='';
          standing2='back in the pool, still training with the club'; }
        else if(r.offer_response==='pending'){ standing='waiting on the family'; tone='wn'; }
        return {...r, name, sub:bits.join(' · '), standing, standing2, tone};
      })
      .sort((a,b)=> String(a.family_name).localeCompare(String(b.family_name))
                 || String(a.given_name).localeCompare(String(b.given_name)));
  },
  //  The buckets are a UI ordering, not a data rule — which is why they are
  //  derived here and not baked into the view. Each states the rule it reports
  //  against, because a number without its rule is where a club misreads its own
  //  season (the dashboard does the same thing).
  plBuckets(){
    const all=this.plAll();
    const f=(fn)=>all.filter(fn);
    return [
      {k:'answer', label:'Awaiting an answer', act:'answer', col:'Standing', tone:'wn',
       rule:'A place has been offered and the family has not answered. Accepting puts them on the '
           +'roster; declining takes them off it and returns them to the pool — still training with '
           +'the club. The place is then backfilled by hand, never by re-running the engine.',
       empty:'Nobody is waiting on a family right now.',
       rows:f(r=>r.offer_response==='pending')},
      {k:'register', label:'Accepted, not registered', act:'register', col:'Standing', tone:'wn',
       rule:'A place is binding at REGISTRATION, not at acceptance and not at payment. Registration '
           +'happens on the association’s system — record here that it happened.',
       empty:'Everybody who has accepted is registered.',
       rows:f(r=>r.offer_response==='accepted' && !r.registered_at)},
      {k:'fees', label:'Fees outstanding', act:'fees', col:'Fees',
       rule:'Fees are recorded and chased. They do not hold or release a place — only registration '
           +'does that.',
       empty:'No fees outstanding against a place.',
       rows:f(r=>r.offer_response==='accepted' && (r.fees==='unpaid' || r.fees==='part_paid'))},
      {k:'backfill', label:'Declined — a place to fill', act:'backfill', col:'Standing',
       rule:'The team is one short. Backfill by hand from the pool — re-running the engine would '
           +'reshuffle families who have already been told.',
       empty:'No place has come back.',
       rows:f(r=>r.offer_response==='declined')},
      {k:'training', label:'No place offered', act:'', col:'Standing',
       rule:'Training with the club and not offered a team this season. Offers come out of '
           +'accepting a formation.',
       empty:'Everybody in the pool has been offered a place.',
       rows:f(r=>!r.offer_response)},
      {k:'all', label:'Everyone', act:'', col:'Standing',
       rule:'Every active player in this season, whatever their standing.',
       empty:'No player in this season yet.',
       rows:all},
    ].map(b=>({...b, n:b.rows.length}));
  },
  plDay(iso){
    const m=String(iso||'').slice(0,10).match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if(!m) return '';
    return String(+m[3])+' '+['Jan','Feb','Mar','Apr','May','Jun',
                              'Jul','Aug','Sep','Oct','Nov','Dec'][+m[2]-1];
  },
  plBucket(){ return this.plBuckets().find(b=>b.k===this.pl.bucket) || this.plBuckets()[0]; },
  plRows(){ return this.plBucket().rows; },
  //  the four numbers on the statrow, from the same derivation the lists use
  plCount(k){
    const all=this.plAll();
    if(k==='offered')    return all.filter(r=>r.offer_response).length;
    if(k==='answered')   return all.filter(r=>r.offer_response && r.offer_response!=='pending').length;
    if(k==='registered') return all.filter(r=>r.registered_at).length;
    if(k==='fees')       return all.filter(r=>r.offer_response==='accepted'
                                           && (r.fees==='unpaid'||r.fees==='part_paid')).length;
    return 0;
  },

  //  ── recording the answer ────────────────────────────────────────────────
  //  The database does the rest: `sync_player_season_from_offer` moves the club
  //  relationship and `sync_roster_from_offer` adds or removes the roster row.
  //  This writes ONE column and lets the triggers do what they were built for.
  async plAnswer(r, response){
    if(!r || !r.offer_id) return;
    this.pl.busy=r.person_id; this.pl.err='';
    const {error} = await this.sb.from('team_offer')
      .update({response, responded_at:new Date().toISOString()}).eq('id', r.offer_id);
    this.pl.busy=''; this.pl.decline='';
    if(error){ this.pl.err = error.message; return; }
    await this.loadPlacement();
  },
  //  ── recording the registration ──────────────────────────────────────────
  //  `registered_at` is what makes a place binding, and the trigger refuses
  //  `confirmed` without it — so both go in one statement. Upsert, because a
  //  player with no `player_season` row is in the same state as one whose row
  //  says training: the row simply has not been written yet.
  async plRegister(r){
    if(!r) return;
    this.pl.busy=r.person_id; this.pl.err='';
    const {error} = await this.sb.from('player_season').upsert({
      org_id:this.org.id, season_id:this.seasonId, person_id:r.person_id,
      status:'confirmed', registered_at:new Date().toISOString(),
      registration_ref:(this.pl.ref[r.person_id]||'').trim() || null
    }, {onConflict:'season_id,person_id'});
    this.pl.busy='';
    if(error){ this.pl.err = error.message; return; }
    delete this.pl.ref[r.person_id]; this.pl.ref={...this.pl.ref};
    await this.loadPlacement();
  },
  //  ── recording the fees ──────────────────────────────────────────────────
  //  One click, no dialog: this is repeated dozens of times in a sitting, like
  //  verifying. Fees never gate anything, so nothing else moves with it.
  async plFees(r, fees){
    if(!r) return;
    this.pl.busy=r.person_id; this.pl.err='';
    const {error} = await this.sb.from('player_season').upsert({
      org_id:this.org.id, season_id:this.seasonId, person_id:r.person_id, fees
    }, {onConflict:'season_id,person_id'});
    this.pl.busy='';
    if(error){ this.pl.err = error.message; return; }
    await this.loadPlacement();
  },
  //  A place that has come back is filled on the Teams stage — ON THE TEAM THAT
  //  LOST IT. Ming, 20 Aug 2026: "it doesn't open the team the place was
  //  offered, only to the team management page." Landing a coach in the right
  //  age group and making them find the team again is most of the trip, not the
  //  end of it. The offer carries `team_season_id`, so the roster is one hop.
  async plToTeams(r){
    await this.openTeams();
    if(!r) return;
    if(r.team_age_group) this.selectGroup(r.team_age_group);
    //  selectGroup clears the selection, so the team is chosen after it
    if(r.team_season_id && (this.teamSeasons||[]).some(t=>t.id===r.team_season_id)){
      this.tm.selected = r.team_season_id;
      this.tm.view = 'roster';
    }
  },


  // ── the dashboard: the season at a glance ────────────────────────────────
  //  Everything here is READ from views that already exist. It answers one
  //  question per row — what has to happen next — and every number is a link
  //  into the section that would do it. It decides nothing and writes nothing.
  async openDash(){
    this.stage='dash'; this.dash.err='';
    if(!this.org) return;
    this.dash.busy=true;
    //  The season cards are the first decision on this screen, so what is in
    //  each season loads whether or not one has been chosen yet.
    if(!this.seasonId){
      const {data} = await this.sb.from('v_season_summary').select('*');
      this.dash={...this.dash, busy:false, summary:data||[]};
      return;
    }
    const q = async (t,f) => { let r=this.sb.from(t).select('*');
      if(f) r=r.eq(f[0],f[1]);
      const {data,error}=await r;
      if(error){ this.dash.err=t+': '+error.message; return []; }
      return data||[]; };
    const [pipe,queue,pool,plans,ts,summary] = await Promise.all([
      //  ONE SOURCE FOR WHERE A PLAYER STANDS. `v_season_pipeline` starts from
      //  `player_season`, so a rated child nobody has offered anything is not in
      //  it — and the dashboard and the Placement section would then disagree
      //  about the same season. Both read `v_season_standing` (028).
      q('v_season_standing',['season_id',this.seasonId]),
      q('v_session_queue'),
      q('v_player_pool',['season_id',this.seasonId]),
      q('formation_plan',['season_id',this.seasonId]),
      q('team_season',['season_id',this.seasonId]),
      q('v_season_summary'),          // every season, so the cards can say what is in each
    ]);
    this.dash={...this.dash, busy:false, pipe, queue, pool, plans, ts, summary};
  },
  //  A club runs and plans for a handful of seasons at a time, but it
  //  ACCUMULATES them — so the most recent few are cards and the rest sit
  //  behind one control. Ordered by the year age is reckoned at, newest first,
  //  with the current season pulled to the front of its year.
  //  THE CURRENT SEASON IS ON THE LEFT; WHAT IS AHEAD RUNS TO THE RIGHT.
  //  Ming, 20 Aug 2026. The order used to be newest year first, which put next
  //  summer to the left of the season a club is actually running — the tile you
  //  press ten times a day was never the first one.
  //  Among several current seasons, the one that FINISHES FIRST leads: a club
  //  running winter and summer at once is closing winter out, so that is the one
  //  it is working. Then alphabetical, so the row never reorders itself over a
  //  detail nobody set.
  //  NO CLOCK ANYWHERE. "Ahead" is ordered on `season.year`, the number the CLUB
  //  states, and on the end date it typed — never on today's date. Inferring it
  //  from a clock would break the rule that keeps age eligibility honest.
  dashSeasonOrder(list){
    const end = s => String(s.ends_on || '9999-12-31');   // no end date sorts last in its block
    return (list||[]).slice().sort((a,b) =>
         (b.is_current?1:0) - (a.is_current?1:0)
      || (a.is_current && b.is_current
            ? 0
            : (a.year||0) - (b.year||0))
      || end(a).localeCompare(end(b))
      || String(a.name||'').localeCompare(String(b.name||'')));
  },
  //  IN PLAY — which is exactly "current and future" once a club archives what
  //  is past. Ming, 19 Aug 2026. It needs no date arithmetic, and it must not
  //  have any: `season.year` is a number the CLUB states, never the wall-clock
  //  year, so "future" cannot be inferred from a clock without breaking the rule
  //  that keeps age eligibility honest. The club says what is finished.
  // ── THE SEASON IS CHOSEN ON TILES, EVERYWHERE IT IS CHOSEN ───────────────
  //  Ming, 20 Aug 2026: "make season selection tiles where-ever appropriate
  //  throughout the system." One control, one derivation, one handler — the
  //  alternative is four copies of a dropdown that drift apart, which is how the
  //  dashboard ended up asking the same question in a different shape from every
  //  other screen.
  //
  //  "Appropriate" means: a stage where the season is the SCOPE everything below
  //  is read through. It is not the Season section — there the season is the
  //  subject, not the lens — and it is not Players, which reads the season's
  //  YEAR for age arithmetic and never filters by it.
  //
  //  A WORKING STAGE OFFERS ONLY SEASONS IN PLAY, plus the one already selected
  //  whatever its state, so arriving from the dashboard on an archived season
  //  does not silently jump (the `seasonsForWork` rule, now on the tiles too).
  seasonTiles(){
    const live = this.dashLive();
    const cur = (this.seasons||[]).find(s => s.id === this.seasonId);
    const four = live.slice(0, 4);
    return (cur && !four.some(s => s.id === cur.id)) ? four.concat([cur]) : four;
  },
  seasonTilesOlder(){
    const shown = new Set(this.seasonTiles().map(s => s.id));
    return this.dashLive().filter(s => !shown.has(s.id))
      .concat(this.dashSeasonOrder((this.seasons||[]).filter(s => s.archived_at)))
      .filter(s => !shown.has(s.id));
  },
  //  WHAT CHANGING THE SEASON MEANS IS PER STAGE, AND IT LIVES HERE. Every stage
  //  owns its data and none of it exists until that stage's loader has run — the
  //  same rule that gave Ming an empty Formation modal on 19 Aug.
  async pickSeason(id){
    if(!id) return;
    this.seasonId = id; this.onSeasonChange();
    if(this.stage === 'teams'){ await this.loadTeams(); this.tm.view = 'list'; }
    else if(this.stage === 'formation'){ await this.loadFormation(); this.fReset(); }
    else if(this.stage === 'dash'){ await this.openDash(); }
    else if(this.stage === 'placement'){ await this.loadPlacement(); }
  },
  //  A season change invalidates a proposal built from another season's players.
  fReset(){
