    this.fp.result = null; this.fp.frozen = null; this.fp.moves = {};
    this.fp.resumed = false;
    this.fp.link = {}; this.fNewTeamClose(); this.fp.phase = 'setup'; this.fp.group = '';
    this.fvfy = {busy:'', err:'', open:'', note:''};
  },
  dashLive(){ return this.dashSeasonOrder((this.seasons||[]).filter(s => !s.archived_at)); },
  dashSeasons(){ return this.dashLive().slice(0, 4); },
  //  Seasons ACCUMULATE even unarchived — a club five years in that has never
  //  tidied up still gets a readable screen.
  dashOlder(){
    return this.dashLive().slice(4)
      .concat(this.dashSeasonOrder((this.seasons||[]).filter(s => s.archived_at)));
  },
  dashArchived(){ return (this.seasons||[]).filter(s => s.archived_at).length; },
  //  What is actually in a season, so a card is worth pressing rather than just
  //  a name. Read from v_season_summary, which already counts these.
  //  WHAT IS IN A SEASON, wherever the tiles are drawn. The dashboard loads its
  //  own summary; every other stage has `seasonRows` from boot. Reading only the
  //  dashboard's copy made every tile on Rating, Teams and Formation say
  //  "nothing in it yet" — a card is worth pressing because of what it says, so
  //  a card that says nothing is worse than no card.
  dashSeasonSub(s){
    const r = (this.dash.summary||[]).find(x => x.id === s.id)
           || (this.seasonRows||[]).find(x => x.id === s.id);
    if(!r) return 'nothing in it yet';
    const bits = [];
    if(+r.players) bits.push(r.players + ' player' + (+r.players===1?'':'s'));
    if(+r.teams)   bits.push(r.teams + ' team' + (+r.teams===1?'':'s'));
    if(+r.sessions) bits.push(r.sessions + ' trial' + (+r.sessions===1?'':'s'));
    return bits.length ? bits.join(' · ') : 'nothing in it yet';
  },

  dashRated(){ return this.dash.pool.filter(p=>p.rating!=null).length; },
  dashUnrated(){ return this.dash.pool.filter(p=>p.rating==null).length; },
  dashUnverified(){ return this.dash.pool.filter(p=>p.verification!=='verified').length; },
  dashOffered(){ return this.dash.pipe.filter(r=>r.offer_response).length; },
  dashAccepted(){ return this.dash.pipe.filter(r=>r.offer_response==='accepted').length; },
  dashConfirmed(){ return this.dash.pipe.filter(r=>r.registered_at).length; },
  //  Ming's rule repeated where the number is: a place is binding at
  //  registration, so "waiting" is the offer nobody has answered.
  dashWaiting(){ return this.dash.pipe.filter(r=>r.offer_response==='pending').length; },
  dashSessionsOpen(){ return this.dash.queue.filter(s=>s.status==='open').length; },
  dashSessionsToSettle(){ return this.dash.queue.reduce((a,s)=>a+(+s.to_settle||0),0); },
  dashSessionsLate(){ return this.dash.queue.filter(s=>s.outside_window).length; },
  //  One row per age group: is there a plan, and does it describe the cohort?
  dashGroups(){
    const gs=[...new Set(this.dash.pool.map(p=>p.age_group).filter(Boolean))]
      .sort((a,b)=>this.fByAge(a,b));
    return gs.map(g=>{
      const ps=this.dash.pool.filter(p=>p.age_group===g);
      const plan=this.dash.plans.find(x=>x.age_group===g);
      const named=this.dash.ts.filter(t=>t.age_group===g).length;
      return { g, n:ps.length,
        rated:ps.filter(p=>p.rating!=null).length,
        teams:(plan&&plan.teams&&plan.teams.length)||0,
        named,
        state: !plan||!plan.teams||!plan.teams.length ? 'no plan yet'
             : named>=plan.teams.length ? 'teams named'
             : 'planned, not named' };
    });
  },

  async openFormation(){
    this.stage='formation'; this.fp.err='';
    await this.loadFormation();
  },
  async loadFormation(){
    if(!this.org || !this.seasonId) return;
    const q = async (t, filt) => {
      let r = this.sb.from(t).select('*');
      if(filt) r = r.eq(filt[0], filt[1]);
      const {data,error} = await r;
      if(error){ this.fp.err = t+': '+error.message; return []; }
      return data||[];
    };
    this.clubCfg  = (await q('org_profile'))[0] || this.clubCfg;
    this.teams    = await q('team');
    this.teamSeasons = (await q('team_season',['season_id',this.seasonId])).map(ts => ({
      ...ts, team_name:(this.teams.find(t=>t.id===ts.team_id)||{}).name || '(unnamed)' }));
    this.pool     = await q('v_player_pool',['season_id',this.seasonId]);
    this.fp.plans = await q('formation_plan',['season_id',this.seasonId]);
    //  THE LENSES BELONG TO THE SPORT — defined once, read by every club,
    //  authored by no tenant. The club's sport is on the organisation; if it is
    //  not set, take whichever sport actually declares lenses rather than naming
    //  one here.
    const sports = await q('sport');   // also loaded in load(), this refreshes it
    const mine = sports.find(x=>x.id===this.org?.primary_sport_id);
    this.fp.lenses = ((mine&&mine.lenses&&mine.lenses.length ? mine
                       : sports.find(x=>x.lenses&&x.lenses.length)) || {}).lenses || [];
    if(!this.fp.lens) this.fp.lens=(this.fLensList()[0]||{}).k||'';
    //  Scoring is LAST season's, so take the most recent record per player from
    //  any season earlier than this one.
    const year = (this.seasons.find(s=>s.id===this.seasonId)||{}).year;
    const rows = await q('v_player_scoring');
    const best = {};
    rows.filter(r => year==null || r.year < year)
        .forEach(r => { const b=best[r.person_id];
          if(!b || (r.year||0) > (b.year||0)) best[r.person_id]=r; });
    this.fp.scoring = Object.values(best);
  },

  // ── the club's own numbers, never constants in here ──────────────────────
  fCfg(){ const c=this.clubCfg||{};
    return {growth:+c.age_growth||1.34, step:+c.age_step||0.15, div:+c.age_div||2,
            compound:c.age_shift_compound!==false, cap:+c.squad_cap_default||10}; },

  fByAge(a,b){ return (parseInt(String(a).replace(/\D/g,''))||999)
                    - (parseInt(String(b).replace(/\D/g,''))||999); },
  fAllGroups(){
    return [...new Set(this.pool.filter(p=>p.age_group).map(p=>p.age_group))]
      .sort((a,b)=>this.fByAge(a,b));
  },
  //  A band's gender is whatever the club's own bracket rule put on the end of
  //  its name — "U14 Boys", "U8 Mixed". Read off the groups that exist rather
  //  than named here, because the words are the club's, not the platform's.
  fGenderOf(g){ const w=String(g||'').trim().split(/\s+/); return w.length>1?w[w.length-1]:''; },
  //  Sorted, not in the order the age groups happen to fall — otherwise the
  //  chips reorder themselves the day a club registers a younger cohort.
  fGenders(){
    return [...new Set(this.fAllGroups().map(g=>this.fGenderOf(g)).filter(Boolean))]
      .sort((a,b)=>a.localeCompare(b));
  },
  fGroups(){
    const gs=this.fAllGroups(), all=this.fGenders();
    if(!all.length) return gs;
    const pick = all.includes(this.fp.gender) ? this.fp.gender : all[0];
    if(this.fp.gender!==pick) this.fp.gender=pick;
    return gs.filter(g=>this.fGenderOf(g)===pick);
  },
  fPoolOf(g){ return this.pool.filter(p=>p.age_group===g); },
  fPool(){ return this.fPoolOf(this.fp.group); },
  fMean(a){ const v=a.filter(x=>x!=null); return v.length? v.reduce((x,y)=>x+ +y,0)/v.length : 0; },
  f2(v){ return (Math.round((v||0)*100)/100).toFixed(2); },

  //  A scoring record is a YEAR OLD. Same age group next season means a year's
  //  growth; a band up means older opposition. The club decides whether a mover
  //  gets both — see org_profile.age_shift_compound.
  fPpg(p){
    const r = this.fp.scoring.find(s=>s.person_id===p.person_id);
    if(!r || r.ppg==null) return null;
    const c=this.fCfg(), br=(this.clubCfg?.age_brackets||[]).map(b=>+b.u).sort((a,b)=>a-b);
    const uFor = age => br.find(u=>age<u) || (br[br.length-1]||20);
    const now=uFor(p.age), then=uFor(Math.max(1,p.age-1));
    const steps=(now-then)/2;
    const down=Math.pow(1-c.step, c.div*steps);
    const f = steps>0 ? (c.compound ? c.growth*down : down) : c.growth;
    return +r.ppg * f;
  },
  fVal(p){ return this.fp.basis==='points' ? this.fPpg(p) : (p.rating==null?null:+p.rating); },
  fRated(){ return this.fPool().filter(p=>this.fVal(p)!=null); },
  fMissing(){ return this.fPool().filter(p=>this.fVal(p)==null); },
  fVisible(basis){
    const keep=this.fp.basis; this.fp.basis=basis;
    const n=this.fPool().filter(p=>this.fVal(p)!=null).length;
    this.fp.basis=keep; return n;
  },
  fAxis(){
    if(this.fp.basis!=='points') return {lo:1,hi:5,dp:2,unit:''};
    const v=this.fPool().map(p=>this.fPpg(p)).filter(x=>x!=null);
    return {lo:0,hi:Math.max(2,Math.ceil(Math.max(0,...v)+0.5)),dp:1,unit:' ppg'};
  },
  fPct(v){ const a=this.fAxis(); return ((v-a.lo)/(a.hi-a.lo))*100; },
  fFx(v){ const a=this.fAxis();
    return a.dp===1 ? (Math.round(v*10)/10).toFixed(1)+a.unit : (Math.round(v*100)/100).toFixed(2); },
  // org_profile.division_label is a PATTERN, not a prefix — 'Div {n}', 'Grade {n}',
  // 'A{n}' — exactly like age_group_label 'U{n}'. Substitute; only fall back to
  // appending when a club has typed a pattern with no placeholder in it.
  //  A name the club has typed wins; otherwise the pattern with {n} substituted.
  //  The RANK still orders and bands — this is only what gets printed.
  fDivLabel(d){
    if(d==null) return 'Ungraded';
    const named=(this.clubCfg?.division_names||{})[String(d)];
    if(named && String(named).trim()) return String(named).trim();
    const pat=(this.clubCfg?.division_label||'Div {n}').trim();
    return pat.includes('{n}') ? pat.replace(/\{n\}/g,d) : (pat+' '+d);
  },

  // ── what this association calls its divisions ────────────────────────────
  //  Club-wide, because a division is the association's competition and rank 3
  //  means the same thing in U12 as in U18. Edited here because here is where a
  //  club looks at the names.
  fNameOpen(){
    this.fp.names = {...(this.clubCfg?.division_names||{})};
    this.fp.pattern = this.clubCfg?.division_label || 'Div {n}';
    this.fp.namesErr=''; this.fp.naming=true;
  },
  //  Every rank this club has anywhere — the plans, the teams entered, and the
  //  chips being edited right now — so nothing in use is missing from the list.
  fNameRanks(){
    const r=new Set();
    (this.fp.plans||[]).forEach(p=>(p.teams||[]).forEach(d=>d!=null&&r.add(+d)));
    (this.teamSeasons||[]).forEach(t=>t.division_rank!=null&&r.add(+t.division_rank));
    (this.fp.teams||[]).forEach(d=>d!=null&&r.add(+d));
    return [...r].sort((a,b)=>a-b);
  },
  fNameSet(d,v){
    const n={...this.fp.names};
    if(String(v||'').trim()) n[String(d)]=String(v).trim(); else delete n[String(d)];
    this.fp.names=n;
  },
  //  What the pattern would give — shown beside an empty field so a club can see
  //  what it is overriding before it types.
  fNameFallback(d){
    const pat=(this.fp.pattern||'Div {n}').trim();
    return pat.includes('{n}') ? pat.replace(/\{n\}/g,d) : (pat+' '+d);
  },
  async fSaveNames(){
    this.fp.busy=true; this.fp.namesErr='';
    const {error} = await this.sb.from('org_profile')
      .update({division_names:this.fp.names, division_label:(this.fp.pattern||'Div {n}').trim()})
      .eq('org_id', this.org.id);
    this.fp.busy=false;
    if(error){ this.fp.namesErr=error.message; return; }
    this.clubCfg={...this.clubCfg, division_names:this.fp.names,
                  division_label:(this.fp.pattern||'Div {n}').trim()};
    this.fp.naming=false;
  },

  // ── the plan for one age group ───────────────────────────────────────────
  fPlan(g){
    return this.fp.plans.find(p=>p.age_group===g)
      || {age_group:g, basis:'rating', teams:[], cuts:[], cuts_other:[],
          squad_cap:this.fCfg().cap, min_field:8};
  },
  //  The teams the club intends to ENTER, which is the plan's own list — naming
  //  them happens afterwards (ADR-008), so this cannot be read off the named
  //  teams. Before a plan exists, the named teams are the best available guess
  //  and seed it.
  fTeamsOf(g){
    const p=this.fp.plans.find(x=>x.age_group===g);
    if(p && p.teams && p.teams.length) return p.teams.slice().sort((a,b)=>a-b);
    return this.teamSeasons.filter(ts=>ts.age_group===g)
      .map(ts=>ts.division_rank).filter(d=>d!=null).sort((a,b)=>a-b);
  },
  //  The row is narrow, so the word is said once — 'Div 1 · 3 · 4' — but only when
  //  the club's pattern actually ENDS in the number. 'A{n} Grade' cannot be
  //  collapsed that way, so every team is labelled in full instead.
  fTeamsLabel(g){
    const t=this.fTeamsOf(g);
    if(!t.length) return 'no teams entered';
    const pat=(this.clubCfg?.division_label||'Div {n}').trim();
    if(pat.endsWith('{n}'))
      return pat.replace(/\{n\}$/,'').trim()+' '+t.join(' · ');
    return t.map(d=>this.fDivLabel(d)).join(' · ');
  },
  fGroupSub(g){
    const ps=this.fPoolOf(g);
    return ps.length+' players · avg '+this.f2(this.fMean(ps.map(p=>p.rating)));
  },

  // ── bands ────────────────────────────────────────────────────────────────
  //  Consecutive teams in the SAME division share one band and are balanced
  //  against each other; different divisions are separated by a line.
  fBandsOf(divs, cuts, g){
    const out=[];
    divs.forEach(d=>{ const last=out[out.length-1];
      if(last && last.div===d) last.teams++; else out.push({div:d,teams:1}); });
    const A=this.fAxis();
    const ps=this.fPoolOf(g).filter(p=>this.fVal(p)!=null)
      .sort((a,b)=>this.fVal(b)-this.fVal(a));
    return out.map((b,i)=>{
      const inb=ps.filter(p=>{
        const v=this.fVal(p);
        let k=cuts.length; for(let j=0;j<cuts.length;j++) if(v>=cuts[j]){k=j;break}
        return k===i; });
      const vals=inb.map(p=>this.fVal(p));
      return {...b, i, n:inb.length, avg:this.fMean(vals),
        total:vals.reduce((a,x)=>a+x,0),
        from: i<cuts.length?cuts[i]:A.lo, to: i>0?cuts[i-1]:A.hi,
        per: b.teams? Math.round(inb.length/b.teams*10)/10 : 0};
    });
  },
  fBands(){ return this.fBandsOf(this.fp.teams, this.fp.cuts, this.fp.group); },
  fBandRange(b,i){
    return i===0 ? this.fFx(b.from)+' and above'
      : (i===this.fp.cuts.length ? 'under '+this.fFx(b.to)
         : this.fFx(b.from)+' – '+this.fFx(b.to));
  },
  fThin(g){
    const p=this.fPlan(g), divs=this.fTeamsOf(g);
    if(!divs.length) return 0;
    return this.fBandsOf(divs, p.cuts||[], g)
      .filter(b=>b.n && b.per < (p.min_field||8)).length;
  },
  fLocked(){
    //  already in a team FOR THIS SEASON, and still in this age group
    const ids=new Set(this.teamSeasons.filter(ts=>ts.age_group===this.fp.group).map(ts=>ts.id));
    return this.roster.filter(r=>ids.has(r.team_season_id));
  },

  fSpark(g){
    const ps=this.fPoolOf(g), plan=this.fPlan(g), cuts=plan.cuts||[];
    const keep=this.fp.basis; this.fp.basis = plan.basis||'rating';
    const A=this.fAxis(), N=24, h=new Array(N).fill(0);
    ps.forEach(p=>{ const v=this.fVal(p); if(v==null) return;
      const i=Math.min(N-1,Math.max(0,Math.floor((v-A.lo)/(A.hi-A.lo)*N))); h[i]++; });
    const mx=Math.max(1,...h);
    const out=h.map((v,i)=>{
      const r=A.lo+(i+0.5)/N*(A.hi-A.lo);
      let k=cuts.length; for(let j=0;j<cuts.length;j++) if(r>=cuts[j]){k=j;break}
      return '<i class="b'+Math.min(6,k+1)+'" style="height:'+Math.round(v/mx*100)+'%"></i>';
    }).join('');
    this.fp.basis=keep; return out;
  },
  fBarsHTML(){
    const A=this.fAxis(), N=24, h=new Array(N).fill(0);
    this.fPool().forEach(p=>{ const v=this.fVal(p); if(v==null) return;
      const i=Math.min(N-1,Math.max(0,Math.floor((v-A.lo)/(A.hi-A.lo)*N))); h[i]++; });
    const mx=Math.max(1,...h), cuts=this.fp.cuts;
    return h.map((v,i)=>{
      const r=A.lo+(i+0.5)/N*(A.hi-A.lo);
      let k=cuts.length; for(let j=0;j<cuts.length;j++) if(r>=cuts[j]){k=j;break}
      return '<i class="b'+Math.min(6,k+1)+'" style="height:'+Math.round(v/mx*100)+'%"></i>';
    }).join('');
  },
  fAxisHTML(){
    const A=this.fAxis(), out=[];
    for(let i=0;i<=8;i++){
      const v=+(A.lo+(A.hi-A.lo)*i/8).toFixed(2);
      out.push('<span style="left:'+this.fPct(v)+'%'
        +(i===0?';transform:none':'')+(i===8?';transform:translateX(-100%)':'')+'">'
        +this.fFx(v)+'</span>');
    }
    return out.join('');
  },

  // ── opening one, and the lines ───────────────────────────────────────────
  fOpen(g){
    //  An age group with nobody in it has nothing to band, and a modal with no
    //  distribution in it reads as a broken screen rather than an empty one.
    if(!this.fPoolOf(g).length){
      this.fp.err='No player in '+g+' has a rating in this season yet.';
      return;
    }
    //  REOPENING THE GROUP YOU WERE WORKING ON RESUMES IT. Ming, 20 Aug 2026:
    //  "I need a way to save my works so that I don't redo the whole thing
    //  again." Every hand move on the draft board lived only in `fp`, and this
    //  method cleared it on the way in — so stepping out to check one record
    //  and coming back cost an hour of dragging. Resume only where there is
    //  something to resume: the same age group, a board already frozen, and
    //  past the setup phase. It survives leaving the section; it does NOT
    //  survive a page reload — that is `formation_run`, still to be built, and
    //  the caption says so rather than implying a durability it does not have.
    if(this.fp.group===g && this.fp.result && this.fp.phase!=='setup'){
      this.fp.err=''; this.fp.resumed=true; this.modal='formation'; return;
    }
    this.fp.resumed=false; this.fvfy={busy:'',err:'',open:'',note:''};
    const p=this.fPlan(g);
    this.fp.group=g; this.fp.basis=p.basis||'rating';
    this.fp.cap=p.squad_cap||this.fCfg().cap; this.fp.min=p.min_field||8;
    this.fp.lock=p.lock_placed!==false;
    this.fp.teams=this.fTeamsOf(g).slice();
    this.fp.saved=''; this.fp.err=''; this.fp.phase='setup'; this.fp.result=null;
    this.fp.frozen=null; this.fp.moves={}; this.fp.marks={}; this.fp.stars={};
    this.fp.link={}; this.fp.nt={ci:null,name:'',div:'',err:'',busy:false};
    this.fp.cuts=(p.cuts||[]).map(Number);
    if(this.fp.cuts.length !== this.fBandsOf(this.fp.teams,[],g).length-1) this.fEvenCounts();
    this.modal='formation';
  },
  fAddTeam(d){ this.fp.teams.push(+d); this.fp.teams.sort((a,b)=>a-b); this.fEvenCounts(); },
  fDropTeam(i){ if(this.fp.teams.length<2) return;
    this.fp.teams.splice(i,1); this.fEvenCounts(); },
  fSetBasis(b){ if(this.fp.basis===b) return; this.fp.basis=b; this.fEvenCounts(); },
  fEvenCounts(){
    const g=this.fp.group, bs=this.fBandsOf(this.fp.teams,[],g);
    const ps=this.fRated().sort((a,b)=>this.fVal(b)-this.fVal(a));
    const tot=bs.reduce((a,b)=>a+b.teams,0);
    const cuts=[]; let run=0;
    for(let i=0;i<bs.length-1;i++){
      run+=bs[i].teams;
      const k=Math.round(ps.length*run/tot);
      const hi=ps[k-1]?this.fVal(ps[k-1]):this.fAxis().lo;
      const lo=ps[k]?this.fVal(ps[k]):this.fAxis().lo;
      cuts.push(+((hi+lo)/2).toFixed(2));
    }
    this.fp.cuts=cuts;
    this.fStale();
  },
  fEvenSpan(){
    const bs=this.fBandsOf(this.fp.teams,[],this.fp.group);
    const v=this.fRated().map(p=>this.fVal(p));
    if(!v.length) return;
    const hi=Math.max(...v), lo=Math.min(...v), tot=bs.reduce((a,b)=>a+b.teams,0);
    const cuts=[]; let run=0;
    for(let i=0;i<bs.length-1;i++){ run+=bs[i].teams;
      cuts.push(+(hi-(hi-lo)*run/tot).toFixed(2)); }
    this.fp.cuts=cuts;
    this.fStale();
  },
  //  Anything that changes what the engine would produce marks the teams below
  //  the graph as stale. They are NOT cleared — seeing what the last build gave
  //  while you drag the line is the whole reason they are down there.
  fStale(){ if(this.fp.result) this.fp.stale=true; },
  //  Dragging repaints the number and the bands; nothing heavier runs until the
  //  line is let go. Rebuilding the table on every pointer move destroyed the
  //  very slider under the pointer the first time this was built.
  fDragStart(ev,i){
    ev.preventDefault();
    const box=document.getElementById('flv'); if(!box) return;
    const A=this.fAxis(), st=A.dp===1?10:20, self=this;
    const move=e=>{
      const b=box.getBoundingClientRect();
      let v=A.lo+Math.max(0,Math.min(1,(e.clientX-b.left)/b.width))*(A.hi-A.lo);
      const up=i>0?self.fp.cuts[i-1]-0.05:A.hi;
      const dn=i<self.fp.cuts.length-1?self.fp.cuts[i+1]+0.05:A.lo;
      v=Math.max(dn,Math.min(up,Math.round(v*st)/st));
      self.fp.cuts[i]=+v.toFixed(2);
    };
    const up=()=>{ window.removeEventListener('pointermove',move);
                   window.removeEventListener('pointerup',up);
                   self.fStale(); };
    window.addEventListener('pointermove',move);
    window.addEventListener('pointerup',up);
  },

  async fSavePlan(){
    this.fp.busy=true; this.fp.err=''; this.fp.saved='';
    const row={ org_id:this.org.id, season_id:this.seasonId, age_group:this.fp.group,
      basis:this.fp.basis, teams:this.fp.teams, cuts:this.fp.cuts,
      squad_cap:this.fp.cap, min_field:this.fp.min, lock_placed:!!this.fp.lock,
      updated_by:this.me?.id||null };
    const {error} = await this.sb.from('formation_plan')
      .upsert(row, {onConflict:'season_id,age_group'});
    this.fp.busy=false;
    if(error){ this.fp.err=error.message; return; }
    this.fp.saved='saved';
    await this.loadFormation();
    return true;
  },

  //  THE ENGINE IS NOT IN THIS FILE. It runs as an edge function because this
  //  file is served from a public repository — see CLAUDE.md. The plan is saved
  //  first so the engine reads what is on screen rather than what was last
  //  written, and so a proposal can always be explained by a stored plan.
  async fGenerate(){
    this.fp.err=''; this.fp.result=null; this.fp.busy=true; this.fp.resumed=false;
    const ok = await this.fSavePlan();
    if(!ok){ this.fp.busy=false; return; }
    this.fp.busy=true;
    const {data,error} = await this.sb.functions.invoke('formation',
      {body:{season_id:this.seasonId, age_group:this.fp.group}});
    this.fp.busy=false;
    if(error){
      //  The function returns its reason in the body; supabase-js only gives a
      //  status on the error, so read the body before falling back to it.
      let msg = error.message;
      try{ const b = await error.context?.json?.(); if(b?.error) msg=b.error; }catch(e){}
      this.fp.err = msg; return;
    }
    if(data?.error){ this.fp.err=data.error; return; }
    this.fp.result=data; this.fp.stale=false;
  },
  // ═══ THE PROPOSAL, AND THE DRAFT BOARD ═══════════════════════════════════
  //  Ported from prototype_formation_setup.html. Opening the DRAFT BOARD freezes
  //  the engine's proposal: from then on the engine does not run again and every
  //  change is the coach's, shown against the number its band set. ADR-001 made
  //  visible.
  //
  //  IT IS CALLED A DRAFT, NOT A CONFIRMATION. Ming, 19 Aug 2026:
  //  "let's not call it Confirm a proposal, call it Draft formation workbench or
  //  something not mislead to confirmation." In this product CONFIRMING is what a
  //  head coach does to a rating session — it snapshots `player_rating` and
  //  cannot be reopened. Nothing here writes anything at all; the writing step is
  //  Accept. Reusing the word for a working surface would tell a coach they had
  //  committed something when they had not.

  //  The lenses belong to the SPORT (migration 018). Colour is presentation and
  //  is taken by position from one palette, so adding a sport never touches this
  //  file and no basketball position is named here.
  fLensPalette:['#3c7dc4','#1d9e75','#1F3864','#4d9ec4','#8fc7db','#7b96bd','#c9a227'],
  fLensList(){
    const used=this.clubCfg?.lenses_used||[];
    const all=(this.fp.lenses||[]).map(l=>({...l,
      slots:(l.slots||[]).map((z,i)=>({...z, c:this.fLensPalette[i%this.fLensPalette.length]}))}));
    return used.length ? all.filter(l=>used.includes(l.k)) : all;
  },
  fLens(){ const L=this.fLensList();
    return L.find(l=>l.k===(this.fp.lens||(L[0]||{}).k)) || L[0] || null; },
  fSetLens(k){ this.fp.lens=k; },
  fOther(){ return {k:'', t:'', c:'#a9a69e'}; },
  //  Where a stored value sits when seen through a given lens. Rolls UP, never
  //  down: set somebody fine and the coarse view shows the coarse slot; set them
  //  coarse and the fine view cannot invent which kind, so it says so.
  fSlotIn(lens,stored){
    if(!stored||!lens) return '';
    if(lens.slots.some(x=>x.k===stored.k)) return stored.k;
    const src=this.fLensList().find(l=>l.k===stored.lens);
    const def=src&&src.slots.find(x=>x.k===stored.k);
    if(def&&def.up&&lens.slots.some(x=>x.k===def.up)) return def.up;
    return '';
  },
  //  Keyed on (TEAM, PLAYER), never on the person — the same child can be the
  //  size in one squad and a skill player in another. `team_member.zone` does
  //  exactly this in the schema.
  fMarks(axis){ this.fp.marks=this.fp.marks||{};
    return this.fp.marks[axis]=this.fp.marks[axis]||{}; },
  fZKey(col,pid){ return col+'|'+pid; },
  fSlotOf(col,pid){ const l=this.fLens();
    return l ? this.fSlotIn(l, this.fMarks(l.axis)[this.fZKey(col,pid)]) : ''; },
  fSetZone(pid,col,k){
    const l=this.fLens(); if(!l) return;
    const m=this.fMarks(l.axis), key=this.fZKey(col,pid);
    if(k) m[key]={k:k,lens:l.k}; else delete m[key];
    this.fp.marks={...this.fp.marks};
  },
  fCoarseNote(col,pid){
    const l=this.fLens(); if(!l) return '';
    const st=this.fMarks(l.axis)[this.fZKey(col,pid)];
    if(!st||this.fSlotIn(l,st)) return '';
    const src=this.fLensList().find(x=>x.k===st.lens);
    const def=src&&src.slots.find(x=>x.k===st.k);
    return def?def.t:'';
  },
  //  What this player is on the axes NOT currently on screen — three different
  //  questions about the same child, so the answers to the other two travel
  //  with them.
  fOtherAxes(col,pid){
    const cur=(this.fLens()||{}).axis, out=[];
    this.fLensList().forEach(l=>{
      if(l.axis===cur) return;
      const st=this.fMarks(l.axis)[this.fZKey(col,pid)];
      const slot=st&&l.slots.find(x=>x.k===st.k);
      if(slot) out.push(slot.t);
    });
    return out;
  },
  fToggleStar(col,pid){ const key=this.fZKey(col,pid);
    if(this.fp.stars[key]) delete this.fp.stars[key]; else this.fp.stars[key]=true;
    this.fp.stars={...this.fp.stars}; },
  fIsStar(col,pid){ return !!this.fp.stars[this.fZKey(col,pid)]; },
  fSlotsWithOther(){ const l=this.fLens();
    return l ? l.slots.concat([{...this.fOther(), t:l.empty||'Other'}]) : []; },
  fInSlot(col,players,k){ return players.filter(p=>this.fSlotOf(col,p.person_id)===k); },

  //  THE BOARD IS DERIVED ONCE, and the markup only walks what this returns.
  //
  //  It was built the obvious way first — an x-for over the columns, and each
  //  slot's players recomputed inside it from the loop variable. On 19 Aug 2026
  //  that rendered eleven names under a header reading ten: a hand move updated
  //  the column header, which reads the loop variable directly, but not the
  //  nested lists, which re-derive from it in a child scope Alpine had already
  //  settled. Both were reading the same `col`; only one had been told it moved.
  //
  //  One derivation removes the whole class of bug: there is nothing left to go
  //  out of step with, because there is only one thing.
  //  THE RATING SHAPE, ONE PER TEAM. Ming, 19 Aug 2026: "in the team comparison
  //  modal, I also want to see the chart for ratings as in TMS."
  //
  //  Same picture as the TMS and as this app's player card: `radarSVG()` with
  //  its geometry untouched, rings at 1..5 and the 3-ring dashed as the
  //  reference. What changes is what is plotted — the TEAM's average on each
  //  measure against the AGE GROUP's own profile, dashed. That is the same
  //  comparison the bars on the proposal card make; a coach reading a squad
  //  wants the outline, and reading two squads side by side wants two outlines.
  //
  //  Nothing is encoded by colour alone: the two series differ by dash as well
  //  as colour, and every value is written out beneath.
  //  Every player carries their per-measure scores, so a column can be redrawn
  //  after a hand move. If they DO NOT — an older engine, a payload that lost
  //  them — the shape must not be drawn: a radar of zeros looks like a squad
  //  with no ability rather than a screen with no data, and on 19 Aug 2026 it
  //  did exactly that on Ming's screen.
  fHasCat(players){ return players.some(p => Array.isArray(p.cat) && p.cat.length); },
  fRadar(players){
    const labs = this.fp.result?.categories || [];
    if(!labs.length || !players.length || !this.fHasCat(players)) return '';
    const mine = labs.map((_,ci) =>
      this.fMean(players.map(p => (p.cat && p.cat[ci]!=null) ? p.cat[ci] : null)));
    //  the cohort's own profile, from the run — not a nominal 3
    const prof = this.fp.result?.cohort?.profile?.cat || [];
    return this.radarSVG(labs, [
      {vals: labs.map((_,ci)=> prof[ci] ?? null), stroke:'#8A8A80', dash:'4 3', w:1.3,
       fill:'rgba(138,138,128,.08)'},
      {vals: mine, stroke:'#1F3864', fill:'rgba(31,56,100,.20)', w:2, dot:true},
    ], 190);
  },
  //  The shape a column has RIGHT NOW — after any hand moves — so the picture
  //  and the roster under it never disagree.
  fColShape(col){
    const labs = this.fp.result?.categories || [];
    const prof = this.fp.result?.cohort?.profile?.cat || [];
    return labs.map((label,ci) => {
      const got = this.fMean(col.players.map(p => (p.cat && p.cat[ci]!=null) ? p.cat[ci] : null));
      return { i:ci, label, got, want: prof[ci] ?? null,
               dev: prof[ci]==null ? 0 : got - prof[ci] };
    });
  },

  fBoard(){
    const slots=this.fSlotsWithOther();
    return this.fLiveCols().map((col,ci)=>{
      const n=col.players.length||1;
      const buckets=slots.map(z=>{
        const inz=col.players.filter(p=>this.fSlotOf(ci,p.person_id)===z.k);
        return {...z, n:inz.length, w:100*inz.length/n, players:inz};
      });
      return {...col, ci, slots:buckets,
      //  DERIVED HERE, NOT IN THE MARKUP — same rule as `ref`. The header, the
      //  link control and the accept panel all read one value.
      ref_team:this.fLinkedTeam(ci),
        title:buckets.map(z=>z.n+' '+z.t).join(' · '),
        //  DERIVED HERE, NOT IN THE MARKUP. Called from inside an x-if in the
        //  column header it was captured in a child scope Alpine had already
        //  settled, so a hand move changed the average beside it and left the
        //  projected score on the frozen proposal's number. Same defect as the
        //  eleven-names-under-a-header-of-ten: one derivation, nothing to drift.
        ref:this.fColRef(col),
        moveIn:col.players.filter(p=>this.fp.moves[p.person_id]!=null).length,
        moveOut:col.ids.filter(id=>this.fp.moves[id]!=null&&this.fp.moves[id]!==ci).length};
    });
  },

  // ── naming: propose, never decide (ADR-008) ──────────────────────────────
  //  The TMS prefix rule, unchanged: B / G / U plus the number.
  fPrefix(g){
    const t=String(g||'').toUpperCase();
    const n=(t.match(/\d+/)||[''])[0];
    return (t.includes('GIRL')?'G':t.includes('BOY')?'B':'U')+n;
  },
  // ── A PROPOSAL IS ANONYMOUS; THE DRAFT BOARD LINKS IT ────────────────────
  //  Ming, 20 Aug 2026: "I only want to see them as team 1, team 2, team 3 etc
  //  shown. Then, in the draft board, I want to be able to select and link team
  //  names for that age group for that season, should they have been created,
  //  or, if not already created, be able to jump to team creation and create new
  //  ones. I don't want team names to be cached, I just want to use what has
  //  been created in the same season already or create new ones."
  //
  //  This REPLACES the proposal-from-last-season rule in ADR-008, on Ming's
  //  instruction. What it was doing: matching each band to the team that ran the
  //  nearest division last year, then falling back to any spare club name, then
  //  inventing "B14 Team 3". Three layers of guessing, and the top one is the
  //  dangerous one — it reads LAST season's Gold onto a band drawn from THIS
  //  season's players, which is precisely the assumption the whole rating
  //  exercise exists to avoid.
  //
  //  The only names offered now are `team_season` rows already entered in this
  //  (season, age group). Nothing is remembered, nothing is inferred, and a name
  //  that does not exist yet is CREATED — explicitly, by the club, in the season
  //  it belongs to.
  fSqLabel(i){ return 'Team '+(i+1); },
  //  The teams entered in this age group this season, with the one already
  //  linked to another column marked so it cannot be linked twice.
  fLinkable(ci){
    const g=this.fp.group, taken=this.fp.link||{};
    return (this.teamSeasons||[])
      .filter(ts=>ts.season_id===this.seasonId && (ts.age_group||'')===(g||''))
      .map(ts=>({id:ts.id, name:ts.team_name,
                 div:ts.division_label||ts.division||'',
                 used:Object.keys(taken).some(k=>+k!==+ci && taken[k]===ts.id)}))
      .sort((a,b)=>a.name.localeCompare(b.name));
  },
  fLinkTo(ci, tsId){
    this.fp.link = {...(this.fp.link||{})};
    if(!tsId) delete this.fp.link[ci]; else this.fp.link[ci]=tsId;
  },
  fLinkedTeam(ci){
    const id=(this.fp.link||{})[ci]; if(!id) return null;
    return (this.teamSeasons||[]).find(ts=>ts.id===id) || null;
  },
  fUnlinked(){ return this.fBoard().filter(c=>!this.fLinkedTeam(c.ci)).length; },
  //  JUMP TO TEAM CREATION — without leaving the draft. Navigating to the Teams
  //  stage would throw away every hand move made so far, so the same act happens
  //  here: it writes a real `team` and a real `team_season` in THIS season and
  //  age group, under the same rules the Teams stage uses, and links it.
  //  ALWAYS AN OBJECT, never null — `x-model` cannot bind through a null, and
  //  Alpine evaluates a template's bindings once more as it tears the block
  //  down, so nulling it throws on the way out. `ci` says which column it is
  //  open on, and null means closed.
  fNewTeamOpen(ci){
    this.fp.nt = {ci, name:'', div:'', err:'', busy:false};
  },
  fNewTeamClose(){ this.fp.nt = {ci:null, name:'', div:'', err:'', busy:false}; },
  fNewTeamTidy(){ return this.tmTidy(this.fp.nt?.name||''); },
  //  THE SAME PREFIX PROPOSAL AS THE TEAMS STAGE. Ming, 20 Aug 2026: "I like the
  //  autocomplete name function in teams… I want that in the formation draft
  //  board for new teams as well." Same rule, same words, same button — a club
  //  that meets a convention in one place and not the other learns that the
  //  product is inconsistent rather than that the convention is worth following.
  //  PROPOSED, NEVER IMPOSED (ADR-008): what was typed is left alone.
  fNtProposed(){
    const n=(this.fp.nt?.name||'').trim(), p=this.fp.group ? this.fPrefix(this.fp.group) : '';
    if(!n || !p) return '';
    return n.toUpperCase().startsWith(p.toUpperCase()+' ') ? '' : p+' '+n;
  },
  fNtUsePrefix(){ const n=this.fNtProposed(); if(n) this.fp.nt = {...this.fp.nt, name:n}; },
  fNewTeamOpenOn(ci){ return this.fp.nt && this.fp.nt.ci===ci; },
  async fNewTeamSave(){
    const nt=this.fp.nt; if(!nt || nt.ci===null) return;
    const name=this.tmTidy(nt.name);
    if(!name){ this.fp.nt.err='A team needs a name.'; return; }
    this.fp.nt.busy=true; this.fp.nt.err='';
    let team=(this.teams||[]).find(t=>t.name.toLowerCase()===name.toLowerCase());
    if(!team){
      const {data,error}=await this.sb.from('team')
        .insert({org_id:this.org.id, name}).select().single();
      if(error){ this.fp.nt.err=error.message; this.fp.nt.busy=false; return; }
      team=data;
    }
    const divText=(nt.div||'').trim();
    const divRank=divText ? (divText.match(/\d+/)||[null])[0] : null;
    const {data:ts,error}=await this.sb.from('team_season').insert({
      org_id:this.org.id, season_id:this.seasonId, team_id:team.id,
      age_group:this.fp.group, division:divText||null, division_label:divText||null,
      division_rank:divRank!==null ? Number(divRank) : null}).select().single();
    this.fp.nt.busy=false;
    if(error){
      this.fp.nt.err = /one_entry_per_age_group|already entered in/.test(error.message)
        ? name+' is already entered in '+this.fp.group+'. Pick it from the list instead.'
        : error.message;
      return;
    }
    await this.loadFormation();
    this.fLinkTo(nt.ci, ts.id);
    this.fNewTeamClose();
  },

  // ── the draft board: the frozen proposal, and what the coach does to it ──
  fOpenDraft(){
    this.fp.frozen=(this.fp.result?.squads||[]).map(sq=>({
      division_rank:sq.division_rank, ordinal:sq.ordinal,
      target:sq.target, target_total:sq.target_total,
      ids:sq.players.map(p=>p.person_id) }));
    this.fp.by={}; (this.fp.result?.squads||[]).forEach(sq=>sq.players
      .forEach(p=>this.fp.by[p.person_id]=p));
    this.fp.moves={}; this.fp.phase='draft';
  },
  fBackToSetup(){ this.fp.phase='setup'; },
  fRestoreProposal(){ this.fp.moves={}; },
  fMovePlayer(pid,to){
    const home=this.fp.frozen.findIndex(s=>s.ids.includes(pid));
    if(to===home) delete this.fp.moves[pid]; else this.fp.moves[pid]=to;
    this.fp.moves={...this.fp.moves};
  },
  fMoved(pid){ return this.fp.moves[pid]!=null; },
  //  Where everybody sits right now: the frozen proposal plus the coach's moves.
  fLiveCols(){
    const cols=(this.fp.frozen||[]).map(s=>({...s, players:[]}));
    (this.fp.frozen||[]).forEach((s,i)=>s.ids.forEach(id=>{
      const to=this.fp.moves[id]!=null?this.fp.moves[id]:i;
      if(cols[to]&&this.fp.by[id]) cols[to].players.push(this.fp.by[id]);
    }));
    cols.forEach(c=>c.players.sort((a,b)=>(b.value||0)-(a.value||0)
      || a.person_id.localeCompare(b.person_id)));
    return cols;
  },
  fColNow(col){ const v=col.players.map(p=>p.value).filter(x=>x!=null);
    return this.fp.basis==='points' ? v.reduce((a,x)=>a+x,0) : this.fMean(v); },
  fColTgt(col){ return this.fp.basis==='points' ? col.target_total : col.target; },
  fColOff(col){ const d=Math.abs(this.fColNow(col)-this.fColTgt(col));
    return this.fp.basis==='points' ? d>2 : d>0.2; },
  fColVs(col){ return this.fp.basis==='points'
    ? Math.round(this.fColNow(col))+' vs '+Math.round(this.fColTgt(col))+' pts'
    : this.f2(this.fColNow(col))+' vs '+this.f2(this.fColTgt(col)); },
  fColIn(col,i){ return col.players.filter(p=>this.fp.moves[p.person_id]!=null).length; },
  fColOut(col,i){ return col.ids.filter(id=>this.fp.moves[id]!=null&&this.fp.moves[id]!==i).length; },
  fMovedCount(){ return Object.keys(this.fp.moves||{}).length; },

  // ═══ ACCEPTING ═══════════════════════════════════════════════════════════
  //  The last step, and the only one in Formation that writes anything about a
  //  child. Everything below it — the teams, the rosters, the offers — is ONE
  //  call to `accept_formation`, which is one transaction. Four inserts from
  //  here would leave a club with half a season if the third failed.
  //
  //  DERIVED ONCE, like the board. Nothing in the accept panel calls a method
  //  from inside a nested scope; the row carries everything the row draws.
  fAcceptRows(){
    return this.fBoard().map(col=>{
      //  CARRY THE ID, NOT ONLY THE NAME — and the three fields the association's
      //  registration is reconciled against. A name can be read; a record can be
      //  acted on. This is what lets the refusal be cleared in place instead of
      //  sending the coach to another section and losing the board.
      const unver=col.players.map(p=>{
        const r=(this.pool||[]).find(x=>x.person_id===p.person_id);
        if(!r || r.verification==='verified') return null;
        return {id:p.person_id,
                name:(p.given_name+' '+p.family_name).replace('DEMO_',''),
                dob:r.dob||'—', gender:r.gender||'—', grp:r.age_group||'—'};
      }).filter(Boolean);
      return { ci:col.ci, band:this.fSqLabel(col.ci),
        team:col.ref_team||null, name:col.ref_team?col.ref_team.team_name:'',
        div:this.fDivLabel(col.division_rank),
        rank:col.division_rank, n:col.players.length,
        over:Math.max(0,col.players.length-this.fp.cap),
        note:this.fp.acc.caps[col.ci]||'', unver:unver,
        unverT:unver.map(u=>u.name).join(', '),
        vs:col.players.length?this.fColVs(col):'' };
    });
  },
  //  WHAT WOULD BE REFUSED, SAID BEFORE THE CLUB PRESSES ANYTHING. The database
  //  refuses all of this too and is the enforcement — this is the same answer,
  //  early, so a club fixes everything in one pass instead of discovering it one
  //  error at a time with a hundred and fifty children in front of them.
  fAcceptStops(){
    const rows=this.fAcceptRows(), out=[];
    //  EVERY BAND MUST BE LINKED TO A TEAM THAT EXISTS. Ming, 20 Aug 2026: the
    //  proposal is anonymous, so this is where the mapping is checked.
    const loose=rows.filter(r=>!r.team).map(r=>r.band);
    if(loose.length) out.push({k:'link', t:loose.join(', ')+
      (loose.length===1?' is not linked to a team':' are not linked to a team'),
      how:'Link each one on the draft board, or create the team there.'});
    //  Two bands pointed at one team would be one roster written twice. The
    //  select already marks a linked team as taken; this is the guard behind it.
    const seen={}, twice=[];
    rows.forEach(r=>{ if(!r.team) return;
      if(seen[r.team.id] && twice.indexOf(r.name)<0) twice.push(r.name);
      seen[r.team.id]=1; });
    if(twice.length) out.push({k:'twice',
      t:twice.join(', ')+(twice.length===1?' is':' are')+' linked to more than one band',
      how:'One team can only take one roster. Link the others to a different team.'});
    //  THE STOP CARRIES THE RECORDS, so it can be cleared where it is raised.
    //  A player can appear in only one band, but dedupe on the id anyway — the
    //  list is what gets acted on and a name is not a key.
    const seenP={}, unver=[];
    rows.forEach(r=>r.unver.forEach(u=>{ if(seenP[u.id]) return;
      seenP[u.id]=1; unver.push(u); }));
    if(unver.length) out.push({k:'unver', people:unver, t:unver.length+
      (unver.length===1?' record has':' records have')+' not been checked against the registration: '+
      unver.map(u=>u.name).join(', '),
      how:'Check each one here — the gate is on the offer, not on the rating, and nothing on this board is lost.'});
    const caps=rows.filter(r=>r.over>0 && !r.note.trim()).map(r=>r.name||('#'+(r.ci+1)));
    if(caps.length) out.push({k:'cap', t:caps.join(', ')+
      (caps.length===1?' is':' are')+' over the squad cap of '+this.fp.cap,
      how:'Say why beside each of them, or move somebody.'});
    return out;
  },
  fAcceptCount(){ return this.fAcceptRows().reduce((a,r)=>a+r.n,0); },
  //  ── CLEARING THE VERIFICATION STOP WHERE IT IS RAISED ───────────────────
  //  Ming, 20 Aug 2026, blocked at accept with eight unchecked records and an
  //  hour of hand moves on the board behind him. Sending him to Players to tick
  //  them was the screen telling him to throw his work away — the run is
  //  live-only until N7 persists it, so leaving the modal loses the draft.
  //
  //  This is the SAME three acts as the player card, in the same order, with the
  //  same rule: `admin` must say why, the other two write immediately. It is not
  //  a bulk tick and must not become one — a gate that can be cleared for
  //  everybody at once is not a gate. The count on screen is what makes a run
  //  through eight of them feel finite.
  async fVerify(id, src){
    const note=(this.fvfy.note||'').trim();
    if(src==='admin' && !note){ this.fvfy.err='Say why you are standing behind this record.'; return; }
    this.fvfy.busy=id; this.fvfy.err='';
    const {error}=await this.sb.from('person').update({
      verification:'verified', verified_source:src, verified_by:this.me?.id,
      verified_note: src==='admin' ? note : null }).eq('id', id);
    this.fvfy.busy='';
    if(error){ this.fvfy.err=error.message; return; }
    this.fvfy.open=''; this.fvfy.note='';
    //  The write succeeded, so the row is verified. Patch it rather than
    //  refetching the pool: a refetch is a second source of truth for the board
    //  to disagree with, and the board is the thing being protected here.
    const p=(this.pool||[]).find(x=>x.person_id===id);
    if(p){ p.verification='verified'; p.verified_source=src; this.pool=[...this.pool]; }
    const q=(this.people||[]).find(x=>x.id===id);
    if(q){ q.verification='verified'; q.verified_source=src; }
  },
  //  What the coach is actually being asked. Verification is RECONCILIATION —
  //  the club matches the association's registration, which is already
  //  parent-attested and paid against. It is never a "confirm your details"
  //  email to the family.
  fVerifyWhy(){ return 'Checking a record means matching it to the association’s registration — '
    +'the name, the date of birth and the gender the child is registered under. '
    +'It is not a second birthday check, and it is not a question for the parent.'; },
  async fAccept(){
    //  IT ALWAYS ANSWERS THE PRESS. Returning silently was survivable while the
    //  button disabled itself; now that it does not, a press with something
    //  outstanding has to say what. The list is already on screen — this names
    //  the count so the eye is sent to it.
    const stops=this.fAcceptStops();
    if(stops.length){
      this.fp.acc.err = stops.length===1
        ? 'One thing is still outstanding — it is listed below.'
        : stops.length+' things are still outstanding — they are listed below.';
      return;
    }
    this.fp.acc.busy=true; this.fp.acc.err=''; this.fp.acc.done=null;
    const squads=this.fBoard().map(col=>({
      //  THE LINKED ENTRY, BY ID. The club chose a team that already exists in
      //  this season and age group, so accepting points at it rather than
      //  creating anything by name.
      team_season_id:col.ref_team ? col.ref_team.id : null,
      name:col.ref_team ? col.ref_team.team_name : '',
      division_rank:col.division_rank,
      division_label:this.fDivLabel(col.division_rank),
      target_value:this.fColTgt(col)==null?null:Number(this.fColTgt(col)),
      target_basis:this.fp.basis,
      cap_note:(this.fp.acc.caps[col.ci]||'').trim()||null,
      players:col.players.map(pl=>({
        person_id:pl.person_id,
        zone:(this.fMarks('zone')[this.fZKey(col.ci,pl.person_id)]||{}).k||null,
        role:(this.fMarks('role')[this.fZKey(col.ci,pl.person_id)]||{}).k||null,
        position:(this.fMarks('position')[this.fZKey(col.ci,pl.person_id)]||{}).k||null,
        star:!!this.fp.stars[this.fZKey(col.ci,pl.person_id)] }))
    }));
    const {data,error}=await this.sb.rpc('accept_formation',{
      p_season:this.seasonId, p_age_group:this.fp.group,
      p_squads:squads, p_note:(this.fp.acc.note||'').trim()||null});
    this.fp.acc.busy=false;
    if(error){ this.fp.acc.err=error.message; return; }
    this.fp.acc.done=data;
    //  the Teams stage reads team_season and the roster, so both have to be
    //  refetched or the club goes looking for teams that are already there
    await this.loadFormation();
    if(this.stage==='teams') await this.loadTeams();
  },
  //  Straight to the rosters that were just written — the club's next move is
  //  always to look at them.
  async fAcceptToTeams(){
    this.modal=''; this.fp.phase='setup'; this.fp.acc.done=null;
    await this.openTeams();
  },
  //  The reference basis travels with the column, and states its own coverage.
  fColRef(col){
    if(!col.players.length) return null;
    if(this.fp.basis==='points'){
      const r=col.players.map(p=>p.rating).filter(x=>x!=null);
      return {label:'coach rating', text:this.f2(this.fMean(r)),
              note:r.length===col.players.length?'':r.length+' of '+col.players.length+' on record'};
    }
    const have=col.players.filter(p=>p.ppg!=null);
    return {label:'projects to score',
      text: have.length?Math.round(have.reduce((a,p)=>a+p.ppg,0))+' pts/game':'—',
      note: have.length===col.players.length?'':have.length+' of '+col.players.length+' on record'};
  },
  fVfx(v){ return v==null?'—':(this.fp.basis==='points'
    ? (Math.round(v*10)/10).toFixed(1) : this.f2(v)); },
  fLensNote(){ const a=(this.fLens()||{}).axis;
    return {zone:'how the squad is built', role:'what a player does',
            position:'where a player lines up'}[a] || ''; },

  // ── drag and drop, one delegated set of handlers as the TMS does it ──────
  fDragStartPlayer(ev,pid){ ev.dataTransfer.setData('text/plain',pid); },
  //  Dropping ON a zone moves the player AND sets what they are in that team;
  //  dropping on the team but not a zone is a plain move and leaves it alone.
  fDrop(ev,col,zone){
    const pid=ev.dataTransfer.getData('text/plain'); if(!pid) return;
    this.fMovePlayer(pid,col);
    if(zone!==undefined) this.fSetZone(pid,col,zone);
  },

  fRefText(s){
    const r=s.reference; if(!r) return '';
    const v = r.label==='coach rating' ? this.f2(r.value) : Math.round(r.value)+' pts/game';
    return r.label+' '+v + (r.covered===r.of ? '' : ' ('+r.covered+' of '+r.of+' on record)');
  },
  fSqDev(s){ return s.average - s.target; },
  fSqOff(s){ return this.fp.basis==='points'
    ? Math.abs(s.total-s.target_total)>2 : Math.abs(this.fSqDev(s))>0.2; },
  fSqVs(s){ return this.fp.basis==='points'
    ? Math.round(s.total)+' vs '+Math.round(s.target_total)+' pts/game'
    : this.f2(s.average)+' vs '+this.f2(s.target); },
  //  A bar left of centre is a category this team is short in. Every value is
  //  also written out — nothing here is encoded by colour alone.
  fBarStyle(dev){
    const d=Math.max(-1.5,Math.min(1.5,dev)), w=Math.abs(d)/1.5*50;
    return d>=0 ? 'left:50%;width:'+w+'%' : 'left:'+(50-w)+'%;width:'+w+'%';
  },

  ageGroupsInSeason(){
    return [...new Set(this.teamSeasons.map(ts=>ts.age_group))]
      .sort((a,b)=> (parseInt(String(a).replace(/\D/g,''))||999)
                  - (parseInt(String(b).replace(/\D/g,''))||999));
  },
  teamSeasonsIn(g){
    if(g === undefined) return [];
    return this.teamSeasons.filter(ts=>ts.age_group===g)
      .sort((a,b)=>a.team_name.localeCompare(b.team_name));
  },
  // every age group the club's own banding produces for this season's players
  allAgeGroups(){
    return [...new Set(this.pool.map(p=>p.age_group).filter(Boolean))]
      .sort((a,b)=> (parseInt(String(a).replace(/\D/g,''))||999)
                  - (parseInt(String(b).replace(/\D/g,''))||999));
  },
  poolAll(){ return this.pool.filter(p=>p.status!=='inactive'); },
  placedPeople(){ return new Set(this.roster.map(r=>r.person_id)); },
  placedCount(){ return this.roster.length; },
  placedInGroup(g){
    return new Set(this.roster
      .filter(r=>r.age_group===g).map(r=>r.person_id));
  },
  poolShown(){
    const t = this.selTeam(); const q = this.tm.q.trim().toLowerCase();
    const inGrp = t ? this.placedInGroup(t.age_group) : new Set();
    return this.poolAll().filter(p => {
      if(this.tm.scope==='grp' && t && t.age_group && p.age_group !== t.age_group) return false;
      if(this.tm.hidePlaced && inGrp.has(p.person_id)) return false;
      if(!q) return true;
      return (p.given_name+' '+p.family_name).toLowerCase().includes(q);
    }).sort((a,b)=> (b.rating||0)-(a.rating||0)
        || (a.family_name+a.given_name).localeCompare(b.family_name+b.given_name));
  },

  // Ported from the TMS `elig`: on age, plays up, plays down, or refused on
  // gender. An age gap is a judgement; a gender mismatch is a rule.
  eligible(playerGroup, gender, teamGroup){
    if(!teamGroup) return {k:'on2', s:'—'};
    if(!playerGroup) return {k:'no', s:'no age group'};
    if((teamGroup.includes('Boys')  && gender==='F') ||
       (teamGroup.includes('Girls') && gender==='M')) return {k:'no', s:'wrong group'};
    if(playerGroup === teamGroup) return {k:'on2', s:'on age'};
    const n = g => parseInt(String(g).replace(/\D/g,''),10) || 0;
    return n(teamGroup) < n(playerGroup)
      ? {k:'dn', s:'plays down'} : {k:'up', s:'plays up'};
  },
  eligOf(p){ return this.eligible(p.age_group, p.gender, this.selTeam()?.age_group); },
  eligRow(r){ return this.eligible(r.natural_group, r.gender, r.age_group); },

  //  ONE NAME PER AGE GROUP, AND CASE IS NOT A DIFFERENCE. Ming, 19 Aug 2026:
  //  "The only ban of same name would be within a same age group in the same
  //  season. Auto correct capital letters and don't differ them in the data as
  //  most team admins are not as diligent."
  //
  //  Gold in U14 and Gold in U16 of one season are ORDINARY — two entries
  //  against one club-level name. Two Golds in one age group are the pair
  //  nobody can tell apart on a team sheet, and that is the only refusal.
  tmPrefix(){ return this.tm.grp ? this.fPrefix(this.tm.grp) : ''; },
  //  PROPOSED, NEVER IMPOSED, and now genuinely optional — it is a convention a
  //  club may like, not the way out of a constraint. Naming is the club's
  //  (ADR-008).
  tmProposed(){
    const n=(this.tm.name||'').trim(), p=this.tmPrefix();
    if(!n || !p) return '';
    return n.toUpperCase().startsWith(p.toUpperCase()+' ') ? '' : p+' '+n;
  },
  tmUsePrefix(){ const n=this.tmProposed(); if(n) this.tm={...this.tm, name:n}; },
  //  THE SPELLING ON FILE WINS — the same rule the database applies, applied on
  //  screen so the club sees it happen rather than being surprised by it. Typing
  //  "gold" where "Gold" is on file gives you Gold; a brand-new name typed with
  //  no capitals at all gets its words capitalised, and a name with any capital
  //  anywhere is left exactly as typed (McTavish, B14 Gold, iCoach).
  tmTidy(n){
    const t=String(n||'').trim().replace(/\s+/g,' ');
    if(!t) return '';
    const known=(this.teams||[]).find(x=>x.name.toLowerCase()===t.toLowerCase());
    if(known) return known.name;
    return t===t.toLowerCase()
      ? t.replace(/\b[a-z]/g, c=>c.toUpperCase()) : t;
  },
  //  What the name will actually be recorded as, shown when it differs from what
  //  was typed. Derived once and rendered — never called from a nested scope.
  tmTidied(){
    const typed=(this.tm.name||'').trim(), tidy=this.tmTidy(typed);
    return (tidy && tidy!==typed) ? tidy : '';
  },
  //  The one refusal: this name is already entered IN THIS AGE GROUP.
  tmNameStop(){
    const n=this.tmTidy(this.tm.name); if(!n) return null;
    const team=(this.teams||[]).find(t=>t.name.toLowerCase()===n.toLowerCase());
    if(!team) return null;
    const here=(this.teamSeasons||[]).find(ts=>ts.team_id===team.id
      && ts.season_id===this.seasonId
      && (ts.age_group||'')===(this.tm.grp||''));
    if(!here) return null;
    return { t:team.name+' is already entered in '+(this.tm.grp||'this season with no age group')+'.',
      how:'Two squads of one name are one team on a team sheet. Give this one a name of its own — '
          +(this.tmPrefix()?this.tmPrefix()+' in front of it is the usual way.':'') };
  },
  async createTeam(){
    this.tm.err='';
    const stop=this.tmNameStop();
    if(stop){ this.tm.err=stop.t+' '+stop.how; return; }
    this.tm.busy=true;
    const name = this.tmTidy(this.tm.name);
    let team = this.teams.find(t => t.name.toLowerCase() === name.toLowerCase());
    if(!team){
      const {data,error} = await this.sb.from('team')
        .insert({org_id:this.org.id, name}).select().single();
      if(error){ this.tm.err=error.message; this.tm.busy=false; return; }
      team = data;
    }
    //  A division is a RANK and a printable LABEL. What is typed is what gets
    //  printed; the digits in it are what orders and bands. Without the rank this
    //  team is invisible to Formation, which reads the rank and nothing else.
    const divText = this.tm.div.trim();
    const divRank = divText ? (divText.match(/\d+/)||[null])[0] : null;
    const {error} = await this.sb.from('team_season').insert({
      org_id:this.org.id, season_id:this.seasonId, team_id:team.id,
      age_group:this.tm.grp || null, division:divText || null,
      division_label:divText || null,
      division_rank:divRank!==null ? Number(divRank) : null});
    this.tm.busy=false;
    if(error){
      this.tm.err = /one_entry_per_age_group|already entered in/.test(error.message)
        ? name+' is already entered in '+(this.tm.grp||'this season')+'.'
        : error.message;
      return;
    }
    this.tm={...this.tm, adding:false, name:'', div:''};
    await this.loadTeams();
  },
  selectTeam(id){ this.tm.selected=id; this.tm.err=''; },

  // ── the age group is the index; a team is what you do inside one ──────────
  //  Ming, 19 Aug 2026: "Age group on the left, teams on the right, choose edit
  //  to edit team information, choose roster to see team roster."
  selectGroup(g){
    this.tm.grpSel = g; this.tm.view='list'; this.tm.adding=false;
    this.tm.err=''; this.tm.selected='';
  },
  //  A NEW TEAM STARTS IN THE GROUP YOU ARE STANDING IN. The field is still
  //  there and still changeable — the group is proposed, not imposed — but a
  //  club entering four U14 teams should not pick U14 four times.
  startTeam(){
    this.tm = {...this.tm, adding:true, name:'', div:'',
               grp:this.tm.grpSel || (this.allAgeGroups()[0]||'')};
  },
  openTeamEdit(id){
    const ts=this.teamSeasons.find(x=>x.id===id); if(!ts) return;
    this.tm = {...this.tm, selected:id, view:'edit', adding:false, err:'', esaved:'',
               ename:ts.team_name||'', egrp:ts.age_group||'',
               ediv:ts.division_label||ts.division||''};
  },
  openTeamRoster(id){
    this.tm = {...this.tm, selected:id, view:'roster', adding:false, err:''};
  },
  //  TWO WRITES, AND THEY ARE DIFFERENT THINGS. The name is club-level and
  //  changing it changes the team in every season it has ever run in; the age
  //  group and the division belong to THIS season's entry. The screen says so.
  async saveTeam(){
    const ts=this.selTeam(); if(!ts) return;
    this.tm.err=''; this.tm.esaved=''; this.tm.busy=true;
    const name=this.tmTidy(this.tm.ename);
    if(name && name.toLowerCase()!==String(ts.team_name||'').toLowerCase()){
      const {error} = await this.sb.from('team').update({name}).eq('id', ts.team_id);

  // ── forming teams ──────────────────────────────────────────────────────
  // The engine itself is NOT here. It runs as a Supabase Edge Function, because
  // this file is served from a public repository and the solver is the one
  // piece of the product worth protecting. All this does is describe the teams,
  // ask, and show what came back.
  parsePlan(text){
    // "Gold 8, Navy 8 F, U12 White 10" -> [{label,size,gender}]
    return String(text).split(',').map(x => x.trim()).filter(Boolean).map(part => {
      const m = part.match(/^(.*?)\s+(\d+)\s*([FM])?$/i);
      if(!m) return {label: part, size: 10, gender: null};
      return {label: m[1].trim(), size: Number(m[2]),
              gender: m[3] ? m[3].toUpperCase() : null};
    }).filter(t => t.label && t.size > 0);
  },

  async runFormation(s){
    this.fm.err = ''; this.fm.busy = true; this.fm.sessionId = s.id;
    const teams = this.parsePlan(this.fm.plan);
    if(!teams.length){ this.fm.busy=false; this.fm.err='Describe at least one team.'; return; }
    const dup = teams.map(t=>t.label).filter((l,i,a)=>a.indexOf(l)!==i);
    if(dup.length){ this.fm.busy=false; this.fm.err='Two teams cannot share the name "'+dup[0]+'".'; return; }
    const {data, error} = await this.sb.functions.invoke('formation', {
      body: {session_id: s.id, teams}
    });
    this.fm.busy = false;
    if(error){ this.fm.err = error.message || String(error); return; }
    if(data?.error){ this.fm.err = data.error; return; }
    this.fm.result = data;
  },

    this.fm.err = '';

        team_label: label, locked_by: this.me.id

      if(error){ this.fm.err = error.message; return; }

    await this.runFormation(s);

  async addBlock(){
    this.blockErr=''; this.err='';
    const s = this.sel;
    if(!this.newBlock.date){ this.blockErr='Pick a date for this day.'; return; }
    const lo = s.opens_at.slice(0,10), hi = s.closes_at.slice(0,10);
    if(this.newBlock.date < lo || this.newBlock.date > hi){
      this.blockErr = `That day is outside the session window (${lo} to ${hi}).`; return;

    if(this.newBlock.end <= this.newBlock.start){

      ends_at:this.newBlock.end, venue:this.newBlock.venue,
      sort_order:this.blocks.length+1
    });

  // ── the number ─────────────────────────────────────────────────────────
  meanOf(personId){

  sessionMean(){
