<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coaching Platform</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
/* ── Design tokens lifted from the TMS (build/src/app.css). Keep in step. ── */
:root{--bg:#f6f5f2;--card:#fff;--line:#e3e1db;--line2:#cfccc4;--ink:#1c1b19;--ink2:#5f5e5a;
--ink3:#8b8981;--navy:#1F3864;--navy2:#e8edf5;--ok:#0f6e56;--okbg:#e1f5ee;--okline:#9fe1cb;
--warn:#854f0b;--warnbg:#faeeda;--warnline:#fac775;--bad:#a32d2d;--badbg:#fcebeb;--badline:#f7c1c1;
--acc:#534ab7;--accbg:#eeedfe;--accline:#cecbf6;--sh:0 6px 24px rgba(28,27,25,.16);--hh:52px}
html,body{margin:0;height:100%}
body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
background:var(--bg);color:var(--ink)}
button{font:inherit}
[x-cloak]{display:none!important}

header{background:var(--navy);color:#fff;padding:9px 16px;display:flex;align-items:center;gap:10px;
flex-wrap:wrap;position:fixed;top:0;left:0;right:0;z-index:60;height:var(--hh);box-sizing:border-box}
header h1{font-size:15px;font-weight:600;margin:0}
header .sub{font-size:11px;opacity:.7}
header .spacer{flex:1}
.hb{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);
padding:6px 11px;border-radius:6px;cursor:pointer;font-size:12.5px}
.hb:hover{background:rgba(255,255,255,.26)}
.hb.pri{background:#fff;color:var(--navy);border-color:#fff;font-weight:600}
.hb:disabled{opacity:.45;cursor:default}

#shell{padding-top:var(--hh)}
.stage{max-width:1020px;margin:18px auto 60px;padding:0 16px}
.stage.narrow{max-width:520px;margin-top:60px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;
margin-bottom:14px}
.rhead{padding:14px 18px;border-bottom:1px solid var(--line);background:#fbfaf8}
.rhead h2{margin:0;font-size:19px;font-weight:600}
.rhead .sub{font-size:12.5px;color:var(--ink2);margin-top:3px}
.pbody{padding:12px 18px 16px}
.statrow{display:flex;gap:20px;flex-wrap:wrap;padding:11px 18px;background:#fbfaf8;
border-bottom:1px solid var(--line);font-size:12px;color:var(--ink2)}
.statrow div{min-width:76px}
.statrow b{display:block;font-size:17px;color:var(--ink);font-weight:600;line-height:1.25}
.warnbar{margin:0;padding:9px 18px;background:var(--warnbg);border-bottom:1px solid var(--warnline);
color:var(--warn);font-size:12.5px}
.okbar{margin:0;padding:9px 18px;background:var(--okbg);border-bottom:1px solid var(--okline);
color:var(--ok);font-size:12.5px}
.note{font-size:11.5px;color:var(--ink2);margin:8px 0 0}
.empty{padding:26px 16px;text-align:center;color:var(--ink3);font-size:13.5px}

.chips{display:flex;gap:4px;flex-wrap:wrap}
.c{font-size:10px;padding:2px 6px;border-radius:9px;border:1px solid var(--line2);color:var(--ink2);
background:#f7f6f3;white-space:nowrap}
.c.grp{background:var(--navy2);border-color:#c2cfe3;color:var(--navy);font-weight:600}
.c.acc{background:var(--accbg);border-color:var(--accline);color:var(--acc);font-weight:600}
.c.ok{background:var(--okbg);border-color:var(--okline);color:var(--ok);font-weight:600}
.c.wn{background:var(--warnbg);border-color:var(--warnline);color:var(--warn);font-weight:600}
.cath{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;color:var(--ink2);
text-transform:uppercase;letter-spacing:.04em;margin:12px 0 5px}
.cath:first-child{margin-top:0}
.rgrp{margin-bottom:14px}.rgrp:last-child{margin-bottom:0}
.cath b{margin-left:auto;font-weight:600;color:var(--ink3)}

.jt{width:100%;border-collapse:collapse;font-size:12.5px}
.jt th,.jt td{border:1px solid var(--line);padding:5px 7px;text-align:left}
.jt th{background:#fbfaf8;font-weight:600;font-size:11.5px}
.scroll{max-height:270px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.scroll .jt th{position:sticky;top:0;z-index:1}
.scroll .jt th,.scroll .jt td{border-left:0;border-top:0}

input[type=text],input[type=email],input[type=date],input[type=time],select,textarea{
font:12.5px inherit;padding:5px 8px;border:1px solid var(--line2);border-radius:6px;
background:#fff;color:var(--ink);box-sizing:border-box}
input:focus,select:focus,textarea:focus{outline:2px solid var(--navy2);border-color:var(--navy)}
textarea{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}
label.fl{display:block;font-size:11px;color:var(--ink2);margin:0 0 3px}
.field{margin-bottom:10px}
.field input,.field select,.field textarea{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1px solid var(--line2);background:#fff;border-radius:6px;padding:6px 12px;
cursor:pointer;font-size:12.5px;color:var(--ink)}
.btn:hover{background:#fbfaf8}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.btn.pri:hover{background:#2b4a7d}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:3px 8px;font-size:11.5px}
.err{color:var(--bad);font-size:12px;margin:6px 0 0}
.msg{color:var(--ok);font-size:12px;margin:6px 0 0}
.lnk{background:none;border:0;color:var(--ink3);font-size:11.5px;text-decoration:underline;
cursor:pointer;padding:0}

.srow{border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:7px;background:#fff}
.srow:hover{border-color:var(--line2)}
.sflex{display:flex;align-items:center;gap:10px}
.sflex .body{flex:1;min-width:0}
.nm{font-weight:600;font-size:13px}
.meta{font-size:11px;color:var(--ink2);margin-top:2px}
.sdet{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.inline{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.scale{display:flex;gap:4px}
.sv{border:1px solid var(--line2);background:#fff;border-radius:6px;width:38px;height:32px;
cursor:pointer;font-size:13px;font-weight:600;color:var(--ink2);padding:0}
.sv:hover{border-color:var(--navy);color:var(--navy)}
.sv.on{background:var(--navy);border-color:var(--navy);color:#fff}
.mrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .lb{flex:1;font-size:13px;font-weight:600}
.plist{max-height:60vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.pitem{display:flex;align-items:center;gap:8px;padding:6px 9px;border-bottom:1px solid var(--line);
cursor:pointer;font-size:12.5px}
.pitem:last-child{border-bottom:0}
.pitem:hover{background:#fbfaf8}
.pitem.on{background:var(--navy2);font-weight:600}
.pitem .st{margin-left:auto;font-size:10px;color:var(--ink3)}
.split{display:grid;grid-template-columns:240px 1fr;gap:14px}
tr.flag td{background:var(--warnbg)}
pre.sql{background:#fbfaf8;border:1px solid var(--line);border-radius:7px;padding:9px 11px;
font-size:11px;overflow-x:auto;margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* ── the player card. Same tokens, deliberately NOT a ledger. ──────────
   The review table is a ledger — you scan it. This is one player, so it reads
   as rows of evidence: the measure, what each pass said, and where the mean
   sits on the scale. Value first, colour second — every number is on screen,
   the bar only repeats it. ── */
.pc{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.pcr{display:flex;align-items:center;gap:12px;padding:9px 12px;border-bottom:1px solid var(--line)}
.pcr:last-child{border-bottom:0}
.pcr:nth-child(even){background:#fcfbf9}
.pcr .lb{width:132px;flex:none;font-size:13px;font-weight:600}
.pcr .passes{display:flex;gap:4px;flex:none}
.pv{width:26px;height:26px;border-radius:6px;border:1px solid var(--line2);background:#fff;
display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;
color:var(--ink2)}
.pv.none{color:var(--ink3);background:#f7f6f3}
.meter{flex:1;min-width:70px;height:7px;border-radius:4px;background:#efeee9;position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--navy);
display:block}
.pcr .mn{width:38px;flex:none;text-align:right;font-size:14px;font-weight:600}
.pcr .sp{width:52px;flex:none;text-align:right;font-size:11px;color:var(--ink3)}
.pcr.wide{border-left:3px solid var(--warnline);background:var(--warnbg)}
.pcr.settled{border-left:3px solid var(--okline);background:var(--okbg)}
.pcr.gap{border-left:3px solid var(--line2)}
.pcr.gap .lb,.pcr.gap .mn{color:var(--ink3)}
.pcr.settled .meter{background:#c8ebdd}
.pcr.settled .meter i{background:var(--ok)}
.pcr .act{flex:none}
.rz{padding:10px 12px;background:#fbfaf8;border-top:1px solid var(--line)}
.rz .opt{display:flex;align-items:center;gap:9px;padding:7px 9px;border:1px solid var(--line);
border-radius:8px;margin-bottom:5px;background:#fff;cursor:pointer;font-size:12.5px}
.rz .opt:hover{border-color:var(--navy)}
.rz .opt.on{border-color:var(--navy);background:var(--navy2);font-weight:600}
.rz .opt .v{width:26px;height:26px;border-radius:6px;background:var(--navy);color:#fff;flex:none;
display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12.5px}
.rz .opt.on .v{background:var(--ok)}
.pcr.wide .meter{background:#f0dfc2}
.pcr.wide .sp{color:var(--warn);font-weight:600}
.shape{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.shape .leg{font-size:11.5px;color:var(--ink2);min-width:150px}
.shape .leg div{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.shape .leg i{width:16px;height:0;border-top-width:2px;border-top-style:solid;display:block;flex:none}
.vals{margin-top:8px;border-top:1px solid var(--line)}
.vrow{display:flex;align-items:center;gap:9px;padding:4px 0;border-bottom:1px solid var(--line)}
.vrow .l{flex:1;min-width:0;font-size:12.5px}
.vrow .n{font-size:13px;font-weight:600;width:38px;text-align:right}
.trend{width:100%;overflow-x:auto}
.tline{display:flex;align-items:flex-end;gap:2px;height:34px}
.tline b{flex:1;min-width:5px;background:var(--navy);border-radius:2px 2px 0 0;display:block}
.dlt{font-size:11px;font-weight:600}
.dlt.up{color:var(--ok)} .dlt.dn{color:var(--bad)} .dlt.flat{color:var(--ink3)}
.sess{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--line);
border-radius:9px;margin-bottom:6px;background:#fff}
.sess .body{flex:1;min-width:0}
.sess .t{font-size:13px;font-weight:600}
.sess .d{font-size:11px;color:var(--ink2);margin-top:1px}
.sess .big{font-size:19px;font-weight:600;line-height:1}
@media (max-width:640px){
 .pcr{flex-wrap:wrap}
 .pcr .lb{width:100%}
 .meter{display:none}
}
/* ── courtside: the coach's own device. Same tokens, bigger targets. ── */
.court{max-width:560px;margin:0 auto}
.qbar{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:9px;
font-size:12.5px;margin-bottom:11px;border:1px solid}
.qbar.wait{background:var(--warnbg);border-color:var(--warnline);color:var(--warn)}
.qbar.done{background:var(--okbg);border-color:var(--okline);color:var(--ok)}
.qbar .spacer{flex:1}
.prow{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);
border-radius:10px;margin-bottom:7px;background:#fff;cursor:pointer}
.prow:active{background:#fbfaf8}
.prow .nm{flex:1;min-width:0;font-size:15px;font-weight:600}
.prow .who{font-size:11px;color:var(--ink2);font-weight:400;display:block;margin-top:1px}
.mrow.big{padding:11px 0}
.mrow.big .lb{font-size:15px}
.scale.big{gap:6px}
.scale.big .sv{width:46px;height:44px;font-size:16px}
@media (max-width:600px){
 .scale.big .sv{width:100%;flex:1}
 .stage{padding:0 11px}
}
/* modals — TMS pattern */
.modal{position:fixed;inset:0;background:rgba(28,27,25,.5);z-index:80;display:flex;
align-items:flex-start;justify-content:center;padding:44px 18px;overflow:auto}
.modal .box{background:var(--card);border-radius:13px;width:100%;max-width:880px;
overflow:hidden;box-shadow:var(--sh)}
.modal .box.sm{max-width:560px}
.mhead{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;
gap:10px;background:#fbfaf8}
.mhead h3{margin:0;font-size:16px;font-weight:600;flex:1}
.mhead .x{border:1px solid var(--line2);background:#fff;border-radius:5px;width:24px;height:24px;
cursor:pointer;color:var(--ink3);font-size:14px;line-height:1;padding:0}
.mhead .x:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.mbody{padding:12px 18px 18px;max-height:70vh;overflow:auto}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:12.5px}
.kv dt{color:var(--ink2)}
.kv dd{margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;
word-break:break-all}
</style>
</head>
<body>
<div x-data="app()" x-init="boot()" x-cloak
     @keydown.escape.window="pm.open ? (pm.open=false) : (modal='')">

<!-- ────────────────────────── SETUP ────────────────────────── -->
<template x-if="screen==='setup'">
<div>
  <header><div><h1>Coaching Platform</h1><div class="sub">first-time setup</div></div></header>
  <div id="shell"><div class="stage narrow">
    <div class="panel">
      <div class="rhead"><h2>Connect to your database</h2>
        <div class="sub">One-time. Both values come from Supabase — Settings → API.
          They are stored only in this browser.</div></div>
      <div class="pbody">
        <div class="field"><label class="fl">Project URL</label>
          <input type="text" x-model="cfg.url" placeholder="https://xxxxxxxx.supabase.co"></div>
        <div class="field"><label class="fl">Anon public key</label>
          <textarea x-model="cfg.key" rows="3" placeholder="eyJhbGciOi..."></textarea>
          <p class="note">Use the <b>anon public</b> key. Never paste the service_role key into a browser.</p></div>
        <button class="btn pri" @click="saveCfg()" :disabled="!cfg.url||!cfg.key">Connect</button>
        <p x-show="err" x-text="err" class="err"></p>
      </div>
    </div>
  </div></div>
</div>
</template>

<!-- ────────────────────────── SIGN IN ────────────────────────── -->
<template x-if="screen==='signin'">
<div>
  <header><div><h1>Coaching Platform</h1><div class="sub">sign in</div></div></header>
  <div id="shell"><div class="stage narrow">
    <div class="panel">
      <div class="rhead"><h2>Sign in</h2>
        <div class="sub">We email you a link. No password to remember.</div></div>
      <div class="pbody">
        <div class="field"><label class="fl">Email address</label>
          <input type="email" x-model="email" placeholder="you@example.com"></div>
        <button class="btn pri" @click="signIn()" :disabled="!email||busy"
          x-text="busy?'Sending…':'Email me a sign-in link'"></button>
        <p x-show="msg" x-text="msg" class="msg"></p>
        <p x-show="err" x-text="err" class="err"></p>
        <p class="note"><button class="lnk" @click="resetCfg()">Change database connection</button></p>
      </div>
    </div>
  </div></div>
</div>
</template>

<!-- ────────────────────────── APP ────────────────────────── -->
<template x-if="screen==='app'">
<div>
  <header>
    <div>
      <h1 x-text="org?.name || 'Coaching Platform'"></h1>
      <div class="sub">
        <span x-text="me?.display_name || userEmail"></span>
        <template x-if="me"><span> · <span x-text="me.role.replace('_',' ')"></span>
          · seniority <span x-text="me.seniority"></span></span></template>
      </div>
    </div>
    <div class="spacer"></div>
    <template x-if="org">
      <span>
        <button class="hb" :class="stage==='court'?'pri':''"
                @click="stage==='court' ? (stage='admin') : openCourt()"
                x-text="stage==='court' ? 'Club' : 'Courtside'"></button>
        <button class="hb" x-show="stage==='admin'" @click="modal='players'">Players…</button>
        <button class="hb" x-show="stage==='admin'" @click="modal='rubrics'">Rubrics…</button>
      </span>
    </template>
    <button class="hb" @click="modal='more'">More…</button>
  </header>

  <div id="shell"><div class="stage">

    <!-- ══════════════════ COURTSIDE — the coach's own device ══════════════════
         Same app, same tokens, phone-shaped. A coach sees only the sessions they
         are authorised for. Ratings save to THIS DEVICE first and upload when
         there is a connection — a school hall on trial night is exactly where a
         live-only form dies, mid-rating, with a child standing in front of you.
         Nobody is pre-assigned: the list shows who has already been rated and by
         whom, and coaches pick up whoever has not been. -->
    <template x-if="stage==='court'">
      <div class="court">
        <div class="qbar" :class="queue.length ? 'wait' : 'done'">
          <b x-text="queue.length ? queue.length + (queue.length===1?' rating waiting':' ratings waiting')
                                  : 'Everything is saved'"></b>
          <span class="spacer"></span>
          <span x-show="!online" class="c wn">offline</span>
          <button class="btn sm" x-show="queue.length" :disabled="syncing || !online"
                  @click="flushQueue()" x-text="syncing?'Sending…':'Send now'"></button>
        </div>
        <p class="note" x-show="queue.length && !online" style="margin:-6px 0 11px">
          No connection. Keep rating — everything is held on this device and goes up by itself
          when you are back.</p>

        <!-- A refusal is not a network problem and must never be retried into a loop.
             The database said no; the coach is told what it said and decides. -->
        <template x-if="rejected.length">
          <div class="panel" style="border-color:var(--badline);margin-bottom:11px">
            <div class="rhead" style="background:var(--badbg);border-color:var(--badline)">
              <h2 style="font-size:15px">
                <span x-text="rejected.length"></span>
                <span x-text="rejected.length===1?'rating was not accepted':'ratings were not accepted'"></span>
              </h2>
              <div class="sub">These did not fail to send — they reached the database and it refused
                them. Nothing is lost; nothing will be retried on its own.</div>
            </div>
            <div class="pbody">
              <template x-for="r in rejected" :key="r.id">
                <div style="padding:8px 0;border-bottom:1px solid var(--line)">
                  <div style="font-size:13px;font-weight:600" x-text="nameOfPerson(r.person_id)"></div>
                  <div class="note" style="margin:2px 0 6px" x-text="r.reason"></div>
                  <div class="inline" style="margin:0">
                    <button class="btn sm" @click="requeueRejected(r.id)">Try again</button>
                    <button class="btn sm" @click="discardRejected(r.id)">Discard</button>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>
        <p x-show="court.err" x-text="court.err" class="err" style="margin-top:0"></p>

        <!-- pick a session -->
        <template x-if="!court.session">
          <div class="panel">
            <div class="rhead"><h2>Your rating sessions</h2>
              <div class="sub">Only sessions you have been authorised to rate in.</div></div>
            <div class="pbody">
              <template x-if="!court.sessions.length">
                <div class="empty">Nothing open for you right now. The club opens a session and
                  authorises you before it appears here.</div>
              </template>
              <template x-for="s in court.sessions" :key="s.id">
                <div class="prow" @click="pickCourtSession(s)">
                  <div class="nm"><span x-text="s.name"></span>
                    <span class="who"><span x-text="s.opens_at?.slice(0,10)"></span> →
                      <span x-text="s.closes_at?.slice(0,10)"></span></span></div>
                  <span class="c grp" x-text="s.status"></span>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- the squad -->
        <template x-if="court.session && !court.person">
          <div class="panel">
            <div class="rhead" style="display:flex;align-items:center;gap:10px">
              <div style="flex:1">
                <h2 x-text="court.session.name"></h2>
                <div class="sub"><span x-text="courtDone()"></span> of
                  <span x-text="court.people.length"></span> rated by anyone</div>
              </div>
              <button class="btn sm" @click="court.session=null;court.person=null">Back</button>
            </div>
            <div class="pbody">
              <p class="note" style="margin:0 0 9px">Nobody is assigned. Pick up whoever has not
                been rated — the list shows who already has.</p>
              <template x-for="p in court.people" :key="p.id">
                <div class="prow" @click="pickCourtPlayer(p)">
                  <div class="nm"><span x-text="p.given_name+' '+p.family_name"></span>
                    <span class="who" x-text="courtWho(p.id)"></span></div>
                  <span class="c" :class="courtMine(p.id) ? 'ok' : (courtRated(p.id) ? 'grp' : '')"
                        x-text="courtMine(p.id) ? 'you' : (courtRated(p.id) ? 'rated' : 'to do')"></span>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- rate one player -->
        <template x-if="court.person">
          <div class="panel">
            <div class="rhead" style="display:flex;align-items:center;gap:10px">
              <div style="flex:1">
                <h2 x-text="(court.person?.given_name||'')+' '+(court.person?.family_name||'')"></h2>
                <div class="sub"><span x-text="Object.keys(court.scores).length"></span> of
                  <span x-text="courtMeasures().length"></span> scored</div>
              </div>
              <button class="btn sm" @click="court.person=null">Back</button>
            </div>
            <div class="pbody">
              <p class="warnbar" style="border-radius:8px;border:1px solid var(--warnline);margin-bottom:10px"
                 x-show="courtMine(court.person?.id)">
                You have already rated this player in this session. Rating again is allowed and both
                are kept — the head coach sees the spread.</p>
              <template x-for="m in courtMeasures()" :key="m.id">
                <div class="mrow big">
                  <span class="lb" x-text="m.label"></span>
                  <div class="scale big">
                    <template x-for="v in scaleOf(m)" :key="v">
                      <button class="sv" :class="court.scores[m.id]===v?'on':''"
                              @click="court.scores[m.id]=v" x-text="v"></button>
                    </template>
                  </div>
                </div>
              </template>
              <div class="field" style="margin-top:10px">
                <label class="fl">Note (optional)</label>
                <input type="text" x-model="court.note" placeholder="anything worth recording">
              </div>
              <div class="inline" style="margin-top:0">
                <button class="btn pri" @click="saveCourt()"
                        :disabled="!Object.keys(court.scores).length">Save and next</button>
                <button class="btn" @click="court.scores={};court.note=''">Clear</button>
              </div>
              <p class="note">Saved on this device straight away. It goes up on its own — you do not
                have to wait for it. A saved rating cannot be edited; a correction is a resolution by
                the head coach.</p>
              <p x-show="court.msg" x-text="court.msg" class="msg"></p>
            </div>
          </div>
        </template>
      </div>
    </template>

    <template x-if="stage==='admin'">
    <div>

    <!-- no membership -->
    <template x-if="!org">
      <div class="panel">
        <div class="rhead"><h2>No organisation yet</h2>
          <div class="sub">You are signed in, but not a member of any organisation.</div></div>
        <p class="warnbar">This is the security model working. With no membership row the database
          returns nothing at all — not an error, just nothing.</p>
        <div class="pbody">
          <p class="note" style="margin-top:0">Run this in the Supabase SQL Editor to join the demo
            club. Your user id is already filled in.</p>
          <pre class="sql">insert into membership (user_id, org_id, display_name, role, seniority)
values (
  '<span x-text="userId"></span>',
  '11111111-0000-0000-0000-000000000001',
  'Your Name', 'head_coach', 10
);</pre>
          <p><button class="btn pri" @click="load()">I've done that — reload</button></p>
        </div>
      </div>
    </template>

    <!-- the working surface: rating sessions -->
    <template x-if="org">
    <div class="panel">
      <div class="rhead" style="display:flex;align-items:flex-start;gap:10px">
        <div style="flex:1">
          <h2>Rating sessions</h2>
          <div class="sub">A multi-day trial is one session. Days are added inside it.</div>
        </div>
        <button class="btn" @click="newSession.open=!newSession.open"
                x-text="newSession.open?'Cancel':'New session'"></button>
      </div>
      <div class="statrow">
        <div><b x-text="sessions.length"></b>sessions</div>
        <div><b x-text="sessions.filter(s=>s.status==='open').length"></b>open</div>
        <div><b x-text="sessions.filter(s=>s.status==='confirmed').length"></b>confirmed</div>
        <div><b x-text="waitingCount()"></b>waiting on you</div>
        <div><b x-text="toSettleCount()"></b>calls to make</div>
        <div><b x-text="people.length"></b>players</div>
      </div>
      <div class="statrow" style="padding-top:8px;padding-bottom:8px" x-show="waitingCount()">
        <div style="min-width:0;display:flex;gap:6px;align-items:center;flex-wrap:wrap">
          <button class="btn sm" :class="onlyWaiting ? 'pri' : ''"
                  @click="onlyWaiting=!onlyWaiting"
                  x-text="onlyWaiting ? 'Showing what is waiting' : 'Show only what is waiting'"></button>
          <span class="note" style="margin:0">A session appears here once anybody in it is fully
            rated, or a disagreement is waiting on your call.</span>
        </div>
      </div>
      <p x-show="err" class="warnbar" style="display:flex;gap:10px;align-items:center">
        <span style="flex:1" x-text="err"></span>
        <button class="lnk" style="color:var(--warn)" @click="err=''">dismiss</button>
      </p>

      <div class="pbody">
        <div x-show="newSession.open" class="srow" style="background:#fbfaf8">
          <div class="field"><label class="fl">Session name</label>
            <input type="text" x-model="newSession.name" placeholder="e.g. U14 Trials 2027"></div>
          <div class="row2">
            <div class="field"><label class="fl">First day</label>
              <input type="date" x-model="newSession.opens"></div>
            <div class="field"><label class="fl">Last day</label>
              <input type="date" x-model="newSession.closes" :min="newSession.opens"></div>
          </div>
          <div class="field"><label class="fl">Rubric — most clubs want Core</label>
            <select x-model="newSession.rubric_id">
              <template x-for="r in rubrics" :key="r.id">
                <option :value="r.id" x-text="r.name+' ('+measuresOf(r.id).length+' measures)'"></option>
              </template>
            </select></div>
          <p class="note" style="margin-bottom:8px">Every day you add must fall on or between
            these two dates.</p>
          <button class="btn pri" @click="createSession()"
            :disabled="!newSession.name||!newSession.opens||!newSession.closes||busy">Create session</button>
          <p x-show="err" x-text="err" class="err"></p>
        </div>

        <template x-if="!sessions.length"><div class="empty">No sessions yet.</div></template>

        <template x-for="s in visibleSessions()" :key="s.id">
          <div class="srow">
            <div class="sflex">
              <div class="body">
                <div class="nm" x-text="s.name"></div>
                <div class="meta">
                  <span x-text="s.opens_at?.slice(0,10)"></span> →
                  <span x-text="s.closes_at?.slice(0,10)"></span>
                  · <span x-text="rubricName(s.rubric_id)"></span>
                  <span class="c" :class="rubricLevel(s.rubric_id)==='core'?'grp':'acc'"
                        x-text="rubricLevel(s.rubric_id)==='core'?'5 measures':'10 measures'"></span>
                </div>
              </div>
              <span class="c" :class="{'':s.status==='draft','grp':s.status==='open',
                    'wn':s.status==='closed','ok':s.status==='confirmed'}" x-text="s.status"></span>
              <span class="c wn" x-show="q(s.id)?.outside_window"
                    title="Ratings are gated by status, never the clock — this is a reminder, not a block"
                    >outside its window</span>
              <span class="c acc" x-show="q(s.id)?.to_settle"
                    x-text="q(s.id)?.to_settle + ' to settle'"></span>
              <span class="c" x-show="q(s.id)?.complete"
                    x-text="q(s.id)?.complete + '/' + q(s.id)?.players + ' rated'"></span>
              <button class="btn sm" x-show="q(s.id)?.needs_you" @click="openReview(s)"
                      >Review…</button>
              <button class="btn sm" @click="openSession(s)"
                      x-text="sel?.id===s.id?'Close':'Open'"></button>
            </div>

            <div x-show="sel?.id===s.id" class="sdet">
              <div class="cath">Days in this session <b x-text="blocks.length"></b></div>
              <template x-if="!blocks.length">
                <div class="note" style="margin:0">No days yet.</div></template>
              <table class="jt" x-show="blocks.length">
                <thead><tr><th>Date</th><th style="width:110px">Time</th><th>Venue</th>
                  <th style="width:74px"></th></tr></thead>
                <tbody>
                  <template x-for="b in blocks" :key="b.id">
                    <tr><td x-text="b.block_date"></td>
                        <td x-text="b.starts_at?.slice(0,5)+'–'+b.ends_at?.slice(0,5)"></td>
                        <td x-text="b.venue"></td>
                        <td><button class="btn sm" @click="removeBlock(b)">Remove</button></td></tr>
                  </template>
                </tbody>
              </table>
              <p class="note">This session runs <b x-text="fmt(sel?.opens_at)"></b> to
                <b x-text="fmt(sel?.closes_at)"></b>.</p>
              <div class="inline">
                <input type="date" x-model="newBlock.date"
                       :min="sel?.opens_at?.slice(0,10)" :max="sel?.closes_at?.slice(0,10)">
                <input type="time" x-model="newBlock.start" style="width:104px">
                <input type="time" x-model="newBlock.end" style="width:104px">
                <input type="text" x-model="newBlock.venue" placeholder="venue" style="width:130px">
                <button class="btn sm" @click="addBlock()">Add day</button>
              </div>
              <p x-show="blockErr" x-text="blockErr" class="err"></p>

              <div class="cath">Authorised raters <b x-text="auths.length"></b></div>
              <p class="note" style="margin:0 0 5px">Being a coach in the club is not enough.
                Authorisation is explicit and per session.</p>
              <template x-if="!auths.length">
                <div class="note" style="margin:0">Nobody authorised yet.</div></template>
              <template x-for="a in auths" :key="a.id">
                <div class="inline" style="margin:0 0 3px;gap:8px">
                  <span style="font-size:12.5px" x-text="nameOf(a.membership_id)"></span>
                  <button class="btn sm" @click="removeAuth(a)">Remove</button>
                </div>
              </template>
              <div class="inline">
                <select x-model="newAuth.membership_id">
                  <option value="">choose a member…</option>
                  <template x-for="m in members" :key="m.id">
                    <option :value="m.id" x-text="m.display_name+' ('+m.role.replace('_',' ')+')'"></option>
                  </template>
                </select>
                <button class="btn sm" @click="addAuth()"
                        :disabled="!newAuth.membership_id">Authorise</button>
              </div>

              <div class="cath">Where this session is up to</div>
              <div class="inline" style="margin-top:0">
                <span class="c" :class="s.status==='draft'?'':'ok'">1 · draft</span>
                <span class="c" :class="['open','closed','confirmed'].includes(s.status)?'ok':''">2 · open</span>
                <span class="c" :class="['closed','confirmed'].includes(s.status)?'ok':''">3 · closed</span>
                <span class="c" :class="s.status==='confirmed'?'ok':''">4 · confirmed</span>
              </div>

              <div class="inline">
                <template x-if="s.status==='draft'">
                  <button class="btn pri" @click="setStatus(s,'open')"
                          :disabled="!blocks.length || !auths.length">Open this session</button>
                </template>
                <template x-if="s.status==='open'">
                  <button class="btn" @click="setStatus(s,'closed')">Close for now</button>
                </template>
                <template x-if="s.status==='closed'">
                  <button class="btn" @click="setStatus(s,'open')">Reopen</button>
                </template>
              </div>
              <p class="note" x-show="s.status==='draft' && openBlockers()"
                 style="margin:4px 0 0">
                Before this can open it needs <b x-text="openBlockers()"></b>.
              </p>
              <p class="note" x-show="s.status==='closed'" style="margin:4px 0 0">
                Closed stops new ratings but is not final — reopen it if a coach still has players
                to get through. Confirming is the step that cannot be undone.
              </p>
              <p x-show="statusErr" x-text="statusErr" class="err"></p>

              <div class="cath">Do the work</div>
              <div class="inline" style="margin-top:0">
                <button class="btn pri" @click="openRate(s)"
                        :disabled="s.status!=='open'">Rate players…</button>
                <button class="btn" @click="openReview(s)">Review &amp; confirm…</button>
              </div>
              <p class="note" x-show="s.status!=='open'">
                Ratings can only be recorded while a session is <b>open</b>. This one is
                <b x-text="s.status"></b>.
              </p>

              <template x-if="s.status==='draft' || s.status==='open'">
                <div style="margin-top:14px;border-top:1px solid var(--line);padding-top:10px">
                  <div class="inline" style="margin:0">
                    <button class="btn sm" x-show="delConfirm!==s.id"
                            @click="delConfirm=s.id; delErr=''">Delete this session</button>
                    <template x-if="delConfirm===s.id">
                      <span class="inline" style="margin:0;gap:8px">
                        <span class="note" style="margin:0">Delete
                          <b x-text="s.name"></b> permanently?</span>
                        <button class="btn sm pri" @click="deleteSession(s)">Yes, delete</button>
                        <button class="btn sm" @click="delConfirm=''">Keep it</button>
                      </span>
                    </template>
                  </div>
                  <p class="note" style="margin:6px 0 0">A session that holds ratings cannot be
                    deleted — close it instead. Ratings are a permanent record.</p>
                  <p x-show="delErr" x-text="delErr" class="err"></p>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
    </div>
    </template>

    </div>
    </template>

  </div></div>

  <!-- ─────────── PLAYERS (modal) ─────────── -->
  <template x-if="modal==='players'">
    <div class="modal" @click.self="modal=''">
      <div class="box">
        <div class="mhead"><h3>Players</h3>
          <span class="c" x-text="people.length+' in this organisation'"></span>
          <button class="x" @click="modal=''" title="Close">×</button></div>
        <div class="mbody">
          <p x-show="peopleErr" x-text="peopleErr" class="err" style="margin-top:0"></p>
          <template x-if="!people.length"><div class="empty">No players yet.</div></template>
          <table class="jt" x-show="people.length">
            <thead><tr><th>Name</th><th style="width:70px">Gender</th>
              <th style="width:120px">Date of birth</th><th style="width:70px"></th>
              <th style="width:74px"></th></tr></thead>
            <tbody>
              <template x-for="p in people" :key="p.id">
                <tr><td x-text="p.given_name+' '+p.family_name"></td>
                    <td x-text="p.gender"></td><td x-text="p.dob"></td>
                    <td><span x-show="p.is_demo" class="c">DEMO</span></td>
                    <td><button class="btn sm" @click="deletePerson(p)">Delete</button></td></tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </template>

  <!-- ─────────── RUBRICS (modal) ─────────── -->
  <template x-if="modal==='rubrics'">
    <div class="modal" @click.self="modal=''">
      <div class="box">
        <div class="mhead"><h3>Rubrics</h3>
          <span class="c">locked · scale 1–5</span>
          <button class="x" @click="modal=''" title="Close">×</button></div>
        <div class="mbody">
          <p class="note" style="margin-top:0">Identical for every club in the sport. Every club
            completes <b>Core</b>. <b>Extended</b> is for clubs that can do more, and its measures
            roll up into Core so both depths stay comparable.</p>
          <template x-for="r in rubrics" :key="r.id">
            <div class="rgrp">
              <div class="cath"><span x-text="r.name"></span>
                <b x-text="measuresOf(r.id).length+' measures'"></b></div>
              <div class="chips">
                <template x-for="m in measuresOf(r.id)" :key="m.id">
                  <span class="c" :class="r.level==='core' ? 'grp' : (m.rolls_up_to ? 'acc' : '')"
                        :title="m.rolls_up_to ? 'rolls up to '+labelOf(m.rolls_up_to)
                                : (r.level==='extended' ? 'extended signal only' : '')"
                        x-text="m.label"></span>
                </template>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>
  </template>


  <!-- ─────────── RATE (modal) ─────────── -->
  <template x-if="modal==='rate'">
    <div class="modal" @click.self="modal=''">
      <div class="box">
        <div class="mhead"><h3>Rate players</h3>
          <span class="c" x-text="rate.session?.name"></span>
          <span class="c grp" x-text="rubricName(rate.session?.rubric_id)"></span>
          <button class="x" @click="modal=''" title="Close">×</button></div>
        <div class="mbody">
          <template x-if="!rate.authorised">
            <p class="warnbar" style="border-radius:8px;border:1px solid var(--warnline)">
              You are not authorised to rate in this session. Authorisation is explicit and per
              session — add yourself under <b>Authorised raters</b> first.</p>
          </template>

          <template x-if="rate.authorised">
          <div class="split">
            <div>
              <div class="cath">Players <b x-text="people.length"></b></div>
              <div class="plist">
                <template x-for="p in people" :key="p.id">
                  <div class="pitem" :class="rate.person?.id===p.id?'on':''" @click="pickPlayer(p)">
                    <span x-text="p.given_name+' '+p.family_name"></span>
                    <span class="st" x-text="rate.done[p.id] ? '✓ rated' : ''"></span>
                  </div>
                </template>
              </div>
            </div>

            <div>
              <template x-if="!rate.person">
                <div class="empty">Choose a player to start.</div>
              </template>
              <template x-if="rate.person">
              <div>
                <div class="cath">
                  <span x-text="rate.person.given_name+' '+rate.person.family_name"></span>
                  <b x-text="Object.keys(rate.scores).length+' of '+rateMeasures().length+' scored'"></b>
                </div>
                <template x-for="m in rateMeasures()" :key="m.id">
                  <div class="mrow">
                    <span class="lb" x-text="m.label"></span>
                    <div class="scale">
                      <template x-for="v in scaleOf(m)" :key="v">
                        <button class="sv" :class="rate.scores[m.id]===v?'on':''"
                                @click="rate.scores[m.id]=v" x-text="v"></button>
                      </template>
                    </div>
                  </div>
                </template>
                <div class="field" style="margin-top:10px">
                  <label class="fl">Note (optional)</label>
                  <input type="text" x-model="rate.note" placeholder="anything worth recording">
                </div>
                <div class="inline" style="margin-top:0">
                  <button class="btn pri" @click="saveRating()"
                          :disabled="!Object.keys(rate.scores).length||busy">Save rating</button>
                  <button class="btn" @click="rate.scores={};rate.note=''">Clear</button>
                </div>
                <p class="note">Saved ratings cannot be edited. A correction is recorded as a
                  resolution by the head coach, never by changing the original.</p>
                <p x-show="rate.err" x-text="rate.err" class="err"></p>
                <p x-show="rate.msg" x-text="rate.msg" class="msg"></p>
              </div>
              </template>
            </div>
          </div>
          </template>
        </div>
      </div>
    </div>
  </template>

  <!-- ─────────── REVIEW & CONFIRM (modal) ─────────── -->
  <template x-if="modal==='review'">
    <div class="modal" @click.self="modal=''">
      <div class="box">
        <div class="mhead"><h3>Review &amp; confirm</h3>
          <span class="c" x-text="review.session?.name"></span>
          <span class="c" :class="review.session?.status==='confirmed'?'ok':'grp'"
                x-text="review.session?.status"></span>
          <button class="x" @click="modal=''" title="Close">×</button></div>
        <div class="mbody">
          <div class="statrow" style="border:1px solid var(--line);border-radius:8px;margin-bottom:12px">
            <div><b x-text="review.rows.filter(r=>r.coverage==='complete').length"></b>complete</div>
            <div><b x-text="review.rows.filter(r=>r.coverage==='partial').length"></b>partial</div>
            <div><b x-text="review.rows.filter(r=>r.coverage==='not rated').length"></b>not rated</div>
            <div><b x-text="flagged().length"></b>to look at</div>
            <div><b x-text="sessionMean()"></b>session mean</div>
          </div>

          <div class="cath">Coverage and disagreement
            <b x-text="'threshold '+review.threshold"></b></div>
          <p class="note" style="margin-top:0">Rows are highlighted where two raters differ by more
            than the threshold. Confirming with gaps is allowed and recorded.</p>
          <div class="scroll" style="max-height:320px">
            <table class="jt">
              <thead><tr><th>Player</th><th style="width:66px">Rating</th>
                <th style="width:90px">Coverage</th>
                <th style="width:70px">Scored</th><th style="width:70px">Raters</th>
                <th style="width:74px">Spread</th><th style="width:64px"></th></tr></thead>
              <tbody>
                <template x-for="r in review.rows" :key="r.person_id">
                  <tr :class="r.worst_spread > review.threshold ? 'flag' : ''">
                    <td x-text="r.given_name+' '+r.family_name"></td>
                    <td><b x-text="meanOf(r.person_id)"></b></td>
                    <td><span class="c" :class="r.coverage==='complete'?'ok':
                          (r.coverage==='partial'?'wn':'')" x-text="r.coverage"></span></td>
                    <td x-text="r.measures_scored+'/'+r.measure_count"></td>
                    <td x-text="r.assessment_count"></td>
                    <td x-text="r.worst_spread || ''"></td>
                    <td><button class="btn sm" x-show="r.measures_scored"
                          @click="openPlayer(r.person_id)">Detail</button></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>

          <div class="cath">Confirm</div>
          <template x-if="review.session?.status==='confirmed'">
            <p class="okbar" style="border-radius:8px;border:1px solid var(--okline)">
              Confirmed. The formation engine can now use this session — and it cannot be reopened.</p>
          </template>
          <template x-if="review.session?.status!=='confirmed'">
            <div>
              <p class="note" style="margin-top:0">Confirming closes the session as a whole and is
                recorded against your name. Only a head coach or club admin can do it.</p>
              <button class="btn pri" @click="confirmSession()"
                :disabled="busy || !['head_coach','club_admin'].includes(me?.role)">
                Confirm this session</button>
              <p x-show="!['head_coach','club_admin'].includes(me?.role)" class="note">
                Your role is <b x-text="me?.role"></b>, so you cannot confirm.</p>
              <p x-show="review.err" x-text="review.err" class="err"></p>
            </div>
          </template>
        </div>
      </div>
    </div>
  </template>

  <!-- ─────────── PLAYER (modal) ─────────── -->
  <!-- Layered above Review, because it is summoned FROM Review and Review is still
       the thing you are doing. Escape or the × returns you to it, in place. -->
  <template x-if="pm.open">
    <div class="modal" data-modal="player" style="z-index:90" @click.self="pm.open=false">
      <div class="box">
        <div class="mhead">
          <h3 x-text="pm.name"></h3>
          <span class="c grp" x-text="pm.sessionName"></span>
          <span class="c" x-show="pm.mean" x-text="'rating '+pm.mean"></span>
          <span class="c" :class="pm.coverage==='complete'?'ok':(pm.coverage==='partial'?'wn':'')"
                x-show="pm.coverage" x-text="pm.coverage"></span>
          <button class="x" @click="pm.open=false" title="Close">×</button>
        </div>
        <div class="mbody">
          <p x-show="pm.err" x-text="pm.err" class="err" style="margin-top:0"></p>
          <template x-if="!pm.detail.length && !pm.err">
            <div class="empty">Nothing recorded for this player in this session yet.</div>
          </template>

          <template x-if="pm.detail.length">
            <div>
              <div class="statrow" style="border:1px solid var(--line);border-radius:8px;margin-bottom:12px">
                <div><b x-text="pm.mean"></b>rating</div>
                <div><b x-text="pmRaters().length"></b><span x-text="pmRaters().length===1?'pass':'passes'"></span></div>
                <div><b x-text="pmMeasures().length"></b>measures</div>
                <div><b x-text="pmWorst()"></b>worst spread</div>
              </div>

              <div class="cath">What each rater said
                <b x-text="'threshold '+review.threshold"></b></div>
              <div class="inline" style="margin:0 0 6px">
                <template x-for="w in pmRaters()" :key="w.key">
                  <span class="c grp"><span x-text="w.name"></span> ·
                    <span x-text="w.when"></span></span>
                </template>
              </div>
              <div class="pc">
                <template x-for="m in pmMeasures()" :key="m.measure_id">
                  <div>
                  <div class="pcr" :class="res(m.measure_id) ? 'settled'
                                        : (!m.rated ? 'gap'
                                        : (m.spread > review.threshold ? 'wide' : ''))">
                    <span class="lb" x-text="m.label"></span>
                    <span class="passes">
                      <template x-for="w in pmRaters()" :key="w.key">
                        <span class="pv" :class="m.by[w.key] == null ? 'none' : ''"
                              x-text="m.by[w.key] ?? '–'"></span>
                      </template>
                    </span>
                    <span class="meter" :title="effOf(m) + ' of 5'">
                      <i :style="'width:'+ (isNaN(effOf(m)) ? 0 : effOf(m)/5*100) +'%'"></i>
                    </span>
                    <span class="mn" x-text="effOf(m)"></span>
                    <span class="sp" x-text="res(m.measure_id)
                          ? (res(m.measure_id).source==='adopted'
                              ? 'took '+res(m.measure_id).adopted_name
                              : 'HC call')
                          : (!m.rated ? 'not rated' : (m.spread ? 'spread '+m.spread : ''))"></span>
                    <span class="act">
                      <button class="btn sm" x-show="canResolve()"
                              @click="toggleResolve(m)"
                              x-text="rz.measure_id===m.measure_id ? 'Cancel'
                                    : (res(m.measure_id) ? 'Change' : 'Override')"></button>
                    </span>
                  </div>

                  <!-- Pick one of the raters, or record your own. Both are the head
                       coach's call; only the record of WHOSE call differs. -->
                  <div class="rz" x-show="rz.measure_id===m.measure_id">
                    <div class="cath" style="margin-top:0">The head coach's call</div>
                    <p class="note" style="margin:0 0 7px">A session is usually run by the coaching
                      staff; the head coach carries the final say on every rating, and the
                      explanation with it.</p>
                    <template x-for="w in pmRaters()" :key="w.key">
                      <div class="opt" x-show="m.by[w.key] != null"
                           :class="rz.source==='adopted' && rz.adopted===w.mid ? 'on' : ''"
                           @click="rz.source='adopted'; rz.adopted=w.mid; rz.score=m.by[w.key]">
                        <span class="v" x-text="m.by[w.key]"></span>
                        <span>Take <b x-text="w.name"></b>'s rating</span>
                      </div>
                    </template>
                    <div class="opt" :class="rz.source==='own' ? 'on' : ''"
                         @click="rz.source='own'; rz.adopted=null">
                      <span class="v" x-text="rz.source==='own' && rz.score ? rz.score : '?'"></span>
                      <span>Record my own</span>
                      <span class="scale" style="margin-left:auto">
                        <template x-for="v in scaleOf(rzMeasure())" :key="v">
                          <button class="sv" :class="rz.source==='own' && rz.score===v ? 'on' : ''"
                                  @click.stop="rz.source='own'; rz.adopted=null; rz.score=v"
                                  x-text="v"></button>
                        </template>
                      </span>
                    </div>
                    <div class="field" style="margin:8px 0 0">
                      <label class="fl">Why — this is the explanation you will give a parent</label>
                      <input type="text" x-model="rz.rationale"
                             placeholder="e.g. watched the second half">
                    </div>
                    <div class="inline" style="margin-top:8px">
                      <button class="btn pri" @click="saveResolution(m)"
                              :disabled="!rz.score || rz.busy">Save the call</button>
                      <button class="btn" @click="rz.measure_id=''">Cancel</button>
                    </div>
                    <p x-show="rz.err" x-text="rz.err" class="err"></p>
                  </div>
                  </div>
                </template>
              </div>
              <p class="note" x-show="pmRaters().length>1">One box per rating pass, in the order
                they were taken. Where the same coach rated twice the passes stay separate —
                nothing is averaged away before you see it. The bar repeats the mean; it does not
                add anything the number does not already say.</p>
              <p class="note" x-show="pmRaters().length===1">One pass, so there is nothing to
                disagree with yet. Spread appears once a second coach rates this player.</p>
            </div>
          </template>

          <!-- The shape. Ported from the TMS `radarSVG` so the two systems draw a
               player the same way. Series are distinguished by BOTH colour and
               dash, and every value is written out beside the chart, so nothing
               depends on telling two colours apart. -->
          <template x-if="pmHistory().length">
            <div>
              <div class="cath">The shape
                <b x-text="pmHistory().length > 1
                     ? 'latest against the one before'
                     : 'one confirmed session so far'"></b></div>
              <div class="shape">
                <div x-html="playerRadar()"></div>
                <div class="leg">
                  <div><i :style="'border-color:var(--navy)'"></i>
                    <span x-text="pmHistory()[pmHistory().length-1]?.session_name"></span></div>
                  <div x-show="pmHistory().length > 1">
                    <i style="border-color:var(--ink3);border-top-style:dashed"></i>
                    <span x-text="pmHistory()[pmHistory().length-2]?.session_name"></span></div>
                  <div class="vals">
                    <template x-for="r in pmShapeRows()" :key="r.measure_id">
                      <div class="vrow">
                        <span class="l" x-text="r.label"></span>
                        <span class="n" x-text="r.now.toFixed(2)"></span>
                        <span class="dlt" x-show="pmHistory().length>1"
                              :class="r.delta > 0 ? 'up' : (r.delta < 0 ? 'dn' : 'flat')"
                              x-text="r.delta == null ? '—'
                                    : (r.delta > 0 ? '▲ +' : (r.delta < 0 ? '▼ ' : '– '))
                                      + (r.delta === 0 ? '0.00' : r.delta.toFixed(2))"></span>
                      </div>
                    </template>
                  </div>
                </div>
              </div>
            </div>
          </template>

          <!-- The trend. One bar per confirmed session, oldest first. With a
               single session it is a single bar and says so — better than an
               empty frame pretending a line exists. -->
          <template x-if="pmHistory().length">
            <div>
              <div class="cath">Overall, session by session</div>
              <div class="trend">
                <div class="tline">
                  <template x-for="h in pmHistory()" :key="h.session_id">
                    <b :style="'height:'+ Math.max(3, h.mean/5*34) +'px'"
                       :title="h.session_name + ' — ' + h.mean"></b>
                  </template>
                </div>
                <div class="inline" style="margin-top:5px">
                  <template x-for="h in pmHistory()" :key="h.session_id">
                    <span class="c"><span x-text="h.session_date"></span> ·
                      <b x-text="h.mean"></b></span>
                  </template>
                </div>
              </div>
              <p class="note" x-show="pmHistory().length === 1">
                One confirmed session. The trend fills in as more are signed off — this is the
                first point on it.</p>
              <p class="note" x-show="pmHistory().length > 1">
                Overall is the plain mean across every approved measure in that session, the same
                arithmetic the rating itself uses.</p>
            </div>
          </template>

          <div class="cath">Approved record</div>
          <template x-if="!pm.history.length">
            <p class="note" style="margin-top:0">Nothing approved yet. A rating enters this player's
              permanent record when the head coach confirms the session it came from.</p>
          </template>
          <template x-if="pm.history.length">
            <div>
              <template x-for="h in pmHistory()" :key="h.session_id">
                <div class="sess">
                  <span class="big" x-text="h.mean"></span>
                  <div class="body">
                    <div class="t" x-text="h.session_name"></div>
                    <div class="d"><span x-text="h.session_date"></span> ·
                      <span x-text="h.n"></span> measures</div>
                  </div>
                  <span class="c" :class="h.anyResolved?'acc':''"
                        x-text="h.anyResolved?'resolved':'mean'"></span>
                </div>
              </template>
              <p class="note">One card per confirmed session, oldest first. The matrix and the
                trend chart will read from this same record.</p>
            </div>
          </template>
        </div>
      </div>
    </div>
  </template>

  <!-- ─────────── MORE (modal) ─────────── -->
  <template x-if="modal==='more'">
    <div class="modal" @click.self="modal=''">
      <div class="box sm">
        <div class="mhead"><h3>More</h3>
          <button class="x" @click="modal=''" title="Close">×</button></div>
        <div class="mbody">
          <div class="cath">This session</div>
          <dl class="kv">
            <dt>Signed in as</dt><dd x-text="userEmail"></dd>
            <dt>User id</dt><dd x-text="userId"></dd>
            <template x-if="org">
              <span style="display:contents">
                <dt>Organisation</dt><dd x-text="org.name"></dd>
                <dt>Organisation id</dt><dd x-text="org.id"></dd>
                <dt>Edition</dt><dd x-text="org.edition"></dd>
              </span>
            </template>
            <dt>Database</dt><dd x-text="cfg.url"></dd>
          </dl>

          <div class="cath">Tenant isolation</div>
          <p class="note" style="margin-top:0">Every count comes from an unfiltered query — there is
            no <code>where org_id</code> anywhere in this app. The database returns only your
            organisation's rows.</p>
          <div class="statrow" style="border:1px solid var(--line);border-radius:8px">
            <div><b x-text="orgs.length"></b>organisations</div>
            <div><b x-text="people.length"></b>players</div>
            <div><b x-text="members.length"></b>members</div>
            <div><b x-text="measures.length"></b>rubric measures</div>
          </div>

          <div class="cath">Actions</div>
          <div class="inline" style="margin-top:0">
            <button class="btn" @click="load();modal=''">Reload data</button>
            <button class="btn" @click="resetCfg()">Change database</button>
            <button class="btn" @click="signOut()">Sign out</button>
          </div>
          <p class="note">v0.1 · foundation. Rating capture, the formation engine and imports are
            the next increments.</p>
        </div>
      </div>
    </div>
  </template>

</div>
</template>

</div>

<script>
function app(){ return {
  screen:'setup', cfg:{url:'',key:''}, sb:null,
  email:'', msg:'', err:'', busy:false,
  userId:'', userEmail:'',
  orgs:[], org:null, me:null, members:[], people:[], measures:[], rubrics:[], sessions:[],
  sel:null, blocks:[], auths:[], blockErr:'', modal:'', delConfirm:'', delErr:'', peopleErr:'', statusErr:'',
  authErr:'',
  rate:{session:null,authorised:false,person:null,scores:{},note:'',done:{},err:'',msg:''},
  review:{session:null,rows:[],threshold:2,err:'',scores:{}},
  pm:{open:false,personId:'',name:'',sessionName:'',mean:'',coverage:'',
      detail:[],history:[],resolutions:[],err:''},
  rz:{measure_id:'',source:'',adopted:null,score:null,rationale:'',err:'',busy:false},
  stage:'admin', queueRows:[], onlyWaiting:false,
  court:{sessions:[],session:null,people:[],measures:[],rated:{},person:null,
         scores:{},note:'',err:'',msg:''},
  queue:[], rejected:[], syncing:false, online:true,
  newSession:{open:false,name:'',opens:'',closes:'',rubric_id:''},
  newBlock:{date:'',start:'18:00',end:'20:00',venue:''},
  newAuth:{membership_id:''},

  async boot(){
    const saved = localStorage.getItem('platform.cfg');
    if(!saved){ this.screen='setup'; return; }
    this.cfg = JSON.parse(saved);
    this.connect();
    const {data:{session}} = await this.sb.auth.getSession();
    if(session){ await this.afterLogin(session); } else { this.screen='signin'; }
    this.sb.auth.onAuthStateChange(async (_e,s)=>{ if(s) await this.afterLogin(s); });
  },

  connect(){ this.sb = window.supabase.createClient(this.cfg.url, this.cfg.key); },

  saveCfg(){
    this.err='';
    try{
      if(!/^https:\/\/.+\.supabase\.co\/?$/.test(this.cfg.url.trim()))
        throw new Error('That does not look like a Supabase project URL.');
      this.cfg.url = this.cfg.url.trim().replace(/\/$/,'');
      this.cfg.key = this.cfg.key.trim();
      if(this.cfg.key.includes('service_role'))
        throw new Error('That looks like the service_role key. Use the anon public key.');
      localStorage.setItem('platform.cfg', JSON.stringify(this.cfg));
      this.connect(); this.screen='signin';
    }catch(e){ this.err = e.message; }
  },

  resetCfg(){ localStorage.removeItem('platform.cfg'); location.reload(); },

  async signIn(){
    this.busy=true; this.err=''; this.msg='';
    const {error} = await this.sb.auth.signInWithOtp({
      email:this.email, options:{ emailRedirectTo: window.location.href.split('#')[0] }
    });
    this.busy=false;
    if(error){ this.err = error.message; }
    else { this.msg = 'Check your email — the link signs you straight in.'; }
  },

  async signOut(){ await this.sb.auth.signOut(); location.reload(); },

  async afterLogin(session){
    this.userId = session.user.id; this.userEmail = session.user.email;
    this.screen='app';
    this.loadQueue(); this.loadRejected();
    this.online = navigator.onLine !== false;
    addEventListener('online',  () => { this.online = true;  this.flushQueue(); });
    addEventListener('offline', () => { this.online = false; });
    await this.load();
    this.flushQueue();
  },

  async load(){
    this.err=''; this.authErr=''; this.blockErr='';
    const q = async (t,sel='*',order=null)=>{
      let r = this.sb.from(t).select(sel);
      if(order) r = r.order(order);
      const {data,error} = await r;
      if(error){ this.err = t+': '+error.message; return []; }
      return data||[];
    };
    this.orgs     = await q('organisation');
    this.org      = this.orgs[0] || null;
    this.members  = await q('membership');
    this.me       = this.members.find(m=>m.user_id===this.userId) || null;
    this.people   = await q('person','*','family_name');
    this.rubrics  = (await q('rubric','*','level')).filter(r=>r.org_id===null);
    this.measures = await q('rubric_measure','*','sort_order');
    if(!this.newSession.rubric_id){
      const core = this.rubrics.find(r=>r.level==='core');
      this.newSession.rubric_id = (core||this.rubrics[0])?.id || '';
    }
    this.sessions = await q('rating_session','*','opens_at');
    await this.loadSessionQueue();
  },

  nameOf(mid){ const m=this.members.find(x=>x.id===mid); return m? m.display_name : mid; },
  measuresOf(rid){ return this.measures.filter(m=>m.rubric_id===rid); },
  labelOf(mid){ return this.measures.find(m=>m.id===mid)?.label || ''; },
  rubricName(rid){ return this.rubrics.find(r=>r.id===rid)?.name || '(unknown rubric)'; },
  rubricLevel(rid){ return this.rubrics.find(r=>r.id===rid)?.level || ''; },

  fmt(iso){ return iso ? iso.slice(0,10) : ''; },

  async createSession(){
    this.err='';
    if(this.newSession.closes < this.newSession.opens){
      this.err='The last day cannot be before the first day.'; return;
    }
    if(!this.newSession.rubric_id){ this.err='Choose a rubric.'; return; }
    this.busy=true;
    // Dates are picked as calendar dates. Send them as UTC day boundaries so the
    // database sees exactly the days chosen, with no timezone drift either way.
    const {error} = await this.sb.from('rating_session').insert({
      org_id:this.org.id, rubric_id:this.newSession.rubric_id, name:this.newSession.name,
      opens_at:this.newSession.opens+'T00:00:00Z',
      closes_at:this.newSession.closes+'T23:59:59Z',
      status:'draft'
    });
    this.busy=false;
    if(error){ this.err=error.message; return; }
    this.newSession={open:false,name:'',opens:'',closes:'',rubric_id:this.newSession.rubric_id};
    await this.load();
  },

  // ── what is waiting ────────────────────────────────────────────────────
  // One read for the whole club: how far each session got, how many calls are
  // still the head coach's to make, and anything sitting open past its own
  // window. The window flag is a REMINDER — ratings are gated by status, never
  // by the clock.
  q(sessionId){ return this.queueRows.find(r => r.session_id === sessionId) || null; },
  waitingCount(){ return this.queueRows.filter(r => r.needs_you).length; },
  toSettleCount(){ return this.queueRows.reduce((n, r) => n + (r.to_settle || 0), 0); },
  visibleSessions(){
    if(!this.onlyWaiting) return this.sessions;
    return this.sessions.filter(s => this.q(s.id)?.needs_you);
  },
  async loadSessionQueue(){
    const {data} = await this.sb.from('v_session_queue').select('*');
    this.queueRows = data || [];
  },

  async openSession(s){
    if(this.sel?.id===s.id){ this.sel=null; return; }
    this.sel=s;
    const {data:b} = await this.sb.from('session_block').select('*')
      .eq('session_id',s.id).order('sort_order');
    this.blocks=b||[];
    const {data:a} = await this.sb.from('session_authorisation').select('*').eq('session_id',s.id);
    this.auths=a||[];
    this.blockErr=''; this.authErr=''; this.delErr=''; this.delConfirm=''; this.statusErr='';
    this.newBlock.date = this.newBlock.date || s.opens_at.slice(0,10);
  },

  async addBlock(){
    this.blockErr=''; this.err='';
    const s = this.sel;
    if(!this.newBlock.date){ this.blockErr='Pick a date for this day.'; return; }
    const lo = s.opens_at.slice(0,10), hi = s.closes_at.slice(0,10);
    if(this.newBlock.date < lo || this.newBlock.date > hi){
      this.blockErr = `That day is outside the session window (${lo} to ${hi}).`; return;
    }
    if(this.newBlock.end <= this.newBlock.start){
      this.blockErr = 'The finish time must be after the start time.'; return;
    }
    if(this.blocks.some(b => b.block_date === this.newBlock.date
        && b.starts_at.slice(0,5) === this.newBlock.start)){
      this.blockErr = 'There is already a day starting at that time.'; return;
    }
    const {error} = await this.sb.from('session_block').insert({
      org_id:this.org.id, session_id:s.id,
      block_date:this.newBlock.date, starts_at:this.newBlock.start,
      ends_at:this.newBlock.end, venue:this.newBlock.venue,
      sort_order:this.blocks.length+1
    });
    if(error){ this.blockErr=error.message; return; }
    this.newBlock={date:'',start:'18:00',end:'20:00',venue:''};
    this.sel=null; await this.openSession(s);
  },

  scaleOf(m){ const a=[]; for(let v=(m.scale_min??1); v<=(m.scale_max??5); v++) a.push(v); return a; },
  rateMeasures(){ return this.measuresOf(this.rate.session?.rubric_id); },
  flagged(){ return this.review.rows.filter(r=>r.worst_spread > this.review.threshold); },

  async openRate(s){
    this.modal='rate';
    this.rate={session:s,authorised:false,person:null,scores:{},note:'',done:{},err:'',msg:''};
    const {data:a} = await this.sb.from('session_authorisation').select('membership_id')
      .eq('session_id',s.id);
    this.rate.authorised = (a||[]).some(x=>x.membership_id===this.me?.id);
    const {data:mine} = await this.sb.from('assessment').select('person_id')
      .eq('session_id',s.id).eq('membership_id',this.me?.id);
    const done={}; (mine||[]).forEach(r=>done[r.person_id]=true);
    this.rate.done=done;
  },

  pickPlayer(p){ this.rate.person=p; this.rate.scores={}; this.rate.note=''; 
                 this.rate.err=''; this.rate.msg=''; },

  async saveRating(){
    this.rate.err=''; this.rate.msg=''; this.busy=true;
    const {data:a, error:e1} = await this.sb.from('assessment').insert({
      org_id:this.org.id, session_id:this.rate.session.id,
      person_id:this.rate.person.id, membership_id:this.me.id,
      submitted_at:new Date().toISOString()
    }).select('id').single();
    if(e1){ this.busy=false; this.rate.err=e1.message; return; }
    const rows = Object.entries(this.rate.scores).map(([measure_id,score],i)=>({
      assessment_id:a.id, measure_id, score,
      note: i===0 && this.rate.note ? this.rate.note : null
    }));
    const {error:e2} = await this.sb.from('assessment_score').insert(rows);
    this.busy=false;
    if(e2){ this.rate.err=e2.message; return; }
    this.rate.done[this.rate.person.id]=true;
    this.rate.msg='Saved '+this.rate.person.given_name+'.';
    const i=this.people.findIndex(p=>p.id===this.rate.person.id);
    const next=this.people.slice(i+1).find(p=>!this.rate.done[p.id]);
    if(next){ this.pickPlayer(next); this.rate.msg='Saved. Next: '+next.given_name+'.'; }
    else { this.rate.person=null; this.rate.msg='All players rated.'; }
  },

  async openReview(s){
    this.modal='review';
    this.review={session:s,rows:[],threshold:2,err:'',scores:{}};
    this.pm.open=false;
    const {data:prof} = await this.sb.from('org_profile')
      .select('divergence_threshold_measure').eq('org_id',this.org.id).maybeSingle();
    if(prof) this.review.threshold = Number(prof.divergence_threshold_measure);
    const {data:rows,error} = await this.sb.from('v_session_review').select('*')
      .eq('session_id',s.id).order('family_name');
    if(error){ this.review.err=error.message; return; }
    this.review.rows = rows||[];
    // The average is a plain mean over every measure rated, Size included —
    // the same arithmetic the TMS uses (ratingAvgAt). Computed in the database.
    const {data:sc} = await this.sb.from('v_session_player_score').select('*')
      .eq('session_id',s.id);
    this.review.scores = {};
    (sc||[]).forEach(x => this.review.scores[x.person_id] = x);
  },

  // ── the number ─────────────────────────────────────────────────────────
  meanOf(personId){
    const x = this.review.scores?.[personId];
    return x ? Number(x.mean_score).toFixed(2) : '—';
  },
  sessionMean(){
    const v = Object.values(this.review.scores || {}).map(x => Number(x.mean_score));
    if(!v.length) return '—';
    return (v.reduce((a,b)=>a+b,0) / v.length).toFixed(2);
  },

  // ══════════════════════ COURTSIDE ══════════════════════
  // The coach's own device. Two rules shape all of this:
  //
  //   1. A rating is SAVED THE MOMENT IT IS TAKEN, to this device. Uploading is
  //      a separate, later, retryable thing. A school hall on trial night has no
  //      usable wifi and that is precisely when this has to work.
  //   2. Nobody is pre-assigned. The squad list shows who has already been rated
  //      and by whom, and coaches pick up whoever has not been. Two coaches
  //      rating the same player is allowed by design (decision F4) — both are
  //      kept and the head coach sees the spread.
  //
  // Idempotence comes free from the schema: the client generates the assessment
  // id, and assessment_score is keyed on (assessment_id, measure_id). A retry
  // that re-posts the same rating writes nothing new.

  QKEY(){ return 'platform.queue.' + (this.userId || 'anon'); },
  loadQueue(){
    try { this.queue = JSON.parse(localStorage.getItem(this.QKEY()) || '[]'); }
    catch { this.queue = []; }
  },
  saveQueue(){ localStorage.setItem(this.QKEY(), JSON.stringify(this.queue)); },
  RKEY(){ return 'platform.rejected.' + (this.userId || 'anon'); },
  loadRejected(){
    try { this.rejected = JSON.parse(localStorage.getItem(this.RKEY()) || '[]'); }
    catch { this.rejected = []; }
  },
  saveRejected(){ localStorage.setItem(this.RKEY(), JSON.stringify(this.rejected)); },

  CKEY(id){ return 'platform.court.' + id; },
  cacheSession(bundle){
    try { localStorage.setItem(this.CKEY(bundle.session.id), JSON.stringify(bundle)); } catch {}
  },
  cachedSession(id){
    try { return JSON.parse(localStorage.getItem(this.CKEY(id)) || 'null'); } catch { return null; }
  },

  uuid(){
    if(crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = crypto.getRandomValues(new Uint8Array(1))[0] % 16;
      return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
  },

  async openCourt(){
    this.stage = 'court';
    this.court.err = ''; this.court.session = null; this.court.person = null;
    const {data, error} = await this.sb.from('session_authorisation')
      .select('session_id, rating_session!inner(id,name,status,opens_at,closes_at,rubric_id)')
      .eq('membership_id', this.me.id);
    if(error){
      // No connection: fall back to whatever this device already knows.
      this.court.sessions = this.knownSessions();
      this.court.err = this.court.sessions.length ? '' :
        'Cannot reach the database, and this device has no session saved yet.';
      return;
    }
    this.court.sessions = (data || [])
      .map(r => r.rating_session)
      .filter(s => s && s.status === 'open');
    this.court.sessions.forEach(s => {
      const b = this.cachedSession(s.id) || {};
      this.cacheSession({...b, session: s});
    });
  },
  knownSessions(){
    const out = [];
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(!k || k.indexOf('platform.court.') !== 0) continue;
      try { const b = JSON.parse(localStorage.getItem(k)); if(b?.session) out.push(b.session); }
      catch {}
    }
    return out;
  },

  async pickCourtSession(s){
    this.court.session = s; this.court.person = null;
    this.court.err = ''; this.court.msg = '';
    const cached = this.cachedSession(s.id);
    if(cached){ this.court.people = cached.people || []; this.court.measures = cached.measures || [];
                this.court.rated = cached.rated || {}; }
    const [{data:ppl, error:e1}, {data:ms, error:e2}, {data:det}] = await Promise.all([
      this.sb.from('person').select('id,given_name,family_name').order('family_name'),
      this.sb.from('rubric_measure').select('*').eq('rubric_id', s.rubric_id).order('sort_order'),
      this.sb.from('v_rating_detail').select('person_id,membership_id,rater_name')
        .eq('session_id', s.id)
    ]);
    if(e1 || e2){
      if(!cached) this.court.err =
        'Cannot reach the database, and this session is not saved on this device yet. ' +
        'Open it once while you have a connection.';
      return;
    }
    this.court.people   = ppl || [];
    this.court.measures = ms  || [];
    const rated = {};
    (det || []).forEach(d => {
      rated[d.person_id] = rated[d.person_id] || {names:new Set(), mine:false};
      rated[d.person_id].names.add(d.rater_name);
      if(d.membership_id === this.me.id) rated[d.person_id].mine = true;
    });
    // Sets do not survive JSON, so store plain arrays.
    this.court.rated = Object.fromEntries(Object.entries(rated)
      .map(([k,v]) => [k, {names:[...v.names], mine:v.mine}]));
    this.applyQueueToRated();
    this.cacheSession({session:s, people:this.court.people,
                       measures:this.court.measures, rated:this.court.rated});
  },
  // Anything still sitting in the queue counts as rated — the coach did the work,
  // it just has not left the device.
  applyQueueToRated(){
    this.queue.filter(q => q.session_id === this.court.session?.id).forEach(q => {
      const r = this.court.rated[q.person_id] || {names:[], mine:false};
      if(!r.names.includes(this.me.display_name)) r.names.push(this.me.display_name);
      r.mine = true;
      this.court.rated[q.person_id] = r;
    });
  },
  courtMeasures(){ return this.court.measures; },
  courtRated(id){ return !!this.court.rated[id]; },
  courtMine(id){ return !!this.court.rated[id]?.mine; },
  courtWho(id){
    const r = this.court.rated[id];
    if(!r) return 'not rated yet';
    return 'rated by ' + r.names.join(', ');
  },
  courtDone(){ return Object.keys(this.court.rated).length; },

  pickCourtPlayer(p){
    this.court.person = p; this.court.scores = {}; this.court.note = ''; this.court.msg = '';
  },

  // Save = write to this device. Uploading is a separate concern.
  saveCourt(){
    const q = {
      id: this.uuid(),
      org_id: this.org.id,
      session_id: this.court.session.id,
      person_id: this.court.person.id,
      membership_id: this.me.id,
      submitted_at: new Date().toISOString(),
      note: this.court.note || null,
      scores: Object.entries(this.court.scores).map(([measure_id, score]) => ({measure_id, score}))
    };
    this.queue.push(q); this.saveQueue();
    const r = this.court.rated[q.person_id] || {names:[], mine:false};
    if(!r.names.includes(this.me.display_name)) r.names.push(this.me.display_name);
    r.mine = true; this.court.rated[q.person_id] = r;
    this.cacheSession({session:this.court.session, people:this.court.people,
                       measures:this.court.measures, rated:this.court.rated});
    this.court.person = null; this.court.scores = {}; this.court.note = '';
    this.flushQueue();
  },

  async flushQueue(){
    if(this.syncing || !this.queue.length) return;
    this.syncing = true;
    const still = [];
    for(const q of this.queue){
      const r = await this.sendOne(q);
      if(r.status === 'retry')   { still.push(q); }
      if(r.status === 'refused') { this.rejected.push({...q, reason:r.reason}); }
      // 'sent' simply falls off the queue.
    }
    this.queue = still; this.saveQueue(); this.saveRejected();
    this.syncing = false;
  },
  // A refusal is the coach's to see and decide about. It is never silently
  // dropped and never retried into a loop.
  discardRejected(id){
    this.rejected = this.rejected.filter(r => r.id !== id);
    this.saveRejected();
  },
  requeueRejected(id){
    const r = this.rejected.find(x => x.id === id);
    if(!r) return;
    this.rejected = this.rejected.filter(x => x.id !== id);
    const {reason, ...clean} = r;
    this.queue.push(clean);
    this.saveRejected(); this.saveQueue();
    this.flushQueue();
  },
  nameOfPerson(id){
    const p = (this.court.people || []).find(x => x.id === id);
    return p ? p.given_name + ' ' + p.family_name : 'a player';
  },
  // Three outcomes, not two. A rating that COULD NOT BE SENT and a rating the
  // database REFUSED are different problems and must not share a code path:
