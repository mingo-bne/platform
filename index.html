<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coaching Platform</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
/* ── Design tokens lifted from the TMS (build/src/app.css). Keep in step. ── */
:root{--bg:#f6f5f2;--card:#fff;--line:#e3e1db;--line2:#cfccc4;--ink:#1c1b19;--ink2:#5f5e5a;
--ink3:#8b8981;--navy:#1F3864;--navy2:#e8edf5;--ok:#0f6e56;--okbg:#e1f5ee;--okline:#9fe1cb;
--warn:#854f0b;--warnbg:#faeeda;--warnline:#fac775;--bad:#a32d2d;--badbg:#fcebeb;--badline:#f7c1c1;
--acc:#534ab7;--accbg:#eeedfe;--accline:#cecbf6;--sh:0 6px 24px rgba(28,27,25,.16);--hh:52px;
--d1:#1F3864;--d2:#33517f;--d3:#4d6c9b;--d4:#7b96bd;--d5:#a3b7d3;--d6:#c8d3e4}
html,body{margin:0;height:100%}
body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
background:var(--bg);color:var(--ink)}
button{font:inherit}
[x-cloak]{display:none!important}

header{background:var(--navy);color:#fff;padding:9px 16px;display:flex;align-items:center;gap:10px;
flex-wrap:wrap;position:fixed;top:0;left:0;right:0;z-index:60;height:var(--hh);box-sizing:border-box}
header h1{font-size:15px;font-weight:600;margin:0}
header .sub{font-size:11px;opacity:.7}
header .spacer{flex:1}
.hb{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);
padding:6px 11px;border-radius:6px;cursor:pointer;font-size:12.5px}
.hb:hover{background:rgba(255,255,255,.26)}
.hb.pri{background:#fff;color:var(--navy);border-color:#fff;font-weight:600}
.hb:disabled{opacity:.45;cursor:default}

#shell{padding-top:var(--hh)}
.stage{max-width:1020px;margin:18px auto 60px;padding:0 16px}
.stage.narrow{max-width:520px;margin-top:60px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;
margin-bottom:14px}
.rhead{padding:14px 18px;border-bottom:1px solid var(--line);background:#fbfaf8}
.rhead h2{margin:0;font-size:19px;font-weight:600}
.rhead .sub{font-size:12.5px;color:var(--ink2);margin-top:3px}
.pbody{padding:12px 18px 16px}
.statrow{display:flex;gap:20px;flex-wrap:wrap;padding:11px 18px;background:#fbfaf8;
border-bottom:1px solid var(--line);font-size:12px;color:var(--ink2)}
.statrow div{min-width:76px}
.statrow b{display:block;font-size:17px;color:var(--ink);font-weight:600;line-height:1.25}
.warnbar{margin:0;padding:9px 18px;background:var(--warnbg);border-bottom:1px solid var(--warnline);
color:var(--warn);font-size:12.5px}
.okbar{margin:0;padding:9px 18px;background:var(--okbg);border-bottom:1px solid var(--okline);
color:var(--ok);font-size:12.5px}
.note{font-size:11.5px;color:var(--ink2);margin:8px 0 0}
.empty{padding:26px 16px;text-align:center;color:var(--ink3);font-size:13.5px}

.chips{display:flex;gap:4px;flex-wrap:wrap}
.c{font-size:10px;padding:2px 6px;border-radius:9px;border:1px solid var(--line2);color:var(--ink2);
background:#f7f6f3;white-space:nowrap}
.c.grp{background:var(--navy2);border-color:#c2cfe3;color:var(--navy);font-weight:600}
.c.acc{background:var(--accbg);border-color:var(--accline);color:var(--acc);font-weight:600}
.c.ok{background:var(--okbg);border-color:var(--okline);color:var(--ok);font-weight:600}
.c.wn{background:var(--warnbg);border-color:var(--warnline);color:var(--warn);font-weight:600}
.cath{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;color:var(--ink2);
text-transform:uppercase;letter-spacing:.04em;margin:12px 0 5px}
.cath:first-child{margin-top:0}
.rgrp{margin-bottom:14px}.rgrp:last-child{margin-bottom:0}
.cath b{margin-left:auto;font-weight:600;color:var(--ink3)}

.jt{width:100%;border-collapse:collapse;font-size:12.5px}
.jt th,.jt td{border:1px solid var(--line);padding:5px 7px;text-align:left}
.jt th{background:#fbfaf8;font-weight:600;font-size:11.5px}
.scroll{max-height:270px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.scroll .jt th{position:sticky;top:0;z-index:1}
.scroll .jt th,.scroll .jt td{border-left:0;border-top:0}

input[type=text],input[type=email],input[type=date],input[type=time],select,textarea{
font:12.5px inherit;padding:5px 8px;border:1px solid var(--line2);border-radius:6px;
background:#fff;color:var(--ink);box-sizing:border-box}
input:focus,select:focus,textarea:focus{outline:2px solid var(--navy2);border-color:var(--navy)}
textarea{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}
label.fl{display:block;font-size:11px;color:var(--ink2);margin:0 0 3px}
.field{margin-bottom:10px}
.field input,.field select,.field textarea{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1px solid var(--line2);background:#fff;border-radius:6px;padding:6px 12px;
cursor:pointer;font-size:12.5px;color:var(--ink)}
.btn:hover{background:#fbfaf8}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.btn.pri:hover{background:#2b4a7d}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:3px 8px;font-size:11.5px}
.err{color:var(--bad);font-size:12px;margin:6px 0 0}
.msg{color:var(--ok);font-size:12px;margin:6px 0 0}
.lnk{background:none;border:0;color:var(--ink3);font-size:11.5px;text-decoration:underline;
cursor:pointer;padding:0}
.lnkb{background:none;border:0;color:var(--navy);font:inherit;font-weight:600;cursor:pointer;
padding:0;text-align:left}
.lnkb:hover{text-decoration:underline}
/* ── the detail block of the player card. Read by default; the SAME rows
      become editable in place, so looking at a player and correcting one are
      not two different screens. ── */
.dl{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.dl .r{display:flex;align-items:center;gap:12px;padding:7px 12px;border-bottom:1px solid var(--line);
min-height:36px}
.dl .r:last-child{border-bottom:0}
.dl .r:nth-child(even){background:#fcfbf9}
.dl .r .k{width:118px;flex:none;font-size:11.5px;color:var(--ink2)}
.dl .r .v{font-size:13px;flex:1;min-width:0}
.dl .r .v.none{color:var(--ink3)}
.dl .r input,.dl .r select{flex:1;min-width:0}
.vsrc{display:flex;gap:5px;flex-wrap:wrap}

.srow{border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:7px;background:#fff}
.srow:hover{border-color:var(--line2)}
.sflex{display:flex;align-items:center;gap:10px}
.sflex .body{flex:1;min-width:0}
.nm{font-weight:600;font-size:13px}
.meta{font-size:11px;color:var(--ink2);margin-top:2px}
.sdet{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.inline{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.scale{display:flex;gap:4px}
.sv{border:1px solid var(--line2);background:#fff;border-radius:6px;width:38px;height:32px;
cursor:pointer;font-size:13px;font-weight:600;color:var(--ink2);padding:0}
.sv:hover{border-color:var(--navy);color:var(--navy)}
.sv.on{background:var(--navy);border-color:var(--navy);color:#fff}
.mrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .lb{flex:1;font-size:13px;font-weight:600}
.plist{max-height:60vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.pitem{display:flex;align-items:center;gap:8px;padding:6px 9px;border-bottom:1px solid var(--line);
cursor:pointer;font-size:12.5px}
.pitem:last-child{border-bottom:0}
.pitem:hover{background:#fbfaf8}
.pitem.on{background:var(--navy2);font-weight:600}
.pitem .st{margin-left:auto;font-size:10px;color:var(--ink3)}
.split{display:grid;grid-template-columns:240px 1fr;gap:14px}
tr.flag td{background:var(--warnbg)}
pre.sql{background:#fbfaf8;border:1px solid var(--line);border-radius:7px;padding:9px 11px;
font-size:11px;overflow-x:auto;margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* ── the player card. Same tokens, deliberately NOT a ledger. ──────────
   The review table is a ledger — you scan it. This is one player, so it reads
   as rows of evidence: the measure, what each pass said, and where the mean
   sits on the scale. Value first, colour second — every number is on screen,
   the bar only repeats it. ── */
.pc{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.pcr{display:flex;align-items:center;gap:12px;padding:9px 12px;border-bottom:1px solid var(--line)}
.pcr:last-child{border-bottom:0}
.pcr:nth-child(even){background:#fcfbf9}
.pcr .lb{width:132px;flex:none;font-size:13px;font-weight:600}
.pcr .passes{display:flex;gap:4px;flex:none}
.pv{width:26px;height:26px;border-radius:6px;border:1px solid var(--line2);background:#fff;
display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;
color:var(--ink2)}
.pv.none{color:var(--ink3);background:#f7f6f3}
.meter{flex:1;min-width:70px;height:7px;border-radius:4px;background:#efeee9;position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--navy);
display:block}
.pcr .mn{width:38px;flex:none;text-align:right;font-size:14px;font-weight:600}
.pcr .sp{width:52px;flex:none;text-align:right;font-size:11px;color:var(--ink3)}
.pcr.wide{border-left:3px solid var(--warnline);background:var(--warnbg)}
.pcr.settled{border-left:3px solid var(--okline);background:var(--okbg)}
.pcr.gap{border-left:3px solid var(--line2)}
.pcr.gap .lb,.pcr.gap .mn{color:var(--ink3)}
.pcr.settled .meter{background:#c8ebdd}
.pcr.settled .meter i{background:var(--ok)}
.pcr .act{flex:none}
.rz{padding:10px 12px;background:#fbfaf8;border-top:1px solid var(--line)}
.rz .opt{display:flex;align-items:center;gap:9px;padding:7px 9px;border:1px solid var(--line);
border-radius:8px;margin-bottom:5px;background:#fff;cursor:pointer;font-size:12.5px}
.rz .opt:hover{border-color:var(--navy)}
.rz .opt.on{border-color:var(--navy);background:var(--navy2);font-weight:600}
.rz .opt .v{width:26px;height:26px;border-radius:6px;background:var(--navy);color:#fff;flex:none;
display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12.5px}
.rz .opt.on .v{background:var(--ok)}
.pcr.wide .meter{background:#f0dfc2}
.pcr.wide .sp{color:var(--warn);font-weight:600}
.shape{display:grid;grid-template-columns:auto minmax(230px,1fr);gap:18px;align-items:start}
@media (max-width:760px){.shape{grid-template-columns:1fr}}
.shape .leg{font-size:11.5px;color:var(--ink2);margin-top:6px}
.shape .leg div{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.shape .leg i{width:16px;height:0;border-top-width:2px;border-top-style:solid;display:block;flex:none}
/* The values beside the shape. A table, because it is read down a column and
   compared row to row — Ming, 13 Aug 2026. Lighter than `.jt` on purpose: this
   sits beside a chart, it is not a second ledger. Every plotted value is here
   in figures, so nothing on the chart depends on telling two colours apart. */
.vtab{width:100%;border-collapse:collapse;font-size:12.5px}
.vtab th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.7px;
color:var(--ink3);font-weight:700;padding:0 0 5px;border-bottom:1px solid var(--line2)}
.vtab td{padding:5px 0;border-bottom:1px solid var(--line)}
.vtab tr:last-child td{border-bottom:0}
.vtab th.r,.vtab td.r{text-align:right;padding-left:10px;white-space:nowrap}
.vtab td.v{font-weight:600;font-variant-numeric:tabular-nums}
.vtab td.d{font-variant-numeric:tabular-nums}
/* formation */
.tcol{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.tcol .h{padding:8px 11px;background:#fbfaf8;border-bottom:1px solid var(--line);
display:flex;align-items:center;gap:8px}
.tcol .h b{flex:1;font-size:13px}
.tcol .p{display:flex;align-items:center;gap:8px;padding:6px 11px;border-bottom:1px solid var(--line);
font-size:12.5px}
.tcol .p:last-child{border-bottom:0}
.tcol .p .r{margin-left:auto;font-weight:600}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.vals{margin-top:8px;border-top:1px solid var(--line)}
.vrow{display:flex;align-items:center;gap:9px;padding:4px 0;border-bottom:1px solid var(--line)}
.vrow .l{flex:1;min-width:0;font-size:12.5px}
.vrow .n{font-size:13px;font-weight:600;width:38px;text-align:right}
.trend{width:100%;overflow-x:auto}
.tline{display:flex;align-items:flex-end;gap:2px;height:34px}
.tline b{flex:1;min-width:5px;background:var(--navy);border-radius:2px 2px 0 0;display:block}
.dlt{font-size:11px;font-weight:600}
.dlt.up{color:var(--ok)} .dlt.dn{color:var(--bad)} .dlt.flat{color:var(--ink3)}
.sess{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--line);
border-radius:9px;margin-bottom:6px;background:#fff}
.sess .body{flex:1;min-width:0}
.sess .t{font-size:13px;font-weight:600}
.sess .d{font-size:11px;color:var(--ink2);margin-top:1px}
.sess .big{font-size:19px;font-weight:600;line-height:1}
@media (max-width:640px){
 .pcr{flex-wrap:wrap}
 .pcr .lb{width:100%}
 .meter{display:none}
}
/* ── courtside: the coach's own device. Same tokens, bigger targets. ── */
.court{max-width:560px;margin:0 auto}
.qbar{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:9px;
font-size:12.5px;margin-bottom:11px;border:1px solid}
.qbar.wait{background:var(--warnbg);border-color:var(--warnline);color:var(--warn)}
.qbar.done{background:var(--okbg);border-color:var(--okline);color:var(--ok)}
.qbar .spacer{flex:1}
.prow{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);
border-radius:10px;margin-bottom:7px;background:#fff;cursor:pointer}
.prow:active{background:#fbfaf8}
.prow .nm{flex:1;min-width:0;font-size:15px;font-weight:600}
.prow .who{font-size:11px;color:var(--ink2);font-weight:400;display:block;margin-top:1px}
.mrow.big{padding:11px 0}
.mrow.big .lb{font-size:15px}
.scale.big{gap:6px}
.scale.big .sv{width:46px;height:44px;font-size:16px}
@media (max-width:600px){
 .scale.big .sv{width:100%;flex:1}
 .stage{padding:0 11px}
}
/* modals — TMS pattern */
.modal{position:fixed;inset:0;background:rgba(28,27,25,.5);z-index:80;display:flex;
align-items:flex-start;justify-content:center;padding:44px 18px;overflow:auto}
.modal .box{background:var(--card);border-radius:13px;width:100%;max-width:880px;
overflow:hidden;box-shadow:var(--sh)}
.modal .box.sm{max-width:560px}
.modal .box.lg{max-width:1140px}
/* ── the directory: list left, one player right. Ming, 13 Aug 2026 — scroll the
      list and the detail follows, rather than opening and closing a dialog per
      player. ── */
.psplit{display:grid;grid-template-columns:264px 1fr;gap:14px;align-items:start}
.plist2{border:1px solid var(--line);border-radius:9px;overflow:auto;max-height:60vh;background:#fff}
.prow{display:flex;align-items:center;gap:7px;padding:6px 9px;border-bottom:1px solid var(--line);
cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;
font:inherit}
.prow:last-child{border-bottom:0}
.prow:hover{background:#fbfaf8}
.prow.on{background:var(--navy2)}
.prow .bd{flex:1;min-width:0}
.prow .n2{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;
text-overflow:ellipsis;display:block}
.prow .m2{font-size:10.5px;color:var(--ink3);margin-top:1px;display:block;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .u{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:none}
.pdet{min-width:0}
.fchips{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-top:6px}
.fc{font-size:11px;padding:3px 8px;border-radius:9px;border:1px solid var(--line2);background:#fff;
color:var(--ink2);cursor:pointer;font:inherit;font-size:11px}
.fc:hover{border-color:var(--navy)}
.fc.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.fc b{font-weight:700}
/* ── the Teams stage. List of teams left, one roster right, the pool beneath
      the list — the TMS shape: you scroll a pool and place into the team in
      front of you, across age groups. ── */
.tsplit{display:grid;grid-template-columns:280px 1fr;gap:14px;align-items:start}
@media (max-width:900px){.tsplit{grid-template-columns:1fr}}
.tgrp{font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;
color:var(--ink3);padding:9px 2px 4px}
.titem{display:flex;align-items:center;gap:7px;padding:6px 9px;border:1px solid var(--line);
border-radius:8px;background:#fff;cursor:pointer;width:100%;text-align:left;font:inherit;
margin-bottom:5px}
.titem:hover{border-color:var(--navy)}
.titem.on{background:var(--navy2);border-color:var(--navy)}
.titem .tn{flex:1;min-width:0;font-size:12.5px;font-weight:600;white-space:nowrap;
overflow:hidden;text-overflow:ellipsis}
.rost{border:1px solid var(--line);border-radius:10px;background:#fff;min-height:120px}
.rost.over{border-color:var(--navy);background:var(--navy2)}
.rrow{display:flex;align-items:center;gap:8px;padding:7px 11px;border-bottom:1px solid var(--line);
font-size:12.5px}
.rrow:last-child{border-bottom:0}
.rrow:nth-child(even){background:#fcfbf9}
.rrow .rn{flex:1;min-width:0;font-weight:600}
.rrow .rv{width:42px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.rrow select{font:inherit;font-size:11px;padding:2px 4px;width:auto}
.star{background:none;border:0;cursor:pointer;font-size:14px;line-height:1;padding:0 2px;
color:var(--line2)}
.star.on{color:#d19a2a}
.pool{border:1px solid var(--line);border-radius:9px;background:#fff;max-height:46vh;overflow:auto}
.pitem2{display:flex;align-items:center;gap:7px;padding:6px 9px;border-bottom:1px solid var(--line);
font-size:12px;cursor:grab}
.pitem2:last-child{border-bottom:0}
.pitem2:hover{background:#fbfaf8}
.pitem2 .pn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem2 .pv{font-weight:600;font-variant-numeric:tabular-nums}
.elig{font-size:9.5px;font-weight:700;letter-spacing:.4px;padding:1px 4px;border-radius:4px;
white-space:nowrap}
.elig.on2{background:var(--okbg);color:var(--ok);border:1px solid var(--okline)}
.elig.up{background:var(--accbg);color:var(--acc);border:1px solid var(--accline)}
.elig.dn{background:var(--warnbg);color:var(--warn);border:1px solid var(--warnline)}
.elig.no{background:var(--badbg);color:var(--bad);border:1px solid var(--badline)}
.mhead{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;
gap:10px;background:#fbfaf8}
.mhead h3{margin:0;font-size:16px;font-weight:600;flex:1}
.mhead .x{border:1px solid var(--line2);background:#fff;border-radius:5px;width:24px;height:24px;
cursor:pointer;color:var(--ink3);font-size:14px;line-height:1;padding:0}
.mhead .x:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.mbody{padding:12px 18px 18px;max-height:70vh;overflow:auto}
/*  A modal footer sits INSIDE the modal, with the same 18px gutter as the body
    and its own tinted band. Without it the buttons ran flush to the edge and
    read as if they had fallen out of the dialog. Ported from the prototype. */
.mfoot{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:12px 18px;
 border-top:1px solid var(--line);background:#fbfaf8;border-radius:0 0 13px 13px}
.mfoot .note{margin:0}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:12.5px}
.kv dt{color:var(--ink2)}
.kv dd{margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;
word-break:break-all}
/* ── the Formation stage. One row per age group; open one and you get that
      group alone. Ming, 19 Aug 2026: a page of every age group's every division
      was "too overwhelming". See DECISIONS.md ADR-006/007/008/009. ────────── */
.fgen{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:12px 0 4px}
.fgl{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.fgr{display:flex;align-items:center;gap:12px;padding:9px 12px;border:0;
 border-bottom:1px solid var(--line);background:#fff;cursor:pointer;width:100%;text-align:left;
 font:inherit}
.fgr:last-child{border-bottom:0}
.fgr:hover{background:#fbfaf8}
.fgr .nm{width:120px;flex:0 0 120px;font-weight:650;font-size:13px}
.fgr .nm span{display:block;font-weight:400;font-size:11px;color:var(--ink3)}
.fspark{flex:1;height:30px;display:flex;align-items:flex-end;gap:1px;min-width:120px}
.fspark i{flex:1;background:var(--line2);border-radius:1px 1px 0 0;min-height:1px}
.fspark i.b1{background:var(--d1)} .fspark i.b2{background:var(--d2)}
.fspark i.b3{background:var(--d3)} .fspark i.b4{background:var(--d4)}
.fspark i.b5{background:var(--d5)} .fspark i.b6{background:var(--d6)}
.fgr .st{width:200px;flex:0 0 200px;display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap}
/* levels: the cohort drawn, with the division lines on it */
.flv{position:relative;height:132px;border:1px solid var(--line);border-radius:9px;
 background:#fbfaf8;overflow:hidden;margin-top:4px}
.flv .bars{position:absolute;inset:0 0 20px 0;display:flex;align-items:flex-end;padding:8px 0 0}
.flv .bars i{flex:1;margin:0 .5px;background:var(--line2);border-radius:1px 1px 0 0;min-height:1px}
.flv .bars i.b1{background:var(--d1)} .flv .bars i.b2{background:var(--d2)}
.flv .bars i.b3{background:var(--d3)} .flv .bars i.b4{background:var(--d4)}
.flv .bars i.b5{background:var(--d5)} .flv .bars i.b6{background:var(--d6)}
.flv .axis{position:absolute;left:0;right:0;bottom:0;height:20px;border-top:1px solid var(--line);
 font-size:10px;color:var(--ink3)}
.flv .axis span{position:absolute;transform:translateX(-50%);top:2px}
.fcut{position:absolute;top:0;bottom:20px;width:2px;background:var(--ink);cursor:ew-resize;
 touch-action:none}
.fcut::before{content:'';position:absolute;left:-9px;right:-9px;top:0;bottom:0}
.fcut b{position:absolute;top:2px;left:50%;transform:translateX(-50%);background:var(--ink);
 color:#fff;font-size:10px;padding:1px 5px;border-radius:4px;white-space:nowrap;font-weight:600}
.fcut.drag{background:var(--acc)} .fcut.drag b{background:var(--acc)}
.fbt{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:12px}
.fbt th{text-align:left;font-size:10px;letter-spacing:.05em;text-transform:uppercase;
 color:var(--ink3);font-weight:650;padding:5px 6px;border-bottom:1px solid var(--line)}
.fbt td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
.fbt tr:last-child td{border-bottom:0}
.fbt .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.fbt .num{text-align:right;font-variant-numeric:tabular-nums}
/* ── THE PROPOSAL AND THE COMPARISON BOARD ──────────────────────────────────
   Lifted from prototype_formation_setup.html with the rules unchanged. Ming,
   19 Aug 2026: "I want them look like the prototype we've just built this
   morning." Same tokens, same geometry, same class names — this is a PORT, and
   restyling it independently is how the two drift apart. */
.c.bad{background:var(--badbg);border-color:var(--badline);color:var(--bad);font-weight:600}
.sq{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,268px));gap:10px;margin-top:8px}
.sqc{border:1px solid var(--line);border-radius:9px;background:#fff;overflow:hidden}
.sqc.short{border-color:var(--warnline)}
.sqh{padding:7px 10px;border-bottom:1px solid var(--line);background:#fbfaf8;font-size:12.5px}
.sqh .row{display:flex;gap:6px;align-items:baseline;margin-top:3px;font-size:11px;color:var(--ink2);
 flex-wrap:wrap}
.asg select{width:100%;font:600 12.5px inherit;padding:3px 5px;border-color:#b9c7de;
 background:var(--navy2);color:var(--navy)}
.cats{padding:6px 10px}
.catr{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--ink2);margin-bottom:2px}
.catr .nm2{width:70px;flex:0 0 70px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catr .tr{position:relative;flex:1;height:7px;background:#f1efea;border-radius:4px}
.catr .tr i{position:absolute;top:0;bottom:0;width:2px;background:var(--line2);left:50%}
.catr .tr b{position:absolute;top:1px;height:5px;border-radius:3px;background:var(--navy)}
.catr .tr b.lo{background:var(--warn)}
.catr .dv{width:32px;text-align:right;font-variant-numeric:tabular-nums}
.sqp{list-style:none;margin:0;padding:2px 0 4px;max-height:170px;overflow:auto}
.nl{border-top:1px solid var(--line)}
.nl summary{padding:5px 10px;font-size:11px;color:var(--ink2);cursor:pointer;list-style:none}
.nl summary::-webkit-details-marker{display:none}
.nl summary::before{content:'\25b8 ';color:var(--ink3)}
.nl[open] summary::before{content:'\25be '}
.sqp li{display:flex;gap:8px;padding:2px 10px;font-size:11.5px}
.sqp li .r{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink2)}
.warnbox{background:var(--accbg);border:1px solid var(--accline);color:var(--acc);
 border-radius:9px;padding:8px 11px;font-size:12px;margin-top:10px}
/* the comparison board */
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(206px,1fr));gap:10px;
 align-items:start}
.col{border:1px solid var(--line);border-radius:9px;background:#fff;overflow:hidden}
.col.over{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy2)}
.col.warn{border-color:var(--warnline)}
.colh{padding:7px 9px;border-bottom:1px solid var(--line);background:#fbfaf8}
.colh b{font-size:12.5px;display:block}
.colh .mt{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.pl{list-style:none;margin:0;padding:3px 0;min-height:56px}
.pl li{display:flex;gap:7px;padding:3px 9px;font-size:11.5px;cursor:grab;
 border-bottom:1px solid #f3f1ec}
.pl li:last-child{border-bottom:0}
.pl li:hover{background:#fbfaf8}
.pl li .r{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink2)}
.pl li .mk{color:var(--acc);font-weight:700;font-size:9px;letter-spacing:.04em}
.pl li .mvn{color:var(--acc);font-weight:600}
.pl li .ax{font-size:9px;color:var(--ink3);border:1px solid var(--line);border-radius:9px;
 padding:0 5px;white-space:nowrap}
.pl li .st{background:0;border:0;padding:0 2px 0 0;font-size:11px;color:var(--line2);cursor:pointer}
.pl li .st.on{color:#c9a227}
.pl li.ph{color:var(--ink3);cursor:default;justify-content:center;font-size:10px}
.lens{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.lb{background:#fff;border:1px solid var(--line2);border-radius:7px;padding:4px 11px;
 font:12.5px inherit;cursor:pointer}
.lb.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.zbar{display:flex;height:6px;margin:0 9px 6px}
.zbar i{display:block}
.zbar i:first-child{border-radius:3px 0 0 3px}
.zbar i:last-child{border-radius:0 3px 3px 0}
.zsec{border-top:1px solid var(--line)}
.zsec.over{background:var(--navy2)}
.zh{display:flex;align-items:center;gap:5px;padding:4px 9px 2px;font-size:9.5px;
 letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);font-weight:650}
.zh i{width:8px;height:8px;border-radius:2px;display:inline-block}
.zh span{margin-left:auto;font-weight:600}
.ftms{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.ftm{display:inline-flex;align-items:center;gap:5px;background:var(--navy2);border:1px solid #b9c7de;
 color:var(--navy);font-weight:600;font-size:12px;padding:3px 5px 3px 10px;border-radius:20px}
.ftm button{background:0;border:0;color:var(--navy);cursor:pointer;font-size:14px;line-height:1;
 padding:0 3px;opacity:.6}
.ftm button:hover{opacity:1}
.fopt{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line2);border-radius:9px;
 padding:9px 12px;background:#fff;cursor:pointer;font-size:12.5px}
.fopt.on{border-color:var(--navy);background:#f4f7fc}
.fbasis{display:flex;gap:12px;flex-wrap:wrap}
.fb{flex:1 1 300px;border:1px solid var(--line2);border-radius:10px;padding:10px 13px;
 background:#fff;cursor:pointer}
.fb.on{border-color:var(--navy);background:#f4f7fc}
.fb b{font-size:13px}
.fb p{margin:5px 0 0;font-size:11.5px;color:var(--ink2)}
</style>
</head>
<body>
<div x-data="app()" x-init="boot()" x-cloak
     @keydown.escape.window="pm.editing ? cancelEdit()
                     : (pm.adding ? (pm.adding=false) : (modal=''))">

<!-- ────────────────────────── SETUP ────────────────────────── -->
<template x-if="screen==='setup'">
<div>
  <header><div><h1>Coaching Platform</h1><div class="sub">first-time setup</div></div></header>
  <div id="shell"><div class="stage narrow">
    <div class="panel">
      <div class="rhead"><h2>Connect to your database</h2>
        <div class="sub">One-time. Both values come from Supabase — Settings → API.
          They are stored only in this browser.</div></div>
      <div class="pbody">
        <div class="field"><label class="fl">Project URL</label>
          <input type="text" x-model="cfg.url" placeholder="https://xxxxxxxx.supabase.co"></div>
        <div class="field"><label class="fl">Anon public key</label>
          <textarea x-model="cfg.key" rows="3" placeholder="eyJhbGciOi..."></textarea>
          <p class="note">Use the <b>anon public</b> key. Never paste the service_role key into a browser.</p></div>
        <button class="btn pri" @click="saveCfg()" :disabled="!cfg.url||!cfg.key">Connect</button>
        <p x-show="err" x-text="err" class="err"></p>
      </div>
    </div>
  </div></div>
</div>
</template>

<!-- ────────────────────────── SIGN IN ────────────────────────── -->
<template x-if="screen==='signin'">
<div>
  <header><div><h1>Coaching Platform</h1><div class="sub">sign in</div></div></header>
  <div id="shell"><div class="stage narrow">
    <div class="panel">
      <div class="rhead"><h2>Sign in</h2>
        <div class="sub">We email you a link. No password to remember.</div></div>
      <div class="pbody">
        <div class="field"><label class="fl">Email address</label>
          <input type="email" x-model="email" placeholder="you@example.com"></div>
        <button class="btn pri" @click="signIn()" :disabled="!email||busy"
          x-text="busy?'Sending…':'Email me a sign-in link'"></button>
        <p x-show="msg" x-text="msg" class="msg"></p>
        <p x-show="err" x-text="err" class="err"></p>
        <p class="note"><button class="lnk" @click="resetCfg()">Change database connection</button></p>
      </div>
    </div>
  </div></div>
</div>
</template>

<!-- ────────────────────────── APP ────────────────────────── -->
<template x-if="screen==='app'">
<div>
  <header>
    <div>
      <h1 x-text="org?.name || 'Coaching Platform'"></h1>
      <div class="sub">
        <span x-text="me?.display_name || userEmail"></span>
        <template x-if="me"><span> · <span x-text="me.role.replace('_',' ')"></span>
          · seniority <span x-text="me.seniority"></span></span></template>
      </div>
    </div>
    <div class="spacer"></div>
    <template x-if="org">
      <span>
        <button class="hb" :class="stage==='court'?'pri':''"
                @click="stage==='court' ? (stage='admin') : openCourt()"
                x-text="stage==='court' ? 'Club' : 'Courtside'"></button>
        <!-- A SECTION BUTTON KEEPS ITS NAME AND SHOWS WHETHER YOU ARE IN IT.
             These read as a set of places, not as toggles: renaming Teams to
             "Sessions" while you stand in it makes the header say where you are
             going instead of where you are. Ming, 19 Aug 2026. Courtside stays a
             toggle because it is a MODE, and while you are in it the section
             buttons are hidden — its label is the way back. -->
        <button class="hb" x-show="stage!=='court'" :class="stage==='admin'?'pri':''"
                @click="stage='admin'">Sessions</button>
        <button class="hb" x-show="stage!=='court'" :class="stage==='teams'?'pri':''"
                @click="openTeams()">Teams</button>
        <button class="hb" x-show="stage!=='court'" :class="stage==='formation'?'pri':''"
                @click="openFormation()">Formation</button>
        <button class="hb" x-show="stage!=='court'" @click="modal='players'">Players…</button>
        <button class="hb" x-show="stage==='admin'" @click="modal='rubrics'">Rubrics…</button>
        <button class="hb" x-show="stage==='teams'"
                @click="openClubCfg(); modal='clubcfg'">Club settings…</button>
      </span>
    </template>
    <button class="hb" @click="modal='more'">More…</button>
  </header>

  <div id="shell"><div class="stage">

    <!-- ══════════════════ COURTSIDE — the coach's own device ══════════════════
         Same app, same tokens, phone-shaped. A coach sees only the sessions they
         are authorised for. Ratings save to THIS DEVICE first and upload when
         there is a connection — a school hall on trial night is exactly where a
         live-only form dies, mid-rating, with a child standing in front of you.
         Nobody is pre-assigned: the list shows who has already been rated and by
         whom, and coaches pick up whoever has not been. -->
    <template x-if="stage==='court'">
      <div class="court">
        <div class="qbar" :class="queue.length ? 'wait' : 'done'">
          <b x-text="queue.length ? queue.length + (queue.length===1?' rating waiting':' ratings waiting')
                                  : 'Everything is saved'"></b>
          <span class="spacer"></span>
          <span x-show="!online" class="c wn">offline</span>
          <button class="btn sm" x-show="queue.length" :disabled="syncing || !online"
                  @click="flushQueue()" x-text="syncing?'Sending…':'Send now'"></button>
        </div>
        <p class="note" x-show="queue.length && !online" style="margin:-6px 0 11px">
          No connection. Keep rating — everything is held on this device and goes up by itself
          when you are back.</p>

        <!-- A refusal is not a network problem and must never be retried into a loop.
             The database said no; the coach is told what it said and decides. -->
        <template x-if="rejected.length">
          <div class="panel" style="border-color:var(--badline);margin-bottom:11px">
            <div class="rhead" style="background:var(--badbg);border-color:var(--badline)">
              <h2 style="font-size:15px">
                <span x-text="rejected.length"></span>
                <span x-text="rejected.length===1?'rating was not accepted':'ratings were not accepted'"></span>
              </h2>
              <div class="sub">These did not fail to send — they reached the database and it refused
                them. Nothing is lost; nothing will be retried on its own.</div>
            </div>
            <div class="pbody">
              <template x-for="r in rejected" :key="r.id">
                <div style="padding:8px 0;border-bottom:1px solid var(--line)">
                  <div style="font-size:13px;font-weight:600" x-text="nameOfPerson(r.person_id)"></div>
                  <div class="note" style="margin:2px 0 6px" x-text="r.reason"></div>
                  <div class="inline" style="margin:0">
                    <button class="btn sm" @click="requeueRejected(r.id)">Try again</button>
                    <button class="btn sm" @click="discardRejected(r.id)">Discard</button>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>
        <p x-show="court.err" x-text="court.err" class="err" style="margin-top:0"></p>

        <!-- pick a session -->
        <template x-if="!court.session">
          <div class="panel">
            <div class="rhead"><h2>Your rating sessions</h2>
              <div class="sub">Only sessions you have been authorised to rate in.</div></div>
            <div class="pbody">
              <template x-if="!court.sessions.length">
                <div class="empty">Nothing open for you right now. The club opens a session and
                  authorises you before it appears here.</div>
              </template>
              <template x-for="s in court.sessions" :key="s.id">
                <div class="prow" @click="pickCourtSession(s)">
                  <div class="nm"><span x-text="s.name"></span>
                    <span class="who"><span x-text="s.opens_at?.slice(0,10)"></span> →
                      <span x-text="s.closes_at?.slice(0,10)"></span></span></div>
                  <span class="c grp" x-text="s.status"></span>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- the squad -->
        <template x-if="court.session && !court.person">
          <div class="panel">
            <div class="rhead" style="display:flex;align-items:center;gap:10px">
              <div style="flex:1">
                <h2 x-text="court.session.name"></h2>
                <div class="sub"><span x-text="courtDone()"></span> of
                  <span x-text="court.people.length"></span> rated by anyone</div>
              </div>
              <button class="btn sm" @click="court.session=null;court.person=null">Back</button>
            </div>
            <div class="pbody">
              <p class="note" style="margin:0 0 9px">Nobody is assigned. Pick up whoever has not
                been rated — the list shows who already has.</p>
              <template x-for="p in court.people" :key="p.id">
                <div class="prow" @click="pickCourtPlayer(p)">
                  <div class="nm"><span x-text="p.given_name+' '+p.family_name"></span>
                    <span class="who" x-text="courtWho(p.id)"></span></div>
                  <span class="c" :class="courtMine(p.id) ? 'ok' : (courtRated(p.id) ? 'grp' : '')"
                        x-text="courtMine(p.id) ? 'you' : (courtRated(p.id) ? 'rated' : 'to do')"></span>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- rate one player -->
        <template x-if="court.person">
          <div class="panel">
            <div class="rhead" style="display:flex;align-items:center;gap:10px">
              <div style="flex:1">
                <h2 x-text="(court.person?.given_name||'')+' '+(court.person?.family_name||'')"></h2>
                <div class="sub"><span x-text="Object.keys(court.scores).length"></span> of
                  <span x-text="courtMeasures().length"></span> scored</div>
              </div>
              <button class="btn sm" @click="court.person=null">Back</button>
            </div>
            <div class="pbody">
              <p class="warnbar" style="border-radius:8px;border:1px solid var(--warnline);margin-bottom:10px"
                 x-show="courtMine(court.person?.id)">
                You have already rated this player in this session. Rating again is allowed and both
                are kept — the head coach sees the spread.</p>
              <template x-for="m in courtMeasures()" :key="m.id">
                <div class="mrow big">
                  <span class="lb" x-text="m.label"></span>
                  <div class="scale big">
                    <template x-for="v in scaleOf(m)" :key="v">
                      <button class="sv" :class="court.scores[m.id]===v?'on':''"
                              @click="court.scores[m.id]=v" x-text="v"></button>
                    </template>
                  </div>
                </div>
              </template>
              <div class="field" style="margin-top:10px">
                <label class="fl">Note (optional)</label>
                <input type="text" x-model="court.note" placeholder="anything worth recording">
              </div>
              <div class="inline" style="margin-top:0">
                <button class="btn pri" @click="saveCourt()"
                        :disabled="!Object.keys(court.scores).length">Save and next</button>
                <button class="btn" @click="court.scores={};court.note=''">Clear</button>
              </div>
              <p class="note">Saved on this device straight away. It goes up on its own — you do not
                have to wait for it. A saved rating cannot be edited; a correction is a resolution by
                the head coach.</p>
              <p x-show="court.msg" x-text="court.msg" class="msg"></p>
            </div>
          </div>
        </template>
      </div>
    </template>

    <!-- ══════════════════════ TEAMS ══════════════════════
         Ming, 13 Aug 2026: team formation happens here, across age groups, in
         a surface of its own — not as an output of one trial. The TMS shape:
         teams down the left, one roster in front of you, and the club's whole
         pool beneath the list. A player is placed from the pool, and the pool
         can show every age group at once, which is how a player plays up.

         The team NAME is club-level and outlives the season; what you are
         editing is that team's roster FOR THE SELECTED SEASON. -->
    <template x-if="stage==='teams'">
    <div class="panel">
      <div class="rhead" style="display:flex;align-items:flex-start;gap:10px">
        <div style="flex:1">
          <h2>Teams</h2>
          <div class="sub">A team name carries across seasons. The roster belongs to the season
            you are in.</div>
        </div>
        <div class="inline" style="margin:0">
          <select x-model="seasonId" @change="onSeasonChange(); loadTeams()" style="width:auto">
            <template x-for="s in seasons" :key="s.id">
              <option :value="s.id" x-text="seasonOptionLabel(s)"></option>
            </template>
          </select>
          <button class="btn" @click="tm.adding=true" :disabled="!seasonId">New team</button>
        </div>
      </div>

      <div class="statrow">
        <div><b x-text="teamSeasons.length"></b>teams</div>
        <div><b x-text="ageGroupsInSeason().length"></b>age groups</div>
        <div><b x-text="placedCount()"></b>placed</div>
        <div><b x-text="poolAll().length - placedPeople().size"></b>unplaced</div>
        <div><b x-text="rosterAvg(tm.selected) || '—'"></b>this team</div>
      </div>
      <p x-show="tm.err" class="warnbar" style="display:flex;gap:10px;align-items:center">
        <span style="flex:1" x-text="tm.err"></span>
        <button class="lnk" style="color:var(--warn)" @click="tm.err=''">dismiss</button></p>

      <div class="pbody">
        <!-- new team -->
        <div x-show="tm.adding" class="srow" style="background:#fbfaf8">
          <div class="row2">
            <div class="field"><label class="fl">Team name — reused every season</label>
              <input type="text" x-model="tm.name" placeholder="e.g. Gold"
                     list="teamNames"></div>
            <div class="field"><label class="fl">Age group this season</label>
              <select x-model="tm.grp">
                <option value="">—</option>
                <template x-for="g in allAgeGroups()" :key="g">
                  <option :value="g" x-text="g"></option></template>
              </select></div>
          </div>
          <datalist id="teamNames">
            <template x-for="t in teams" :key="t.id"><option :value="t.name"></option></template>
          </datalist>
          <div class="field"><label class="fl">Division (optional)</label>
            <input type="text" x-model="tm.div" placeholder="e.g. Div 1"></div>
          <p class="note" style="margin-bottom:8px">Reusing an existing name puts that team into
            this season — it does not create a second team.</p>
          <div class="inline">
            <button class="btn pri" @click="createTeam()"
                    :disabled="!tm.name.trim() || tm.busy">Add team</button>
            <button class="btn" @click="tm.adding=false">Cancel</button>
          </div>
        </div>

        <template x-if="!teamSeasons.length && !tm.adding">
          <div class="empty" x-text="'No teams in '+seasonName(seasonId)+' yet. Add one to start.'"></div>
        </template>

        <div class="tsplit" x-show="teamSeasons.length">
          <!-- ── teams, grouped by age group ── -->
          <div>
            <template x-for="g in ageGroupsInSeason()" :key="g||'none'">
              <div>
                <div class="tgrp" x-text="g || 'No age group'"></div>
                <template x-for="ts in teamSeasonsIn(g)" :key="ts.id">
                  <button class="titem" :class="tm.selected===ts.id?'on':''"
                          @click="selectTeam(ts.id)">
                    <span class="tn" x-text="ts.team_name"></span>
                    <span class="c" x-show="ts.division" x-text="ts.division"></span>
                    <span class="c" x-text="rosterOf(ts.id).length"></span>
                    <span class="c grp" x-text="rosterAvg(ts.id) || '–'"></span>
                  </button>
                </template>
              </div>
            </template>

            <!-- ── the pool ── -->
            <div class="cath" style="margin-top:12px">Player pool</div>
            <div class="inline" style="margin-top:0">
              <input type="search" x-model="tm.q" placeholder="Search" style="flex:1;min-width:90px">
              <select x-model="tm.scope" style="width:auto">
                <option value="grp">This age group</option>
                <option value="all">All age groups</option>
              </select>
            </div>
            <label class="fl" style="margin:6px 0 4px">
              <input type="checkbox" x-model="tm.hidePlaced" style="width:auto;margin-right:6px">
              Hide anyone already placed in this age group</label>
            <div class="pool">
              <template x-for="p in poolShown()" :key="p.person_id">
                <div class="pitem2" draggable="true"
                     @dragstart="tm.drag=p.person_id"
                     @dblclick="place(p.person_id)">
                  <span class="pn" x-text="p.given_name+' '+p.family_name"></span>
                  <span class="c" x-text="p.age!=null ? p.age : '?'"></span>
                  <span class="pv" x-text="p.rating ?? '–'"></span>
                  <span class="elig" :class="eligOf(p).k" x-text="eligOf(p).s"></span>
                  <button class="btn sm" @click="place(p.person_id)"
                          :disabled="!tm.selected || eligOf(p).k==='no'">+</button>
                </div>
              </template>
              <template x-if="!poolShown().length">
                <div class="empty" style="padding:16px 10px">Nobody left in this filter.</div>
              </template>
            </div>
            <p class="note">Drag a name onto the roster, or use <b>+</b>. A player can be in one
              team per age group and in as many age groups as you place them.</p>
          </div>

          <!-- ── the roster ── -->
          <div>
            <template x-if="!tm.selected">
              <div class="empty">Pick a team on the left.</div>
            </template>
            <template x-if="tm.selected">
              <div>
                <div class="inline" style="margin:0 0 8px">
                  <b style="font-size:15px" x-text="selTeam()?.team_name"></b>
                  <span class="c grp" x-text="selTeam()?.age_group || 'no age group'"></span>
                  <span class="c" x-show="selTeam()?.division" x-text="selTeam()?.division"></span>
                  <span class="c" x-text="rosterOf(tm.selected).length + ' players'"></span>
                  <span class="c" x-text="'avg ' + (rosterAvg(tm.selected) || '–')"></span>
                  <span style="margin-left:auto"></span>
                  <button class="btn sm" @click="removeTeamSeason()"
                          :disabled="rosterOf(tm.selected).length>0">Remove from season</button>
                </div>

                <div class="rost" :class="tm.over?'over':''"
                     @dragover.prevent="tm.over=true" @dragleave="tm.over=false"
                     @drop.prevent="tm.over=false; if(tm.drag) place(tm.drag); tm.drag=null">
                  <template x-for="r in rosterOf(tm.selected)" :key="r.id">
                    <div class="rrow">
                      <button class="star" :class="r.is_star?'on':''"
                              @click="setStar(r, !r.is_star)"
                              :title="r.is_star?'Starred':'Mark as a key player'">★</button>
                      <span class="rn" x-text="r.given_name+' '+r.family_name"></span>
                      <span class="c" x-text="r.age!=null ? r.age : '?'"></span>
                      <span class="elig" :class="eligRow(r).k" x-text="eligRow(r).s"></span>
                      <select x-show="zones().length"
                              @change="setZone(r, $event.target.value)">
                        <option value="" :selected="!r.zone">zone —</option>
                        <template x-for="z in zones()" :key="z">
                          <option :value="z" :selected="r.zone===z" x-text="z"></option></template>
                      </select>
                      <select x-show="positions().length"
                              @change="setPosition(r, $event.target.value)">
                        <option value="" :selected="!r.position">pos —</option>
                        <template x-for="ps in positions()" :key="ps">
                          <option :value="ps" :selected="r.position===ps" x-text="ps"></option></template>
                      </select>
                      <span class="rv" x-text="r.rating ?? '–'"></span>
                      <button class="btn sm" @click="unplace(r)">Remove</button>
                    </div>
                  </template>
                  <template x-if="!rosterOf(tm.selected).length">
                    <div class="empty" style="padding:22px 10px">
                      Empty. Drag a name from the pool, or press <b>+</b> beside one.</div>
                  </template>
                </div>

                <!-- balance across the age group, so a swap shows its cost -->
                <template x-if="teamSeasonsIn(selTeam()?.age_group).length > 1">
                  <div>
                    <div class="cath" style="margin-top:12px">Balance across
                      <b x-text="selTeam()?.age_group"></b></div>
                    <table class="vtab">
                      <thead><tr><th>Team</th><th class="r">Players</th>
                        <th class="r">Average</th></tr></thead>
                      <tbody>
                        <template x-for="ts in teamSeasonsIn(selTeam()?.age_group)" :key="ts.id">
                          <tr>
                            <td x-text="ts.team_name"></td>
                            <td class="r v" x-text="rosterOf(ts.id).length"></td>
                            <td class="r v" x-text="rosterAvg(ts.id) || '–'"></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                    <p class="note">Every placement moves these numbers. A backfill by hand is
                      meant to be visible, not silent.</p>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </div>
      </div>
    </div>
    </template>


    <!-- ── FORMATION. Ming, 19 Aug 2026: one row per age group, open one and you
         get that group alone. The club moves LINES on the distribution and a
         team's target is read off the band they cut — never typed at a cohort
         that cannot reach it. ADR-006/007/009. ─────────────────────────────── -->
    <template x-if="stage==='formation'">
    <div class="panel">
      <div class="rhead" style="display:flex;align-items:flex-start;gap:10px">
        <div style="flex:1">
          <h2>Formation</h2>
          <div class="sub">One row per age group. Open one to see who is in it and set the
            divisions you intend to play.</div>
        </div>
        <div class="inline" style="margin:0">
          <select x-model="seasonId" @change="onSeasonChange(); loadFormation()" style="width:auto">
            <template x-for="s in seasons" :key="s.id">
              <option :value="s.id" x-text="seasonOptionLabel(s)" :selected="s.id===seasonId"></option>
            </template>
          </select>
        </div>
      </div>

      <p x-show="fp.err" x-text="fp.err" class="err"></p>

      <template x-if="!seasonId">
        <div class="empty">Choose a season first — formation belongs to one.</div>
      </template>

      <template x-if="seasonId && !fAllGroups().length">
        <div class="empty">No player in this club has a date of birth and a rating yet, so there
          is nothing to band. Rate a trial first.</div>
      </template>

      <template x-if="seasonId && fAllGroups().length && !fGroups().length">
        <div class="empty" x-text="'No '+fp.gender+' age group has players in this season.'"></div>
      </template>

      <!-- SEASON, THEN GENDER, THEN THE AGE GROUPS IN IT. Ming, 19 Aug 2026.
           Thirteen rows of mixed boys, girls and mixed is a list to read; the
           six or seven you are actually working through is a list to use. The
           genders offered are the ones this club's own bands produce — nothing
           is named here. -->
      <template x-if="seasonId && fGenders().length>1">
        <div class="fgen">
          <span class="cath" style="margin:0">Gender</span>
          <template x-for="x in fGenders()" :key="x">
            <button class="lb" :class="fp.gender===x?'on':''" @click="fp.gender=x"
                    x-text="x"></button>
          </template>
          <span class="c" x-text="fGroups().length+' age group'+(fGroups().length===1?'':'s')"></span>
        </div>
      </template>

      <template x-if="seasonId && fGroups().length">
        <div>
          <div class="cath">Age groups</div>
          <div class="fgl">
            <template x-for="g in fGroups()" :key="g">
              <button class="fgr" @click="fOpen(g)">
                <span class="nm"><b x-text="g"></b>
                  <span x-text="fGroupSub(g)"></span></span>
                <span class="fspark" x-html="fSpark(g)"></span>
                <span class="st">
                  <span class="c on" x-text="fTeamsLabel(g)"></span>
                  <span class="c" x-text="fPlan(g).basis==='points'?'points':'rating'"></span>
                  <template x-if="fThin(g)">
                    <span class="c wn" x-text="fThin(g)+' too small'"></span>
                  </template>
                </span>
              </button>
            </template>
          </div>
          <p class="note">The strip is that age group's distribution, shaded by the divisions you
            have set. There is nothing to set club-wide — no two age groups have the same players
            in them.</p>
        </div>
      </template>
    </div>
    </template>

    <template x-if="stage==='admin'">
    <div>

    <!-- no membership -->
    <template x-if="!org">
      <div class="panel">
        <div class="rhead"><h2>No organisation yet</h2>
          <div class="sub">You are signed in, but not a member of any organisation.</div></div>
        <p class="warnbar">This is the security model working. With no membership row the database
          returns nothing at all — not an error, just nothing.</p>
        <div class="pbody">
          <p class="note" style="margin-top:0">Run this in the Supabase SQL Editor to join the demo
            club. Your user id is already filled in.</p>
          <pre class="sql">insert into membership (user_id, org_id, display_name, role, seniority)
values (
  '<span x-text="userId"></span>',
  '11111111-0000-0000-0000-000000000001',
  'Your Name', 'head_coach', 10
);</pre>
          <p><button class="btn pri" @click="load()">I've done that — reload</button></p>
        </div>
      </div>
    </template>

    <!-- the working surface: rating sessions -->
    <template x-if="org">
    <div class="panel">
      <div class="rhead" style="display:flex;align-items:flex-start;gap:10px">
        <div style="flex:1">
          <h2>Rating sessions</h2>
          <div class="sub">A multi-day trial is one session. Days are added inside it.</div>
        </div>
        <!-- The season is a SCOPE, not a section, so it sits on the stage rather
             than in the header beside Players and Rubrics. Everything below is
             read through it. -->
        <div class="inline" style="margin:0">
          <select x-model="seasonId" @change="onSeasonChange()" style="width:auto"
                  :disabled="!seasons.length">
            <template x-for="s in seasons" :key="s.id">
              <option :value="s.id" x-text="seasonOptionLabel(s)"></option>
            </template>
          </select>
          <button class="btn" @click="modal='seasons'">Seasons…</button>
          <button class="btn" @click="newSession.open=!newSession.open"
                  :disabled="!seasons.length"
                  x-text="newSession.open?'Cancel':'New session'"></button>
        </div>
      </div>
      <p class="warnbar" x-show="!seasons.length">There is no season yet, and a trial has to belong
        to one. Open <b>Seasons…</b> and create the season you are running.</p>
      <div class="statrow">
        <div><b x-text="sessions.length"></b>sessions</div>
        <div><b x-text="sessions.filter(s=>s.status==='open').length"></b>open</div>
        <div><b x-text="sessions.filter(s=>s.status==='confirmed').length"></b>confirmed</div>
        <div><b x-text="waitingCount()"></b>waiting on you</div>
        <div><b x-text="toSettleCount()"></b>calls to make</div>
        <div><b x-text="people.length"></b>players</div>
      </div>
      <div class="statrow" style="padding-top:8px;padding-bottom:8px" x-show="waitingCount()">
        <div style="min-width:0;display:flex;gap:6px;align-items:center;flex-wrap:wrap">
          <button class="btn sm" :class="onlyWaiting ? 'pri' : ''"
                  @click="onlyWaiting=!onlyWaiting"
                  x-text="onlyWaiting ? 'Showing what is waiting' : 'Show only what is waiting'"></button>
          <span class="note" style="margin:0">A session appears here once anybody in it is fully
            rated, or a disagreement is waiting on your call.</span>
        </div>
      </div>
      <p x-show="err" class="warnbar" style="display:flex;gap:10px;align-items:center">
        <span style="flex:1" x-text="err"></span>
        <button class="lnk" style="color:var(--warn)" @click="err=''">dismiss</button>
      </p>

      <div class="pbody">
        <div x-show="newSession.open" class="srow" style="background:#fbfaf8">
          <div class="field"><label class="fl">Session name</label>
            <input type="text" x-model="newSession.name" placeholder="e.g. U14 Trials 2027"></div>
          <div class="row2">
            <div class="field"><label class="fl">First day</label>
              <input type="date" x-model="newSession.opens"></div>
            <div class="field"><label class="fl">Last day</label>
              <input type="date" x-model="newSession.closes" :min="newSession.opens"></div>
          </div>
          <div class="field"><label class="fl">Rubric — most clubs want Core</label>
            <select x-model="newSession.rubric_id">
              <template x-for="r in rubrics" :key="r.id">
                <option :value="r.id" x-text="r.name+' ('+measuresOf(r.id).length+' measures)'"></option>
              </template>
            </select></div>
          <p class="note" style="margin-bottom:8px">Every day you add must fall on or between
            these two dates. This trial lands in <b x-text="seasonName(seasonId)"></b>.</p>
          <button class="btn pri" @click="createSession()"
            :disabled="!newSession.name||!newSession.opens||!newSession.closes||busy">Create session</button>
          <p x-show="err" x-text="err" class="err"></p>
        </div>

        <!-- A filter that silently hides work is worse than no filter. If the
             chosen season is empty and another one is not, say so and offer the
             way there. -->
        <template x-if="!sessions.length">
          <div class="empty">
            <div x-text="'No sessions in '+seasonName(seasonId)+' yet.'"></div>
            <template x-if="elsewhereSeasons().length">
              <div style="margin-top:8px">
                <span x-text="allSessions.length + (allSessions.length===1
                      ? ' session sits in another season:' : ' sessions sit in other seasons:')"></span>
                <template x-for="s in elsewhereSeasons()" :key="s.id">
                  <button class="btn sm" style="margin-left:6px"
                          @click="seasonId=s.id; onSeasonChange()"
                          x-text="seasonOptionLabel(s)"></button>
                </template>
              </div>
            </template>
          </div>
        </template>

        <template x-for="s in visibleSessions()" :key="s.id">
          <div class="srow">
            <div class="sflex">
              <div class="body">
                <div class="nm" x-text="s.name"></div>
                <div class="meta">
                  <span x-text="s.opens_at?.slice(0,10)"></span> →
                  <span x-text="s.closes_at?.slice(0,10)"></span>
                  · <span x-text="rubricName(s.rubric_id)"></span>
                  <span class="c" :class="rubricLevel(s.rubric_id)==='core'?'grp':'acc'"
                        x-text="rubricLevel(s.rubric_id)==='core'?'5 measures':'10 measures'"></span>
                </div>
              </div>
              <span class="c" :class="{'':s.status==='draft','grp':s.status==='open',
                    'wn':s.status==='closed','ok':s.status==='confirmed'}" x-text="s.status"></span>
              <span class="c wn" x-show="q(s.id)?.outside_window"
                    title="Ratings are gated by status, never the clock — this is a reminder, not a block"
                    >outside its window</span>
              <span class="c acc" x-show="q(s.id)?.to_settle"
                    x-text="q(s.id)?.to_settle + ' to settle'"></span>
              <span class="c" x-show="q(s.id)?.complete"
                    x-text="q(s.id)?.complete + '/' + q(s.id)?.players + ' rated'"></span>
              <button class="btn sm" x-show="q(s.id)?.needs_you" @click="openReview(s)"
                      >Review…</button>
              <button class="btn sm" @click="openSession(s)"
                      x-text="sel?.id===s.id?'Close':'Open'"></button>
            </div>

            <div x-show="sel?.id===s.id" class="sdet">
              <div class="cath">Days in this session <b x-text="blocks.length"></b></div>
              <template x-if="!blocks.length">
                <div class="note" style="margin:0">No days yet.</div></template>
              <table class="jt" x-show="blocks.length">
                <thead><tr><th>Date</th><th style="width:110px">Time</th><th>Venue</th>
                  <th style="width:74px"></th></tr></thead>
                <tbody>
                  <template x-for="b in blocks" :key="b.id">
                    <tr><td x-text="b.block_date"></td>
                        <td x-text="b.starts_at?.slice(0,5)+'–'+b.ends_at?.slice(0,5)"></td>
                        <td x-text="b.venue"></td>
                        <td><button class="btn sm" @click="removeBlock(b)">Remove</button></td></tr>
                  </template>
                </tbody>
              </table>
              <p class="note">This session runs <b x-text="fmt(sel?.opens_at)"></b> to
                <b x-text="fmt(sel?.closes_at)"></b>.</p>
              <div class="inline">
                <input type="date" x-model="newBlock.date"
                       :min="sel?.opens_at?.slice(0,10)" :max="sel?.closes_at?.slice(0,10)">
                <input type="time" x-model="newBlock.start" style="width:104px">
                <input type="time" x-model="newBlock.end" style="width:104px">
                <input type="text" x-model="newBlock.venue" placeholder="venue" style="width:130px">
                <button class="btn sm" @click="addBlock()">Add day</button>
              </div>
              <p x-show="blockErr" x-text="blockErr" class="err"></p>

              <div class="cath">Authorised raters <b x-text="auths.length"></b></div>
              <p class="note" style="margin:0 0 5px">Being a coach in the club is not enough.
                Authorisation is explicit and per session.</p>
              <template x-if="!auths.length">
                <div class="note" style="margin:0">Nobody authorised yet.</div></template>
              <template x-for="a in auths" :key="a.id">
                <div class="inline" style="margin:0 0 3px;gap:8px">
                  <span style="font-size:12.5px" x-text="nameOf(a.membership_id)"></span>
                  <button class="btn sm" @click="removeAuth(a)">Remove</button>
                </div>
              </template>
              <div class="inline">
                <select x-model="newAuth.membership_id">
                  <option value="">choose a member…</option>
                  <template x-for="m in members" :key="m.id">
                    <option :value="m.id" x-text="m.display_name+' ('+m.role.replace('_',' ')+')'"></option>
                  </template>
                </select>
                <button class="btn sm" @click="addAuth()"
                        :disabled="!newAuth.membership_id">Authorise</button>
              </div>

              <div class="cath">Where this session is up to</div>
              <div class="inline" style="margin-top:0">
                <span class="c" :class="s.status==='draft'?'':'ok'">1 · draft</span>
                <span class="c" :class="['open','closed','confirmed'].includes(s.status)?'ok':''">2 · open</span>
                <span class="c" :class="['closed','confirmed'].includes(s.status)?'ok':''">3 · closed</span>
                <span class="c" :class="s.status==='confirmed'?'ok':''">4 · confirmed</span>
              </div>

              <div class="inline">
                <template x-if="s.status==='draft'">
                  <button class="btn pri" @click="setStatus(s,'open')"
                          :disabled="!blocks.length || !auths.length">Open this session</button>
                </template>
                <template x-if="s.status==='open'">
                  <button class="btn" @click="setStatus(s,'closed')">Close for now</button>
                </template>
                <template x-if="s.status==='closed'">
                  <button class="btn" @click="setStatus(s,'open')">Reopen</button>
                </template>
              </div>
              <p class="note" x-show="s.status==='draft' && openBlockers()"
                 style="margin:4px 0 0">
                Before this can open it needs <b x-text="openBlockers()"></b>.
              </p>
              <p class="note" x-show="s.status==='closed'" style="margin:4px 0 0">
                Closed stops new ratings but is not final — reopen it if a coach still has players
                to get through. Confirming is the step that cannot be undone.
              </p>
              <p x-show="statusErr" x-text="statusErr" class="err"></p>

              <div class="cath" x-show="s.status==='confirmed'">Form teams</div>
              <template x-if="s.status==='confirmed'">
                <div>
                  <p class="note" style="margin-top:0">Runs on the approved record from this
                    session. It is a constraint solver, not a guess — the same session and the same
                    plan always produce the same teams, and anything it cannot place is named.</p>
                  <div class="inline">
                    <input type="text" x-model="fm.plan" style="flex:1;min-width:200px"
                           placeholder="Gold 8, Navy 8, White 8">
                    <button class="btn pri" @click="runFormation(s)"
                            :disabled="fm.busy || !fm.plan.trim()"
                            x-text="fm.busy ? 'Working…' : 'Propose teams'"></button>
                  </div>
                  <p class="note" style="margin:4px 0 0">Name each team and how many it holds.
                    Add <b>F</b> or <b>M</b> for a single-gender team — <i>Girls 8 F, Open 10</i>.</p>
                  <p x-show="fm.err" x-text="fm.err" class="err"></p>
                </div>
              </template>

              <template x-if="fm.result && fm.sessionId===s.id">
                <div style="margin-top:10px">
                  <div class="statrow" style="border:1px solid var(--line);border-radius:8px;margin-bottom:10px">
                    <div><b x-text="fm.result.teams.length"></b>teams</div>
                    <div><b x-text="fm.result.teams.reduce((n,t)=>n+t.size,0)"></b>placed</div>
                    <div><b x-text="fm.result.unplaced.length"></b>unplaced</div>
                    <div><b x-text="fm.result.spread"></b>spread</div>
                    <div><b x-text="fm.result.swaps"></b>swaps</div>
                  </div>
                  <div class="grid3">
                    <template x-for="t in fm.result.teams" :key="t.label">
                      <div class="tcol">
                        <div class="h"><b x-text="t.label"></b>
                          <span class="c" x-text="t.size + '/' + t.planned_size"></span>
                          <span class="c grp" x-text="'avg ' + (t.average ?? '–')"></span></div>
                        <template x-for="pl in t.players" :key="pl.person_id">
                          <div class="p">
                            <span x-text="pl.name"></span>
                            <span class="c ok" x-show="pl.forced">HC</span>
                            <span class="c" x-show="pl.locked && !pl.forced">locked</span>
                            <span class="r" x-text="Number(pl.rating).toFixed(2)"></span>
                            <button class="btn sm" @click="toggleLock(s, pl, t.label)"
                                    x-text="pl.locked ? 'Unlock' : 'Lock'"></button>
                          </div>
                        </template>
                        <template x-if="!t.players.length">
                          <div class="p" style="color:var(--ink3)">nobody yet</div>
                        </template>
                      </div>
                    </template>
                  </div>

                  <template x-if="fm.result.unplaced.length">
                    <div class="warnbar" style="border-radius:8px;border:1px solid var(--warnline);margin-top:10px">
                      <b x-text="fm.result.unplaced.length + ' not placed'"></b> — nobody is dropped
                      silently.
                      <template x-for="u in fm.result.unplaced" :key="u.person_id">
                        <div style="margin-top:3px"><b x-text="u.name"></b>
                          <span x-text="' — ' + u.reason"></span></div>
                      </template>
                    </div>
                  </template>

                  <template x-if="fm.result.notes.length">
                    <div style="margin-top:8px">
                      <div class="cath">Decisions the engine was told to respect</div>
                      <template x-for="(n, ix) in fm.result.notes" :key="ix">
                        <div class="note" style="margin:2px 0" x-text="n"></div>
                      </template>
                    </div>
                  </template>
                  <p class="note" x-text="fm.result.method"></p>
                </div>
              </template>

              <div class="cath">Do the work</div>
              <div class="inline" style="margin-top:0">
                <button class="btn pri" @click="openRate(s)"
                        :disabled="s.status!=='open'">Rate players…</button>
                <button class="btn" @click="openReview(s)">Review &amp; confirm…</button>
              </div>
              <p class="note" x-show="s.status!=='open'">
                Ratings can only be recorded while a session is <b>open</b>. This one is
                <b x-text="s.status"></b>.
              </p>

              <template x-if="s.status==='draft' || s.status==='open'">
                <div style="margin-top:14px;border-top:1px solid var(--line);padding-top:10px">
                  <div class="inline" style="margin:0">
                    <button class="btn sm" x-show="delConfirm!==s.id"
                            @click="delConfirm=s.id; delErr=''">Delete this session</button>
                    <template x-if="delConfirm===s.id">
                      <span class="inline" style="margin:0;gap:8px">
                        <span class="note" style="margin:0">Delete
                          <b x-text="s.name"></b> permanently?</span>
                        <button class="btn sm pri" @click="deleteSession(s)">Yes, delete</button>
                        <button class="btn sm" @click="delConfirm=''">Keep it</button>
                      </span>
                    </template>
                  </div>
                  <p class="note" style="margin:6px 0 0">A session that holds ratings cannot be
                    deleted — close it instead. Ratings are a permanent record.</p>
                  <p x-show="delErr" x-text="delErr" class="err"></p>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
    </div>
    </template>

    </div>
    </template>

  </div></div>

  <!-- ─────────── PLAYERS (modal) ───────────
       Three doors, one record: staff entry here, EOI and import later. They
       differ in how much TRUST attaches to the data, never in what they
       produce — so this screen writes the same row an import will.

       Verification is RECONCILIATION, not interrogation. The parent supplied
       this data; asking them to confirm it tests transcription, not truth. A
       club matches the association's registration, which the parent already
       attested to and paid against, and only contacts a family where the two
       disagree. Hence three sources, and an override that must say why. ── -->
  <template x-if="modal==='players'">
    <div class="modal" @click.self="pm.editing ? null : (modal='')">
      <div class="box lg">
        <div class="mhead"><h3>Players</h3>
          <span class="c" x-text="peopleShown().length+' of '+people.length"></span>
          <span class="c wn" x-show="unverifiedCount()"
                x-text="unverifiedCount()+' unverified'"></span>
          <button class="btn sm pri" @click="startAdd()"
                  x-show="!pm.editing && pm.returnTo!=='review'">Add a player</button>
          <button class="x" @click="modal=''" x-show="!pm.editing" title="Close">×</button></div>

        <div class="mbody">
          <p x-show="peopleErr" x-text="peopleErr" class="err" style="margin-top:0"></p>

          <!-- ── filters. Age is arithmetic — age at 31 December of the year you
                 pick — NOT a named band. U12 / U14 are an association's own
                 convention and belong with the season, not hard-coded here. ── -->
          <p class="note" x-show="pm.returnTo==='review'" style="margin-top:0">
            Showing the players in <b x-text="pm.sessionName"></b>. Pick any of them on the left —
            you do not have to go back to the ledger between players.</p>
          <div class="inline" style="margin-top:0" x-show="pm.returnTo!=='review'">
            <input type="search" x-model="pf.q" placeholder="Search a name"
                   style="flex:1;min-width:150px">
            <select x-model="pf.show" style="width:auto">
              <option value="active">Active</option>
              <option value="unverified">Unverified only</option>
              <option value="inactive">Inactive</option>
              <option value="all">Everyone</option>
            </select>
            <select x-model="pf.gender" style="width:auto">
              <option value="">Any gender</option>
              <option value="F">F</option><option value="M">M</option><option value="X">X</option>
            </select>
            <select x-model.number="pf.year" style="width:auto">
              <template x-for="y in ageYears()" :key="y">
                <option :value="y" x-text="'age at 31 Dec '+y"></option>
              </template>
            </select>
          </div>
          <div class="fchips" x-show="pm.returnTo!=='review'">
            <button class="fc" :class="pf.age===null?'on':''" @click="pf.age=null">All ages</button>
            <template x-for="g in ageGroups()" :key="g.age">
              <button class="fc" :class="pf.age===g.age?'on':''" @click="pf.age=g.age">
                <b x-text="g.age"></b><span x-text="' · '+g.n"></span></button>
            </template>
            <span class="c" x-show="!ageGroups().length">no dates of birth recorded</span>
          </div>

          <div class="psplit" style="margin-top:10px">
            <div>
              <div class="plist2">
                <template x-for="p in peopleShown()" :key="p.id">
                  <button class="prow" :class="pm.personId===p.id?'on':''"
                          @click="selectPlayer(p)">
                    <span class="u" x-show="p.verification!=='verified'"
                          title="not verified"></span>
                    <span class="bd">
                      <span class="n2" x-text="p.given_name+' '+p.family_name"></span>
                      <span class="m2">
                        <span x-text="p.dob ? ageAt(p.dob, pf.year)+' in '+pf.year : 'no DOB'"></span>
                        <span x-show="p.gender" x-text="' · '+p.gender"></span>
                        <span x-show="p.status==='inactive'"> · inactive</span>
                        <span x-show="ratedCount(p.id)" x-text="' · '+ratedCount(p.id)+' rated'"></span>
                      </span>
                    </span>
                  </button>
                </template>
                <template x-if="!peopleShown().length">
                  <div class="empty" style="padding:18px 10px"
                       x-text="people.length ? 'Nobody matches that.' : 'No players yet.'"></div>
                </template>
              </div>
              <p class="note">A dot marks a record nobody has stood behind yet. Rating never waits
                on it; <b>an offer of a place does</b>.</p>
            </div>

            <div class="pdet" data-modal="player">
              <template x-if="!pm.personId">
                <div class="empty">Pick a player on the left.</div>
              </template>
              <template x-if="pm.personId">
                <div>
                  <div class="inline" style="margin:0 0 8px">
                    <b style="font-size:15px" x-text="pm.name"></b>
                    <span class="c" x-show="pe.dob" x-text="ageAt(pe.dob, pf.year)+' in '+pf.year"></span>
                    <span class="c" x-show="pe.status==='inactive'">inactive</span>
                    <span class="c" :class="pe.verification==='verified' ? 'ok':'wn'"
                          x-text="pe.verification==='verified'
                                  ? vsourceShort(pe.vsource) : 'unverified'"></span>
                    <span class="c grp" x-show="pm.sessionName" x-text="pm.sessionName"></span>
                    <span style="margin-left:auto"></span>
                    <button class="btn sm" x-show="pm.returnTo==='review' && !pm.editing"
                            @click="modal='review'">&larr; Review</button>
                    <button class="btn sm" x-show="!pm.editing && canEditPlayer()"
                            @click="pm.editing=true">Edit</button>
                    <button class="btn sm pri" x-show="pm.editing" @click="savePerson()"
                            :disabled="pe.busy || !pe.given.trim() || !pe.family.trim()"
                            x-text="pe.busy ? 'Saving…' : 'Done'"></button>
