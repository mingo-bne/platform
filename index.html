<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClubFlowO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
/* ── Design tokens lifted from the TMS (build/src/app.css). Keep in step. ──
     ONE EXCEPTION, and it is deliberate: `--navy` is the CapFlowO FAMILY navy
     #1A2B48, not the TMS #1F3864. Ming's call, 20 Aug 2026, following ADR-028
     (the product is ClubFlowO, in the family wordmark) — once the name is
     family the chrome it sits on has to be too, or the mark sits on a foreign
     navy. Every other token still matches the TMS exactly.
     `--d1`…`--d6` and the chart strokes below are DATA colour, not chrome, and
     they stay on the TMS navy: a player drawn here and a player drawn in the
     TMS must be the same picture, and that rule is change-both-or-neither. */
:root{--bg:#f6f5f2;--card:#fff;--line:#e3e1db;--line2:#cfccc4;--ink:#1c1b19;--ink2:#5f5e5a;
--ink3:#8b8981;--navy:#1A2B48;--navy2:#e8edf5;--flow:#F37021;--flowo:#00A19D;--ok:#0f6e56;--okbg:#e1f5ee;--okline:#9fe1cb;
--warn:#854f0b;--warnbg:#faeeda;--warnline:#fac775;--bad:#a32d2d;--badbg:#fcebeb;--badline:#f7c1c1;
--acc:#534ab7;--accbg:#eeedfe;--accline:#cecbf6;--sh:0 6px 24px rgba(28,27,25,.16);--hh:52px;
--d1:#1F3864;--d2:#33517f;--d3:#4d6c9b;--d4:#7b96bd;--d5:#a3b7d3;--d6:#c8d3e4}
html,body{margin:0;height:100%}
body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
background:var(--bg);color:var(--ink)}
button{font:inherit}
[x-cloak]{display:none!important}

header{background:var(--navy);color:#fff;padding:9px 16px;display:flex;align-items:center;gap:10px;
flex-wrap:wrap;position:fixed;top:0;left:0;right:0;z-index:60;height:var(--hh);box-sizing:border-box}
header h1{font-size:15px;font-weight:600;margin:0}
header .sub{font-size:11px;opacity:.7}
header .spacer{flex:1}
.hb{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);
padding:6px 11px;border-radius:6px;cursor:pointer;font-size:12.5px}
.hb:hover{background:rgba(255,255,255,.26)}
.hb.pri{background:#fff;color:var(--navy);border-color:#fff;font-weight:600}
.hb:disabled{opacity:.45;cursor:default}

#shell{padding-top:var(--hh)}
.stage{max-width:1020px;margin:18px auto 60px;padding:0 16px}
.stage.narrow{max-width:520px;margin-top:60px}
/* A WORKING SURFACE IS AS WIDE AS THE WORK. Ming, 20 Aug 2026: "the page is not
   readable, check it yourself." Teams is index + roster + pool — three columns
   that demand about 1,230px — inside a stage capped at 1,020, so 252px of it
   was simply clipped off the right on a 1,710px screen with room to spare.
   1,020 is the READING width and stays the default; the stages that carry an
   index beside a working column get the room. */
.stage.wide{max-width:1400px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;
margin-bottom:14px}
.rhead{padding:14px 18px;border-bottom:1px solid var(--line);background:#fbfaf8}
.rhead h2{margin:0;font-size:19px;font-weight:600}
.rhead .sub{font-size:12.5px;color:var(--ink2);margin-top:3px}
.pbody{padding:12px 18px 16px}
.statrow{display:flex;gap:20px;flex-wrap:wrap;padding:11px 18px;background:#fbfaf8;
border-bottom:1px solid var(--line);font-size:12px;color:var(--ink2)}
.statrow div{min-width:76px}
.statrow b{display:block;font-size:17px;color:var(--ink);font-weight:600;line-height:1.25}
.warnbar{margin:0;padding:9px 18px;background:var(--warnbg);border-bottom:1px solid var(--warnline);
color:var(--warn);font-size:12.5px}
.okbar{margin:0;padding:9px 18px;background:var(--okbg);border-bottom:1px solid var(--okline);
color:var(--ok);font-size:12.5px}
.note{font-size:11.5px;color:var(--ink2);margin:8px 0 0}
.empty{padding:26px 16px;text-align:center;color:var(--ink3);font-size:13.5px}

.chips{display:flex;gap:4px;flex-wrap:wrap}
.c{font-size:10px;padding:2px 6px;border-radius:9px;border:1px solid var(--line2);color:var(--ink2);
background:#f7f6f3;white-space:nowrap}
.c.grp{background:var(--navy2);border-color:#c2cfe3;color:var(--navy);font-weight:600}
.c.acc{background:var(--accbg);border-color:var(--accline);color:var(--acc);font-weight:600}
.c.ok{background:var(--okbg);border-color:var(--okline);color:var(--ok);font-weight:600}
.c.wn{background:var(--warnbg);border-color:var(--warnline);color:var(--warn);font-weight:600}
.cath{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;color:var(--ink2);
text-transform:uppercase;letter-spacing:.04em;margin:12px 0 5px}
.cath:first-child{margin-top:0}
.pbody>:first-child{margin-top:0}
.pbody>.cath:first-of-type{margin-top:0}
.rgrp{margin-bottom:14px}.rgrp:last-child{margin-bottom:0}
.cath b{margin-left:auto;font-weight:600;color:var(--ink3)}

.jt{width:100%;border-collapse:collapse;font-size:12.5px}
.jt th,.jt td{border:1px solid var(--line);padding:5px 7px;text-align:left}
.jt th{background:#fbfaf8;font-weight:600;font-size:11.5px}
.scroll{max-height:270px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.scroll .jt th{position:sticky;top:0;z-index:1}
.scroll .jt th,.scroll .jt td{border-left:0;border-top:0}

input[type=text],input[type=email],input[type=date],input[type=time],select,textarea{
font:12.5px inherit;padding:5px 8px;border:1px solid var(--line2);border-radius:6px;
background:#fff;color:var(--ink);box-sizing:border-box}
input:focus,select:focus,textarea:focus{outline:2px solid var(--navy2);border-color:var(--navy)}
textarea{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}
/* THE ClubFlowO WORDMARK — the CapFlowO family treatment, unchanged.
   Club (navy on light / white on dark) + Flow (Prosperity Orange #F37021)
   + O (Growth Teal #00A19D). One word, capital C, F and O. The colour
   assignments never move between elements, and it is never written as three
   words. Ming's brand rule, carried across from CapFlowO.
   The family specifies Inter 800; this file loads no webfont on purpose
   (no build pipeline, and a font is a network dependency on a sideline with
   no signal), so it renders in the app's own stack at 800. */
.wm{font-weight:800;letter-spacing:-.5px}
.wm .f{color:var(--flow)}
.wm .o{color:var(--flowo)}
header .wm{color:#fff}
label.fl{display:block;font-size:11px;color:var(--ink2);margin:0 0 3px}
.field{margin-bottom:10px}
.field input,.field select,.field textarea{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1px solid var(--line2);background:#fff;border-radius:6px;padding:6px 12px;
cursor:pointer;font-size:12.5px;color:var(--ink)}
.btn:hover{background:#fbfaf8}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.btn.pri:hover{background:#2b4a7d}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:3px 8px;font-size:11.5px}
.err{color:var(--bad);font-size:12px;margin:6px 0 0}
.msg{color:var(--ok);font-size:12px;margin:6px 0 0}
.lnk{background:none;border:0;color:var(--ink3);font-size:11.5px;text-decoration:underline;
cursor:pointer;padding:0}
.lnkb{background:none;border:0;color:var(--navy);font:inherit;font-weight:600;cursor:pointer;
padding:0;text-align:left}
.lnkb:hover{text-decoration:underline}
/* ── the detail block of the player card. Read by default; the SAME rows
      become editable in place, so looking at a player and correcting one are
      not two different screens. ── */
.dl{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.dl .r{display:flex;align-items:center;gap:12px;padding:7px 12px;border-bottom:1px solid var(--line);
min-height:36px}
.dl .r:last-child{border-bottom:0}
.dl .r:nth-child(even){background:#fcfbf9}
.dl .r .k{width:118px;flex:none;font-size:11.5px;color:var(--ink2)}
.dl .r .v{font-size:13px;flex:1;min-width:0}
.dl .r .v.none{color:var(--ink3)}
.dl .r input,.dl .r select{flex:1;min-width:0}
.vsrc{display:flex;gap:5px;flex-wrap:wrap}

.srow{border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:7px;background:#fff}
.srow:hover{border-color:var(--line2)}
.sflex{display:flex;align-items:center;gap:10px}
.sflex .body{flex:1;min-width:0}
.nm{font-weight:600;font-size:13px}
.meta{font-size:11px;color:var(--ink2);margin-top:2px}
.sdet{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.inline{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.scale{display:flex;gap:4px}
.sv{border:1px solid var(--line2);background:#fff;border-radius:6px;width:38px;height:32px;
cursor:pointer;font-size:13px;font-weight:600;color:var(--ink2);padding:0}
.sv:hover{border-color:var(--navy);color:var(--navy)}
.sv.on{background:var(--navy);border-color:var(--navy);color:#fff}
.mrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .lb{flex:1;font-size:13px;font-weight:600}
.plist{max-height:60vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.pitem{display:flex;align-items:center;gap:8px;padding:6px 9px;border-bottom:1px solid var(--line);
cursor:pointer;font-size:12.5px}
.pitem:last-child{border-bottom:0}
.pitem:hover{background:#fbfaf8}
.pitem.on{background:var(--navy2);font-weight:600}
.pitem .st{margin-left:auto;font-size:10px;color:var(--ink3)}
.split{display:grid;grid-template-columns:240px 1fr;gap:14px}
tr.flag td{background:var(--warnbg)}
pre.sql{background:#fbfaf8;border:1px solid var(--line);border-radius:7px;padding:9px 11px;
font-size:11px;overflow-x:auto;margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* ── the player card. Same tokens, deliberately NOT a ledger. ──────────
   The review table is a ledger — you scan it. This is one player, so it reads
   as rows of evidence: the measure, what each pass said, and where the mean
   sits on the scale. Value first, colour second — every number is on screen,
   the bar only repeats it. ── */
.pc{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.pcr{display:flex;align-items:center;gap:12px;padding:9px 12px;border-bottom:1px solid var(--line)}
.pcr:last-child{border-bottom:0}
.pcr:nth-child(even){background:#fcfbf9}
.pcr .lb{width:132px;flex:none;font-size:13px;font-weight:600}
.pcr .passes{display:flex;gap:4px;flex:none}
.pv{width:26px;height:26px;border-radius:6px;border:1px solid var(--line2);background:#fff;
display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;
color:var(--ink2)}
.pv.none{color:var(--ink3);background:#f7f6f3}
.meter{flex:1;min-width:70px;height:7px;border-radius:4px;background:#efeee9;position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--navy);
display:block}
.pcr .mn{width:38px;flex:none;text-align:right;font-size:14px;font-weight:600}
.pcr .sp{width:52px;flex:none;text-align:right;font-size:11px;color:var(--ink3)}
.pcr.wide{border-left:3px solid var(--warnline);background:var(--warnbg)}
.pcr.settled{border-left:3px solid var(--okline);background:var(--okbg)}
.pcr.gap{border-left:3px solid var(--line2)}
.pcr.gap .lb,.pcr.gap .mn{color:var(--ink3)}
.pcr.settled .meter{background:#c8ebdd}
.pcr.settled .meter i{background:var(--ok)}
.pcr .act{flex:none}
.rz{padding:10px 12px;background:#fbfaf8;border-top:1px solid var(--line)}
.rz .opt{display:flex;align-items:center;gap:9px;padding:7px 9px;border:1px solid var(--line);
border-radius:8px;margin-bottom:5px;background:#fff;cursor:pointer;font-size:12.5px}
.rz .opt:hover{border-color:var(--navy)}
.rz .opt.on{border-color:var(--navy);background:var(--navy2);font-weight:600}
.rz .opt .v{width:26px;height:26px;border-radius:6px;background:var(--navy);color:#fff;flex:none;
display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12.5px}
.rz .opt.on .v{background:var(--ok)}
.pcr.wide .meter{background:#f0dfc2}
.pcr.wide .sp{color:var(--warn);font-weight:600}
.shape{display:grid;grid-template-columns:auto minmax(230px,1fr);gap:18px;align-items:start}
@media (max-width:760px){.shape{grid-template-columns:1fr}}
.shape .leg{font-size:11.5px;color:var(--ink2);margin-top:6px}
.shape .leg div{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.shape .leg i{width:16px;height:0;border-top-width:2px;border-top-style:solid;display:block;flex:none}
/* The values beside the shape. A table, because it is read down a column and
   compared row to row — Ming, 13 Aug 2026. Lighter than `.jt` on purpose: this
   sits beside a chart, it is not a second ledger. Every plotted value is here
   in figures, so nothing on the chart depends on telling two colours apart. */
.vtab{width:100%;border-collapse:collapse;font-size:12.5px}
.vtab th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.7px;
color:var(--ink3);font-weight:700;padding:0 0 5px;border-bottom:1px solid var(--line2)}
.vtab td{padding:5px 0;border-bottom:1px solid var(--line)}
.vtab tr:last-child td{border-bottom:0}
.vtab th.r,.vtab td.r{text-align:right;padding-left:10px;white-space:nowrap}
.vtab td.v{font-weight:600;font-variant-numeric:tabular-nums}
.vtab td.d{font-variant-numeric:tabular-nums}
/* formation */
.tcol{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.tcol .h{padding:8px 11px;background:#fbfaf8;border-bottom:1px solid var(--line);
display:flex;align-items:center;gap:8px}
.tcol .h b{flex:1;font-size:13px}
.tcol .p{display:flex;align-items:center;gap:8px;padding:6px 11px;border-bottom:1px solid var(--line);
font-size:12.5px}
.tcol .p:last-child{border-bottom:0}
.tcol .p .r{margin-left:auto;font-weight:600}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.vals{margin-top:8px;border-top:1px solid var(--line)}
.vrow{display:flex;align-items:center;gap:9px;padding:4px 0;border-bottom:1px solid var(--line)}
.vrow .l{flex:1;min-width:0;font-size:12.5px}
.vrow .n{font-size:13px;font-weight:600;width:38px;text-align:right}
.trend{width:100%;overflow-x:auto}
.tline{display:flex;align-items:flex-end;gap:2px;height:34px}
.tline b{flex:1;min-width:5px;background:var(--navy);border-radius:2px 2px 0 0;display:block}
.dlt{font-size:11px;font-weight:600}
.dlt.up{color:var(--ok)} .dlt.dn{color:var(--bad)} .dlt.flat{color:var(--ink3)}
.sess{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--line);
border-radius:9px;margin-bottom:6px;background:#fff}
.sess .body{flex:1;min-width:0}
.sess .t{font-size:13px;font-weight:600}
.sess .d{font-size:11px;color:var(--ink2);margin-top:1px}
.sess .big{font-size:19px;font-weight:600;line-height:1}
@media (max-width:640px){
 .pcr{flex-wrap:wrap}
 .pcr .lb{width:100%}
 .meter{display:none}
}
/* ── courtside: the coach's own device. Same tokens, bigger targets. ── */
.court{max-width:560px;margin:0 auto}
.qbar{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:9px;
font-size:12.5px;margin-bottom:11px;border:1px solid}
.qbar.wait{background:var(--warnbg);border-color:var(--warnline);color:var(--warn)}
.qbar.done{background:var(--okbg);border-color:var(--okline);color:var(--ok)}
.qbar .spacer{flex:1}
.prow{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);
border-radius:10px;margin-bottom:7px;background:#fff;cursor:pointer}
.prow:active{background:#fbfaf8}
.prow .nm{flex:1;min-width:0;font-size:15px;font-weight:600}
.prow .who{font-size:11px;color:var(--ink2);font-weight:400;display:block;margin-top:1px}
.mrow.big{padding:11px 0}
.mrow.big .lb{font-size:15px}
.scale.big{gap:6px}
.scale.big .sv{width:46px;height:44px;font-size:16px}
@media (max-width:600px){
 .scale.big .sv{width:100%;flex:1}
 .stage{padding:0 11px}
}
/* modals — TMS pattern */
.modal{position:fixed;inset:0;background:rgba(28,27,25,.5);z-index:80;display:flex;
align-items:flex-start;justify-content:center;padding:44px 18px;overflow:auto}
.modal .box{background:var(--card);border-radius:13px;width:100%;max-width:880px;
overflow:hidden;box-shadow:var(--sh)}
.modal .box.sm{max-width:560px}
.modal .box.lg{max-width:1140px}
/* ── the directory: list left, one player right. Ming, 13 Aug 2026 — scroll the
      list and the detail follows, rather than opening and closing a dialog per
      player. ── */
.psplit{display:grid;grid-template-columns:264px 1fr;gap:14px;align-items:start}
.plist2{border:1px solid var(--line);border-radius:9px;overflow:auto;max-height:60vh;background:#fff}
.prow{display:flex;align-items:center;gap:7px;padding:6px 9px;border-bottom:1px solid var(--line);
cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;
font:inherit}
.prow:last-child{border-bottom:0}
.prow:hover{background:#fbfaf8}
.prow.on{background:var(--navy2)}
.prow .bd{flex:1;min-width:0}
.prow .n2{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;
text-overflow:ellipsis;display:block}
.prow .m2{font-size:10.5px;color:var(--ink3);margin-top:1px;display:block;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .u{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:none}
.pdet{min-width:0}
.fchips{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-top:6px}
.fc{font-size:11px;padding:3px 8px;border-radius:9px;border:1px solid var(--line2);background:#fff;
color:var(--ink2);cursor:pointer;font:inherit;font-size:11px}
.fc:hover{border-color:var(--navy)}
.fc.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.fc b{font-weight:700}
/* ── the Teams stage. List of teams left, one roster right, the pool beneath
      the list — the TMS shape: you scroll a pool and place into the team in
      front of you, across age groups. ── */
.tsplit{display:grid;grid-template-columns:280px 1fr;gap:14px;align-items:start}
@media (max-width:900px){.tsplit{grid-template-columns:1fr}}
/* the roster and the pool beside it. Below 1,150px of stage the pool goes full
   width UNDERNEATH — a clipped column is worse than a stacked one */
.rsplit{display:grid;grid-template-columns:1fr 280px;gap:14px;align-items:start}
@media (max-width:1150px){.rsplit{grid-template-columns:1fr}}
.tgrp{font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;
color:var(--ink3);padding:9px 2px 4px}
.titem{display:flex;align-items:center;gap:7px;padding:6px 9px;border:1px solid var(--line);
border-radius:8px;background:#fff;cursor:pointer;width:100%;text-align:left;font:inherit;
margin-bottom:5px}
.titem:hover{border-color:var(--navy)}
.titem.on{background:var(--navy2);border-color:var(--navy)}
/* THE AGE GROUP IS THE LEFT-HAND LIST. Ming, 19 Aug 2026: "Age group on the
   left, teams on the right." Every group the club's own bracket rule produced
   is listed, not only the ones with teams in them — you pick the group you are
   entering FOR, then enter a team into it. */
.agi{display:flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid var(--line);
border-radius:8px;background:#fff;cursor:pointer;width:100%;text-align:left;font:inherit;
margin-bottom:5px}
.agi:hover{border-color:var(--navy)}
.agi.on{background:var(--navy2);border-color:var(--navy);box-shadow:0 0 0 1px var(--navy)}
.agi .an{flex:1;min-width:0;font-size:12.5px;font-weight:600}
.agi .c{flex:0 0 auto}
/* a team, with the two things you can do to it side by side */
.tcard{border:1px solid var(--line2);border-radius:10px;background:#fff;padding:10px 12px;
margin-bottom:8px}
.tcard.on{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy)}
.tcard .th{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.tcard .th b{font-size:14.5px;color:var(--navy)}
.tcard .ta{display:flex;gap:6px;margin-top:8px}

.poolgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:6px;

   three lines and the team two, and the confirmation ran off the right edge —

.plt{table-layout:auto}

.plact{width:1%;white-space:nowrap;text-align:right}

 padding:0 3px;opacity:.6}
.ftm button:hover{opacity:1}
.fopt{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line2);border-radius:9px;
 padding:9px 12px;background:#fff;cursor:pointer;font-size:12.5px}
.fopt.on{border-color:var(--navy);background:#f4f7fc}
.fopts{display:flex;flex-direction:column;gap:7px;margin-top:6px}
.fopt .c{margin-left:6px}
.fopt span span{display:block}
.fbasis{display:flex;gap:12px;flex-wrap:wrap}
.fb{flex:1 1 300px;border:1px solid var(--line2);border-radius:10px;padding:10px 13px;
 background:#fff;cursor:pointer}
.fb.on{border-color:var(--navy);background:#f4f7fc}
.fb b{font-size:13px}
.fb p{margin:5px 0 0;font-size:11.5px;color:var(--ink2)}
</style>
</head>
<body>
<div x-data="app()" x-init="boot()" x-cloak
     @keydown.escape.window="pm.editing ? cancelEdit()
                     : (pm.adding ? (pm.adding=false) : (modal=''))">

<!-- ────────────────────────── SETUP ────────────────────────── -->
<template x-if="screen==='setup'">
<div>
  <header><div><h1 class="wm">Club<span class="f">Flow</span><span class="o">O</span></h1>
    <div class="sub">first-time setup</div></div></header>
  <div id="shell"><div class="stage narrow">
    <div class="panel">
      <div class="rhead"><h2>Connect to your database</h2>
        <div class="sub">One-time. Both values come from Supabase — Settings → API.
          They are stored only in this browser.</div></div>
      <div class="pbody">
        <div class="field"><label class="fl">Project URL</label>
          <input type="text" x-model="cfg.url" placeholder="https://xxxxxxxx.supabase.co"></div>
        <div class="field"><label class="fl">Anon public key</label>
          <textarea x-model="cfg.key" rows="3" placeholder="eyJhbGciOi..."></textarea>
          <p class="note">Use the <b>anon public</b> key. Never paste the service_role key into a browser.</p></div>
        <button class="btn pri" @click="saveCfg()" :disabled="!cfg.url||!cfg.key">Connect</button>
        <p x-show="err" x-text="err" class="err"></p>
      </div>
    </div>
  </div></div>
</div>
</template>

<!-- ────────────────────────── SIGN IN ────────────────────────── -->
<template x-if="screen==='signin'">
<div>
  <header><div><h1 class="wm">Club<span class="f">Flow</span><span class="o">O</span></h1>
    <div class="sub">sign in</div></div></header>
  <div id="shell"><div class="stage narrow">
    <div class="panel">
      <div class="rhead"><h2>Sign in</h2>
        <div class="sub">We email you a link. No password to remember.</div></div>
      <div class="pbody">
        <div class="field"><label class="fl">Email address</label>
          <input type="email" x-model="email" placeholder="you@example.com"></div>
        <button class="btn pri" @click="signIn()" :disabled="!email||busy"
          x-text="busy?'Sending…':'Email me a sign-in link'"></button>
        <p x-show="msg" x-text="msg" class="msg"></p>
        <p x-show="err" x-text="err" class="err"></p>
        <p class="note"><button class="lnk" @click="resetCfg()">Change database connection</button></p>
      </div>
    </div>
  </div></div>
</div>
</template>

<!-- ────────────────────────── APP ────────────────────────── -->
<template x-if="screen==='app'">
<div>
  <header>
    <div>
      <!-- THE CLUB OWNS THE HEADLINE once you are signed in: this is their
           tool. The product names itself where it introduces itself — the
           browser title, the sign-in and setup screens, and More…. -->
      <h1 x-text="org?.name || 'ClubFlowO'"></h1>
      <div class="sub">
        <span x-text="me?.display_name || userEmail"></span>
        <template x-if="me"><span> · <span x-text="me.role.replace('_',' ')"></span>
          · seniority <span x-text="me.seniority"></span></span></template>
      </div>
    </div>
    <div class="spacer"></div>
    <template x-if="org">
      <span>
        <!-- THE SECTIONS, IN THE ORDER A SEASON IS WORKED THROUGH. Ming, 19 Aug
             2026: Dashboard, Players, Rating, Teams, Formation, Setup. A button
             without an ellipsis switches the view; one with an ellipsis opens a
             dialog — Ming's own convention, and it is why Setup carries one and
             the five sections do not. None of them renames itself; `.hb.pri`
             marks the one you are in.
             Courtside is the exception and stays a toggle: it is a MODE rather
             than a section, the sections are hidden while you are in it, and
             Ming asked for that label to keep changing. -->
        <!-- Courtside is not a section, so it is not in this bar. It is reached
             from the Rating stage, which is the screen it belongs to. This is
             the only button here that exists in one stage and not the others —
             it is the way back out of a mode that hides everything else. -->
        <button class="hb" x-show="stage==='court'" @click="stage='dash'">Back to the club</button>
        <button class="hb" x-show="stage!=='court'" :class="stage==='dash'?'pri':''"
                @click="openDash()">Dashboard</button>
        <!-- SEASON IS A SECTION OF ITS OWN. Ming, 19 Aug 2026: "Move Season as a
             separate header, not just part of the rating." It was a modal
             reachable only from Rating, which made the outermost scope of the
             whole product a sub-item of one screen — and the dashboard had to
             tell a club to go to "Rating → Seasons…" to put a season back in
             play, which is a sentence that should never have needed writing.
             It sits second because a season is the first thing a club sets up
             and everything below is read through it. -->
        <button class="hb" x-show="stage!=='court'" :class="stage==='season'?'pri':''"
                @click="openSeason()">Season</button>
        <button class="hb" x-show="stage!=='court'" :class="stage==='players'?'pri':''"
                @click="openPlayersStage()">Players</button>
        <button class="hb" x-show="stage!=='court'" :class="stage==='admin'?'pri':''"
                @click="stage='admin'">Rating</button>
        <button class="hb" x-show="stage!=='court'" :class="stage==='teams'?'pri':''"
                @click="openTeams()">Teams</button>
        <button class="hb" x-show="stage!=='court'" :class="stage==='formation'?'pri':''"
                @click="openFormation()">Formation</button>
        <!-- PLACEMENT COMES AFTER FORMATION because the header order is the order
             a season is worked through, and the offers this section chases are
             what accepting a formation puts out. Ming's word, from his own
             dashboard band. It is not a dialog, so it carries no ellipsis. -->
        <button class="hb" x-show="stage!=='court'" :class="stage==='placement'?'pri':''"
                @click="openPlacement()">Placement</button>
        <button class="hb" x-show="stage!=='court'" @click="openSetup()">Setup…</button>
      </span>
    </template>
    <button class="hb" @click="modal='more'">More…</button>
  </header>

  <div id="shell"><div class="stage" :class="wideStage()?'wide':''">

    <!-- ══════════════════ COURTSIDE — the coach's own device ══════════════════
         Same app, same tokens, phone-shaped. A coach sees only the sessions they
         are authorised for. Ratings save to THIS DEVICE first and upload when
         there is a connection — a school hall on trial night is exactly where a
         live-only form dies, mid-rating, with a child standing in front of you.
         Nobody is pre-assigned: the list shows who has already been rated and by
         whom, and coaches pick up whoever has not been. -->
    <template x-if="stage==='court'">
      <div class="court">
        <div class="qbar" :class="queue.length ? 'wait' : 'done'">
          <b x-text="queue.length ? queue.length + (queue.length===1?' rating waiting':' ratings waiting')
                                  : 'Everything is saved'"></b>
          <span class="spacer"></span>
          <span x-show="!online" class="c wn">offline</span>
          <button class="btn sm" x-show="queue.length" :disabled="syncing || !online"
                  @click="flushQueue()" x-text="syncing?'Sending…':'Send now'"></button>
        </div>
        <p class="note" x-show="queue.length && !online" style="margin:-6px 0 11px">
          No connection. Keep rating — everything is held on this device and goes up by itself
          when you are back.</p>

        <!-- A refusal is not a network problem and must never be retried into a loop.
             The database said no; the coach is told what it said and decides. -->
        <template x-if="rejected.length">
          <div class="panel" style="border-color:var(--badline);margin-bottom:11px">
            <div class="rhead" style="background:var(--badbg);border-color:var(--badline)">
              <h2 style="font-size:15px">
                <span x-text="rejected.length"></span>
                <span x-text="rejected.length===1?'rating was not accepted':'ratings were not accepted'"></span>
              </h2>
              <div class="sub">These did not fail to send — they reached the database and it refused
                them. Nothing is lost; nothing will be retried on its own.</div>
            </div>
            <div class="pbody">
              <template x-for="r in rejected" :key="r.id">
                <div style="padding:8px 0;border-bottom:1px solid var(--line)">
                  <div style="font-size:13px;font-weight:600" x-text="nameOfPerson(r.person_id)"></div>
                  <div class="note" style="margin:2px 0 6px" x-text="r.reason"></div>
                  <div class="inline" style="margin:0">
                    <button class="btn sm" @click="requeueRejected(r.id)">Try again</button>
                    <button class="btn sm" @click="discardRejected(r.id)">Discard</button>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>
        <p x-show="court.err" x-text="court.err" class="err" style="margin-top:0"></p>

        <!-- pick a session -->
        <template x-if="!court.session">
          <div class="panel">
            <div class="rhead"><h2>Your rating sessions</h2>
              <div class="sub">Only sessions you have been authorised to rate in.</div></div>
            <div class="pbody">
              <template x-if="!court.sessions.length">
                <div class="empty">Nothing open for you right now. The club opens a session and
                  authorises you before it appears here.</div>
              </template>
              <template x-for="s in court.sessions" :key="s.id">
                <div class="prow" @click="pickCourtSession(s)">
                  <div class="nm"><span x-text="s.name"></span>
                    <span class="who"><span x-text="s.opens_at?.slice(0,10)"></span> →
                      <span x-text="s.closes_at?.slice(0,10)"></span></span></div>
                  <span class="c grp" x-text="s.status"></span>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- the squad -->
        <template x-if="court.session && !court.person">
          <div class="panel">
            <div class="rhead" style="display:flex;align-items:center;gap:10px">
              <div style="flex:1">
                <h2 x-text="court.session.name"></h2>
                <div class="sub"><span x-text="courtDone()"></span> of
                  <span x-text="court.people.length"></span> rated by anyone</div>
              </div>
              <button class="btn sm" @click="court.session=null;court.person=null">Back</button>
            </div>
            <div class="pbody">
              <p class="note" style="margin:0 0 9px">Nobody is assigned. Pick up whoever has not
                been rated — the list shows who already has.</p>
              <template x-for="p in court.people" :key="p.id">
                <div class="prow" @click="pickCourtPlayer(p)">
                  <div class="nm"><span x-text="p.given_name+' '+p.family_name"></span>
                    <span class="who" x-text="courtWho(p.id)"></span></div>
                  <span class="c" :class="courtMine(p.id) ? 'ok' : (courtRated(p.id) ? 'grp' : '')"
                        x-text="courtMine(p.id) ? 'you' : (courtRated(p.id) ? 'rated' : 'to do')"></span>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- rate one player -->
        <template x-if="court.person">
          <div class="panel">
            <div class="rhead" style="display:flex;align-items:center;gap:10px">
              <div style="flex:1">
                <h2 x-text="(court.person?.given_name||'')+' '+(court.person?.family_name||'')"></h2>
                <div class="sub"><span x-text="Object.keys(court.scores).length"></span> of
                  <span x-text="courtMeasures().length"></span> scored</div>
              </div>
              <button class="btn sm" @click="court.person=null">Back</button>
            </div>
            <div class="pbody">
              <p class="warnbar" style="border-radius:8px;border:1px solid var(--warnline);margin-bottom:10px"
                 x-show="courtMine(court.person?.id)">
                You have already rated this player in this session. Rating again is allowed and both
                are kept — the head coach sees the spread.</p>
              <template x-for="m in courtMeasures()" :key="m.id">
                <div class="mrow big">
                  <span class="lb" x-text="m.label"></span>
                  <div class="scale big">
                    <template x-for="v in scaleOf(m)" :key="v">
                      <button class="sv" :class="court.scores[m.id]===v?'on':''"
                              @click="court.scores[m.id]=v" x-text="v"></button>
                    </template>
                  </div>
                </div>
              </template>
              <div class="field" style="margin-top:10px">
                <label class="fl">Note (optional)</label>
                <input type="text" x-model="court.note" placeholder="anything worth recording">
              </div>
              <div class="inline" style="margin-top:0">
                <button class="btn pri" @click="saveCourt()"
                        :disabled="!Object.keys(court.scores).length">Save and next</button>
                <button class="btn" @click="court.scores={};court.note=''">Clear</button>
              </div>
              <p class="note">Saved on this device straight away. It goes up on its own — you do not
                have to wait for it. A saved rating cannot be edited; a correction is a resolution by
                the head coach.</p>
              <p x-show="court.msg" x-text="court.msg" class="msg"></p>
            </div>
          </div>
        </template>
      </div>
    </template>

    <!-- ══════════════════════ SEASON ══════════════════════
         Ming, 19 Aug 2026: "Move Season as a separate header, not just part of
         the rating." A season is the outermost scope in the product — every
         trial, team, plan, roster and offer is read through one — and it was
         a modal hanging off the Rating stage. That put the thing everything
         else depends on inside one of the things that depends on it.

         The SCOPE selector stays on the working stages, because switching
         scope is something you do WHILE working (ADR-004). This section is
         where seasons are made, marked current, archived and put back. -->
    <template x-if="stage==='season'">
    <div class="panel">
      <div class="rhead" style="display:flex;align-items:flex-start;gap:10px">
        <div style="flex:1">
          <h2>Season</h2>
          <div class="sub">A season carries the year age is reckoned against. Everything else in
            the club is read through the one you are working in.</div>
        </div>
      </div>

      <div class="statrow">
        <div><b x-text="seasonRows.filter(r=>!r.archived_at).length"></b>in play</div>
        <div><b x-text="seasonRows.filter(r=>r.is_current).length"></b>current</div>
        <div><b x-text="seasonRows.filter(r=>r.archived_at).length"></b>archived</div>
        <div><b x-text="seasonRows.reduce((a,r)=>a+(r.players||0),0)"></b>player records</div>
      </div>

      <div class="pbody">

        <p class="note" style="margin-top:0">Every trial belongs to a season, and the season's
          <b>year</b> is what age eligibility is reckoned against. It is a number the club states —
          named bands like U12 are an association's own convention and are not assumed here.</p>

        <div class="srow" style="background:#fbfaf8">
          <div class="row2">
            <div class="field"><label class="fl">Season name</label>
              <input type="text" x-model="newSeason.name" placeholder="e.g. Winter 2027"></div>
            <div class="field"><label class="fl">Year age is reckoned against</label>
              <input type="number" x-model.number="newSeason.year" min="1900" max="2200"></div>
          </div>
          <div class="row2">
            <div class="field"><label class="fl">Starts (optional)</label>
              <input type="date" x-model="newSeason.starts"></div>
            <div class="field"><label class="fl">Ends (optional)</label>
              <input type="date" x-model="newSeason.ends" :min="newSeason.starts"></div>
          </div>
          <label class="fl"><input type="checkbox" x-model="newSeason.current"
                 style="width:auto;margin-right:6px">Make this the current season</label>
          <div class="inline">
            <button class="btn pri" @click="createSeason()"
                    :disabled="!newSeason.name.trim() || !newSeason.year || busy">Add season</button>
          </div>
          <p x-show="seasonErr" x-text="seasonErr" class="err"></p>
        </div>

        <table class="jt" x-show="seasonRows.length" style="margin-top:10px">
          <thead><tr><th>Season</th><th style="width:60px">Year</th>
            <th style="width:70px">Trials</th><th style="width:80px">Confirmed</th>
            <th style="width:70px">Players</th><th style="width:150px"></th></tr></thead>
          <tbody>
            <template x-for="r in seasonRows" :key="r.id">
              <tr :style="r.archived_at?'opacity:.62':''">
                <td><b x-text="r.name"></b>
                    <span class="c ok" x-show="r.is_current">current</span>
                    <span class="c" x-show="r.archived_at">archived</span></td>
                <td x-text="r.year"></td>
                <td x-text="r.sessions"></td>
                <td x-text="r.confirmed_sessions"></td>
                <td x-text="r.players"></td>
                <td>
                  <button class="btn sm" x-show="!r.is_current && !r.archived_at"
                          @click="makeCurrent(r)">Make current</button>
                  <!-- ARCHIVING PROTECTS, it does not only hide: an archived
                       season refuses every new trial, team, plan and offer.
                       And it is REVERSIBLE — a one-way door gets worked around
                       by never archiving anything. -->
                  <button class="btn sm" x-show="!r.archived_at && !r.is_current"
                          @click="archiveSeason(r, true)">Archive</button>
                  <button class="btn sm" x-show="r.archived_at"
                          @click="archiveSeason(r, false)">Put back in play</button>
                  <button class="btn sm" x-show="!r.archived_at" @click="deleteSeason(r)"
                          :disabled="r.sessions+r.teams+r.players+r.offers>0">Delete</button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
        <p class="note">A season holding a trial, a team, a player record or an offer is
          <b>kept</b>. Deleting it would take the year's evaluations with it — <b>archive</b> it
          instead. An archived season keeps everything and goes read-only: it leaves the working
          screens, and nothing new can be written against it until you put it back in play.</p>
        <p class="note" style="margin-top:4px">The <b>current</b> season cannot be archived, and
          neither can one with a trial still open — close it first, so nobody is left
          mid-rating.</p>
      </div>
    </div>
    </template>

    <!-- ══════════════════════ TEAMS ══════════════════════
         Ming, 19 Aug 2026: "I want the screen to show Season selection tiles on
         the top, Age group on the left, teams on the right, choose edit to edit
         team information, choose roster to see team roster assigned for this
         season."

         WHY THE AGE GROUP MOVED TO THE LEFT. The old shape put every team in the
         club down one column grouped by age group, which is the TMS shape and is
         right for a club with fifteen teams. Thirteen age groups with three
         teams each is forty rows in a 280px column. The age group is the thing a
         club works one at a time — the same reason Formation is a list of age
         groups (ADR-006) — so it becomes the index, and the teams IN it get the
         room.

         EDIT AND ROSTER ARE TWO DIFFERENT JOBS. What a team IS — its name, its
         age group, its division — is entered once and rarely touched. Who is IN
         it changes every week. They were one screen; now the card offers both
         and the pane shows the one you asked for. The pool only loads into view
         with the roster, which is also what stops a 400-player list rendering
         behind a screen nobody is placing from. -->
    <template x-if="stage==='teams'">
    <div class="panel">
      <div class="rhead">
        <h2>Teams</h2>
        <div class="sub">A team name carries across seasons. The roster belongs to the season
          you are in.</div>
      </div>

      <!-- ── the season, on tiles ── the same control everywhere the season is
           the scope. One derivation (`seasonTiles`), one handler (`pickSeason`),
           because four copies of a dropdown drift apart. -->
      <div class="pbody" style="padding-bottom:0">
        <div class="cath" style="margin-top:0">Season</div>
        <div class="dsh" style="margin-bottom:8px">
          <template x-for="s in seasonTiles()" :key="s.id">
            <button class="dsc" :class="s.id===seasonId?'on':''" @click="pickSeason(s.id)">
              <b x-text="s.name"></b>
              <span class="yr">age reckoned at <span x-text="s.year"></span></span>
              <span class="mt">
                <span class="c ok" x-show="s.is_current">current</span>
                <span class="c wn" x-show="s.archived_at">archived · read-only</span>
                <span class="c" x-text="dashSeasonSub(s)"></span>
              </span>
            </button>
          </template>
          <template x-if="!seasonTiles().length">
            <div class="empty" style="flex:1">No season in play. Open <b>Season</b> and create one.</div>
          </template>
        </div>
        <div class="inline" style="margin:0 0 4px" x-show="seasonTilesOlder().length">
          <label class="fl" style="margin:0">Earlier and archived seasons</label>
          <select style="width:auto" @change="pickSeason($event.target.value)">
            <option value="">—</option>
            <template x-for="s in seasonTilesOlder()" :key="s.id">
              <option :value="s.id" x-text="seasonOptionLabel(s)+(s.archived_at?' · archived':'')"></option>
            </template>
          </select>
        </div>
      </div>

      <div class="statrow">
        <div><b x-text="teamSeasons.length"></b>teams</div>
        <div><b x-text="ageGroupsInSeason().length"></b>age groups</div>
        <div><b x-text="placedCount()"></b>placed</div>
        <div><b x-text="poolAll().length - placedPeople().size"></b>unplaced</div>
      </div>
      <p x-show="tm.err" class="warnbar" style="display:flex;gap:10px;align-items:center">
        <span style="flex:1" x-text="tm.err"></span>
        <button class="lnk" style="color:var(--warn)" @click="tm.err=''">dismiss</button></p>

      <div class="pbody">
        <div class="tsplit">
          <!-- ══ THE LEFT RAIL IS CONTEXTUAL ══════════════════════════════
               Ming, 20 Aug 2026: "once click the roster, the age group list on
               the left shall be replaced by the player pool."
               Browsing, the question is WHICH GROUP. Editing a roster, the age
               group is settled and the only list you need is who you can put in
               the team — right beside the squad you are dropping them into,
               rather than underneath it where you cannot see both at once. One
               rail, two jobs, never both at the same time. -->
          <div x-show="tm.view==='roster' && selTeam()">
            <div class="cath" style="margin-top:0">Player pool</div>
            <div class="field" style="margin-bottom:6px">
              <input type="search" x-model="tm.q" placeholder="Search"></div>
            <select x-model="tm.scope" style="width:100%;margin-bottom:6px">
              <option value="grp">This age group</option>
              <option value="all">All age groups</option>
            </select>
            <label class="fl" style="margin:0 0 6px;display:block">
              <input type="checkbox" x-model="tm.hidePlaced" style="width:auto;margin-right:6px">
              Hide anyone already placed here</label>
            <!-- dropping a player BACK on the pool takes them off the roster —
                 the reverse of the drag that put them there -->
            <div class="pool" :class="tm.over?'over':''"
                 @dragover.prevent="tm.over=true" @dragleave="tm.over=false"
                 @drop.prevent="tm.over=false; tDropPool()">
              <template x-for="p in poolShown()" :key="p.person_id">
                <div class="pitem2" draggable="true"
                     @dragstart="tm.drag=p.person_id; tm.dragRow=null"
                     @dblclick="place(p.person_id)">
                  <span class="pn" x-text="p.given_name+' '+p.family_name"></span>
                  <span class="c" x-text="p.age!=null ? p.age : '?'"></span>
                  <span class="pv" x-text="rate2(p.rating)"></span>
                  <span class="elig" :class="eligOf(p).k" x-text="eligOf(p).s"></span>
                  <button class="btn sm" @click="place(p.person_id)"
                          :disabled="!tm.selected || eligOf(p).k==='no'">+</button>
                </div>
              </template>
              <template x-if="!poolShown().length">
                <div class="empty" style="padding:16px 10px">Nobody left in this filter.</div>
              </template>
            </div>
            <p class="note">Drag a name onto a zone to place them <b>and</b> say what they are in
              this team. Drag one back here to take them off.</p>
          </div>

          <!-- ── AGE GROUPS, LEFT ── every group the club's bracket rule
               produced, not only the ones with teams: you pick the group you are
               entering FOR, then enter a team into it. -->
          <div x-show="!(tm.view==='roster' && selTeam())">
            <div class="cath" style="margin-top:0">Age group</div>
            <template x-for="g in allAgeGroups()" :key="g">
              <button class="agi" :class="tm.grpSel===g?'on':''"
                      @click="selectGroup(g)">
                <span class="an" x-text="g"></span>
                <span class="c" x-show="teamSeasonsIn(g).length"
                      x-text="teamSeasonsIn(g).length"></span>
                <span class="c" x-show="!teamSeasonsIn(g).length"
                      style="color:var(--ink3)">none</span>
              </button>
            </template>
            <!-- a team entered before age groups existed still has to be findable -->
            <template x-if="teamSeasonsIn(null).length">
              <button class="agi" :class="tm.grpSel===''?'on':''" @click="selectGroup('')">
                <span class="an">No age group</span>
                <span class="c" x-text="teamSeasonsIn(null).length"></span>
              </button>
            </template>
          </div>

          <!-- ── TEAMS, RIGHT ── -->
          <div>
            <template x-if="!tm.grpSel && tm.grpSel!==''">
              <div class="empty">Pick an age group on the left.</div>
            </template>

            <!-- the list of teams in that group -->
            <template x-if="(tm.grpSel || tm.grpSel==='') && tm.view==='list'">
              <div>
                <div class="inline" style="margin:0 0 8px">
                  <b style="font-size:15px" x-text="tm.grpSel || 'No age group'"></b>
                  <span class="c" x-text="teamSeasonsIn(tm.grpSel||null).length+' teams'"></span>
                  <span style="margin-left:auto"></span>
                  <button class="btn pri" @click="startTeam()" :disabled="!seasonId">New team</button>
                </div>

                <!-- NEW TEAM. Name and age group are what a team IS; a division
                     is what an association happens to call the competition it
                     was entered in, and a club often does not know it yet.
                     Ming, 19 Aug 2026: "Name, Gender/Age Group by default,
                     Division as Optional." -->
                <div x-show="tm.adding" class="srow" style="background:#fbfaf8">
                  <div class="row2">
                    <div class="field"><label class="fl">Team name — reused every season</label>
                      <input type="text" x-model="tm.name" placeholder="e.g. Gold"
                             list="teamNames"></div>
                    <div class="field"><label class="fl">Gender / age group</label>
                      <select x-model="tm.grp">
                        <template x-for="g in allAgeGroups()" :key="g">
                          <option :value="g" x-text="g"></option></template>
                      </select></div>
                  </div>
                  <datalist id="teamNames">
                    <template x-for="t in teams" :key="t.id"><option :value="t.name"></option></template>
                  </datalist>
                  <div class="field"><label class="fl">Division
                      <span style="color:var(--ink3);font-weight:400">— optional, and it can be
                      added when the association confirms it</span></label>
                    <input type="text" x-model="tm.div" placeholder="e.g. Div 1"></div>
                  <p class="note" style="margin-bottom:8px">Reusing an existing name puts that team
                    into this season — it does not create a second team. The same name in <b>two
                    different age groups</b> is fine; twice in <b>one</b> age group is not, because
                    they would be one team on a team sheet.</p>
                  <p class="note" style="margin-bottom:8px" x-show="tmTidied()">
                    Will be recorded as <b x-text="tmTidied()"></b>.</p>
                  <p class="note" style="margin-bottom:8px" x-show="tmProposed()">
                    Many clubs put the age group in front of the name.
                    <button class="lnk" @click="tmUsePrefix()">Enter it as
                      <b x-text="tmProposed()"></b></button>
                  </p>
                  <div class="stop" x-show="tmNameStop()" style="margin-bottom:8px">
                    <b x-text="tmNameStop()?.t"></b>
                    <div class="how" x-text="tmNameStop()?.how"></div>
                  </div>
                  <div class="inline">
                    <button class="btn pri" @click="createTeam()"
                            :disabled="!tm.name.trim() || !tm.grp || tm.busy || !!tmNameStop()">
                      Add team</button>
                    <button class="btn" @click="tm.adding=false">Cancel</button>
                  </div>
                </div>

                <!-- THE TEAMS IN THIS GROUP, AS TILES. Ming, 20 Aug 2026. A
                     club works one age group at a time and enters a handful of
                     teams into it; a tile you can read at a glance beats a
                     stacked row, and it is the same control the seasons use. -->
                <div class="ttiles">
                  <template x-for="ts in teamSeasonsIn(tm.grpSel||null)" :key="ts.id">
                    <div class="ttile" :class="tm.selected===ts.id?'on':''">
                      <b x-text="ts.team_name"></b>
                      <div class="mt">
                        <span class="c grp" x-show="ts.division_label || ts.division"
                              x-text="ts.division_label || ts.division"></span>
                        <span class="c" x-show="!(ts.division_label || ts.division)"
                              style="color:var(--ink3)">no division</span>
                        <span class="c" x-text="rosterOf(ts.id).length+' players'"></span>
                        <span class="c" x-text="'avg '+(rosterAvg(ts.id) || '–')"></span>
                      </div>
                      <div class="ta">
                        <button class="btn sm" @click="openTeamEdit(ts.id)">Edit</button>
                        <button class="btn sm pri" @click="openTeamRoster(ts.id)">Roster</button>
                      </div>
                    </div>
                  </template>
                </div>
                <template x-if="!teamSeasonsIn(tm.grpSel||null).length && !tm.adding">
                  <div class="empty">No teams in <span x-text="tm.grpSel || 'this group'"></span>
                    for <span x-text="seasonName(seasonId)"></span> yet.</div>
                </template>

                <!-- the balance across the group is a property of the GROUP, so
                     it belongs on the group's own screen rather than on one team -->
                <template x-if="teamSeasonsIn(tm.grpSel||null).length > 1">
                  <div>
                    <div class="cath" style="margin-top:12px">Balance across
                      <b x-text="tm.grpSel"></b></div>
                    <table class="vtab">
                      <thead><tr><th>Team</th><th class="r">Players</th>
                        <th class="r">Average</th></tr></thead>
                      <tbody>
                        <template x-for="ts in teamSeasonsIn(tm.grpSel||null)" :key="ts.id">
                          <tr>
                            <td x-text="ts.team_name"></td>
                            <td class="r v" x-text="rosterOf(ts.id).length"></td>
                            <td class="r v" x-text="rosterAvg(ts.id) || '–'"></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                    <p class="note">Every placement moves these numbers. A backfill by hand is
                      meant to be visible, not silent.</p>
                  </div>
                </template>
              </div>
            </template>

            <!-- ── EDIT: what the team IS ── -->
            <template x-if="tm.view==='edit' && selTeam()">
              <div>
                <div class="inline" style="margin:0 0 8px">
                  <button class="btn sm" @click="tm.view='list'">← <span x-text="tm.grpSel"></span></button>
                  <b style="font-size:15px" x-text="selTeam()?.team_name"></b>
                  <span class="c grp" x-text="selTeam()?.age_group || 'no age group'"></span>
                </div>
                <div class="srow">
                  <div class="row2">
                    <div class="field"><label class="fl">Team name — club-wide, and it carries
                      across seasons</label>
                      <input type="text" x-model="tm.ename"></div>
                    <div class="field"><label class="fl">Gender / age group this season</label>
                      <select x-model="tm.egrp">
                        <template x-for="g in allAgeGroups()" :key="g">
                          <option :value="g" x-text="g"></option></template>
                      </select></div>
                  </div>
                  <div class="field"><label class="fl">Division
                      <span style="color:var(--ink3);font-weight:400">— optional</span></label>
                    <input type="text" x-model="tm.ediv" placeholder="e.g. Div 1"></div>
                  <p class="note" style="margin-bottom:8px">Renaming changes the team <b>everywhere,
                    in every season</b> — it is the same team. Changing the age group moves this
                    season's entry only.</p>
                  <p class="note" style="margin-bottom:8px" x-show="tm.esaved" x-text="tm.esaved"></p>
                  <div class="inline">
                    <button class="btn pri" @click="saveTeam()"
                            :disabled="!tm.ename.trim() || !tm.egrp || tm.busy">Save</button>
                    <button class="btn" @click="tm.view='list'">Cancel</button>
                    <span style="margin-left:auto"></span>
                    <!-- a destructive control never sits on a row of a ledger -->
                    <button class="btn sm" @click="removeTeamSeason()"
                            :disabled="rosterOf(tm.selected).length>0">Remove from this season</button>
                  </div>
                  <p class="note" style="margin-top:6px" x-show="rosterOf(tm.selected).length">
                    It still has <b x-text="rosterOf(tm.selected).length"></b> on its roster. Empty
                    it first — removing a team with players in it would take the placements with it.</p>
                </div>
              </div>
            </template>

            <!-- ══ ROSTER — THE TEAM CARD ══════════════════════════════════
                 A PORT OF THE TMS TEAM CARD, NOT A DESIGN. Ming, 20 Aug 2026,
                 with the TMS screen beside it: the roster was a list of rows,
                 and a coach reading a squad wants the squad's SHAPE, its
                 numbers, and its players as cards they can see at a glance.
                 Same tokens throughout — this is a different arrangement of the
                 design system, never a second one.
                 What is NOT here is as deliberate as what is: no jersey
                 register and no staff assignment, because neither has a table
                 behind it. A control that cannot do anything is worse than an
                 absent one. -->
            <template x-if="tm.view==='roster' && selTeam()">
              <div>
                <!-- ── the head: what this team IS ── -->
                <div class="tch">
                  <button class="btn sm" @click="tm.view='list'">← <span x-text="tm.grpSel"></span></button>
                  <div class="tt">
                    <b x-text="selTeam()?.team_name"></b>
                    <div class="sub">
                      <span x-text="selTeam()?.age_group || 'no age group'"></span>
                      <span x-show="selTeam()?.division_label">
                        · <span x-text="selTeam()?.division_label"></span></span>
                      <span> · Proposed for <span x-text="seasonYear()"></span>:</span>
                      <select style="width:auto" @change="tSetDivision($event.target.value)">
                        <option value="" :selected="!selTeam()?.division_rank">Div —</option>
                        <template x-for="n in 10" :key="n">
                          <option :value="n" :selected="selTeam()?.division_rank===n"
                                  x-text="fDivLabel(n)"></option>
                        </template>
                      </select>
                    </div>
                  </div>
                  <span style="margin-left:auto"></span>
                  <button class="btn sm" @click="openTeamEdit(tm.selected)">Edit the team</button>
                </div>
                <p class="note" style="margin:0 0 8px" x-show="tm.dsaved" x-text="tm.dsaved"></p>

                <!-- ── the numbers ── -->
                <div class="statrow tsr">
                  <div><b x-text="tCard().n"></b>players</div>
                  <div><b x-text="tCard().onAge"></b>on age</div>
                  <div :class="tCard().outside.length?'wn':''">
                    <b x-text="tCard().outside.length"></b>outside bracket</div>
                  <div><b x-text="tCard().avgAge"></b>avg age</div>
                  <div><b x-text="tCard().accepted"></b>accepted</div>
                  <div><b x-text="tCard().registered"></b>registered</div>
                  <div><b x-text="tCard().stars"></b>star players</div>
                  <div><b x-text="tCard().mix"></b><span x-text="tCard().mixLabel"></span></div>
                  <div><b x-text="tCard().unplaced"></b>unplaced in group</div>
                </div>

                <!-- ── the shape. A CHART WITH NO DATA REFUSES TO DRAW ── -->
                <div class="panel2" x-show="tShapeRows().length">
                  <div class="shape">
                    <div class="csvg" x-html="tRadar()"></div>
                    <div>
                      <div class="cath" style="margin-top:0">Rating shape</div>
                      <p class="note" style="margin:0 0 6px">
                        <span x-text="tCard().ratedLine"></span></p>
                      <div class="cskey" style="margin-bottom:6px">
                        <span class="lg"><i style="border-top:2px solid #1F3864"></i>this squad —
                          <b x-text="tCard().overall"></b></span>
                        <span class="lg"><i style="border-top:2px dashed #8A8A80"></i>
                          <span x-text="selTeam()?.age_group"></span> average —
                          <b x-text="tCard().groupOverall"></b></span>
                      </div>
                      <table class="jt tsh">
                        <template x-for="m in tShapeRows()" :key="m.label">
                          <tr>
                            <td x-text="m.label"></td>
                            <td class="v" x-text="m.team.toFixed(1)"></td>
                            <td class="d" :class="m.delta==null?'':(m.delta<0?'lo':'hi')"
                                x-text="m.delta==null ? '—'
                                        : (m.delta>0?'+':'')+m.delta.toFixed(1)"></td>
                          </tr>
                        </template>
                      </table>
                    </div>
                  </div>
                </div>
                <p class="note" x-show="!tShapeRows().length && rosterOf(tm.selected).length">
                  No one on this roster has an approved rating yet, so there is no shape to draw.
                  Run a trial and confirm it, and it appears here.</p>

                <!-- ── what needs a decision, stated where it happens ── -->
                <p class="warnbar" style="border-radius:8px;border:1px solid var(--warnline)"
                   x-show="tCard().outside.length">
                  <b x-text="tCard().outsideLine"></b>
                  Leave them in place to keep the exception, or take them off with <b>×</b>.
                </p>

                <!-- ── the squad, in its zones ──
                     TWO THINGS YOU PICK OUT; EVERYONE ELSE IS THE THIRD. Other
                     is implicit and is never a state anybody has to sort into. -->
                <div class="zcols">
                  <template x-for="z in tZones()" :key="z.k || 'other'">
                    <div class="zcol">
                      <div class="zh"><i :class="'z'+(z.i)"></i>
                        <span x-text="z.t"></span><b x-text="z.n"></b></div>
                      <div class="zdrop" @dragover.prevent @drop.prevent.stop="tDropZone($event, z.k)">
                        <template x-for="c in z.cards" :key="c.id">
                          <div class="pcard" :class="c.elig.k==='on2'?'':'ex'"
                               draggable="true" @dragstart="tm.drag=c.r.person_id; tm.dragRow=c.r">
                            <div class="ph">
                              <b x-text="c.name"></b>
                              <span class="pa">
                                <button class="star" :class="c.star?'on':''"
                                        @click="setStar(c.r, !c.star)"
                                        :title="c.star?'Starred':'Mark as a key player'">★</button>
                                <button class="btn sm" @click="unplace(c.r)" title="Take off this roster">×</button>
                              </span>
                            </div>
                            <div class="pchips">
                              <span class="c" x-show="c.gender" x-text="c.gender"></span>
                              <span class="elig" :class="c.elig.k" x-show="c.elig.k!=='on2'"
                                    x-text="c.elig.s"></span>
                              <span class="c" x-show="c.age" x-text="c.age"></span>
                              <span class="c stat" x-show="c.stats" x-text="c.stats"></span>
                              <span class="c rt" x-show="c.rating" x-text="c.rating"></span>
                            </div>
                            <!-- one select per lens the club uses; the vocabulary
                                 is the sport's, the value is keyed to (team, player) -->
                            <div class="plens">
                              <template x-for="l in clubLenses()" :key="l.k">
                                <select @change="setSlot(c.r, l.axis, $event.target.value)">
                                  <option value="" :selected="!c.r[l.axis]" x-text="l.short+' —'"></option>
                                  <template x-for="s in l.slots" :key="s.k">
                                    <option :value="s.k" :selected="c.r[l.axis]===s.k" x-text="s.t"></option>
                                  </template>
                                </select>
                              </template>
                            </div>
                          </div>
                        </template>
                        <template x-if="!z.cards.length">
                          <div class="empty" style="padding:14px 8px">Drop a player here.</div>
                        </template>
                      </div>
                    </div>
                  </template>
                </div>
                <template x-if="!rosterOf(tm.selected).length">
                  <div class="empty" style="padding:22px 10px">
                    Empty. Drag a name from the pool below, or press <b>+</b> beside one.</div>
                </template>

              </div>
            </template>
          </div>
        </div>
      </div>
    </div>
    </template>


    <!-- ── FORMATION. Ming, 19 Aug 2026: one row per age group, open one and you
         get that group alone. The club moves LINES on the distribution and a
         team's target is read off the band they cut — never typed at a cohort
         that cannot reach it. ADR-006/007/009. ─────────────────────────────── -->
    <!-- ── DASHBOARD ────────────────────────────────────────────────────────
         Ming, 19 Aug 2026, asked for it at the head of the sequence. It answers
         one question — what has to happen next — and every number is a way into
         the section that would do it. It reads views that already exist; it
         decides nothing, writes nothing, and is not a place to work. ── -->
    <template x-if="stage==='dash'">
    <div class="panel">
      <div class="rhead">
        <h2>Dashboard</h2>
        <div class="sub">Where this season stands, and what is waiting on you.</div>
      </div>

      <div class="pbody">
      <p x-show="dash.err" x-text="dash.err" class="err" style="margin-top:0"></p>

      <!-- THE SEASON IS A SCOPE, AND ON THIS SCREEN IT IS THE FIRST DECISION.
           Ming, 19 Aug 2026: "a club will compete in less than 3 competitions and
           will plan for less than 3." So the live ones are cards you can read and
           press, not a line in a dropdown. Seasons ACCUMULATE, though — five
           years in there are ten of them — so only the most recent few are cards
           and everything older sits behind one control. -->
      <div class="cath">Season</div>
      <div class="dsn">
        <template x-for="s in dashSeasons()" :key="s.id">
          <button class="dsc" :class="s.id===seasonId?'on':''"
                  @click="seasonId=s.id; onSeasonChange(); openDash()">
            <b x-text="s.name"></b>
            <span class="yr">age reckoned at <span x-text="s.year"></span></span>
            <span class="mt">
              <span class="c ok" x-show="s.is_current">current</span>
              <span class="c" x-text="dashSeasonSub(s)"></span>
            </span>
          </button>
        </template>
      </div>
      <div class="inline" style="margin:6px 0 0" x-show="dashOlder().length">
        <label class="fl" style="margin:0"
               x-text="dashArchived() ? 'Earlier and archived seasons' : 'Earlier seasons'"></label>
        <select style="width:auto"
                @change="if($event.target.value){seasonId=$event.target.value; onSeasonChange(); openDash()}">
          <option value="">—</option>
          <template x-for="s in dashOlder()" :key="s.id">
            <option :value="s.id" :selected="s.id===seasonId"
                    x-text="seasonOptionLabel(s)+(s.archived_at?' · archived':'')"></option>
          </template>
        </select>
      </div>
      <p class="note" x-show="!seasons.length">No season yet. Add one from Rating.</p>
      <p class="note" x-show="seasons.length && !dashLive().length">
        Every season is archived. Put one back in play from <b>Season</b>, or add a new
        one.</p>

      <template x-if="!seasonId">
        <div class="empty">Choose a season — everything here is read through one.</div>
      </template>

      <p class="warnbar" style="margin:10px 0 0;border-radius:8px;border:1px solid var(--warnline)"
         x-show="seasonId && (seasons.find(s=>s.id===seasonId)||{}).archived_at">
        This season is archived and read-only. Nothing new can be written against it — put it back
        in play from <b>Season</b> if you need to change it.</p>

      <template x-if="seasonId">
        <div>
          <div class="cath">Talent pool</div>
          <div class="dsh">
            <button class="dc" @click="openPlayersStage()">
              <b x-text="dash.pool.length"></b><span>in the pool</span></button>
            <button class="dc" @click="stage='admin'">
              <b x-text="dashRated()"></b><span>rated</span></button>
            <button class="dc" :class="dashUnrated()?'wn':''" @click="stage='admin'">
              <b x-text="dashUnrated()"></b><span>not rated yet</span></button>
            <!-- the gate bites at the OFFER, so this is a warning, never a block -->
            <button class="dc" :class="dashUnverified()?'wn':''" @click="openPlayersStage()">
              <b x-text="dashUnverified()"></b><span>unverified</span></button>
          </div>

          <div class="cath">Rating</div>
          <div class="dsh">
            <button class="dc" @click="stage='admin'">
              <b x-text="dashSessionsOpen()"></b><span>trials open</span></button>
            <button class="dc" :class="dashSessionsToSettle()?'wn':''" @click="stage='admin'">
              <b x-text="dashSessionsToSettle()"></b><span>to settle</span></button>
            <button class="dc" :class="dashSessionsLate()?'wn':''" @click="stage='admin'">
              <b x-text="dashSessionsLate()"></b><span>open past close</span></button>
          </div>
          <p class="note" style="margin-top:2px" x-show="dashSessionsLate()">A trial sitting open
            past its own closing date is a signal, not a lock — coaches still enter ratings from a
            clipboard days later.</p>

          <div class="cath">Player placement</div>
          <!-- EVERY NUMBER IS A WAY INTO THE SECTION THAT WOULD DO IT. Teams are
               entered on Teams; offers, answers and registrations are worked on
               Placement, so that is where these three lead. -->
          <div class="dsh">
            <button class="dc" @click="openTeams()">
              <b x-text="dash.ts.length"></b><span>teams entered</span></button>
            <button class="dc" @click="openPlacement()">
              <b x-text="dashOffered()"></b><span>offers made</span></button>
            <button class="dc" :class="dashWaiting()?'wn':''"
                    @click="openPlacement('answer')">
              <b x-text="dashWaiting()"></b><span>waiting on a family</span></button>
            <button class="dc" @click="openPlacement('register')">
              <b x-text="dashConfirmed()"></b><span>registered</span></button>
          </div>
          <p class="note" style="margin-top:2px">A place is binding at registration, not at
            acceptance and not at payment.</p>

          <div class="cath">Formation, by age group</div>
          <table class="fbt">
            <tr><th>Age group</th><th class="num">Players</th><th class="num">Rated</th>
                <th class="num">Teams planned</th><th class="num">Named</th><th>Where it is up to</th></tr>
            <template x-for="r in dashGroups()" :key="r.g">
              <!-- LOAD, THEN OPEN. Switching the stage does not fetch anything;
                   the Formation stage has its own pool, plans and team list and
                   none of it exists until loadFormation() has run. Opening the
                   modal first gave an age group with nothing in it. -->
              <tr @click="fFromDash(r.g)" style="cursor:pointer">
                <td><b x-text="r.g"></b></td>
                <td class="num" x-text="r.n"></td>
                <td class="num" x-text="r.rated"></td>
                <td class="num" x-text="r.teams||'—'"></td>
                <td class="num" x-text="r.named||'—'"></td>
                <td><span class="c" :class="r.state==='teams named'?'ok'
                          :(r.state==='no plan yet'?'':'wn')" x-text="r.state"></span></td>
              </tr>
            </template>
          </table>
          <p class="note" x-show="!dashGroups().length">No player has a date of birth and a rating
            in this season yet, so there is nothing to band.</p>
          <p class="note" style="margin-bottom:0" x-show="dashGroups().length">A row opens that
            age group in Formation.</p>
        </div>
      </template>
      </div>
    </div>
    </template>

    <template x-if="stage==='formation'">
    <div class="panel">
      <div class="rhead" style="display:flex;align-items:flex-start;gap:10px">
        <div style="flex:1">
          <h2>Formation</h2>
          <div class="sub">One row per age group. Open one to see who is in it and set the
            divisions you intend to play.</div>
        </div>
      </div>

      <!-- ── the season, on tiles ── the same control everywhere the season is
           the scope. One derivation (`seasonTiles`), one handler (`pickSeason`),
           because four copies of a dropdown drift apart. -->
      <div class="pbody" style="padding-bottom:0">
        <div class="cath" style="margin-top:0">Season</div>
        <div class="dsh" style="margin-bottom:8px">
          <template x-for="s in seasonTiles()" :key="s.id">
            <button class="dsc" :class="s.id===seasonId?'on':''" @click="pickSeason(s.id)">
              <b x-text="s.name"></b>
              <span class="yr">age reckoned at <span x-text="s.year"></span></span>
              <span class="mt">
                <span class="c ok" x-show="s.is_current">current</span>
                <span class="c wn" x-show="s.archived_at">archived · read-only</span>
                <span class="c" x-text="dashSeasonSub(s)"></span>
              </span>
            </button>
          </template>
          <template x-if="!seasonTiles().length">
            <div class="empty" style="flex:1">No season in play. Open <b>Season</b> and create one.</div>
          </template>
        </div>
        <div class="inline" style="margin:0 0 4px" x-show="seasonTilesOlder().length">
          <label class="fl" style="margin:0">Earlier and archived seasons</label>
          <select style="width:auto" @change="pickSeason($event.target.value)">
            <option value="">—</option>
            <template x-for="s in seasonTilesOlder()" :key="s.id">
              <option :value="s.id" x-text="seasonOptionLabel(s)+(s.archived_at?' · archived':'')"></option>
            </template>
          </select>
        </div>
      </div>

      <div class="pbody">
      <p x-show="fp.err" x-text="fp.err" class="err" style="margin-top:0"></p>

      <template x-if="!seasonId">
        <div class="empty">Choose a season first — formation belongs to one.</div>
      </template>

      <template x-if="seasonId && !fAllGroups().length">
        <div class="empty">No player in this club has a date of birth and a rating yet, so there
          is nothing to band. Rate a trial first.</div>
      </template>

      <template x-if="seasonId && fAllGroups().length && !fGroups().length">
        <div class="empty" x-text="'No '+fp.gender+' age group has players in this season.'"></div>
      </template>

      <!-- SEASON, THEN GENDER, THEN THE AGE GROUPS IN IT. Ming, 19 Aug 2026.
           Thirteen rows of mixed boys, girls and mixed is a list to read; the
           six or seven you are actually working through is a list to use. The
           genders offered are the ones this club's own bands produce — nothing
           is named here. -->
      <template x-if="seasonId && fGenders().length>1">
        <div class="fgen">
          <span class="cath" style="margin:0">Gender</span>
          <template x-for="x in fGenders()" :key="x">
            <button class="lb" :class="fp.gender===x?'on':''" @click="fp.gender=x"
                    x-text="x"></button>
          </template>
          <span class="c" x-text="fGroups().length+' age group'+(fGroups().length===1?'':'s')"></span>
        </div>
      </template>

      <template x-if="seasonId && fGroups().length">
        <div>
          <div class="cath">Age groups</div>
          <div class="fgl">
            <template x-for="g in fGroups()" :key="g">
              <button class="fgr" @click="fOpen(g)">
                <span class="nm"><b x-text="g"></b>
                  <span x-text="fGroupSub(g)"></span></span>
                <span class="fspark" x-html="fSpark(g)"></span>
                <span class="st">
                  <span class="c on" x-text="fTeamsLabel(g)"></span>
                  <span class="c" x-text="fPlan(g).basis==='points'?'points':'rating'"></span>
                  <template x-if="fThin(g)">
                    <span class="c wn" x-text="fThin(g)+' too small'"></span>
                  </template>
                </span>
              </button>
            </template>
          </div>
          <p class="note" style="margin-bottom:0">The strip is that age group's distribution,
            shaded by the divisions you have set. There is nothing to set club-wide — no two age
            groups have the same players in them.</p>
        </div>
      </template>
      </div>
    </div>
    </template>
